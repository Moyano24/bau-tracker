    <div class="row between wrap"><h2>Pomodoro</h2><span class="pill">${foco ? 'Foco' : 'Descanso'}</span></div>
    <p class="pomo-fase mt3">${foco ? `${esc(pomo.materia)}${pomo.tema ? ' · ' + esc(pomo.tema) : ''}` : 'Descanso: levantate, tomá agua'}</p>
    <div class="pomo-reloj" id="pomo-num" role="timer" aria-live="off">${fmtTiempo(resta)}</div>
    <p class="pomo-fase muted" id="pomo-pausa" ${pomo.pausa != null ? '' : 'hidden'}>En pausa</p>
    <div class="bar mt3"><i id="pomo-barra" style="--p:${(resta / pomo.total).toFixed(3)}"></i></div>
    <div class="row wrap mt3">
      <button class="btn" data-act="reloj-abrir" data-fuente="pomo">Pantalla completa</button>
      ${foco ? `<button class="btn primary" data-act="pomo-terminar">Terminar ahora</button>
                <button class="btn danger" data-act="pomo-descartar">Descartar</button>`
             : '<button class="btn" data-act="pomo-terminar">Terminar el descanso</button>'}
    </div>
  </div>`;
}

document.addEventListener('visibilitychange', () => {
  if(!document.hidden && pomo) ticPomo();
});

/* ==========================================================================
   PAUSA, común a los tres temporizadores (descanso, pomodoro y hábito). En pausa se
   guarda lo que queda (`pausa`) y desde cuándo; al seguir, el final se corre. Lo que
   corrió de verdad (sin las pausas) sale de `inicio` y de lo que estuvo en pausa.
   ========================================================================== */
function pausar(t, ahora = Date.now()){
  if(!t || t.pausa != null) return;
  t.pausa = Math.max(0, t.fin - ahora); t.pausaDesde = ahora;
}
function seguir(t, ahora = Date.now()){
  if(!t || t.pausa == null) return;
  t.fin = ahora + t.pausa;
  t.pausadoMs = (t.pausadoMs || 0) + Math.max(0, ahora - (t.pausaDesde || ahora));
  delete t.pausa; delete t.pausaDesde;
}
function corridoMs(t, ahora = Date.now()){
  if(!t || !Number.isFinite(t.inicio)) return 0;
  const enPausa = t.pausa != null ? Math.max(0, ahora - (t.pausaDesde || ahora)) : 0;
  return Math.max(0, ahora - t.inicio - (t.pausadoMs || 0) - enPausa);
}
/* Sumar o restar segundos: en pausa se mueve lo que queda; si no, el final. */
function moverFin(t, dSeg){
  if(t.pausa != null) t.pausa = Math.max(0, t.pausa + dSeg * 1000);
  else t.fin += dSeg * 1000;
}

/* ==========================================================================
   TEMPORIZADOR DE UN HÁBITO DE TIEMPO. Como el pomodoro: se guarda el instante en que
   termina, así sobrevive a cerrar la app. Al terminar suma los minutos que corrieron al
   día en que se empezó (con Deshacer). Uno a la vez.
   ========================================================================== */
const CLAVE_HAB_TIMER = 'bauTracker.habTimer';
let habTimer = null;          // {id, nombre, dia, inicio, fin, total, pausa?, pausaDesde?, pausadoMs?}
let habTimerIntervalo = 0;

function guardarHabTimer(){
  if(habTimer) escribirClave(CLAVE_HAB_TIMER, JSON.stringify(habTimer));
  else try{ localStorage.removeItem(CLAVE_HAB_TIMER); }catch(e){}
}
function iniciarHabTimer(id, minutos){
  const hb = habitoDe(id), min = Number(minutos);
  if(!esTiempo(hb) || !Number.isInteger(min) || min < 1 || min > MAX_MIN_HABITO) return false;
  const ahora = Date.now();
  habTimer = { id, nombre: hb.name, dia: iso(), inicio: ahora, fin: ahora + min * 60000, total: min * 60000 };
  guardarHabTimer(); prepararAudio(); pedirPantallaEncendida(); arrancarHabTic();
  return true;
}
/* Suma los minutos al día del hábito (un salteo se reemplaza). Devuelve lo sumado. */
function registrarHabTimer(t, minutos){
  const hb = habitoDe(t.id);
  if(!hb || !(minutos >= 1)) return 0;
  const log = state.habitos.log[t.id] = state.habitos.log[t.id] || {}, previo = log[t.dia];
  log[t.dia] = Math.round((valorDia(t.id, t.dia) + minutos) * 100) / 100;
  save();
  const raiz = state;
  toast(`${hb.name}: +${minutos} min`, { accion: { texto: 'Deshacer', fn: () => {
    if(state !== raiz) return;
    const l = state.habitos.log[t.id] || {};
    if(previo === undefined) delete l[t.dia]; else l[t.dia] = previo;
    save(); render();
  } } });
  return minutos;
}
/* Terminó solo. `silencio` = al volver a abrir la app (no suena). Si terminó hace más de
   12 horas no se registra: ya no se sabe si de verdad pasó. */
function avanzarHabTimer(ahora = Date.now(), silencio = false){
  const t = habTimer;
  if(!t || t.pausa != null || t.fin > ahora) return;
  const mirando = !silencio && relojMuestra('habito'), hb = habitoDe(t.id);
  habTimer = null; guardarHabTimer(); pararHabTic();
  const min = ahora - t.fin < POMO_VIEJO_MS ? registrarHabTimer(t, Math.round(corridoMs(t, t.fin) / 60000)) : 0;
  if(mirando) relojListo('habito', min ? `+${min} min registrados` : 'Terminó', t.nombre, hb && esColorHex(hb.color) ? hb.color : null);
  else cerrarRelojSi('habito');
  if(!silencio) sonarFin();
  render();
}
/* Cortar antes: se registra lo que corrió, si llega a un minuto. */
function terminarHabTimer(){
  const t = habTimer;
  if(!t) return;
  habTimer = null; guardarHabTimer(); pararHabTic(); cerrarRelojSi('habito');
  const min = Math.floor(corridoMs(t) / 60000);
  if(min >= 1) registrarHabTimer(t, min); else toast('Menos de un minuto: no se registró');
  render();
}
function descartarHabTimer(){
  if(!habTimer) return;
  habTimer = null; guardarHabTimer(); pararHabTic(); cerrarRelojSi('habito'); render();
  toast('Temporizador descartado');
}
function arrancarHabTic(){ clearInterval(habTimerIntervalo); habTimerIntervalo = setInterval(ticHabTimer, 500); pintarHabTimer(); }
function pararHabTic(){ clearInterval(habTimerIntervalo); habTimerIntervalo = 0; pintarHabTimer(); }
function ticHabTimer(){
  if(!habTimer) return pararHabTic();
  if(restanteMs(habTimer) <= 0) avanzarHabTimer(); else pintarHabTimer();
}
function pintarHabTimer(){
  const pill = $('#hab-pill');
  if(pill){
    pill.hidden = !habTimer || relojMuestra('habito');
    if(habTimer){
      const resta = restanteMs(habTimer);
      $('#hab-pill-txt').textContent = habTimer.nombre;
      $('#hab-pill-num').textContent = fmtTiempo(resta);
      $('#hab-pill-strip').style.setProperty('--p', (resta / habTimer.total).toFixed(3));
    }
  }
  pintarReloj();
}
function restaurarHabTimer(){
  let t = null;
  try{ t = JSON.parse(leerClave(CLAVE_HAB_TIMER) || 'null'); }catch(e){}
  const ok = t && typeof t.id === 'string' && fechaValida(t.dia) && [t.inicio, t.fin, t.total].every(Number.isFinite) && t.total > 0
             && (t.pausa == null || (Number.isFinite(t.pausa) && t.pausa >= 0)) && esTiempo(habitoDe(t.id));
  habTimer = ok ? t : null;
  if(!habTimer){ guardarHabTimer(); return; }
  avanzarHabTimer(Date.now(), true);
  if(habTimer) arrancarHabTic();
}

/* ==========================================================================
   EL RELOJ: la pantalla grande de los tres temporizadores. Va encima de todo, también
   del diálogo (si no, abrirla taparía el entrenamiento que estás cargando). Dos modos:
     · elegir: botones rápidos + la ruedita (columnas con scroll-snap: en el iPhone
       tienen la inercia de siempre) y "Empezar"
     · corriendo: el anillo que se vacía, el tiempo grande, ±, pausa, terminar y
       minimizar (vuelve a la píldora; tocar "Ver" en la píldora lo abre de nuevo)
   No tiene motor propio: muestra y maneja el del descanso, el del pomodoro o el del hábito.
   ========================================================================== */
const RUEDA_ALTO = 44;                         // alto de una fila de la ruedita (px)
const RELOJ_R = 108, RELOJ_C = 2 * Math.PI * RELOJ_R;
let reloj = null;           // {modo:'elegir', fuente, titulo, sub, cols, rapidos, id?} | {modo:'corriendo', fuente}
let relojFoco = null;

const relojMuestra = f => !!reloj && reloj.modo === 'corriendo' && reloj.fuente === f;
const rango = (a, b, paso = 1) => Array.from({ length: Math.floor((b - a) / paso) + 1 }, (_, i) => a + i * paso);

/* Lo que el reloj necesita de cada fuente, o null si esa no está corriendo. */
function fuenteReloj(f){
  if(f === 'descanso' && timer) return { t: timer, titulo: 'Descanso', sub: 'Entre series', paso: 15, terminar: 'Terminar' };
  if(f === 'pomo' && pomo){
    const foco = pomo.fase === 'foco';
    return { t: pomo, titulo: foco ? 'Foco' : 'Descanso', paso: 60, descartar: foco,
             sub: foco ? pomo.materia + (pomo.tema ? ' · ' + pomo.tema : '') : 'Levantate, tomá agua',
             terminar: foco ? 'Terminar y guardar' : 'Terminar el descanso' };
  }
  if(f === 'habito' && habTimer){
    const hb = habitoDe(habTimer.id), meta = hb ? (metaDia(hb, habTimer.dia) || Number(hb.meta)) : 0;
    return { t: habTimer, titulo: habTimer.nombre, paso: 60, descartar: true, terminar: 'Terminar y registrar',
             tinta: hb && esColorHex(hb.color) ? hb.color : null,
             sub: hb ? `${frecuenciaTexto(hb)} · ${fmtV(valorDia(hb.id, habTimer.dia))} / ${fmtV(meta)} min` : 'Al terminar se registran los minutos' };
  }
  return null;
}
/* El color del reloj: el del hábito si es uno de hábito; si no, el de la app. */
function tintaReloj(c){
  return c ? `--tinta:${c};--sobre:${tintaSobre(c)}` : '--tinta:var(--accent);--sobre:var(--accent-text)';
}
/* Íconos de los botones del reloj (mismo trazo que los íconos de hábitos). */
const ICO_RELOJ = {
  pausa:  '<svg class="ico-h" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5V19M16 5V19"/></svg>',
  seguir: '<svg class="ico-h" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 4.5L19 12L7 19.5Z"/></svg>',
  cerrar: '<svg class="ico-h" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6L18 18M18 6L6 18"/></svg>',
  bajar:  '<svg class="ico-h" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 9L12 15L18 9"/></svg>',
  menos:  '<svg class="ico-h" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12H19"/></svg>',
  mas:    '<svg class="ico-h" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12H19M12 5V19"/></svg>',
};
/* Las rayitas del cuadrante: 60, una más larga cada 5 (se arman una sola vez). */
const RELOJ_MARCAS = Array.from({ length: 60 }, (_, i) => {
  const a = i / 60 * 2 * Math.PI, r1 = i % 5 ? 92 : 86, r2 = 97, c = Math.cos(a), s = Math.sin(a);
  return `<line x1="${(120 + r1 * c).toFixed(1)}" y1="${(120 + r1 * s).toFixed(1)}" x2="${(120 + r2 * c).toFixed(1)}" y2="${(120 + r2 * s).toFixed(1)}"${i % 5 ? '' : ' class="larga"'}/>`;
}).join('');

function abrirReloj(estado){
  const yaEstaba = !!reloj;
  if(!reloj) relojFoco = document.activeElement;
  reloj = estado;
  const el = $('#reloj');
  if(!el) return;
  clearTimeout(relojListoTimer);
  el.innerHTML = reloj.modo === 'elegir' ? relojElegirHTML() : reloj.modo === 'listo' ? relojListoHTML() : relojCorriendoHTML();
  el.hidden = false;
  document.body.classList.add('reloj-abierto');
  if(reloj.modo === 'elegir') montarRuedas();
  if(!yaEstaba) entradaReloj();
  pintarTimer(); pintarPomo(); pintarHabTimer();          // las píldoras se esconden mientras está grande
  const f = el.querySelector('[data-foco]');
  if(f) f.focus({ preventScroll: true });
}
/* `desde` = {y, v}: si lo cerró el dedo tirándolo para abajo, sale por abajo con su envión. */
function cerrarReloj(desde){
  if(!reloj) return;
  clearTimeout(relojListoTimer);
  salidaReloj(desde);
  reloj = null; relojArr = null;
  cancelAnimationFrame(relojRaf); relojRaf = 0;
  if(relojAnim){ relojAnim.detener(); relojAnim = null; }
  const el = $('#reloj');
  el.hidden = true; el.innerHTML = ''; el.style.opacity = '';
  document.body.classList.remove('reloj-abierto');
  pintarTimer(); pintarPomo(); pintarHabTimer();
  if(relojFoco && relojFoco.focus && document.contains(relojFoco)) relojFoco.focus({ preventScroll: true });
  relojFoco = null;
}

/* ---- El final: el anillo se completa, aparece un ✓ y se cierra solo ---- */
const RELOJ_LISTO_MS = 4000;
let relojListoTimer = 0;
function relojListo(fuente, texto, sub, tinta){
  abrirReloj({ modo: 'listo', fuente, texto, sub, tinta });
  relojListoTimer = setTimeout(() => { if(reloj && reloj.modo === 'listo') cerrarReloj(); }, RELOJ_LISTO_MS);
}
function relojListoHTML(){
  const r = reloj;
  return `<div class="reloj-caja reloj-listo" style="${tintaReloj(r.tinta)}">
    <div class="reloj-agarre" aria-hidden="true"></div>
    <div class="reloj-anillo">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle class="reloj-arco lleno" cx="120" cy="120" r="${RELOJ_R}" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
      </svg>
      <svg class="reloj-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5L9.5 17L19 7.5" pathLength="1"/></svg>
    </div>
    <div class="reloj-cab"><h2 id="reloj-tit" role="status">${esc(r.texto)}</h2>${r.sub ? `<p class="reloj-sub">${esc(r.sub)}</p>` : ''}</div>
    <button type="button" class="reloj-pill grande" data-act="reloj-cerrar" data-foco>Listo</button>
  </div>`;
}

/* ---- Entrar y salir "materializándose": escala + opacidad con un resorte sin rebote ----
   La salida la hace un FANTASMA (una copia que se anima y se borra): así el reloj de verdad
   queda cerrado al instante y nada espera a la animación. */
let relojAnim = null;
function ponerCaja(el, y, presencia){
  const c = el.querySelector('.reloj-caja');
  if(c) c.style.transform = y || presencia < 1 ? `translateY(${y.toFixed(1)}px) scale(${(.94 + .06 * presencia).toFixed(4)})` : '';
  el.style.opacity = presencia < 1 ? Math.max(0, presencia).toFixed(3) : '';
}
function entradaReloj(){
  const el = $('#reloj');
  if(movReducido()){ ponerCaja(el, 0, 1); return; }
  if(relojAnim) relojAnim.detener();
  ponerCaja(el, 0, 0);
  relojAnim = resorte({ desde: 0, hasta: 100, respuesta: .35, amortiguacion: 1,
    paso: q => ponerCaja(el, 0, Math.min(q, 100) / 100), fin: () => { relojAnim = null; ponerCaja(el, 0, 1); } });
}
function salidaReloj(desde){
  const el = $('#reloj');
  if(!el || el.hidden || movReducido()) return;
  const g = el.cloneNode(true);
  g.removeAttribute('id'); g.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  g.classList.add('reloj-fantasma'); g.setAttribute('aria-hidden', 'true'); g.inert = true;
  document.body.appendChild(g);
  const alto = innerHeight;
  if(desde && (desde.y > 0 || desde.v > 0)){
    resorte({ desde: desde.y, hasta: alto, v0: Math.max(desde.v, 0), respuesta: .3, amortiguacion: 1,
      paso: y => ponerCaja(g, y, Math.max(0, 1 - y / alto)), fin: () => g.remove() });
  }else{
    const op = parseFloat(el.style.opacity || '1') * 100;
    resorte({ desde: op, hasta: 0, respuesta: .25, amortiguacion: 1,
      paso: q => ponerCaja(g, 0, Math.max(q, 0) / 100), fin: () => g.remove() });
  }
}

/* ---- Tirarlo para abajo para minimizarlo (como una hoja de iOS) ----
   Se agarra de la parte de arriba de la tarjeta; sigue al dedo 1:1 y decide con el envión. */
let relojArr = null;
/* Pura: ¿al soltar se minimiza o vuelve? Con la posición proyectada por la velocidad. */
function decidirSoltarReloj(y, vel, alto){ return y + proyectar(vel) > alto * .35 ? 'cerrar' : 'volver'; }
document.addEventListener('pointerdown', e => {
  if(relojArr || !reloj || reloj.modo === 'elegir' || e.button || movReducido()) return;   // un segundo dedo no pisa el arrastre
  const zona = e.target.closest && e.target.closest('#reloj .reloj-agarre, #reloj .reloj-cab');
  if(!zona) return;
  if(relojAnim){ relojAnim.detener(); relojAnim = null; }        // se puede agarrar en vuelo
  const caja = $('#reloj .reloj-caja');
  // Si se agarra mientras vuelve con el resorte, arranca desde donde SE VE (no salta al reposo).
  const enVuelo = caja && caja.style.transform.match(/translateY\((-?[\d.]+)px\)/);
  relojArr = { id: e.pointerId, y0: e.clientY, base: enVuelo ? +enVuelo[1] : 0, alto: caja ? caja.offsetHeight : innerHeight, hist: [{ t: e.timeStamp, y: e.clientY }] };
  try{ zona.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener('pointermove', e => {
  if(!relojArr || e.pointerId !== relojArr.id) return;
  let y = relojArr.base + (e.clientY - relojArr.y0);
  if(y < 0) y = -gomita(-y, relojArr.alto);                        // para arriba no hay a dónde ir
  relojArr.y = y;
  ponerCaja($('#reloj'), y, 1 - Math.max(0, y) / relojArr.alto * .5);
  relojArr.hist.push({ t: e.timeStamp, y: e.clientY });
  if(relojArr.hist.length > 5) relojArr.hist.shift();
});
['pointerup', 'pointercancel'].forEach(tipo => document.addEventListener(tipo, e => {
  if(!relojArr || e.pointerId !== relojArr.id) return;
  const a = relojArr.hist[0], b = relojArr.hist[relojArr.hist.length - 1], y = relojArr.y || 0, alto = relojArr.alto;
  const vel = tipo === 'pointercancel' ? 0 : (b.y - a.y) / Math.max(b.t - a.t, 1) * 1000;
  relojArr = null;
  if(Math.abs(y) < 2 && Math.abs(vel) < 50) return;                // fue un toque, no un tirón
  if(decidirSoltarReloj(y, vel, alto) === 'cerrar') cerrarReloj({ y, v: vel });
  else{
    const el = $('#reloj');
    // Hubo envión: un poco de rebote se siente real.
    relojAnim = resorte({ desde: y, hasta: 0, v0: vel, respuesta: .35, amortiguacion: .8,
      paso: yy => ponerCaja(el, yy, 1 - Math.max(0, yy) / alto * .5), fin: () => { relojAnim = null; ponerCaja(el, 0, 1); } });
  }
}));
function cerrarRelojSi(f){ if(reloj && reloj.fuente === f) cerrarReloj(); }

function relojCorriendoHTML(){
  const f = fuenteReloj(reloj.fuente);
  if(!f) return '';
  const et = f.paso >= 60 ? `${f.paso / 60} min` : `${f.paso} s`;
  return `<div class="reloj-caja" style="${tintaReloj(f.tinta)}">
    <div class="reloj-agarre" aria-hidden="true"></div>
    <div class="reloj-cab"><h2 id="reloj-tit">${esc(f.titulo)}</h2><p class="reloj-sub" id="reloj-sub">${esc(f.sub)}</p></div>
    <div class="reloj-medio">
      <button type="button" class="reloj-redondo" data-act="reloj-mover" data-d="-${f.paso}" aria-label="Restar ${et}" title="−${et}">${ICO_RELOJ.menos}</button>
      <div class="reloj-anillo">
        <svg viewBox="0 0 240 240" aria-hidden="true">
          <circle class="reloj-pista" cx="120" cy="120" r="${RELOJ_R}"/>
          <g class="reloj-marcas">${RELOJ_MARCAS}</g>
          <circle class="reloj-arco" id="reloj-arco" cx="120" cy="120" r="${RELOJ_R}" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
          <g class="reloj-seg" id="reloj-seg"><circle cx="${120 + RELOJ_R}" cy="120" r="4.5"/></g>
        </svg>
        <div class="reloj-centro">
          <div class="reloj-num" id="reloj-num" role="timer" aria-live="off">${fmtTiempo(restanteMs(f.t))}</div>
          <div class="reloj-estado" id="reloj-estado"></div>
        </div>
      </div>
      <button type="button" class="reloj-redondo" data-act="reloj-mover" data-d="${f.paso}" aria-label="Sumar ${et}" title="+${et}">${ICO_RELOJ.mas}</button>
    </div>
    <div class="reloj-acciones">
      ${f.descartar ? `<button type="button" class="reloj-ico peligro" data-act="reloj-descartar" aria-label="Descartar" title="Descartar">${ICO_RELOJ.cerrar}</button>` : ''}
      <button type="button" class="reloj-ico" data-act="reloj-cerrar" aria-label="Minimizar" title="Minimizar">${ICO_RELOJ.bajar}</button>
      <button type="button" class="reloj-pill" data-act="reloj-terminar">${esc(f.terminar)}</button>
    </div>
    <button type="button" class="reloj-pill grande" data-act="reloj-pausa" id="reloj-pausa" aria-pressed="false" data-foco><span id="reloj-pausa-ico">${ICO_RELOJ.pausa}</span><span id="reloj-pausa-txt">Pausa</span></button>
  </div>`;
}
/* Sin redibujar: el número, el arco, el estado y el botón de pausa. */
function pintarReloj(){
  if(!reloj || reloj.modo !== 'corriendo') return;
  const f = fuenteReloj(reloj.fuente);
  if(!f){ cerrarReloj(); return; }
  const n = $('#reloj-num');
  if(!n) return;
  const resta = arcoReloj(f), enPausa = f.t.pausa != null;
  n.textContent = fmtTiempo(resta);
  if(!enPausa && !relojRaf) animarReloj();
  $('#reloj-estado').textContent = enPausa ? 'En pausa' : '';
  const b = $('#reloj-pausa'), txt = enPausa ? 'Seguir' : 'Pausa';
  if($('#reloj-pausa-txt').textContent !== txt){
    $('#reloj-pausa-txt').textContent = txt;
    $('#reloj-pausa-ico').innerHTML = enPausa ? ICO_RELOJ.seguir : ICO_RELOJ.pausa;
  }
  b.setAttribute('aria-pressed', String(enPausa));
  $('#reloj-tit').textContent = f.titulo; $('#reloj-sub').textContent = f.sub;
}

/* El arco y el puntito de segundos. Con el ATRIBUTO (no style): Safari no siempre toma un
   número sin unidad en la propiedad CSS, y el atributo SVG lo acepta en todos lados.
   pathLength = 100 → el corrimiento es directamente el porcentaje que ya pasó. */
function arcoReloj(f, ahora = Date.now()){
  const resta = restanteMs(f.t, ahora), frac = f.t.total > 0 ? Math.min(resta / f.t.total, 1) : 0;
  const arco = $('#reloj-arco'), seg = $('#reloj-seg');
  if(arco) arco.setAttribute('stroke-dashoffset', (100 * (1 - frac)).toFixed(3));
  // El puntito da una vuelta por minuto de lo que va corriendo: siempre se ve que avanza,
  // aunque falten 30 minutos y el arco baje de a poquito.
  if(seg) seg.setAttribute('transform', `rotate(${((Math.max(0, f.t.total - resta) / 1000) % 60 * 6).toFixed(2)} 120 120)`);
  return resta;
}
/* A 60 cuadros por segundo mientras corre y se ve (no en pausa, ni minimizado, ni con la
   pestaña oculta). Con movimiento reducido no: alcanza con el salto de cada segundo. */
let relojRaf = 0;
function animarReloj(){
  cancelAnimationFrame(relojRaf); relojRaf = 0;
  if(movReducido()) return;
  const paso = () => {
    const f = reloj && reloj.modo === 'corriendo' && fuenteReloj(reloj.fuente);
    if(!f || f.t.pausa != null || document.hidden){ relojRaf = 0; return; }
    arcoReloj(f);
    relojRaf = requestAnimationFrame(paso);
  };
  relojRaf = requestAnimationFrame(paso);
}

/* ---- Toque háptico ----
   Android: la API de vibración. iPhone (iOS 18+): Safari no la tiene, pero alternar un
   interruptor nativo (<input type="checkbox" switch>) da el "tic" del sistema. Solo anda
   dentro de un gesto; si no anda, no pasa nada. Uno cada 40 ms como máximo. */
let hapticoEtiqueta = null, hapticoUltimo = 0;
function tocarHaptico(){
  const ahora = performance.now();
  if(ahora - hapticoUltimo < 40) return;
  hapticoUltimo = ahora;
  try{
    if(navigator.vibrate && !/iPhone|iPad/.test(navigator.userAgent)){ navigator.vibrate(4); return; }
    if(!hapticoEtiqueta){
      hapticoEtiqueta = document.createElement('label');
      hapticoEtiqueta.setAttribute('aria-hidden', 'true');
      hapticoEtiqueta.className = 'haptico';
      hapticoEtiqueta.innerHTML = '<input type="checkbox" switch tabindex="-1">';
      document.body.appendChild(hapticoEtiqueta);
    }
    hapticoEtiqueta.click();
  }catch(e){}
}

/* ---- Elegir: la ruedita ---- */
function relojElegirHTML(){
  const r = reloj, hb = r.fuente === 'habito' ? habitoDe(r.id) : null;
  return `<div class="reloj-caja" style="${tintaReloj(hb && esColorHex(hb.color) ? hb.color : null)}">
    <div class="reloj-cab"><h2 id="reloj-tit">${esc(r.titulo)}</h2>${r.sub ? `<p class="reloj-sub">${esc(r.sub)}</p>` : ''}</div>
    <div class="reloj-rapidos">${r.rapidos.map((q, i) => `<button type="button" class="reloj-chip" data-act="reloj-rapido" data-i="${i}">${esc(q.r)}</button>`).join('')}</div>
    <div class="ruedas">${r.cols.map(ruedaHTML).join('')}</div>
    <div class="reloj-acciones">
      <button type="button" class="reloj-ico" data-act="reloj-cerrar" aria-label="Cancelar" title="Cancelar">${ICO_RELOJ.cerrar}</button>
      <button type="button" class="reloj-pill grande" data-act="reloj-empezar" data-foco>${ICO_RELOJ.seguir}<span>Empezar</span></button>
    </div>
  </div>`;
}
function ruedaHTML(c){
  const k = Math.max(0, c.valores.indexOf(c.v));
  return `<div class="rueda-col">
    <div class="rueda" tabindex="0" role="spinbutton" data-rueda="${c.id}" aria-label="${esc(c.rotulo)}"
      aria-valuemin="${c.valores[0]}" aria-valuemax="${c.valores[c.valores.length - 1]}" aria-valuenow="${c.valores[k]}" aria-valuetext="${c.valores[k]} ${esc(c.rotulo)}">
      <div class="rueda-pad"></div>${c.valores.map((v, i) =>
        `<div class="rueda-item${i === k ? ' sel' : ''}" data-k="${i}">${c.id === 'seg' ? String(v).padStart(2, '0') : v}</div>`).join('')}<div class="rueda-pad"></div>
    </div>
    <span class="rueda-rot" aria-hidden="true">${esc(c.rotulo)}</span>
  </div>`;
}
/* Qué fila queda en el centro según cuánto se scrolleó (2 filas de relleno arriba). Pura. */
function valorRueda(scrollTop, valores, alto = RUEDA_ALTO){
  const k = Math.min(Math.max(Math.round(scrollTop / alto), 0), valores.length - 1);
  return { k, v: valores[k] };
}
/* Cómo se ve una fila a `d` filas del centro: curvada como un cilindro y apagándose hacia
   los bordes, como el selector de hora del iPhone. Pura. */
function estiloFila(d){
  const a = Math.min(Math.abs(d), 3);
  return { rot: Math.max(-54, Math.min(54, -d * 18)), esc: 1 - a * .06, op: Math.max(.16, 1 - a * .28) };
}
function curvarRueda(el){
  const centro = el.scrollTop / RUEDA_ALTO;
  el.querySelectorAll('.rueda-item').forEach(it => {
    const s = estiloFila(+it.dataset.k - centro);
    it.style.transform = `perspective(360px) rotateX(${s.rot.toFixed(1)}deg) scale(${s.esc.toFixed(3)})`;
    it.style.opacity = s.op.toFixed(2);
  });
}
function montarRuedas(){
  $$('#reloj .rueda').forEach(el => {
    const c = reloj.cols.find(x => x.id === el.dataset.rueda);
    el.scrollTop = Math.max(0, c.valores.indexOf(c.v)) * RUEDA_ALTO;
    curvarRueda(el);
    let espera = 0, cuadro = 0, ultimaFila = valorRueda(el.scrollTop, c.valores).k;
    const leer = () => { if(reloj && reloj.modo === 'elegir') fijarRueda(el, valorRueda(el.scrollTop, c.valores).k, false); };
    el.addEventListener('scroll', () => {
      if(!cuadro) cuadro = requestAnimationFrame(() => { cuadro = 0; curvarRueda(el); });
      // Un "tic" cada vez que pasa un número por el centro, como el selector del iPhone.
      const k = valorRueda(el.scrollTop, c.valores).k;
      if(k !== ultimaFila){ ultimaFila = k; tocarHaptico(); }
      // scrollend no existe en Safari viejo: el respaldo lee cuando el scroll se queda quieto.
      clearTimeout(espera); espera = setTimeout(leer, 120);
    }, { passive: true });
    el.addEventListener('scrollend', leer);
  });
}
/* Deja la columna en la fila k: el valor elegido, la marca y lo que anuncia el lector. */
function fijarRueda(el, k, mover = true){
  const c = el && reloj && reloj.cols && reloj.cols.find(x => x.id === el.dataset.rueda);
  if(!c) return;
  k = Math.min(Math.max(k, 0), c.valores.length - 1);
  c.v = c.valores[k];
  el.setAttribute('aria-valuenow', String(c.v));
  el.setAttribute('aria-valuetext', `${c.v} ${c.rotulo}`);
  el.querySelectorAll('.rueda-item').forEach(it => it.classList.toggle('sel', +it.dataset.k === k));
  if(mover) el.scrollTo({ top: k * RUEDA_ALTO, behavior: movReducido() ? 'auto' : 'smooth' });
}
const valorCol = id => { const c = reloj && reloj.cols.find(x => x.id === id); return c ? c.v : null; };

function elegirDescanso(seg = 90){
  seg = Math.min(Math.max(Math.round(seg / 5) * 5, 5), 30 * 60 + 55);
  abrirReloj({ modo: 'elegir', fuente: 'descanso', titulo: 'Descanso', sub: 'Elegí cuánto descansás',
    cols: [{ id: 'min', rotulo: 'min', valores: rango(0, 30), v: Math.floor(seg / 60) },
           { id: 'seg', rotulo: 'seg', valores: rango(0, 55, 5), v: seg % 60 }],
    rapidos: [[60, '1 min'], [90, '1:30'], [120, '2 min'], [180, '3 min'], [300, '5 min']]
      .map(([s, r]) => ({ r, vals: { min: Math.floor(s / 60), seg: s % 60 } })) });
}
function elegirPomo(){
  const foco = Math.min(Math.max(Math.round(pomoForm.foco / 5) * 5, POMO_MIN), POMO_FOCO_MAX);
  abrirReloj({ modo: 'elegir', fuente: 'pomo', titulo: 'Pomodoro', sub: pomoForm.materia + (pomoForm.tema ? ' · ' + pomoForm.tema : ''),
    cols: [{ id: 'foco', rotulo: 'min de foco', valores: rango(POMO_MIN, POMO_FOCO_MAX, 5), v: foco },
           { id: 'descanso', rotulo: 'min de descanso', valores: rango(0, POMO_DESC_MAX), v: pomoForm.descanso }],
    rapidos: [[25, 5], [50, 10], [45, 15], [90, 20]].map(([f, d]) => ({ r: `${f} + ${d}`, vals: { foco: f, descanso: d } })) });
}
function elegirHabito(id){
  const hb = habitoDe(id);
  if(!esTiempo(hb)) return;
  const hoy = iso(), meta = metaDia(hb, hoy) || Number(hb.meta), hecho_ = valorDia(id, hoy);
  const falta = Math.round(meta - hecho_), arranque = Math.min(falta > 0 ? falta : meta, 180);
  const rapidos = (falta > 0 ? [{ r: `Lo que falta · ${falta} min`, vals: { min: Math.min(falta, 180) } }] : [])
    .concat([15, 30, 45, 60].filter(m => m !== falta).map(m => ({ r: `${m} min`, vals: { min: m } })));
  abrirReloj({ modo: 'elegir', fuente: 'habito', id, titulo: hb.name, rapidos,
    sub: `Hoy: ${fmtV(hecho_)} de ${fmtV(meta)} min`,
    cols: [{ id: 'min', rotulo: 'min', valores: rango(1, 180), v: arranque }] });
}
/* "Empezar": arranca el motor que corresponde y pasa a la pantalla con el anillo. */
function empezarReloj(){
  if(!reloj || reloj.modo !== 'elegir') return;
  const f = reloj.fuente;
  if(f === 'descanso'){
    const s = valorCol('min') * 60 + valorCol('seg');
    if(s < 5){ toast('Elegí al menos 5 segundos.'); return; }
    iniciarTimer(s);
  }else if(f === 'pomo'){
    pomoForm.foco = valorCol('foco'); pomoForm.descanso = valorCol('descanso');
    if(!iniciarPomo(pomoForm.materia, pomoForm.tema, pomoForm.foco, pomoForm.descanso)) return;
  }else if(f === 'habito'){
    if(!iniciarHabTimer(reloj.id, valorCol('min'))) return;
    render();
  }
  abrirReloj({ modo: 'corriendo', fuente: f });
}
function guardarFuente(f){ if(f === 'descanso') guardarTimer(); else if(f === 'pomo') guardarPomo(); else guardarHabTimer(); }
function pausaReloj(){
  const f = reloj && fuenteReloj(reloj.fuente);
  if(!f) return;
  if(f.t.pausa != null) seguir(f.t); else pausar(f.t);
  guardarFuente(reloj.fuente);
  if(reloj.fuente === 'pomo') render(); else pintarReloj();
}
/* ±: el descanso tiene su propia regla (ajustarTimer); en los otros el anillo se
   recalcula sobre el total nuevo, y restar hasta el final es terminar. */
function moverReloj(d){
  const fuente = reloj && reloj.fuente, f = fuenteReloj(fuente);
  if(!f) return;
  if(fuente === 'descanso'){ ajustarTimer(d); return; }
  moverFin(f.t, d);
  f.t.total = Math.max(f.t.total + d * 1000, restanteMs(f.t), 1000);
  if(restanteMs(f.t) <= 0 && f.t.pausa == null){ if(fuente === 'pomo') avanzarPomo(); else avanzarHabTimer(); return; }
  guardarFuente(fuente);
  if(fuente === 'pomo') pintarPomo(); else pintarHabTimer();
}
document.addEventListener('visibilitychange', () => { if(!document.hidden && habTimer) ticHabTimer(); });

/* ==========================================================================
   LA BURBUJA DE LA BARRA DE SECCIONES (celular). Como la barra de vidrio de iOS: la
   sección actual tiene una burbuja que se desliza con un resorte, y se puede arrastrar
   con el dedo por la barra y soltarla sobre otra sección.
   ========================================================================== */
let tabInd = null, tabIndX = null, tabIndAnim = null, tabArr = null, tabSuprimirClic = false;
const barraFlotante = () => matchMedia('(max-width: 899px)').matches;
let tabsAzul = null;
function montarIndicadorTabs(){
  const nav = $('.tabs');
  if(!nav || tabInd) return;
  nav.insertAdjacentHTML('afterbegin', '<span class="tab-ind" aria-hidden="true"></span>');
  tabInd = nav.querySelector('.tab-ind');
  // La capa azul: una copia de las secciones, toda en azul y recortada por la burbuja.
  tabsAzul = document.createElement('div');
  tabsAzul.className = 'tabs-azul'; tabsAzul.setAttribute('aria-hidden', 'true');
  tabsAzul.innerHTML = [...nav.querySelectorAll(':scope > .tab')].map(t => `<span class="tab">${t.innerHTML}</span>`).join('');
  nav.appendChild(tabsAzul);
  const act = nav.querySelector('.tab[aria-current="page"]');
  if(act) moverIndicador(act, true);
  addEventListener('resize', () => { const a = $('.tabs > .tab[aria-current="page"]'); if(a) moverIndicador(a, true); });
}
/* Lo que queda a la vista de la capa azul para una burbuja en `x` con ancho `w`, en una barra
   de ancho `W`: inset(arriba derecha abajo izquierda). Pura. */
function recorteAzul(x, w, W){
  const izq = Math.max(0, Math.min(x, W)), der = Math.max(0, Math.min(W - (x + w), W));
  return `inset(0 ${der.toFixed(1)}px 0 ${izq.toFixed(1)}px)`;
}
function ponerIndicador(x){
  tabIndX = x;
  if(!tabInd) return;
  tabInd.style.transform = `translateX(${x.toFixed(1)}px)`;
  if(tabsAzul){
    const nav = tabsAzul.parentElement, w = parseFloat(tabInd.style.width) || tabInd.offsetWidth;
    tabsAzul.style.clipPath = tabsAzul.style.webkitClipPath = recorteAzul(x, w, nav.clientWidth);
  }
}
function moverIndicador(tab, sinAnimar){
  if(!tabInd || !barraFlotante()) return;
  tabInd.style.width = tab.offsetWidth + 'px';
  const x = tab.offsetLeft;
  if(tabIndAnim){ tabIndAnim.detener(); tabIndAnim = null; }
  if(sinAnimar || tabIndX === null || movReducido()){ ponerIndicador(x); return; }
  tabIndAnim = resorte({ desde: tabIndX, hasta: x, respuesta: .35, amortiguacion: .85,
    paso: ponerIndicador, fin: () => { tabIndAnim = null; } });
}
/* La pestaña más cercana a una posición de la burbuja (por el centro). Pura sobre la lista. */
function tabMasCercana(x, tabs){
  return tabs.reduce((mejor, t) => Math.abs(t.offsetLeft - x) < Math.abs(mejor.offsetLeft - x) ? t : mejor, tabs[0]);
}
document.addEventListener('pointerdown', e => {
  if(tabArr || e.button || !barraFlotante() || !tabInd) return;                   // un segundo dedo no pisa el arrastre
  const nav = e.target.closest && e.target.closest('.tabs');
  if(!nav) return;
  if(tabIndAnim){ tabIndAnim.detener(); tabIndAnim = null; }
  tabArr = { id: e.pointerId, x0: e.clientX, base: tabIndX || 0, mov: false, hist: [{ t: e.timeStamp, x: e.clientX }] };
});
document.addEventListener('pointermove', e => {
  if(!tabArr || e.pointerId !== tabArr.id) return;
  const dx = e.clientX - tabArr.x0;
  if(!tabArr.mov && Math.abs(dx) < 10) return;                    // hasta 10 px es un toque
  if(!tabArr.mov){ tabArr.mov = true; $('.tabs').classList.add('apretada'); try{ $('.tabs').setPointerCapture(e.pointerId); }catch(_){} }
  const tabs = $$('.tabs > .tab'), min = tabs[0].offsetLeft, max = tabs[tabs.length - 1].offsetLeft;
  let x = tabArr.base + dx;
  if(x < min) x = min - gomita(min - x, 120);                     // en las puntas, resistencia
  if(x > max) x = max + gomita(x - max, 120);
  ponerIndicador(x);
  tabArr.hist.push({ t: e.timeStamp, x: e.clientX });
  if(tabArr.hist.length > 5) tabArr.hist.shift();
});
['pointerup', 'pointercancel'].forEach(tipo => document.addEventListener(tipo, e => {
  if(!tabArr || e.pointerId !== tabArr.id) return;
  const arr = tabArr; tabArr = null;
  $('.tabs').classList.remove('apretada');
  if(!arr.mov) return;                                             // un toque: lo resuelve el clic
  tabSuprimirClic = true; setTimeout(() => { tabSuprimirClic = false; }, 400);
  const a = arr.hist[0], b = arr.hist[arr.hist.length - 1];
  const vel = tipo === 'pointercancel' ? 0 : (b.x - a.x) / Math.max(b.t - a.t, 1) * 1000;
  const destino = tabMasCercana(tabIndX + proyectar(vel, .99), $$('.tabs > .tab'));
  if(destino.dataset.view !== view) go(destino.dataset.view); else moverIndicador(destino);
}));
// El clic que llega después de arrastrar la burbuja no tiene que cambiar otra vez de sección.
document.addEventListener('click', e => {
  if(tabSuprimirClic && e.target.closest && e.target.closest('.tabs')){ tabSuprimirClic = false; e.stopImmediatePropagation(); e.preventDefault(); }
}, true);

/* La barra de arriba muestra su borde solo cuando hay contenido pasando por debajo. */
let topbarCuadro = 0;
addEventListener('scroll', () => {
  if(topbarCuadro) return;
  topbarCuadro = requestAnimationFrame(() => {
    topbarCuadro = 0;
    const t = $('.topbar'); if(t) t.classList.toggle('scrolleado', scrollY > 4);
  });
}, { passive: true });
/* iOS aplica :active (la respuesta al apoyar el dedo) solo si hay un touchstart escuchando. */
document.addEventListener('touchstart', () => {}, { passive: true });



document.addEventListener('visibilitychange', () => {
  if(document.hidden || !timer) return;
  timerWakeLock = null;              // el sistema lo suelta solo al ocultar la página
  ticTimer();                        // ¿terminó mientras no mirabas?
  if(timer) pedirPantallaEncendida();
});

/* ==========================================================================
   COPIA DE SEGURIDAD — cuándo fue la última, y si el navegador protege los datos.
   Todo vive en el localStorage de UN aparato: si se limpia el navegador, se
   cambia de celular o el sistema purga el almacenamiento, el historial se va.
   Estas funciones no evitan eso (nada puede, salvo exportar): hacen que no te
   olvides, y le piden al navegador que no lo borre solo.
   Las fechas van en claves APARTE del estado, como el tema: son un dato de ESTE
   aparato. Si vivieran dentro del estado viajarían en el backup, y al importar
   uno viejo la app creería que exportaste hace meses.
   ========================================================================== */
const CLAVE_BACKUP = 'bauTracker.backup';
const CLAVE_BACKUP_SILENCIO = 'bauTracker.backupSilencio';
const AVISO_MIN_REGISTROS = 5;   // con menos que esto no hay nada que valga la pena proteger
const AVISO_DIAS = 14;           // cada cuánto se avisa
const AVISO_SILENCIO_DIAS = 7;   // cuánto calla "Más tarde"

function leerClave(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function escribirClave(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

function ultimoBackup(){ return leerClave(CLAVE_BACKUP) || null; }       // 'AAAA-MM-DD' o null
function marcarBackup(){ escribirClave(CLAVE_BACKUP, iso()); }
function diasSinBackup(){ const u = ultimoBackup(); return u ? daysSince(u) : null; }
function textoBackup(){
  const d = diasSinBackup();
  if(d === null) return 'nunca';
  if(d <= 0) return 'hoy';
  if(d === 1) return 'ayer';
  return `hace ${d} días`;
}

/* Cuánto hay en juego: una app vacía no necesita avisar nada. */
function registrosEnRiesgo(){
  return state.gym.sessions.length + state.estudio.entries.length + state.freelance.items.length +
    Object.values(state.habitos.log).reduce((a, l) => a + Object.keys(l || {}).length, 0);
}
/* ¿Hay que avisar? Devuelve null o {dias} (dias:null = nunca exportó). */
function avisoBackup(){
  if(registrosEnRiesgo() < AVISO_MIN_REGISTROS) return null;
  const callado = leerClave(CLAVE_BACKUP_SILENCIO);
  if(callado && daysSince(callado) < AVISO_SILENCIO_DIAS) return null;
  const d = diasSinBackup();
  if(d !== null && d < AVISO_DIAS) return null;
  return { dias: d };
}

function avisoBackupHTML(){
  const a = avisoBackup();
  if(!a) return '';
  const titulo = a.dias === null ? 'Todavía no exportaste ninguna copia'
                                 : `Hace ${a.dias} días que no exportás una copia`;
  return `
    <div class="card" id="aviso-backup" style="border-color:var(--warn);margin-bottom:var(--s4)">
      <b>${titulo}</b>
      <p class="xs muted mt3">Tus datos viven solo en este aparato. Si limpiás el navegador o
         cambiás de celular, se pierden. Exportar es un toque.</p>
      <div class="row wrap mt3">
        <button class="btn sm primary" data-act="export">Exportar ahora</button>
        <button class="btn sm" data-act="backup-despues">Más tarde</button>
      </div>
    </div>`;
}

/* Tras un intento de exportar. Solo un éxito marca la fecha: si el guardado
   falló o se canceló, decir "ya exportaste" sería peor que no decir nada. */
function registrarExportacion(ok){
  if(ok){
    marcarBackup();
    const el = $('#backup-estado');
    if(el) el.innerHTML = `Último backup: <b>${textoBackup()}</b>`;
    if(view === 'inicio') render();       // el aviso, si estaba, desaparece
  }
  return ok;
}

/* Almacenamiento persistente: le pide al navegador que NO borre estos datos
   cuando falte espacio. En Chrome se concede según el uso; Safari y Firefox
   deciden distinto. Dentro de un iframe con sandbox (el visor de artifacts)
   puede no existir o lanzar, y eso es "no se puede comprobar acá", NO
   "no protegido": decir lo segundo sería una alarma falsa. */
let almacenamiento = 'desconocido';   // 'protegido' | 'no-protegido' | 'no-disponible'
async function pedirProteccion(){
  try{
    if(!(navigator.storage && navigator.storage.persist && navigator.storage.persisted)){
      almacenamiento = 'no-disponible';
    }else if(await navigator.storage.persisted()){
      almacenamiento = 'protegido';
    }else{
      almacenamiento = (await navigator.storage.persist()) ? 'protegido' : 'no-protegido';
    }
  }catch(e){ almacenamiento = 'no-disponible'; }
  const el = $('#almacen-estado');
  if(el) el.innerHTML = almacenamientoHTML();   // en el lugar: no se redibuja Ajustes mientras escribís
}
function almacenamientoHTML(){
  const t = {
    'desconocido':  'comprobando…',
    'protegido':    'protegido por el navegador',
    'no-protegido': 'sin proteger: el navegador podría borrarlo si le falta espacio',
    'no-disponible':'no se puede comprobar desde acá, por eso conviene exportar',
  }[almacenamiento];
  return `Almacenamiento: <b>${t}</b>` +
    (almacenamiento === 'no-protegido'
      ? ` <button class="btn sm" data-act="pedir-proteccion">Pedir protección</button>` : '');
}

/* Guardar el backup en un archivo.
   Abriendo el .html local alcanza con un <a download>. Pero si la app está
   publicada como artifact en claude.ai, el visor bloquea las descargas que
   inicia la página (incluidas las de blob:) y ese link no hace nada: ahí hay
   que pedirle el guardado a la plataforma, que le muestra al usuario una
   confirmación. Un solo código para los dos casos. */
async function exportarBackup(){
  return registrarExportacion(
    await exportarTexto(JSON.stringify(state, null, 2), `bau-tracker-${iso()}.json`));
}

/* Guardar un texto como archivo. Abriendo el .html local alcanza con un <a download>;
   dentro del visor de artifacts las descargas que inicia la página están bloqueadas
   y hay que pedírselo a la plataforma. Un solo código para los dos casos. */
async function exportarTexto(texto, filename){
  const api = (window.claude && typeof window.claude.use === 'function')
    ? await window.claude.use('downloads')
    : null;
  if(api){
    try{ await api.save({ filename, data: texto }); toast('Backup guardado'); return true; }
    catch(err){
      toast(err && err.code === 'declined' ? 'Guardado cancelado' : 'No se pudo guardar el backup.');
      return false;
    }
  }
  // En el iPhone (y en Android) una app instalada no descarga bien con <a download>: se
  // abre la hoja de Compartir (Guardar en Archivos, WhatsApp, Drive…). En la compu, descarga.
  const archivo = typeof File === 'function' ? new File([texto], filename, { type: 'application/json' }) : null;
  if(archivo && navigator.canShare && navigator.share && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare({ files: [archivo] })){
    try{ await navigator.share({ files: [archivo], title: filename }); toast('Backup listo'); return true; }
    catch(err){
      if(err && err.name === 'AbortError'){ toast('Guardado cancelado'); return false; }
      // si compartir falla por otra razón, se intenta la descarga común
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], {type:'application/json'}));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
  return true;     // el navegador no avisa si la descarga terminó: es lo mejor que se sabe
}

   ========================================================================== */
function seedData(){
  const s = emptyState();
  s.profile.bodyweightKg = 72;

  const rutina = [
    [['press-banca',4,10,55],['press-incl',3,10,22],['fondos',3,8,0],['ext-polea',3,12,25]],          // empuje
    [['dominadas',4,7,0],['remo-barra',4,10,45],['curl-barra',3,10,25],['martillo',3,12,12]],          // tirón
    [['sentadilla',4,8,70],['rumano',3,10,55],['prensa',3,12,110],['gemelos-pie',4,15,40]],            // pierna
  ];
  let ri = 0;
  for(let d = 20; d >= 0; d--){
    if(d % 7 === 2 || d % 7 === 5) continue;      // dos días de descanso por semana
    const plan = rutina[ri++ % rutina.length];
    s.gym.sessions.push({
      id: uid(), date: daysAgoISO(d), notes: '',
      exercises: plan.map(([exId, series, reps, kg]) => ({
        exId, name: exDef(exId).name, rir: 1,
        sets: Array.from({length: series}, (_, k) => ({
          reps: reps - (k > 1 ? 1 : 0),
          kg: kg ? kg + Math.floor((20 - d) / 10) * 2.5 : 0    // progresión leve de carga
        }))
      }))
    });
  }

  const materias = [['Matemática','Límites',90],['Física','Cinemática',60],['Química','Estequiometría',45]];
  for(let d = 20; d >= 0; d--){
    if(d % 3 === 0) continue;
    const [subject, topic, min] = materias[d % materias.length];
    s.estudio.entries.push({ id: uid(), date: daysAgoISO(d), subject, topic, minutes: min });
  }

  s.freelance.items = [
    {id:uid(), client:'Panadería La Esquina', project:'Landing + WhatsApp', stage:'completado', amountARS:120000, createdAt:daysAgoISO(60), updatedAt:daysAgoISO(12)},
    {id:uid(), client:'VapeClub MDZ',         project:'Rediseño',           stage:'completado', amountARS:95000,  createdAt:daysAgoISO(45), updatedAt:daysAgoISO(25)},
    {id:uid(), client:'Estudio Contable Ruiz',project:'Sitio institucional',stage:'progreso',   amountARS:150000, createdAt:daysAgoISO(15), updatedAt:daysAgoISO(3)},
    {id:uid(), client:'Gimnasio Titan',       project:'Landing de captación',stage:'propuesta', amountARS:110000, createdAt:daysAgoISO(8),  updatedAt:daysAgoISO(2)},
    {id:uid(), client:'Veterinaria Patitas',  project:'',                   stage:'contactado', amountARS:0,      createdAt:daysAgoISO(2),  updatedAt:daysAgoISO(2)},
  ];

  s.habitos.list = [
    {id:'h1', name:'Leer 20 minutos', icono:'libro', cats:['estudio','tarde'], color:'#A87A17', createdAt:daysAgoISO(60)},
    {id:'h2', name:'Sin pantallas después de las 23', icono:'luna', cats:['salud','cx-noche'], color:'#6A4C9C', createdAt:daysAgoISO(60)},
    {id:'h3', name:'Tomar 2L de agua', icono:'gota', cats:['nutricion','dia'], color:'#17879A', createdAt:daysAgoISO(60)},
    {id:'h4', name:'Leer páginas', emoji:'📚', cats:['estudio','manana'], color:'#43A047', tipo:'cantidad', meta:20, unidad:'páginas', createdAt:daysAgoISO(60)},
  ];
  s.habitos.categorias = [{ id:'cx-noche', n:'Noche' }];       // una propia, para ver cómo conviven
  // Uno con días fijos (lunes, miércoles y viernes), para ver cómo se comporta la frecuencia.
  s.habitos.list.push({id:'h5', name:'Gimnasio', icono:'mancuerna', cats:['fitness','manana'], color:'#E8501C', dias:[0,2,4], createdAt:daysAgoISO(60)});
  s.habitos.log = {h1:{}, h2:{}, h3:{}, h4:{}, h5:{}};
  for(let d = 59; d >= 0; d--){
    const day = daysAgoISO(d);
    if(d % 9 !== 0) s.habitos.log.h1[day] = true;     // racha larga
    if(d % 3 !== 0) s.habitos.log.h2[day] = true;     // irregular
    if(d < 14)      s.habitos.log.h3[day] = true;     // hábito nuevo
    const pag = [20, 20, 12, 0, 25, 8, 20][d % 7];      // cantidad: a veces llega a la meta, a veces no
    if(pag) s.habitos.log.h4[day] = pag;
    if([0, 2, 4].includes(diaSemana(day)) && d % 5 !== 0) s.habitos.log.h5[day] = true;   // casi siempre que toca
  }
  return s;
}

/* ==========================================================================
   TEMA — claro / oscuro / el del sistema.
   Va en su propia clave de localStorage y no dentro del estado: es preferencia
   de ESTE aparato y no tiene por qué viajar en el backup a otro celular.
   ========================================================================== */
const CLAVE_TEMA = 'bauTracker.tema';
function temaGuardado(){
  try{ return localStorage.getItem(CLAVE_TEMA) || 'auto'; }catch(e){ return 'auto'; }
}
function aplicarTema(t){
  const raiz = document.documentElement;
  if(t === 'auto') raiz.removeAttribute('data-theme');
  else raiz.setAttribute('data-theme', t);
  try{ localStorage.setItem(CLAVE_TEMA, t); }catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = getComputedStyle(raiz).getPropertyValue('--bg').trim() || '#15161A';
  const cs = document.querySelector('meta[name="color-scheme"]');
  if(cs) cs.content = t === 'auto' ? 'light dark' : t;
}
aplicarTema(temaGuardado());

function activarInstalacion(){
  if(location.protocol !== 'http:' && location.protocol !== 'https:') return;
  // La versión publicada (GitHub Pages) trae su manifest como archivo y un service worker
  // para abrir sin internet. build-web.py la marca con data-web en <html>.
  if(document.documentElement.dataset.web === '1'){
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(err => console.warn('Sin service worker:', err));
    return;
  }
  try{
    const manifest = {
      name: 'Bau Tracker', short_name: 'Bau', lang: 'es',
      start_url: location.pathname + location.search,
      scope: './', display: 'standalone', orientation: 'portrait',
      background_color: '#F4F2ED', theme_color: '#F4F2ED',
      description: 'Registro diario de gym, estudio, freelance y hábitos.',
      icons: [
        { src: ICONO_192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
        { src: ICONO_512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
      ],
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  }catch(err){ console.warn('No se pudo publicar el manifest:', err); }
}
