/* ---- Hábitos ---- */
/* Una pantalla, cuatro formas de mirar lo mismo (Hoy / Semana / Mes / Año) y un
   detalle por hábito. Los datos son los de siempre: lo único que cambia entre
   vistas es cuánto se muestra y qué se puede tocar. */

/* Cuántas semanas muestra el heatmap tocable del detalle ("Historial").
   Las columnas se reparten el ancho de la tarjeta: menos columnas, celdas más
   grandes. Con mouse alcanza con 14px, así que entra la historia completa.
   Con el dedo cada día es un botón y tiene que poder tocarse, así que acá
   resolvemos el canje al revés: fijamos el tamaño mínimo de la celda y de ahí
   sale cuánta historia entra. En un teléfono angosto son unas 12 semanas (tres
   meses); en una tablet vuelven a entrar las 21.
   `pointer: coarse` pregunta por el dedo, no por el tamaño de la pantalla: una
   notebook con pantalla táctil chica también necesita celdas grandes. */
const SEMANAS_MAX = 21, CEL_MIN = 20, CEL_GAP = 4, BORDES = 81;
function semanasHeat(){
  if(!matchMedia('(pointer: coarse)').matches) return SEMANAS_MAX;
  // BORDES: lo que se comen el margen de la página y el relleno de la tarjeta.
  // Es una constante medida, no estimada; si cambia el padding hay que rehacerla.
  const ancho = Math.max(innerWidth - BORDES, 160);
  const entran = Math.floor((ancho + CEL_GAP) / (CEL_MIN + CEL_GAP));
  return Math.max(10, Math.min(SEMANAS_MAX, entran));
}
function habitColor(id){
  const hb = habitoDe(id);
  return (hb && hb.color) || HABIT_COLORS[0];
}
/* Constancia de Inicio: cuántas semanas entran a lo ancho de la tarjeta con un cuadrado
   de unos 24 px. En el teléfono son 12; en la compu, hasta 26 (medio año). Se estima con
   el ancho de la ventana menos lo que se comen la barra lateral (desde 900 px), el margen
   de la página, el relleno de la tarjeta y la columna de las letras de los días. Si la
   cuenta erra un poco, como las columnas valen 1fr, solo cambia el tamaño del cuadrado. */
const CONST_MIN = 12, CONST_MAX = 26, CONST_CEL = 24, CONST_GAP = 4;
function semanasConstancia(){
  const ancho = innerWidth >= 900 ? Math.min(innerWidth - 216, 1100) - 48 : innerWidth - 32;
  const util = ancho - 34 - 18;                 // relleno + borde de la tarjeta; columna de las letras
  const entran = Math.floor((util + CONST_GAP) / (CONST_CEL + CONST_GAP));
  return Math.max(CONST_MIN, Math.min(CONST_MAX, entran));
}
let semanasDibujadas = semanasHeat(), constanciaDibujada = semanasConstancia();
addEventListener('resize', () => {
  const n = semanasHeat(), c = semanasConstancia();
  if(n !== semanasDibujadas || c !== constanciaDibujada){ semanasDibujadas = n; constanciaDibujada = c; render(); }
});

/* Estado de la pantalla. La vista elegida es una preferencia de ESTE aparato
   (clave aparte, como el tema); el resto vive solo mientras la app está abierta. */
const CLAVE_HABVISTA = 'bauTracker.habVista';
const VISTAS_HAB = [['hoy', 'Hoy'], ['semana', 'Semana'], ['mes', 'Mes'], ['anio', 'Año']];
let habVista = (() => { const v = leerClave(CLAVE_HABVISTA); return VISTAS_HAB.some(([k]) => k === v) ? v : 'hoy'; })();
let habOffset = 0;            // cuántas semanas / meses hacia atrás se está mirando
let habSel = null;            // id del hábito abierto en el detalle, o null
let habDetVista = 'mes';      // 'semana' | 'mes' | 'historial'

const ICONO_CHECK = '<svg class="ck" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICONO_LAPIZ = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/></svg>';
const fmtV = v => Number.isInteger(v) ? String(v) : fmtNum(v, 1);
function fechaLarga(s){
  return parseISO(s).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
}
/* El color llega a un style="…": solo pasa un hex válido, nunca texto crudo. */
function habEstilo(hb){
  const c = esColorHex(hb.color) ? hb.color : HABIT_COLORS[0];
  return `style="--tinta:${c};--sobre:${tintaSobre(c)}"`;
}
function etiquetaDia(hb, dia, ini){
  ini = ini || inicioDe(hb);
  const f = fechaLarga(dia), ok = hecho(hb.id, dia);
  // Lo que un lector de pantalla tiene que saber de un día que se ve atenuado.
  const nota = salteado(hb.id, dia) ? ', salteado' : dia < ini ? ', antes del inicio' : !programadoEn(hb, dia, ini) ? ', no toca' : '';
  if(esCantidad(hb)){
    const m = metaDia(hb, dia);
    return `${f}: ${fmtV(valorDia(hb.id, dia))}${m > 0 ? ` de ${fmtV(m)}` : ''}${hb.unidad ? ' ' + hb.unidad : ''}${ok ? ', cumplido' : ''}${nota}`;
  }
  return `${f}: ${ok ? 'cumplido' : 'sin marcar'}${nota}`;
}
/* Qué fracción de la meta se llegó ese día (0 a 1). */
const fracDia = (hb, dia) => {
  const m = metaDia(hb, dia), v = valorDia(hb.id, dia);
  return m > 0 ? Math.min(v / m, 1) : (v > 0 ? 1 : 0);
};
/* Clases y atributos comunes de una casilla de día, sea del tamaño que sea. */
function claseDia(hb, dia, ini){
  ini = ini || inicioDe(hb);
  const hoy = iso(), ok = hecho(hb.id, dia);
  const parcial = esCantidad(hb) && !ok && valorDia(hb.id, dia) > 0;
  const sk = salteado(hb.id, dia), antes = dia < ini, noToca = !antes && !sk && !programadoEn(hb, dia, ini);
  return { hoy, fut: dia > hoy, antes, noToca, ok, parcial, sk,
           // El futuro no se marca. Lo anterior al inicio sí: se puede registrar lo que ya hacías.
           inerte: dia > hoy,
           // Las clases de atenuado, para pegar a la de cada casilla.
           marcas: `${dia > hoy ? ' fut' : ''}${noToca ? ' nt' : ''}${antes ? ' ant' : ''}${sk ? ' sk' : ''}`,
           act: esCantidad(hb) ? 'valor-dia' : 'toggle-day',
           attrs: `data-act="${esCantidad(hb) ? 'valor-dia' : 'toggle-day'}" data-habit="${esc(hb.id)}" data-day="${dia}"` };
}

/* ---- Dibujar un ícono ----
   iconoSVG da el <svg> completo de un ícono propio ('' si el id no existe: nunca
   se dibuja nada inventado). iconoHabitoHTML decide QUÉ ícono lleva un hábito:
   su ícono propio, si no su emoji, si no el de su primera categoría, si no un punto.
   El emoji entra escapado; el SVG solo sale de la biblioteca, nunca de texto ajeno. */
function iconoSVG(id, tam = 24){
  if(!iconoValido(id)) return '';
  return `<svg class="ico-h" viewBox="0 0 24 24" width="${tam}" height="${tam}" aria-hidden="true" focusable="false">${ICONOS[id].d}</svg>`;
}
function iconoHabitoHTML(hb, tam = 24){
  if(iconoValido(hb.icono)) return iconoSVG(hb.icono, tam);
  if(hb.emoji) return esc(hb.emoji);
  const c = catsDe(hb).find(x => x.icono && iconoValido(x.icono));
  return c ? iconoSVG(c.icono, tam) : '●';
}

/* Cabecera común: ícono, nombre (abre el detalle) y la racha. */
function habCabHTML(hb, derecha, abre = true, marca = '', salteo = false){
  const sub = `${salteo ? 'Salteado · ' : ''}${frecuenciaTexto(hb)} · racha ${habitStreak(hb.id)} · mejor ${habitBestStreak(hb.id)} · ${Math.round(habitRate30(hb.id) * 100)}% en 30 días`;
  const cuerpo = `<b>${esc(hb.name)}</b><span class="hab-sub">${abre ? sub : esc(hb.desc || '')}</span>`;
  return `<div class="hab-cab">${marca}
    <span class="hab-ico" aria-hidden="true">${iconoHabitoHTML(hb, 26)}</span>
    ${abre ? `<button class="hab-nom" data-act="abrir-habito" data-id="${esc(hb.id)}">${cuerpo}</button>`
           : `<div class="hab-nom">${cuerpo}</div>`}
    ${derecha || ''}</div>`;
}

/* ---- Hoy ---- */
/* El día que se está mirando en Hoy: null es "hoy" (así se actualiza solo pasada la
   medianoche; guardar la fecha de hoy se quedaría en la de ayer). */
let habDia = null;
const mayus1 = s => s.charAt(0).toUpperCase() + s.slice(1);

/* La llama de racha. Siempre habla de HOY, aunque se esté mirando otro día:
   encendida si hay racha y hoy está cumplido (o hoy no toca, así que no corre riesgo);
   apagada si no hay racha, o si la hay pero hoy todavía no se hizo. */
const LLAMA_CUERPO = 'M12 2.5c.8 3.4 5.6 6.2 5.6 11a5.6 5.6 0 0 1-11.2 0c0-2.1.9-3.8 2.1-5.2.2 1.7 1 2.7 2 3.2C10.3 8.3 10.6 5.2 12 2.5z';
const LLAMA_NUCLEO = 'M12 12.6c.7 1.7 2.6 2.8 2.6 4.8a2.6 2.6 0 0 1-5.2 0c0-1.4.8-2.4 1.4-3.2.3.9.8 1.3 1.2 1.5-.2-1.1-.2-2 0-3.1z';
function llamaEncendida(hb){
  const hoy = iso();
  return habitStreak(hb.id) >= 1 && (hecho(hb.id, hoy) || !programado(hb, hoy));
}
function llamaHTML(hb){
  const r = habitStreak(hb.id), on = llamaEncendida(hb);
  let d = 0; for(const ch of String(hb.id)) d = (d * 31 + ch.charCodeAt(0)) % 26;     // desfase propio: de 0 a 2,5 s
  const dias = `${r} ${r === 1 ? 'día' : 'días'}`;
  const aria = on ? `Racha de ${dias}` : r ? `Racha de ${dias}: marcá hoy para no perderla` : 'Sin racha';
  return `<span class="llama${on ? ' on' : ''}" data-on="${on ? 1 : 0}" role="img" aria-label="${aria}" style="--d:-${(d / 10).toFixed(1)}s">
    <span class="llama-ico"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g class="cuerpo"><path class="l-cuerpo" d="${LLAMA_CUERPO}"/>${on ? `<path class="l-nucleo" d="${LLAMA_NUCLEO}"/>` : ''}</g></svg>${
      on ? '<i class="chispa a"></i><i class="chispa b"></i>' : ''}</span><b>${r}</b></span>`;
}

/* La tarjeta de Hoy: el avance del día (0 a 1) es lo que llena el color. */
function filaHoyHTML(hb, dia = habDia || iso()){
  const id = esc(hb.id), de = dia === iso() ? 'de hoy' : 'del ' + fechaCorta(dia);
  const c = esColorHex(hb.color) ? hb.color : HABIT_COLORS[0];
  const cant = esCantidad(hb);
  const p = cant ? fracDia(hb, dia) : (hecho(hb.id, dia) ? 1 : 0), ps = p.toFixed(3);
  // En el modo selección (habMulti es un Set) la tarjeta es una casilla y su contenido queda inerte.
  const sel = habMulti ? habMulti.has(hb.id) : null;
  const marca = sel === null ? '' : `<span class="sel-marca" aria-hidden="true">${ICONO_CHECK}</span>`;
  const abre = `<div class="hab rellena${sel === null ? '' : ' en-sel'}" data-hid="${id}" data-dia="${dia}" data-p="${ps}"${sel === null ? ''
    : ` role="checkbox" aria-checked="${sel}" aria-label="${esc(hb.name)}" tabindex="0" data-act="sel-toggle" data-id="${id}"`}
    style="--tinta:${c};--sobre:${tintaSobre(c)};--base:${baseDe(c)};--p:${ps}"><i class="rell" aria-hidden="true"></i><div class="hab-in"${sel === null ? '' : ' inert'}>`;
  // Saltear: se ofrece mientras ese día no tenga nada registrado (o ya esté salteado, para volver atrás).
  const sk = salteado(hb.id, dia);
  const saltar = sk || !activo(hb.id, dia) ? `<button class="saltar" data-act="saltar-dia" data-habit="${id}" data-day="${dia}"
      aria-pressed="${sk}" aria-label="${sk ? 'Quitar el salteo' : 'Saltear'} ${esc(hb.name)} ${de}">–</button>` : '';
  if(!cant){
    const ok = hecho(hb.id, dia);
    const chk = `<button class="chk" data-act="toggle-day" data-habit="${id}" data-day="${dia}"
      aria-pressed="${ok}" aria-label="${ok ? 'Desmarcar' : 'Marcar'} ${esc(hb.name)} ${de}">${ICONO_CHECK}</button>`;
    return `${abre}${habCabHTML(hb, llamaHTML(hb) + saltar + chk, true, marca, sk)}</div></div>`;
  }
  const v = valorDia(hb.id, dia), meta = metaDia(hb, dia) || Number(hb.meta), paso = fmtV(pasoDe(hb));
  // El temporizador registra en el día en que se empieza: solo se ofrece hoy.
  const play = esTiempo(hb) && dia === iso() ? `<button class="chk play" data-act="hab-reloj" data-habit="${id}"
      aria-label="${habTimer && habTimer.id === hb.id ? 'Ver el temporizador de' : 'Empezar el temporizador de'} ${esc(hb.name)}">${habTimer && habTimer.id === hb.id ? '⏱' : '▶'}</button>` : '';
  return `${abre}
    ${habCabHTML(hb, llamaHTML(hb) + play, true, marca, sk)}
    <div class="hab-cant">
      <button class="chk sm" data-act="valor-paso" data-habit="${id}" data-day="${dia}" data-d="-1" aria-label="Restar ${paso}">−</button>
      <div class="hab-valor" aria-live="polite"><b>${fmtV(v)}</b> / ${fmtV(meta)}<small>${esc(hb.unidad || '')}</small></div>
      <button class="chk sm" data-act="valor-paso" data-habit="${id}" data-day="${dia}" data-d="1" aria-label="Sumar ${paso}">+</button>
      <button class="chk sm" data-act="valor-dia" data-habit="${id}" data-day="${dia}" aria-label="Escribir un valor">${ICONO_LAPIZ}</button>
      ${saltar}
    </div>
  </div></div>`;
}

let habNoTocan = false;       // si la lista de los que ese día no tocan está desplegada
/* En Hoy van los hábitos que TOCAN el día elegido, y los que no tocan pero tienen un
   registro (para poder desmarcarlo). Los demás quedan en una línea que los despliega. */
function vistaHoyHTML(list, dia = habDia || iso()){
  const esHoy = dia === iso();
  const toca = hb => programado(hb, dia) || activo(hb.id, dia) || salteado(hb.id, dia);
  const visibles = list.filter(toca), libres = list.filter(hb => !toca(hb));
  return (visibles.length || !libres.length ? visibles.map(hb => filaHoyHTML(hb, dia)).join('')
            : `<div style="grid-column:1 / -1">${emptyHTML(esHoy ? 'Hoy no toca ningún hábito.' : 'Ese día no tocaba ningún hábito.')}</div>`) +
    (libres.length ? `
      <button type="button" class="no-tocan" data-act="no-tocan" aria-expanded="${habNoTocan}">${libres.length} ${
        libres.length === 1 ? 'no toca' : 'no tocan'} ${esHoy ? 'hoy' : 'ese día'} · registrar igual <span aria-hidden="true">${habNoTocan ? '▴' : '▾'}</span></button>
      ${habNoTocan ? libres.map(hb => filaHoyHTML(hb, dia)).join('') : ''}` : '');
}

/* ---- La tira semanal ----
   Siete días de la semana que contiene al día elegido, cada uno con un anillo: la
   fracción de los hábitos que TOCABAN ese día que se cumplieron. Tocar uno cambia el
   día de la lista; los de más adelante de hoy no se pueden elegir. */
/* ¿Ese día se cumplieron todos los hábitos que tocaban? */
function diaCompleto(d){ const a = avanceDia(d); return a.programados > 0 && a.hechos === a.programados; }
/* Un "pop" en el anillo del día, una vez, y un tic donde se pueda. */
function festejarDia(d){
  const b = $(`.tira-dia[data-day="${d}"]`);
  if(!b) return;
  b.classList.remove('festeja'); void b.offsetWidth; b.classList.add('festeja');
  tocarHaptico();
}
function tiraSemanalHTML(){
  const hoy = iso(), sel = habDia || hoy, dias = semanaDe(sel), esHoy = sel === hoy;
  const R = 16, C = 2 * Math.PI * R;
  const botones = dias.map((d, k) => {
    const a = avanceDia(d), f = a.programados ? a.hechos / a.programados : 0;
    const completo = a.programados > 0 && a.hechos === a.programados;
    return `<button type="button" class="tira-dia${d === hoy ? ' hoy' : ''}${completo ? ' completo' : ''}" data-act="dia-sel" data-day="${d}"
      aria-pressed="${d === sel}" ${d > hoy ? 'disabled' : ''}
      aria-label="${esc(fechaLarga(d))}: ${a.programados ? `${a.hechos} de ${a.programados}` : 'no tocaba ninguno'}">
      <span class="tira-l" aria-hidden="true">${INICIAL_DIA[k]}</span>
      <span class="tira-anillo" aria-hidden="true"><svg viewBox="0 0 38 38"><circle class="pista" cx="19" cy="19" r="${R}"/><circle class="avance" cx="19" cy="19" r="${R}" stroke-dasharray="${(C * f).toFixed(1)} ${C.toFixed(1)}"/></svg><b>${Number(d.slice(8))}</b></span></button>`;
  }).join('');
  return `<div class="tira">
    <div class="tira-dias" role="group" aria-label="Días de la semana">${botones}</div>
    <div class="tira-titulo">
      <button type="button" class="btn sm btn-vidrio" data-act="dia-semana" data-d="-1" aria-label="Semana anterior">‹</button>
      <div class="tira-fecha"><b>${esHoy ? 'Hoy' : esc(mayus1(fechaLarga(sel)))}</b>${esHoy
        ? `<span class="xs muted">${esc(fechaLarga(sel))}</span>`
        : '<button type="button" class="btn sm" data-act="dia-hoy">Volver a hoy</button>'}</div>
      <button type="button" class="btn sm" data-act="dia-semana" data-d="1" aria-label="Semana siguiente" ${dias[6] >= hoy ? 'disabled' : ''}>›</button>
    </div></div>`;
}

/* ---- Selección múltiple ----
   habMulti es null (modo apagado) o un Set con los ids elegidos. Solo existe en Hoy, que
   es donde están las tarjetas. Entrar: el botón "Seleccionar" o mantener apretada una
   tarjeta (CLIC_LARGO_MS, se cancela si el dedo se mueve más de CLIC_LARGO_PX o se suelta). */
let habMulti = null, selEntrando = false, musculoAnimado = null;
let lp = null, suprimirClic = false;
const CLIC_LARGO_MS = 500, CLIC_LARGO_PX = 8;

/* Los hábitos que tienen tarjeta en Hoy ahora mismo: con el filtro y el día elegido
   aplicados, y los que no tocan solo si esa lista está desplegada. */
function habMostrados(){
  const dia = habDia || iso();
  const lista = habFiltro ? state.habitos.list.filter(x => (x.cats || []).includes(habFiltro)) : state.habitos.list;
  return lista.filter(hb => habNoTocan || programado(hb, dia) || activo(hb.id, dia) || salteado(hb.id, dia));
}
/* Lo que no se ve no puede quedar elegido: se descarta lo borrado, filtrado o replegado. */
function podarSeleccion(){
  if(!habMulti) return;
  if(habVista !== 'hoy' || !state.habitos.list.length){ habMulti = null; return; }
  const ok = new Set(habMostrados().map(x => x.id));
  habMulti = new Set([...habMulti].filter(id => ok.has(id)));
}
function entrarSeleccion(id){
  if(view !== 'habitos' || habVista !== 'hoy' || !state.habitos.list.length) return;
  habMulti = new Set(id ? [id] : []);
  selEntrando = true;
  render();
}
function salirSeleccion(){ if(habMulti){ habMulti = null; render(); } }

function seleccionCabHTML(){
  const n = habMulti.size, todos = habMostrados().length > 0 && habMostrados().every(x => habMulti.has(x.id));
  return `<div class="sel-cab">
      <b aria-live="polite">${n} ${n === 1 ? 'seleccionado' : 'seleccionados'}</b>
      <span class="row"><button type="button" class="btn sm" data-act="sel-todos">${todos ? 'Ninguno' : 'Todos'}</button>
        <button type="button" class="btn sm" data-act="sel-salir">Cancelar</button></span>
    </div>`;
}
function seleccionBarraHTML(){
  const off = habMulti.size ? '' : 'disabled', entra = selEntrando ? ' entra' : '';
  selEntrando = false;                                    // la barra se redibuja con cada toque: sube una sola vez
  return `<div class="sel-barra${entra}" role="toolbar" aria-label="Acciones sobre los hábitos elegidos">
      <button type="button" class="btn" data-act="sel-completar" ${off}>Completar</button>
      <button type="button" class="btn" data-act="sel-saltear" ${off}>Saltear</button>
      <button type="button" class="btn" data-act="sel-cats" ${off}>Categorías</button>
      <button type="button" class="btn danger" data-act="sel-borrar" ${off}>Borrar</button>
    </div>`;
}

/* Completar: marca cumplido el día elegido en los elegidos que TOCAN ese día (el de
   cantidad se pone en su meta). Los que ya estaban cumplidos o no tocan no se tocan. */
function completarSeleccion(){
  if(!habMulti || !habMulti.size) return;
  const dia = habDia || iso(), raiz = state, de = dia === iso() ? 'de hoy' : 'del ' + fechaCorta(dia);
  const previo = [];
  let hechos = 0, noTocan = 0;
  for(const id of habMulti){
    const hb = habitoDe(id);
    if(!hb) continue;
    if(!tocaDia(hb, dia, inicioDe(hb))){ noTocan++; continue; }
    if(hecho(id, dia)) continue;
    const creado = !state.habitos.log[id];
    const log = state.habitos.log[id] = state.habitos.log[id] || {};
    previo.push({ id, creado, valor: log[dia] });
    log[dia] = esCantidad(hb) ? (metaDia(hb, dia) || Number(hb.meta)) : true;
    hechos++;
  }
  if(!hechos){
    toast(noTocan ? 'Ninguno de los elegidos toca ese día.' : 'Los elegidos ya estaban cumplidos.');
    return;
  }
  habMulti = null;
  save(); render();
  toast(`${hechos} ${hechos === 1 ? 'hábito completado' : 'hábitos completados'} ${de}${noTocan ? ` · ${noTocan} no ${noTocan === 1 ? 'toca' : 'tocan'}` : ''}`, { accion: { texto: 'Deshacer', fn: () => {
    if(state !== raiz) return;
    for(const p of previo){
      const log = state.habitos.log[p.id];
      if(!log) continue;
      if(p.valor === undefined) delete log[dia]; else log[dia] = p.valor;
      if(p.creado && !Object.keys(log).length) delete state.habitos.log[p.id];
    }
    save(); render();
  } } });
}

/* Saltear: el día elegido, en los elegidos que tocaban ese día y no tienen nada registrado. */
function saltearSeleccion(){
  if(!habMulti || !habMulti.size) return;
  const dia = habDia || iso(), raiz = state, de = dia === iso() ? 'de hoy' : 'del ' + fechaCorta(dia);
  const previo = [];
  for(const id of habMulti){
    const hb = habitoDe(id);
    if(!hb || !tocaDia(hb, dia, inicioDe(hb)) || activo(id, dia) || salteado(id, dia)) continue;
    const creado = !state.habitos.log[id];
    (state.habitos.log[id] = state.habitos.log[id] || {})[dia] = SALTEO;
    previo.push({ id, creado });
  }
  if(!previo.length){ toast('Ninguno de los elegidos se puede saltear ese día (ya tienen algo o no tocan).'); return; }
  habMulti = null;
  save(); render();
  toast(`${previo.length} ${previo.length === 1 ? 'hábito salteado' : 'hábitos salteados'} ${de}`, { accion: { texto: 'Deshacer', fn: () => {
    if(state !== raiz) return;
    for(const p of previo){
      const log = state.habitos.log[p.id];
      if(!log || log[dia] !== SALTEO) continue;
      delete log[dia];
      if(p.creado && !Object.keys(log).length) delete state.habitos.log[p.id];
    }
    save(); render();
  } } });
}

/* Borrar: todos juntos, con un solo Deshacer. */
function borrarSeleccion(){
  if(!habMulti || !habMulti.size) return;
  const raiz = state, lista = state.habitos.list;
  const quitados = lista.map((hb, i) => ({ hb, i })).filter(x => habMulti.has(x.hb.id));
  if(!quitados.length) return;
  const logs = {}, ordenLog = Object.keys(state.habitos.log);
  for(const x of quitados.slice().reverse()){
    lista.splice(x.i, 1);
    if(state.habitos.log[x.hb.id]){ logs[x.hb.id] = state.habitos.log[x.hb.id]; delete state.habitos.log[x.hb.id]; }
  }
  habMulti = null;
  save(); render();
  const n = quitados.length;
  toast(n === 1 ? `Hábito “${quitados[0].hb.name}” borrado` : `${n} hábitos borrados`, { accion: { texto: 'Deshacer', fn: () => {
    if(state !== raiz) return;
    for(const x of quitados) lista.splice(Math.min(x.i, lista.length), 0, x.hb);   // de menor a mayor índice: cada uno vuelve a su lugar
    // El historial vuelve en el mismo orden de claves que tenía: el estado queda idéntico, no solo equivalente.
    const actual = state.habitos.log, repuesto = {};
    for(const k of ordenLog) if(k in logs) repuesto[k] = logs[k]; else if(k in actual) repuesto[k] = actual[k];
    for(const k of Object.keys(actual)) if(!(k in repuesto)) repuesto[k] = actual[k];
    state.habitos.log = repuesto;
    save(); render();
  } } });
}

/* Categorías de varios a la vez. Cada etiqueta tiene tres estados: la tienen todos los
   elegidos, algunos, o ninguno. Tocarla la pone en todos (o la saca de todos si ya la
   tenían todos); se aplica al tocar "Aplicar". */
let catsMulti = null;
function chipMultiHTML(c){
  const e = catsMulti.actual[c.id];
  return `<button type="button" class="cat-chip" data-act="multi-cat" data-cat="${esc(c.id)}"
      aria-pressed="${e === 'todas' ? 'true' : e === 'algunas' ? 'mixed' : 'false'}">${c.icono ? iconoSVG(c.icono, 16) : ''}${esc(c.n)}</button>`;
}
function catsMultiHTML(){
  const grupo = (rotulo, lista) => `<div class="cat-grupo"><span class="xs muted">${rotulo}</span>
    <div class="cat-chips">${lista.map(chipMultiHTML).join('')}</div></div>`;
  const propias = state.habitos.categorias || [];
  return grupo('Tema', CATEGORIAS_BASE.filter(c => c.g === 'tema')) +
         grupo('Momento del día', CATEGORIAS_BASE.filter(c => c.g === 'momento')) +
         (propias.length ? grupo('Tus categorías', propias) : '') +
         '<p class="xs muted mt3">Una etiqueta con borde punteado la tienen solo algunos: tocarla se la pone a todos.</p>';
}
function abrirCatsMulti(){
  const hbs = [...(habMulti || [])].map(habitoDe).filter(Boolean);
  if(!hbs.length) return;
  const inicial = {};
  for(const c of categoriasTodas()){
    const n = hbs.filter(hb => (hb.cats || []).includes(c.id)).length;
    inicial[c.id] = n === 0 ? 'ninguna' : n === hbs.length ? 'todas' : 'algunas';
  }
  catsMulti = { ids: hbs.map(x => x.id), inicial, actual: Object.assign({}, inicial) };
  openModal(`Categorías · ${hbs.length} ${hbs.length === 1 ? 'hábito' : 'hábitos'}`, catsMultiHTML(), aplicarCatsMulti, 'Aplicar');
}
function aplicarCatsMulti(){
  const cm = catsMulti, raiz = state;
  if(!cm) return;
  const previo = cm.ids.map(id => { const hb = habitoDe(id); return { id, tenia: !!(hb && hb.cats), cats: hb && hb.cats ? hb.cats.slice() : [] }; });
  let saltados = 0; const cambiados = new Set();
  for(const cid of Object.keys(cm.actual)){
    if(cm.actual[cid] === cm.inicial[cid]) continue;
    for(const id of cm.ids){
      const hb = habitoDe(id);
      if(!hb) continue;
      const cats = hb.cats || [];
      if(cm.actual[cid] === 'todas' && !cats.includes(cid)){
        if(cats.length >= MAX_CATS_HABITO){ saltados++; continue; }
        hb.cats = cats.concat([cid]); cambiados.add(id);
      }else if(cm.actual[cid] === 'ninguna' && cats.includes(cid)){
        const resto = cats.filter(x => x !== cid);
        if(resto.length) hb.cats = resto; else delete hb.cats;
        cambiados.add(id);
      }
    }
  }
  catsMulti = null;
  if(!cambiados.size && !saltados) return true;          // nada que cambiar: se cierra sin avisar
  habMulti = null;
  save();
  const n = cambiados.size;
  toast(`${n ? `Categorías cambiadas en ${n} ${n === 1 ? 'hábito' : 'hábitos'}` : 'Sin cambios'}${saltados ? ` · ${saltados} ya tenían el máximo de ${MAX_CATS_HABITO}` : ''}`,
        { accion: { texto: 'Deshacer', fn: () => {
    if(state !== raiz) return;
    for(const p of previo){
      const hb = habitoDe(p.id);
      if(!hb) continue;
      if(p.tenia) hb.cats = p.cats; else delete hb.cats;
    }
    save(); render();
  } } });
  return true;
}

/* Mantener apretada una tarjeta entra en el modo selección con esa tarjeta elegida. */
function cancelarLP(){ if(lp){ clearTimeout(lp.timer); lp = null; } }
function dispararLP(){
  if(!lp) return;
  const id = lp.id; cancelarLP();
  if(habMulti || view !== 'habitos' || habVista !== 'hoy' || !habitoDe(id)) return;
  habMulti = new Set([id]); selEntrando = true;
  suprimirClic = true; setTimeout(() => { suprimirClic = false; }, 700);   // el toque que sigue al soltar no tiene que alternarla
  try{ if(navigator.vibrate) navigator.vibrate(15); }catch(_){}
  render();
}
document.addEventListener('pointerdown', e => {
  cancelarLP();
  if(e.button || habMulti || view !== 'habitos' || habVista !== 'hoy' || habSel) return;
  const c = e.target.closest && e.target.closest('.hab.rellena[data-hid]');
  if(!c) return;
  lp = { id: c.dataset.hid, x: e.clientX, y: e.clientY, pid: e.pointerId, timer: setTimeout(dispararLP, CLIC_LARGO_MS) };
});
document.addEventListener('pointermove', e => {
  if(lp && e.pointerId === lp.pid && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > CLIC_LARGO_PX) cancelarLP();
});
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, cancelarLP));
// En captura, antes que el resto: se traga el clic que llega justo después de entrar por mantener apretado.
document.addEventListener('click', e => {
  if(suprimirClic){ suprimirClic = false; e.stopImmediatePropagation(); e.preventDefault(); }
}, true);
// Mantener apretado en un teléfono también abre el menú del sistema: acá no corresponde.
document.addEventListener('contextmenu', e => {
  if((lp || suprimirClic) && e.target.closest && e.target.closest('.hab.rellena')) e.preventDefault();
});

/* ---- Año: 53 semanas, solo lectura ---- */
function anioPorHabitoHTML(hb){
  const hoy = iso(), cant = esCantidad(hb), ini = inicioDe(hb);
  let cumplidos = 0;
  const celdas = rangoAnio().flat().map(d => {
    const ok = hecho(hb.id, d), fut = d > hoy;
    if(ok && !fut) cumplidos++;
    const parcial = cant && !ok && valorDia(hb.id, d) > 0;
    const antes = d < ini, noToca = !antes && !programadoEn(hb, d, ini);
    const cls = [ok ? 'on' : '', parcial ? 'parcial' : '', fut ? 'fut' : '', noToca ? 'nt' : '', antes ? 'ant' : '',
                 d === hoy ? 'today' : ''].filter(Boolean).join(' ');
    return `<i class="hcell ${cls}" ${parcial ? `style="--f:${fracDia(hb, d).toFixed(3)}"` : ''}></i>`;
  }).join('');
  const resumen = `${cumplidos} ${cumplidos === 1 ? 'día cumplido' : 'días cumplidos'} en el último año`;
  return `<button class="hab-abrir" data-act="abrir-habito" data-id="${esc(hb.id)}"
      aria-label="Abrir ${esc(hb.name)}: ${resumen}">
    <span class="heat tablero anio" aria-hidden="true">${celdas}</span>

}

/* ---- El heatmap tocable (Historial del detalle) ---- */
function heatmapHTML(habitId){
  const hb = habitoDe(habitId);
  if(!hb) return '';
  const hoy = new Date(), cant = esCantidad(hb);
  // Contamos desde el final de la semana actual hacia atrás: así salen siempre
  // exactamente N columnas completas, sin una suelta a medio llenar en el borde.
  const fin = addDays(hoy, 6 - ((hoy.getDay() + 6) % 7));
  const desde = addDays(fin, -(semanasHeat() * 7 - 1)), ini = inicioDe(hb);
  const celdas = [];
  for(let d = new Date(desde); d <= fin; d = addDays(d, 1)){
    const key = iso(d), c = claseDia(hb, key, ini);
    const cls = [c.ok ? 'on' : '', c.parcial ? 'parcial' : '', c.fut ? 'fut' : '', c.noToca ? 'nt' : '', c.antes ? 'ant' : '',
                 key === iso(hoy) ? 'today' : ''].filter(Boolean).join(' ');
    celdas.push(`<button class="hcell ${cls}" ${c.parcial ? `style="--f:${fracDia(hb, key).toFixed(3)}"` : ''}
      ${c.attrs} ${c.inerte ? 'disabled' : ''} aria-label="${esc(etiquetaDia(hb, key, ini))}" title="${key}"></button>`);
  }
  return `<div class="heat tablero" ${habEstilo(hb)}>${celdas.join('')}</div>`;
}

/* ---- Navegación entre semanas y meses ---- */
function navegacionHTML(vista){
  if(vista !== 'semana' && vista !== 'mes') return '';

}

/* ---- Gráficos de un hábito de cantidad (dentro de un panel del color del hábito) ---- */
function barrasHabitoHTML(hb){
  const W = 310, x0 = 6, x1 = 304, yb = 92, yt = 10, meta = Number(hb.meta);
  const dias = Array.from({ length: 30 }, (_, k) => iso(addDays(new Date(), -(29 - k))));
  const vals = dias.map(d => valorDia(hb.id, d));
  const tope = Math.max(meta * 1.15, ...vals, 1);
  const paso = (x1 - x0) / 30, ancho = Math.max(2, paso - 2);
  const y = v => yb - (v / tope) * (yb - yt);
  const u = hb.unidad ? ' ' + hb.unidad : '';
  const barras = vals.map((v, k) => v <= 0 ? '' :
    `<rect x="${(x0 + paso * k + 1).toFixed(1)}" y="${y(v).toFixed(1)}" width="${ancho.toFixed(1)}"
      height="${(yb - y(v)).toFixed(1)}" rx="2" fill="currentColor" opacity="${v >= meta ? 1 : .55}"/>`).join('');
  const toques = dias.map((d, k) => {
    const txt = esc(`${fechaCorta(d)} · ${fmtV(vals[k])} de ${fmtV(meta)}${u}`);
    return `<rect class="hit" x="${(x0 + paso * k).toFixed(1)}" y="0" width="${paso.toFixed(1)}" height="${yb}"
      tabindex="0" role="button" aria-label="${txt}" data-tipfor="hab-tip-b" data-tiptext="${txt}"/>`;
  }).join('');
  return `<svg class="viz" viewBox="0 0 ${W} 100" role="img" aria-label="Últimos 30 días de ${esc(hb.name)}">
      <line x1="${x0}" y1="${y(meta).toFixed(1)}" x2="${x1}" y2="${y(meta).toFixed(1)}" stroke="currentColor"
        stroke-dasharray="4 3" opacity=".85"/>
      <line x1="${x0}" y1="${yb}" x2="${x1}" y2="${yb}" stroke="currentColor" opacity=".5"/>
      ${barras}
      <text x="${x1}" y="${(y(meta) - 3).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="700" fill="currentColor" stroke="var(--tinta)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">meta ${esc(fmtV(meta) + u)}</text>
      ${toques}</svg>
    <div class="tip" id="hab-tip-b">Tocá una barra para ver el día.</div>`;
}
function tendenciaHabitoHTML(hb){
  const W = 12, x0 = 12, x1 = 298, yb = 92, yt = 12, meta = metaSemanal(hb);
  const semanas = weekStarts(W).map(s => {
    let tot = 0;
    for(let k = 0; k < 7; k++) tot += valorDia(hb.id, iso(addDays(s, k)));
    return { desde: iso(s), tot };
  });
  const tope = Math.max(meta * 1.15, ...semanas.map(s => s.tot), 1);
  const paso = (x1 - x0) / (W - 1);
  const cx = k => x0 + paso * k, y = v => yb - (v / tope) * (yb - yt);
  const u = hb.unidad ? ' ' + hb.unidad : '';
  const puntos = semanas.map((s, k) => `${cx(k).toFixed(1)},${y(s.tot).toFixed(1)}`).join(' ');
  const area = `${cx(0).toFixed(1)},${yb} ${puntos} ${cx(W - 1).toFixed(1)},${yb}`;
  const toques = semanas.map((s, k) => {
    const txt = esc(`Semana del ${fechaCorta(s.desde)} · ${fmtV(Math.round(s.tot * 10) / 10)}${u} (meta ${fmtV(meta)})`);
    return `<rect class="hit" x="${(cx(k) - paso / 2).toFixed(1)}" y="0" width="${paso.toFixed(1)}" height="${yb}"
      tabindex="0" role="button" aria-label="${txt}" data-tipfor="hab-tip-t" data-tiptext="${txt}"/>`;
  }).join('');
  return `<svg class="viz" viewBox="0 0 310 100" role="img" aria-label="Tendencia de 12 semanas de ${esc(hb.name)}">
      <line x1="${x0}" y1="${y(meta).toFixed(1)}" x2="${x1}" y2="${y(meta).toFixed(1)}" stroke="currentColor"
        stroke-dasharray="4 3" opacity=".85"/>
      <text x="${x1}" y="${(y(meta) - 3).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="700" fill="currentColor" stroke="var(--tinta)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">meta semanal ${esc(fmtV(Math.round(meta * 10) / 10) + u)}</text>
      <line x1="${x0}" y1="${yb}" x2="${x1}" y2="${yb}" stroke="currentColor" opacity=".5"/>
      <polygon points="${area}" fill="currentColor" opacity=".22"/>
      <polyline points="${puntos}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${semanas.map((s, k) => `<circle cx="${cx(k).toFixed(1)}" cy="${y(s.tot).toFixed(1)}" r="4" fill="currentColor" stroke="var(--tinta)" stroke-width="2"/>`).join('')}
      ${toques}</svg>
    <div class="tip" id="hab-tip-t">Tocá un punto para ver la semana.</div>`;

const SEC_LABEL = {gym:'Gym', estudio:'Estudio', freelance:'Freelance', habitos:'Hábitos'};

function faltaTxt(r, unit, dec){
  if(r.next === null) return 'nivel máximo';
  const n = Math.max(0, r.next - r.value);
  // singular cuando falta uno solo: antes decía "faltan 1 proyectos"
  const u = (n === 1 && unit.length > 1 && unit.endsWith('s')) ? unit.slice(0, -1) : unit;
  return `${n === 1 ? 'falta' : 'faltan'} ${fmtNum(n, dec)} ${u} para ${TIERS[r.i+1].n}`;
}

/* Panel de señalética: un bloque de color plano por sección.
   Reemplaza a los anillos concéntricos, que no pertenecen a este mundo visual
   sino a cualquier app de salud de los últimos diez años. Un bloque se lee de
   un vistazo y a distancia, que es la escena real: el celular en la mano entre
   series. El numeral es la cifra del nivel; la forma de la marca lo repite. */
function panelHTML(secs, avg){
  const bloques = secs.map(s => `
    <button class="bloque" data-act="go-sec" data-view="${s.view}"
      style="--c:${s.r.tier.c}"
      data-ringinfo="1" data-rname="${esc(s.label)}" data-rtier="${esc(s.r.tier.n)}"
      data-rsub="${esc(faltaTxt(s.r, s.unit, s.dec))}"
      aria-label="${esc(s.label + ': ' + s.r.tier.n + '. ' + faltaTxt(s.r, s.unit, s.dec))}">
      <span class="bloque-top">${gemHTML(s.r.tier)}<span class="bloque-sec">${esc(s.label)}</span></span>
      <span class="cifra">${s.r.i + 1}</span>
      <span class="bloque-rango">${esc(s.r.tier.n)}</span>
      <span class="bar" style="--barra:var(--c)"><i style="--p:${s.r.progress.toFixed(3)}"></i></span>
    </button>`).join('');
  return `<div>
    <div class="panel">${bloques}</div>
    <div class="row between mt3 xs muted">
      <span id="ring-name">Rango general</span>
      <span><b id="ring-tier">${esc(TIERS[avg].n)}</b> <span id="ring-sub" class="dim">promedio de las ${secs.length} secciones</span></span>
    </div>
  </div>`;
}

const ABBR = {pecho:'Pec', espalda:'Esp', hombros:'Hom', biceps:'Bic', triceps:'Tri',
  antebrazos:'Ant', abdominales:'Abs', cuadriceps:'Cua', isquios:'Isq', gluteos:'Glu', pantorrillas:'Pan'};

/* Radar de simetría: la forma del polígono ES el desbalance. Un pico solo
   significa que ese grupo se lleva todo el trabajo. */
function radarHTML(g){
  const n = MUSCLE_IDS.length, R = 72, cx = 110, cy = 96;
  const max = Math.max(...MUSCLE_IDS.map(id => g.m[id].pts), 1);
  const ang = i => (i / n) * Math.PI * 2 - Math.PI / 2;
  const pt = (i, k) => [cx + Math.cos(ang(i)) * R * k, cy + Math.sin(ang(i)) * R * k];
  const f  = id => Math.max(.05, g.m[id].pts / max);

  const grid = [.25,.5,.75,1].map(k =>
    `<polygon points="${MUSCLE_IDS.map((_,i)=>pt(i,k).map(v=>v.toFixed(1)).join(',')).join(' ')}"
      fill="none" stroke="var(--line)" stroke-width=".7"/>`).join('');
  const spokes = MUSCLE_IDS.map((_,i) =>
    `<line x1="${cx}" y1="${cy}" x2="${pt(i,1)[0].toFixed(1)}" y2="${pt(i,1)[1].toFixed(1)}" stroke="var(--line)" stroke-width=".7"/>`).join('');
  const poly = MUSCLE_IDS.map((id,i)=>pt(i,f(id)).map(v=>v.toFixed(1)).join(',')).join(' ');
  const dots = MUSCLE_IDS.map((id,i) => {
    const [x,y] = pt(i, f(id));
    const d = g.m[id];
    // El aro transparente (stroke) agranda el área que responde al toque a unos 44 px sin
    // cambiar cómo se ve el punto.
    return `<circle class="radar-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4"
      fill="${d.rank.tier.c}" stroke="transparent" stroke-width="24" data-act="open-muscle" data-mus="${id}"
      data-tipfor="radar-tip" data-tiptext="${esc(MUSCLES[id].label + ' · ' + d.rank.tier.n + ' · ' + fmtNum(d.pts) + ' pts · entrenado ' + heatLabel(d.last))}"
      role="button" tabindex="0" aria-label="${esc(MUSCLES[id].label)}"/>`;
  }).join('');
  const labels = MUSCLE_IDS.map((id,i) => {
    const [x,y] = pt(i, 1.2);
    const anchor = Math.abs(x - cx) < 8 ? 'middle' : (x > cx ? 'start' : 'end');
    return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anchor}" font-size="7.5" fill="var(--muted)">${ABBR[id]}</text>`;
  }).join('');

  return `<svg class="viz" viewBox="0 0 220 200" role="img" aria-label="Radar de simetría muscular">
    ${grid}${spokes}
    <polygon points="${poly}" fill="color-mix(in srgb, var(--accent) 18%, transparent)" stroke="var(--accent)" stroke-width="1.6"/>
    ${dots}${labels}
  </svg>`;
}

function weekStarts(n){
  const t = new Date();
  const mon = addDays(t, -((t.getDay() + 6) % 7));
  return Array.from({length:n}, (_,k) => addDays(mon, -(n - 1 - k) * 7));
}

/* Tendencia de 12 semanas: DOS gráficos chicos con el mismo eje de semanas, uno para gym
   (puntos) y otro para estudio (horas), cada uno con su escala. Antes era un solo gráfico
   con dos escalas superpuestas: la alineación entre ellas era arbitraria y hacía parecer
   relaciones que no estaban en los datos. */
function semanasTendencia(g){
  return weekStarts(12).map(s => {
    const from = iso(s), to = iso(addDays(s, 6));
    const pts = Object.keys(g.byDate).filter(d => d >= from && d <= to).reduce((a, d) => a + g.byDate[d], 0);
    const min = state.estudio.entries.filter(e => e.date >= from && e.date <= to).reduce((a, e) => a + (Number(e.minutes) || 0), 0);
    return { from, pts, h: min / 60, label: fmtDate(from) };
  });
}
/* Barras de 12 semanas: finas, separadas por 2 px, con la base sólida y el valor de esta
   semana escrito al final (en tinta de texto, no del color de la serie). */
function barrasSemanasHTML(vals, { titulo, unidad, dec, ejeX, textos }){
  const W = 310, x0 = 4, x1 = 306, yb = 52, yt = 16, n = vals.length;
  const tope = Math.max(...vals, 1e-9), paso = (x1 - x0) / n, ancho = paso - 2;
  const alto = v => v > 0 ? Math.max(2, (v / tope) * (yb - yt)) : 0;
  const barras = vals.map((v, i) => v <= 0 ? '' :
    `<rect x="${(x0 + paso * i + 1).toFixed(1)}" y="${(yb - alto(v)).toFixed(1)}" width="${ancho.toFixed(1)}" height="${alto(v).toFixed(1)}" rx="2"
      fill="var(--accent)" opacity="${i === n - 1 ? 1 : .72}"/>`).join('');
  const hits = vals.map((v, i) => `<rect class="hit" x="${(x0 + paso * i).toFixed(1)}" y="0" width="${paso.toFixed(1)}" height="${yb}"
      tabindex="0" role="button" aria-label="${textos[i]}" data-tipfor="trend-tip" data-tiptext="${textos[i]}"/>`).join('');
  const ult = vals[n - 1];
  const eje = ejeX ? `<text x="${x0}" y="${yb + 12}" font-size="8.5" fill="var(--muted)">${esc(ejeX[0])}</text>
      <text x="${x1}" y="${yb + 12}" font-size="8.5" fill="var(--muted)" text-anchor="end">${esc(ejeX[1])}</text>` : '';
  return `<svg class="viz" viewBox="0 0 ${W} ${ejeX ? yb + 16 : yb + 4}" role="img" aria-label="${esc(titulo)}: esta semana ${fmtNum(ult, dec)} ${esc(unidad)}">
      <text x="${x0}" y="10" font-size="9.5" font-weight="700" fill="var(--text)">${esc(titulo)}</text>
      <text x="${x1}" y="10" font-size="9.5" fill="var(--muted)" text-anchor="end">esta semana · <tspan font-weight="700" fill="var(--text)">${fmtNum(ult, dec)} ${esc(unidad)}</tspan></text>
      <line x1="${x0}" y1="${yb}" x2="${x1}" y2="${yb}" stroke="var(--line)"/>
      ${barras}${eje}${hits}</svg>`;
}
function trendHTML(g){
  const ws = semanasTendencia(g);
  const textos = ws.map(w => esc('Semana del ' + w.label + ' · ' + fmtNum(w.pts) + ' pts de gym · ' + fmtNum(w.h, 1) + ' h de estudio'));
  return barrasSemanasHTML(ws.map(w => w.pts), { titulo: 'Gym', unidad: 'pts', dec: 0, textos }) +
         barrasSemanasHTML(ws.map(w => w.h), { titulo: 'Estudio', unidad: 'h', dec: 1, textos,
           ejeX: ['sem. del ' + ws[0].label, 'esta semana'] });
}

/* Heatmap de constancia global: cuántos frentes tocó cada día (0 a 4). */
/* El color de un día según cuántos frentes tuvo (0 a 3). */
const colorConstancia = c => c === 0 ? 'var(--surface-2)' : `color-mix(in srgb, var(--good) ${Math.round(25 + c * 25)}%, var(--surface-2))`;
function leyendaConstanciaHTML(){
  return `<div class="const-leyenda xs muted" aria-hidden="true"><span>Menos</span>${[0, 1, 2, 3].map(c =>
    `<i style="background:${colorConstancia(c)}" title="${c} ${c === 1 ? 'frente' : 'frentes'}"></i>`).join('')}<span>Más</span></div>`;
}
/* La grilla de Constancia: una columna por semana (lunes a domingo, de arriba abajo),
   con las letras de los días a la izquierda y el mes arriba de su primera semana. */
/* Dónde va cada mes: sobre la semana que tiene su día 1 (la de su domingo). Si dos quedan
   a menos de tres semanas, se descarta la de antes (la del mes cortado del principio). */
function mesesConstancia(inicio, semanas){
  const meses = [];
  for(let w = 0; w < semanas; w++){
    const m = addDays(inicio, w * 7 + 6).getMonth();
    if(!meses.length || meses[meses.length - 1].m !== m) meses.push({ w, m });
  }
  return meses.filter((x, k) => !meses[k + 1] || meses[k + 1].w - x.w >= 3);
}
function globalHeatHTML(semanas = semanasConstancia(), t = new Date()){
  const hoy = iso(t);
  const fin = addDays(lunesDe(t), 6), inicio = addDays(fin, -(semanas * 7 - 1));
  // Las fechas de cada frente, una vez: buscar en las listas por cada día era lento.
  const gym = new Set(state.gym.sessions.map(s => s.date));
  const personal = new Set(state.estudio.entries.map(e => e.date).concat(state.freelance.items.map(i => i.updatedAt)));
  const partes = [];
  [['L', 0], ['X', 2], ['V', 4]].forEach(([l, d]) => partes.push(`<span class="const-dia" style="grid-column:1;grid-row:${d + 2}" aria-hidden="true">${l}</span>`));
  mesesConstancia(inicio, semanas).forEach(({ w, m }) =>
    partes.push(`<span class="const-mes" style="grid-column:${w + 2};grid-row:1" aria-hidden="true">${NOMBRE_MES[m].slice(0, 3)}</span>`));
  let activos = 0;
  for(let w = 0; w < semanas; w++){
    const lunes = addDays(inicio, w * 7);
    for(let d = 0; d < 7; d++){
      const key = iso(addDays(lunes, d)), fut = key > hoy;
      // Tres frentes, los mismos que las secciones: estudio y freelance cuentan como uno (Personal).
      let c = 0;
      if(gym.has(key)) c++;
      if(personal.has(key)) c++;
      if(state.habitos.list.some(hb => activo(hb.id, key))) c++;
      if(c && !fut) activos++;
      const txt = `${key} · ${fut ? 'a futuro' : c + ' de 3 frentes'}`;
      partes.push(`<div class="hcell act${fut ? ' fut' : ''}${key === hoy ? ' today' : ''}" data-c="${c}"
        style="grid-column:${w + 2};grid-row:${d + 2};background:${colorConstancia(c)}" title="${txt}" data-tipfor="act-tip"
        data-tiptext="${txt}"></div>`);
    }
  }
  return `<div class="heat constancia" style="--sem:${semanas}" role="img"
    aria-label="${activos} días con actividad en las últimas ${semanas} semanas">${partes.join('')}</div>`;
}

/* ---- Series de la semana ---- */
let gymSemana = 0;            // cuántas semanas atrás se está mirando (0 = esta)

      <div class="serie-cab"><b>${esc(MUSCLES[id].label)}</b><span>${fmtNum(n, n % 1 ? 1 : 0)} / ${min}–${max} · ${estado}</span></div>
      <div class="serie-pista" role="img" aria-label="${esc(MUSCLES[id].label)}: ${fmtNum(n, n % 1 ? 1 : 0)} series de ${min} a ${max}">
        <i class="serie-franja" style="left:${(min / escala * 100).toFixed(1)}%;right:${(100 - max / escala * 100).toFixed(1)}%"></i>
        <i class="serie-avance" style="--p:${Math.min(n / escala, 1).toFixed(3)}"></i>
      </div></div>`;
  }).join('');
  return `<div class="card mt4">
    <div class="row between wrap">
      <div><h2>Series por músculo</h2>

    </div>
    <div class="series">${filas}</div>
  </div>`;
}

/* Sugerencia de entrenamiento: prioriza déficit de puntos y días sin estímulo.
   El botón abre el modal de sesión ya cargado con los ejercicios propuestos. */
let suggestion = [];
/* Qué tan urgente es un grupo (más alto = antes): cuánto le falta de puntos frente al más
   entrenado, cuántos días lleva sin estímulo (hasta 14) y cuántas series le faltan esta
   semana para llegar al piso. Pesos 0,4 · 0,3 · 0,3. */
function prioridadMusculo(ptsRel, dias, series, min){
  return (1 - ptsRel) * .4 + (Math.min(dias, 14) / 14) * .3 + (Math.max(0, min - series) / min) * .3;
}
function suggestHTML(g){
  const max = Math.max(...MUSCLE_IDS.map(id => g.m[id].pts), 1), ss = seriesSemana();
  const scored = MUSCLE_IDS.map(id => {
    const d = g.m[id], [min] = objetivoSeries(id);
    const dias = d.last ? Math.min(daysSince(d.last), 14) : 14;
    return { id, score: prioridadMusculo(d.pts / max, dias, ss[id], min), d, n: ss[id], min };
  }).sort((a,b) => b.score - a.score).slice(0, 3);

  suggestion = [];
  const bloques = scored.map(({id, d, n, min}) => {
    const exs = CATALOG.filter(e => e.muscles[id] >= 1).slice(0, 2);
    exs.forEach(e => { if(!suggestion.includes(e.id)) suggestion.push(e.id); });
    return `<div class="item">
      <div class="row between wrap">
        <b>${esc(MUSCLES[id].label)}</b>
        <span class="pill">${heatLabel(d.last)}</span>
      </div>
      <div class="xs dim" style="margin-top:var(--s1)">${exs.map(e => esc(e.name)).join(' · ')}</div>
      <div class="xs muted" style="margin-top:var(--s1)">Esta semana: ${fmtNum(n, n % 1 ? 1 : 0)} de ${min} series</div>
    </div>`;
  }).join('');

  return `<div class="card mt4">
    <div class="row between wrap">
      <div>
        <h2>Qué entrenar hoy</h2>
        <div class="xs muted" style="margin-top:var(--s1)">Los tres grupos con más déficit, más días sin estímulo y menos series esta semana.</div>
      </div>
      <button class="btn primary" data-act="quick-session">Armar esta sesión</button>
    </div>
    <div class="list mt3">${bloques}</div>
  </div>`;
}

/* ==========================================================================
   MOVIMIENTO — resortes, no duraciones.
   Una animación con duración fija no puede responder a lo que pase mientras
   corre: si la tocás a mitad de camino, o te ignora o pega un salto. Un
   resorte sí, porque no tiene libreto —tiene un objetivo y un estado actual—,
   y cambiarle el objetivo en pleno vuelo sale continuo.
   ========================================================================== */

/* Dos parámetros de diseñador en vez de los tres de física:
     respuesta      a los cuántos segundos llega, más o menos. NO es una
                    duración: el resorte no tiene una, el tiempo de reposo sale
                    de los números.
     amortiguacion  1 = llega y se queda. Menos de 1 se pasa y vuelve.
                    El rebote se GANA: va solo cuando el gesto traía envión.
                    Algo que apareció solo, sin que lo empujaras, no rebota. */
function resorte({ desde, hasta, v0 = 0, respuesta = .4, amortiguacion = 1, paso, fin }){
  const w = 2 * Math.PI / respuesta;
  const DT = 1 / 240;                   // paso fijo: el resultado no depende de los FPS
  let x = desde, v = v0, previo = null, resto = 0, id = 0, vivo = true;
  function cuadro(t){
    if(!vivo) return;
    if(previo === null) previo = t;
    // Si la pestaña estuvo dormida no integramos medio segundo de un saque.
    resto += Math.min((t - previo) / 1000, .064);
    previo = t;
    while(resto >= DT){
      const a = -w * w * (x - hasta) - 2 * amortiguacion * w * v;
      v += a * DT; x += v * DT; resto -= DT;
    }
    paso(x, v);
    if(Math.abs(x - hasta) < .4 && Math.abs(v) < 4) terminar();
    else id = requestAnimationFrame(cuadro);
  }
  function detener(){ vivo = false; cancelAnimationFrame(id); }
  function terminar(){ detener(); x = hasta; v = 0; paso(x, 0); if(fin) fin(); }
  id = requestAnimationFrame(cuadro);
  return { detener, terminar, valor: () => x, velocidad: () => v };
}

/* A dónde llegaría algo que soltás y dejás frenar solo. No es la fórmula del
   secundario (v²/2a): es decaimiento exponencial, la misma que usan iOS y los
   scrolls que se sienten bien. Sirve para decidir con el ENVIÓN y no con la
   posición: un tirón corto y rápido alcanza para cerrar aunque casi no la
   hayas movido, y bajarla despacio hasta la mitad y soltarla, no. */
function proyectar(v, deceleracion = .998){
  return (v / 1000) * deceleracion / (1 - deceleracion);
}

/* Resistencia creciente pasado un borde. Un tope duro se lee como "se colgó";
   esto se lee como "te escucho, pero de acá no hay más". */
function gomita(exceso, alto, c = .55){
  return (exceso * alto * c) / (alto + c * Math.abs(exceso));
}

/* ---- La hoja ----
   En teléfono el diálogo es una hoja que sube desde abajo y se puede agarrar y
   tirar para abajo en cualquier momento, incluso mientras está entrando. En
   escritorio es un diálogo centrado que solo sube 24px: mismo código, distinto
   recorrido, y sin arrastre. */
const movReducido = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const esHoja      = () => matchMedia('(max-width: 699px)').matches;

let hojaY = 0, hojaAlto = 1, hojaAnim = null, agarre = null;

function medirHoja(){
  const m = $('#backdrop .modal');
  hojaAlto = esHoja() ? Math.max(m.offsetHeight, 1) : 24;
  return m;
}
function ponerHoja(y){
  hojaY = y;
  const m = $('#backdrop .modal');
  m.style.transform = y ? 'translateY(' + y.toFixed(2) + 'px)' : '';
  $('#backdrop').style.setProperty('--velo', Math.min(1, Math.max(0, 1 - y / hojaAlto)).toFixed(3));
}
function enVuelo(si){ $('#backdrop .modal').classList.toggle('enVuelo', si); }

function abrirHoja(){
  const bd = $('#backdrop'), yaEstaba = !bd.hidden;
  bd.hidden = false;
  const m = medirHoja();
  if(movReducido()){ if(hojaAnim) hojaAnim.detener(); hojaAnim = null; ponerHoja(0); return; }
  // Si estaba cerrándose, arrancamos desde donde SE VE y con la velocidad que
  // traía, no desde el principio: si no, se ve el salto.
  let desde = hojaAlto, v0 = 0;
  if(yaEstaba && hojaAnim){ desde = hojaAnim.valor(); v0 = hojaAnim.velocidad(); hojaAnim.detener(); }
  else if(yaEstaba){ desde = hojaY; }
  ponerHoja(desde);
  enVuelo(true);
  // Sin rebote: lo que la abrió fue un toque, no un envión.
  hojaAnim = resorte({ desde, hasta: 0, v0, respuesta: .35, amortiguacion: 1,
    paso: ponerHoja, fin: () => { hojaAnim = null; enVuelo(false); } });
}

function cerrarHoja(v0, luego){
  const bd = $('#backdrop'), m = medirHoja();
  const listo = () => {
    hojaAnim = null; enVuelo(false);
    bd.hidden = true; m.style.transform = ''; bd.style.removeProperty('--velo');
    if(luego) luego();
  };
  if(hojaAnim){ hojaAnim.detener(); hojaAnim = null; }
  if(movReducido()){ listo(); return; }
  enVuelo(true);
  hojaAnim = resorte({ desde: hojaY, hasta: hojaAlto, v0: v0 || 0,
    respuesta: .3, amortiguacion: 1, paso: ponerHoja, fin: listo });
}

/* ---- El arrastre ----
   Nada de eventos tipo "swipedown", que solo avisan al final: eso tira a la
   basura el seguimiento continuo, que es justo lo que hace falta para que la
   hoja vaya pegada al dedo. */
function tomarHoja(e){
  if(!esHoja() || movReducido() || e.button) return;
  if(e.target.closest('#modal-x')) return;        // el botón de cerrar es un botón
  medirHoja();
  if(hojaAnim){ hojaAnim.detener(); hojaAnim = null; }   // se puede agarrar en vuelo
  enVuelo(true);
  agarre = { id: e.pointerId, y0: e.clientY, base: hojaY,
             hist: [{ t: e.timeStamp, y: e.clientY }] };
  // Capturar el puntero hace que el seguimiento siga aunque el dedo salga de la
  // cabecera. Lanza si el puntero ya no está activo (un evento sintético, o
  // ciertos lectores de pantalla): sin captura el arrastre sigue funcionando
  // mientras el dedo quede encima, que es mejor que romper el gesto entero.
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
}
function moverHoja(e){
  if(!agarre || e.pointerId !== agarre.id) return;
  // `base` respeta desde dónde la agarraste: si la hoja ya estaba a mitad de
  // camino, no salta para pegarse al dedo.
  let y = agarre.base + (e.clientY - agarre.y0);
  if(y < 0) y = -gomita(-y, hojaAlto);            // para arriba no hay a dónde ir
  ponerHoja(y);
  agarre.hist.push({ t: e.timeStamp, y: e.clientY });
  if(agarre.hist.length > 5) agarre.hist.shift();  // la velocidad es de los últimos cuadros
}
function soltarHoja(e){
  if(!agarre || e.pointerId !== agarre.id) return;
  const h = agarre.hist, a = h[0], b = h[h.length - 1];
  const vel = (b.y - a.y) / Math.max(b.t - a.t, 1) * 1000;   // px/s
  agarre = null;
  // La animación arranca con la velocidad exacta del dedo: sin eso se nota la
  // costura entre arrastrar y soltar.
  if(hojaY + proyectar(vel) > hojaAlto * .5) closeModal(vel);
  else hojaAnim = resorte({ desde: hojaY, hasta: 0, v0: vel, respuesta: .35,
    // Acá SÍ hubo envión, así que un poco de rebote se siente real.
    amortiguacion: .8, paso: ponerHoja, fin: () => { hojaAnim = null; enVuelo(false); } });
}

/* ==========================================================================
   6. MODALES — un solo diálogo reutilizado por todos los formularios.
   Hay UN solo <dialog> en el HTML; cada formulario le cambia el título, el
   cuerpo y qué hace el botón de guardar. Por eso `modalSave` guarda la función
   de turno: el botón no sabe qué está guardando, se lo dice quien abrió.
   ========================================================================== */
let modalSave = null;
let lastFocus = null;

function openModal(title, bodyHTML, onSave, saveLabel = 'Guardar', peligro = false){
  // Guardamos quién tenía el foco para devolvérselo al cerrar: si no, el
  // teclado y el lector de pantalla quedan tirados al principio de la página.
  lastFocus = document.activeElement;
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = bodyHTML;
  $('#modal-foot').innerHTML = `
    <button class="btn" data-act="close-modal">${onSave ? 'Cancelar' : 'Cerrar'}</button>
    ${onSave ? `<button class="btn ${peligro ? 'peligro' : 'primary'}" data-act="save-modal">${esc(saveLabel)}</button>` : ''}`;
  modalSave = onSave;
  abrirHoja();
  const first = $('#modal-body input, #modal-body select, #modal-body textarea');
  if(first) first.focus();
}
function closeModal(v0){
  if($('#backdrop').hidden) return;
  cerrarHoja(v0, () => {
    modalSave = null;
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  });
}

      </div>

        <button type="button" class="btn sm" data-act="prog-editar" data-ei="${i}" aria-expanded="${abierto}">${abierto ? 'Cerrar' : 'Cambiar'}</button></div>

function saveSession(){
  // Limpio series vacías antes de guardar: si no, contaminan el historial.
  draft.exercises.forEach(ex => {
    ex.sets = ex.sets.filter(s => Number(s.reps) > 0);
  });
  draft.exercises = draft.exercises.filter(ex => ex.sets.length);
  if(!draft.exercises.length){ toast('Cargá al menos una serie con reps.'); return false; }
  draft.exercises.forEach(ex => { delete ex.meta; });   // la meta es de la rutina, no del historial

  // Récords: se miden contra el historial SIN esta sesión (esRecord la excluye).
  const records = draft.exercises.filter(ex => esRecord(draft, ex)).map(ex => ex.name);
  const before = computeGym();
  const idx = state.gym.sessions.findIndex(s => s.id === draft.id);
  if(idx >= 0) state.gym.sessions[idx] = draft; else state.gym.sessions.push(draft);
  save();
  const after = computeGym();
  const delta = after.totalPts - before.totalPts;
  toast(`Guardado · ${delta >= 0 ? '+' : ''}${fmtNum(delta,1)} puntos de estímulo` +
        (records.length ? ` · Récord en ${records.join(', ')}` : ''));
  return true;
}

/* ==========================================================================
   11. EVENTOS — delegación desde document. Un solo listener para toda la app:
   como el HTML se redibuja entero, enganchar listeners a cada botón los
   perdería en el siguiente render.
   ========================================================================== */

document.addEventListener('click', e => {
  const fila = e.target.closest('.rueda-item');
  if(fila){ fijarRueda(fila.closest('.rueda'), +fila.dataset.k); return; }
  const tab = e.target.closest('.tabs > .tab');
  if(tab){ go(tab.dataset.view); return; }

  const zone = e.target.closest('[data-muscle]');
  if(zone){
    selMuscle = selMuscle === zone.dataset.muscle ? null : zone.dataset.muscle;
    render();
    const det = $('#muscle-detail');
    if(det) det.focus({preventScroll:true});
    return;
  }

  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  // Si esta acción completa el día que se está mirando en Hábitos, el anillo del día festeja.
  const diaVigilado = view === 'habitos' && habVista === 'hoy' ? (habDia || iso()) : null;
  const antes = diaVigilado && diaCompleto(diaVigilado);
  handleAction(btn.dataset.act, btn, e);
  if(diaVigilado && !antes && view === 'habitos' && diaCompleto(diaVigilado)) festejarDia(diaVigilado);
});

// El mapa corporal también tiene que responder al teclado: los <g> son focusables
// pero no son botones nativos, así que Enter y Espacio hay que manejarlos a mano.
document.addEventListener('keydown', e => {
  // El reloj va encima de todo (también del diálogo): Escape lo minimiza a él primero.
  if(reloj){
    if(e.key === 'Escape'){ e.preventDefault(); cerrarReloj(); return; }
    if(e.target.classList?.contains('rueda')){
      const c = reloj.cols && reloj.cols.find(x => x.id === e.target.dataset.rueda);
      const salto = { ArrowUp: -1, ArrowDown: 1, PageUp: -5, PageDown: 5 }[e.key];
      if(c && (salto || e.key === 'Home' || e.key === 'End')){
        e.preventDefault();
        const k = c.valores.indexOf(c.v);
        fijarRueda(e.target, e.key === 'Home' ? 0 : e.key === 'End' ? c.valores.length - 1 : k + salto);
      }
      return;
    }
    if(e.key === 'Tab'){                // el foco no se escapa del reloj
      const f = [...$('#reloj').querySelectorAll('button, [tabindex="0"]')];
      if(f.length && e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length - 1].focus(); }
      else if(f.length && !e.shiftKey && document.activeElement === f[f.length - 1]){ e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  if(e.key === 'Escape' && !$('#backdrop').hidden){ closeModal(); return; }
  if(e.key === 'Escape' && habMulti){ salirSeleccion(); return; }
  if((e.key === 'Enter' || e.key === ' ') && habMulti && e.target.classList?.contains('en-sel')){ e.preventDefault(); e.target.click(); return; }
  if(e.key === 'Escape' && view === 'habitos' && habSel){ habSel = null; habOffset = 0; render(); return; }
  if(e.key === 'Enter' && e.target.id === 'hb-cat-nueva'){
    e.preventDefault();
    const crear = $('[data-act="crear-cat"]');
    if(crear) crear.click();
    return;
  }
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('mz')){
    e.preventDefault();
    e.target.click();
  }
  if((e.key === 'Enter' || e.key === ' ') &&
     (e.target.classList?.contains('bloque') || e.target.classList?.contains('radar-dot'))){
    e.preventDefault();
    e.target.dispatchEvent(new MouseEvent('click', {bubbles:true}));
  }
});

// Escritura en los inputs del draft de sesión.
document.addEventListener('input', e => {
  const t = e.target;
  // El selector libre de color del editor de hábitos: el elegido pasa a ser el
  // actual y ninguna casilla de la paleta queda marcada.
  if(t.id === 'fl-tel'){ const ok = $('#fl-tel-ok'); if(ok) ok.textContent = telHint(t.value); return; }
  if(t.id === 'hb-ico-buscar'){ filtrarIconos(t.value); return; }
  // "Distinto según el día": las casillas arrancan con los minutos que ya había.
  if(t.id === 'hb-min-var'){
    const base = $('#hb-min'), grilla = $('#hb-min-dias');
    grilla.hidden = !t.checked; base.disabled = t.checked;
    const dias = $$('#hb-min-dias input');
    if(t.checked) dias.forEach(i => { if(!i.value) i.value = base.value; });
    else if(!base.value) base.value = Math.max(0, ...dias.map(i => Number(i.value) || 0)) || '';
    refrescarMinDias();
    return;
  }
  if(t.id === 'hb-color-libre'){
    colorDraft = t.value;
    $$('.sw-btn').forEach(b => b.setAttribute('aria-pressed', 'false'));
    refrescarPreviewIcono();
    return;
  }
  // Escribir un emoji quita el ícono propio elegido: nunca quedan los dos.
  if(t.id === 'hb-emoji'){
    if(t.value.trim()) iconoDraft = null;
    refrescarPreviewIcono();
    return;
  }
  if(!draft) return;
  if(t.dataset.draft){ draft[t.dataset.draft] = t.value; return; }
  if(t.dataset.k){
    const ex = draft.exercises[+t.dataset.ei];
    if(ex) ex.sets[+t.dataset.si][t.dataset.k] = t.value;
    if(Number(t.value) > 0){
      // Ya escribiste: los botones que traen series no aparecen más (nunca pisan lo tuyo).
      $$(`.ultima[data-ei="${t.dataset.ei}"] [data-act="repetir-ultima"], .ultima[data-ei="${t.dataset.ei}"] [data-act="usar-sugerencia"]`).forEach(r => r.remove());
    }
  }
});

/* Filtra en el lugar: todas las palabras tienen que aparecer. Con búsqueda se abren los
   grupos que tienen algo y se esconden los demás; sin búsqueda vuelven a como estaban. */
function filtrarIconos(q){
  const palabras = claveNombre(q).split(' ').filter(Boolean);
  let hay = 0;
  $$('#hb-iconos .icono-grupo').forEach(gr => {
    let n = 0;
    gr.querySelectorAll('.ico-btn').forEach(b => {
      const ok = palabras.every(p => b.dataset.buscar.includes(p));
      b.hidden = !ok; if(ok) n++;
    });
    if(palabras.length){ gr.hidden = !n; if(n){ gr.open = true; } }
    else{ gr.hidden = false; gr.open = !!iconoDraft && ICONOS[iconoDraft] && ICONOS[iconoDraft].g === gr.dataset.grupo; }
    hay += n;
  });
  const nada = $('#hb-iconos .ico-nada'); if(nada) nada.hidden = hay > 0;
}

      <div class="min-dias" id="hb-min-dias" ${md ? '' : 'hidden'}>${INICIAL_DIA.map((l, i) => `
        <label class="min-dia" data-dia="${i}"><span>${l}</span>
          <input type="number" inputmode="numeric" min="0" max="${MAX_MIN_HABITO}" step="1" id="hb-md-${i}" aria-label="Minutos el ${NOMBRES_DIA[i]}"
            value="${md ? md[i] : base}"></label>`).join('')}</div>
      <p class="xs muted" style="margin-top:var(--s1)">En la tarjeta de Hoy, ▶ abre el temporizador y al terminar se registran los minutos solos.</p>
    </div>`;
}
/* Muestra solo las casillas de los días que tocan con la frecuencia que está elegida. */
function refrescarMinDias(){
  $$('#hb-min-dias .min-dia').forEach(l => { l.hidden = frecDraft === 'dias' && !diasDraft.includes(+l.dataset.dia); });
}
/* Lee el bloque de tiempo del editor: {meta, metasDia?} o un texto de error. */
function leerTiempoForm(){
  if($('#hb-min-var').checked){
    const md = INICIAL_DIA.map((_, i) => {
      if(frecDraft === 'dias' && !diasDraft.includes(i)) return 0;
      const v = $('#hb-md-' + i).value.trim();
      return v === '' ? 0 : Number(v);
    });
    if(md.some(n => !Number.isInteger(n) || n < 0 || n > MAX_MIN_HABITO)) return `Los minutos van de 0 a ${MAX_MIN_HABITO}, sin decimales.`;
    if(!md.some(n => n > 0)) return 'Poné minutos en al menos un día.';
    return { meta: Math.max(...md), metasDia: md };
  }
  const m = Number($('#hb-min').value);
  if(!Number.isInteger(m) || m < 1 || m > MAX_MIN_HABITO) return `Los minutos por día van de 1 a ${MAX_MIN_HABITO}.`;
  return { meta: m };
}

/* ---- Registrar una cantidad ---- */
let valorDraft = null;
function setValorDia(id, dia, v){
  const log = state.habitos.log[id] = state.habitos.log[id] || {};
  if(v > 0) log[dia] = Math.round(v * 100) / 100; else delete log[dia];
  save();
}
function abrirValorDia(id, dia){
  const hb = habitoDe(id);
  if(!hb || !esCantidad(hb)) return;
  const meta = metaDia(hb, dia) || Number(hb.meta), paso = fmtV(pasoDe(hb));
  valorDraft = { id, dia };
  openModal(`${hb.name} · ${dia === iso() ? 'hoy' : fechaCorta(dia)}`, `
    <div class="field"><label for="hb-valor">Cuánto${hb.unidad ? ' (' + esc(hb.unidad) + ')' : ''} · meta ${fmtV(meta)}</label>
      <div class="row">
        <button type="button" class="btn" data-act="valor-menos" aria-label="Restar ${paso}">−</button>
        <input id="hb-valor" type="number" inputmode="decimal" min="0" step="any" value="${valorDia(id, dia) || ''}" placeholder="0">
        <button type="button" class="btn btn-vidrio" data-act="valor-mas" aria-label="Sumar ${paso}">+</button>
      </div>
    </div>
    <div class="row wrap mt3">
      <button type="button" class="btn sm" data-act="valor-meta">Completar la meta (${fmtV(meta)})</button>
      <button type="button" class="btn sm" data-act="valor-cero">Dejar en 0</button>
    </div>`,
    () => {
      const crudo = $('#hb-valor').value.trim();
      const v = crudo === '' ? 0 : Number(crudo);
      if(!Number.isFinite(v) || v < 0){ toast('Poné un número de 0 para arriba.'); return false; }
      setValorDia(id, dia, v);
    });
}

/* Sesión pre-armada con la sugerencia del día. */function openQuickSession(){
  draft = { id: uid(), date: iso(), notes: '', exercises: [] };
  suggestion.forEach(exId => {
    const def = exDef(exId);
    if(def) draft.exercises.push({ exId: def.id, name: def.name, rir: 1, sets: [{reps:'', kg:''}] });
  });
  openModal('Sesión sugerida', sessionFormHTML(), saveSession);
}

/* Un día de la rutina: el entrenamiento ya armado, con la meta a la vista. El peso de la
   rutina se pone solo si el ejercicio no tiene historial (si lo tiene, manda la sugerencia). */
function abrirDiaRutina(rid, did){
  const r = state.gym.rutinas.find(x => x.id === rid), d = r && r.dias.find(x => x.id === did);
  if(!d) return;
  const id = uid(), hoy = iso();
  draft = { id, date: hoy, notes: '', exercises: d.ejercicios.filter(e => exDef(e.exId)).map(e => {
    const kg = e.kg && !ultimaVez(e.exId, hoy, id) ? e.kg : '';
    return { exId: e.exId, name: exDef(e.exId).name, rir: 1, meta: { series: e.series, min: e.min, max: e.max },
             sets: Array.from({ length: e.series }, () => ({ reps: '', kg })) };
  }) };
  openModal(d.nombre, sessionFormHTML(), saveSession);
}

function abrirImportar(){
  openModal('Importar con IA', `
    <ol class="imp-pasos">
      <li>Copiá el prompt.</li>
      <li>Pegalo en ChatGPT, Claude o Gemini y mandá junto la foto de tu rutina o de tu cuaderno.</li>

    </ol>
    <button type="button" class="btn" data-act="copiar-prompt">Copiar prompt</button>
    <div id="imp-prompt"></div>
    <div class="field mt3"><label for="imp-texto">Respuesta de la IA</label>
      <textarea id="imp-texto" rows="6" spellcheck="false" placeholder="Pegá acá lo que te respondió">${esc(importTexto)}</textarea></div>
    <p id="imp-error" class="imp-error" role="alert" hidden></p>
