/* Sugerencia de entrenamiento: prioriza déficit de puntos y días sin estímulo.
   El botón abre el modal de sesión ya cargado con los ejercicios propuestos. */
let suggestion = [];
/* Qué tan urgente es un grupo (más alto = antes): cuánto le falta de puntos frente al más
   entrenado, cuántos días lleva sin estímulo (hasta 14) y cuántas series le faltan esta
   semana para llegar al piso. Pesos 0,4 · 0,3 · 0,3. */
function prioridadMusculo(ptsRel, dias, series, min){
  return (1 - ptsRel) * .4 + (Math.min(dias, 14) / 14) * .3 + (Math.max(0, min - series) / min) * .3;
}
function suggestHTML(g){
  const max = Math.max(...MUSCLE_IDS.map(id => g.m[id].pts), 1), ss = seriesSemana();
  const scored = MUSCLE_IDS.map(id => {
    const d = g.m[id], [min] = objetivoSeries(id);
    const dias = d.last ? Math.min(daysSince(d.last), 14) : 14;
    return { id, score: prioridadMusculo(d.pts / max, dias, ss[id], min), d, n: ss[id], min };
  }).sort((a,b) => b.score - a.score).slice(0, 3);

  suggestion = [];
  const bloques = scored.map(({id, d, n, min}) => {
    const exs = CATALOG.filter(e => e.muscles[id] >= 1).slice(0, 2);
    exs.forEach(e => { if(!suggestion.includes(e.id)) suggestion.push(e.id); });
    return `<div class="item">
      <div class="row between wrap">
        <b>${esc(MUSCLES[id].label)}</b>
        <span class="pill">${heatLabel(d.last)}</span>
      </div>
      <div class="xs dim" style="margin-top:var(--s1)">${exs.map(e => esc(e.name)).join(' · ')}</div>
      <div class="xs muted" style="margin-top:var(--s1)">Esta semana: ${fmtNum(n, n % 1 ? 1 : 0)} de ${min} series</div>
    </div>`;
  }).join('');

  return `<div class="card mt4">
    <div class="row between wrap">
      <div>
        <h2>Qué entrenar hoy</h2>
        <div class="xs muted" style="margin-top:var(--s1)">Los tres grupos con más déficit, más días sin estímulo y menos series esta semana.</div>
      </div>
      <button class="btn primary" data-act="quick-session">Armar esta sesión</button>
    </div>
    <div class="list mt3">${bloques}</div>
  </div>`;
}

/* Anima los anillos desde vacío hasta su valor real, una vez montado el HTML. */
function animateIn(){
  // Un solo momento con autoría: las barras del panel crecen al entrar.
  // Antes había entradas repartidas por toda la pantalla.
  requestAnimationFrame(() => {
    document.querySelectorAll('.panel .bar > i').forEach(i => {
      const p = i.style.getPropertyValue('--p');
      i.style.setProperty('--p', '0');
      requestAnimationFrame(() => i.style.setProperty('--p', p));
    });
  });
}

function checkRankUp(){
  const now = currentTiers();
  state.meta = state.meta || {};
  const prev = state.meta.tiers;
  state.meta.tiers = now;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(err){}

    llenas.set(c.dataset.hid + '|' + c.dataset.dia, c.dataset.p);
    const l = c.querySelector('.llama'); if(l) prendidas.set(c.dataset.hid, l.dataset.on);
  });
  $('#main').innerHTML = VIEWS[view]();
  $$('#main .rellena[data-hid]').forEach(c => {
    const antes = llenas.get(c.dataset.hid + '|' + c.dataset.dia);
    if(antes !== undefined && antes !== c.dataset.p){ c.style.setProperty('--p0', antes); c.classList.add('anima'); }
    // La llama se enciende (una sola vez) cuando una acción la pasa de apagada a encendida.
    const l = c.querySelector('.llama');
    if(l && l.dataset.on === '1' && prendidas.get(c.dataset.hid) === '0') l.classList.add('enciende');
  });
  requestAnimationFrame(animateIn);
  pintarPomo();
  pintarSync();
  checkRankUp();
  // Si el editor está abierto, sus chips de categorías se ponen al día (borrar una
  // categoría y Deshacer renderizan la pantalla de atrás, no el diálogo).
  const chipsAbiertos = $('#hb-cats');
  if(chipsAbiertos) chipsAbiertos.innerHTML = catsFormHTML();
  $$('.tab').forEach(t => {
    if(t.dataset.view === view) t.setAttribute('aria-current','page');
    else t.removeAttribute('aria-current');
  });
}

/* Red de seguridad. Si dibujar una vista explota, antes quedaba la página en
   blanco sin menú: no había forma de exportar ni de borrar. Ahora siempre hay
   una salida con los datos a mano. */
function render(){
  try{
    renderInterno();
    if(avisoRescate){
      const m = $('#main');
      m.insertAdjacentHTML('afterbegin', `
        <div class="card" style="border-color:var(--warn);margin-bottom:var(--s4)">
          <b>Tu guardado anterior estaba dañado</b>
          <p class="xs muted mt3">${esc(avisoRescate)}</p>
          <p class="xs muted">Arranqué vacío, pero <b>no se borró nada</b>: quedó apartado.
             Podés bajarlo y revisarlo.</p>
          <div class="row wrap mt3">

            <button class="btn sm" data-act="cerrar-aviso">Entendido</button>
          </div>
        </div>`);
    }
  }catch(err){

}

function pantallaRescate(err){
  const main = document.getElementById('main');
  if(!main) return;
  main.innerHTML = `
    <div class="card" style="border-color:var(--bad)">
      <h2>Algo se rompió al dibujar la pantalla</h2>
      <p class="xs muted mt3">Tus datos siguen guardados. Bajalos antes de hacer nada más.</p>
      <pre class="xs dim" style="white-space:pre-wrap;margin-top:var(--s3)">${esc(String(err && err.message || err))}</pre>
      <div class="row wrap mt4">
        <button class="btn primary" id="rescate-bajar">Descargar mis datos</button>
        <button class="btn" id="rescate-inicio">Volver al inicio</button>
        <button class="btn danger" id="rescate-borrar">Borrar todo y empezar de cero</button>
      </div>
    </div>`;
  // Listeners directos: no dependen de la delegación, que podría estar rota.
  const bajar = () => {
    let raw = '';
    try{ raw = localStorage.getItem(STORAGE_KEY) || JSON.stringify(state); }
    catch(e){ raw = JSON.stringify(state); }
    exportarTexto(raw, `bau-tracker-rescate-${iso()}.json`);
  };
  document.getElementById('rescate-bajar').onclick = bajar;
  document.getElementById('rescate-inicio').onclick = () => { view = 'inicio'; selMuscle = null; render(); };
  // Acá no se puede usar un diálogo de la app (la delegación de eventos podría
  // ser justo lo que está roto) ni uno nativo (puede no mostrarse): se pide un
  // segundo toque sobre el mismo botón, que vuelve atrás solo a los 4 segundos.
  const bBorrar = document.getElementById('rescate-borrar');
  let armado = false, rearmar = 0;
  bBorrar.onclick = () => {
    if(!armado){
      armado = true; bBorrar.textContent = 'Tocá otra vez: borra TODO';
      rearmar = setTimeout(() => { armado = false; bBorrar.textContent = 'Borrar todo y empezar de cero'; }, 4000);
      return;
    }
    clearTimeout(rearmar);
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    state = emptyState(); view = 'inicio'; render();
  };
}

function go(v){ view = v; selMuscle = null; habSel = null; habOffset = 0; habFiltro = null; habNoTocan = false; habDia = null; habMulti = null; gymSemana = 0; limites = { gym: PAGINA, estudio: PAGINA };

/* ==========================================================================
   MOVIMIENTO — resortes, no duraciones.
   Una animación con duración fija no puede responder a lo que pase mientras
   corre: si la tocás a mitad de camino, o te ignora o pega un salto. Un
   resorte sí, porque no tiene libreto —tiene un objetivo y un estado actual—,
   y cambiarle el objetivo en pleno vuelo sale continuo.
   ========================================================================== */

/* Dos parámetros de diseñador en vez de los tres de física:
     respuesta      a los cuántos segundos llega, más o menos. NO es una
                    duración: el resorte no tiene una, el tiempo de reposo sale
                    de los números.
     amortiguacion  1 = llega y se queda. Menos de 1 se pasa y vuelve.
                    El rebote se GANA: va solo cuando el gesto traía envión.
                    Algo que apareció solo, sin que lo empujaras, no rebota. */
function resorte({ desde, hasta, v0 = 0, respuesta = .4, amortiguacion = 1, paso, fin }){
  const w = 2 * Math.PI / respuesta;
  const DT = 1 / 240;                   // paso fijo: el resultado no depende de los FPS
  let x = desde, v = v0, previo = null, resto = 0, id = 0, vivo = true;
  function cuadro(t){
    if(!vivo) return;
    if(previo === null) previo = t;
    // Si la pestaña estuvo dormida no integramos medio segundo de un saque.
    resto += Math.min((t - previo) / 1000, .064);
    previo = t;
    while(resto >= DT){
      const a = -w * w * (x - hasta) - 2 * amortiguacion * w * v;
      v += a * DT; x += v * DT; resto -= DT;
    }
    paso(x, v);
    if(Math.abs(x - hasta) < .4 && Math.abs(v) < 4) terminar();
    else id = requestAnimationFrame(cuadro);
  }
  function detener(){ vivo = false; cancelAnimationFrame(id); }
  function terminar(){ detener(); x = hasta; v = 0; paso(x, 0); if(fin) fin(); }
  id = requestAnimationFrame(cuadro);
  return { detener, terminar, valor: () => x, velocidad: () => v };
}

/* A dónde llegaría algo que soltás y dejás frenar solo. No es la fórmula del
   secundario (v²/2a): es decaimiento exponencial, la misma que usan iOS y los
   scrolls que se sienten bien. Sirve para decidir con el ENVIÓN y no con la
   posición: un tirón corto y rápido alcanza para cerrar aunque casi no la
   hayas movido, y bajarla despacio hasta la mitad y soltarla, no. */
function proyectar(v, deceleracion = .998){
  return (v / 1000) * deceleracion / (1 - deceleracion);
}

/* Resistencia creciente pasado un borde. Un tope duro se lee como "se colgó";
   esto se lee como "te escucho, pero de acá no hay más". */
function gomita(exceso, alto, c = .55){
  return (exceso * alto * c) / (alto + c * Math.abs(exceso));
}

/* ---- La hoja ----
   En teléfono el diálogo es una hoja que sube desde abajo y se puede agarrar y
   tirar para abajo en cualquier momento, incluso mientras está entrando. En
   escritorio es un diálogo centrado que solo sube 24px: mismo código, distinto
   recorrido, y sin arrastre. */
const movReducido = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const esHoja      = () => matchMedia('(max-width: 699px)').matches;

let hojaY = 0, hojaAlto = 1, hojaAnim = null, agarre = null;

function medirHoja(){
  const m = $('#backdrop .modal');
  hojaAlto = esHoja() ? Math.max(m.offsetHeight, 1) : 24;
  return m;
}
function ponerHoja(y){
  hojaY = y;
  const m = $('#backdrop .modal');
  m.style.transform = y ? 'translateY(' + y.toFixed(2) + 'px)' : '';
  $('#backdrop').style.setProperty('--velo', Math.min(1, Math.max(0, 1 - y / hojaAlto)).toFixed(3));
}
function enVuelo(si){ $('#backdrop .modal').classList.toggle('enVuelo', si); }

function abrirHoja(){
  const bd = $('#backdrop'), yaEstaba = !bd.hidden;
  bd.hidden = false;
  const m = medirHoja();
  if(movReducido()){ if(hojaAnim) hojaAnim.detener(); hojaAnim = null; ponerHoja(0); return; }
  // Si estaba cerrándose, arrancamos desde donde SE VE y con la velocidad que
  // traía, no desde el principio: si no, se ve el salto.
  let desde = hojaAlto, v0 = 0;
  if(yaEstaba && hojaAnim){ desde = hojaAnim.valor(); v0 = hojaAnim.velocidad(); hojaAnim.detener(); }
  else if(yaEstaba){ desde = hojaY; }
  ponerHoja(desde);
  enVuelo(true);
  // Sin rebote: lo que la abrió fue un toque, no un envión.
  hojaAnim = resorte({ desde, hasta: 0, v0, respuesta: .35, amortiguacion: 1,
    paso: ponerHoja, fin: () => { hojaAnim = null; enVuelo(false); } });
}

function cerrarHoja(v0, luego){
  const bd = $('#backdrop'), m = medirHoja();
  const listo = () => {
    hojaAnim = null; enVuelo(false);
    bd.hidden = true; m.style.transform = ''; bd.style.removeProperty('--velo');
    if(luego) luego();
  };
  if(hojaAnim){ hojaAnim.detener(); hojaAnim = null; }
  if(movReducido()){ listo(); return; }
  enVuelo(true);
  hojaAnim = resorte({ desde: hojaY, hasta: hojaAlto, v0: v0 || 0,
    respuesta: .3, amortiguacion: 1, paso: ponerHoja, fin: listo });
}

/* ---- El arrastre ----
   Nada de eventos tipo "swipedown", que solo avisan al final: eso tira a la
   basura el seguimiento continuo, que es justo lo que hace falta para que la
   hoja vaya pegada al dedo. */
function tomarHoja(e){
  if(!esHoja() || movReducido() || e.button) return;
  if(e.target.closest('#modal-x')) return;        // el botón de cerrar es un botón
  medirHoja();
  if(hojaAnim){ hojaAnim.detener(); hojaAnim = null; }   // se puede agarrar en vuelo
  enVuelo(true);
  agarre = { id: e.pointerId, y0: e.clientY, base: hojaY,
             hist: [{ t: e.timeStamp, y: e.clientY }] };
  // Capturar el puntero hace que el seguimiento siga aunque el dedo salga de la
  // cabecera. Lanza si el puntero ya no está activo (un evento sintético, o
  // ciertos lectores de pantalla): sin captura el arrastre sigue funcionando
  // mientras el dedo quede encima, que es mejor que romper el gesto entero.
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
}
function moverHoja(e){
  if(!agarre || e.pointerId !== agarre.id) return;
  // `base` respeta desde dónde la agarraste: si la hoja ya estaba a mitad de
  // camino, no salta para pegarse al dedo.
  let y = agarre.base + (e.clientY - agarre.y0);
  if(y < 0) y = -gomita(-y, hojaAlto);            // para arriba no hay a dónde ir
  ponerHoja(y);
  agarre.hist.push({ t: e.timeStamp, y: e.clientY });
  if(agarre.hist.length > 5) agarre.hist.shift();  // la velocidad es de los últimos cuadros
}
function soltarHoja(e){
  if(!agarre || e.pointerId !== agarre.id) return;
  const h = agarre.hist, a = h[0], b = h[h.length - 1];
  const vel = (b.y - a.y) / Math.max(b.t - a.t, 1) * 1000;   // px/s
  agarre = null;
  // La animación arranca con la velocidad exacta del dedo: sin eso se nota la
  // costura entre arrastrar y soltar.
  if(hojaY + proyectar(vel) > hojaAlto * .5) closeModal(vel);
  else hojaAnim = resorte({ desde: hojaY, hasta: 0, v0: vel, respuesta: .35,
    // Acá SÍ hubo envión, así que un poco de rebote se siente real.
    amortiguacion: .8, paso: ponerHoja, fin: () => { hojaAnim = null; enVuelo(false); } });
}

/* ==========================================================================
   6. MODALES — un solo diálogo reutilizado por todos los formularios.
   Hay UN solo <dialog> en el HTML; cada formulario le cambia el título, el
   cuerpo y qué hace el botón de guardar. Por eso `modalSave` guarda la función
   de turno: el botón no sabe qué está guardando, se lo dice quien abrió.
   ========================================================================== */
let modalSave = null;
let lastFocus = null;

function openModal(title, bodyHTML, onSave, saveLabel = 'Guardar', peligro = false){
  // Guardamos quién tenía el foco para devolvérselo al cerrar: si no, el
  // teclado y el lector de pantalla quedan tirados al principio de la página.
  lastFocus = document.activeElement;
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = bodyHTML;
  $('#modal-foot').innerHTML = `
    <button class="btn" data-act="close-modal">${onSave ? 'Cancelar' : 'Cerrar'}</button>
    ${onSave ? `<button class="btn ${peligro ? 'peligro' : 'primary'}" data-act="save-modal">${esc(saveLabel)}</button>` : ''}`;
  modalSave = onSave;
  abrirHoja();
  const first = $('#modal-body input, #modal-body select, #modal-body textarea');
  if(first) first.focus();
}
function closeModal(v0){
  if($('#backdrop').hidden) return;
  cerrarHoja(v0, () => {
    modalSave = null;
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  });
}

/* ---- Modal de sesión de gym ----
   Este es el único formulario con estado propio: `draft` acumula los ejercicios
   antes de guardar. Los inputs escriben directo en el draft (evento `input`)
   para no tener que redibujar en cada tecla, lo que haría perder el foco. */
let draft = null;

function openSessionModal(id){
  const existing = id ? state.gym.sessions.find(s => s.id === id) : null;
  draft = existing
    ? JSON.parse(JSON.stringify(existing))
    : { id: uid(), date: iso(), notes: '', exercises: [] };
  openModal(existing ? 'Editar entrenamiento' : 'Nuevo entrenamiento', sessionFormHTML(), saveSession);
}

function sessionFormHTML(){
  const opts = MUSCLE_IDS.map(mid => {

    if(!list.length) return '';

  return `
    <div class="timer-chips" role="group" aria-label="Descanso">
      <span class="xs muted">Descanso</span>
      ${[[60,'60 s'],[90,'90 s'],[120,'2 min'],[180,'3 min']].map(([s, t]) =>
        `<button type="button" class="btn sm" data-act="timer-iniciar" data-seg="${s}">${t}</button>`).join('')}
    </div>
    <div class="fields">
      <div class="field"><label for="s-date">Fecha</label>
        <input id="s-date" type="date" value="${draft.date}" data-draft="date"></div>
    </div>

    <div class="field">
      <label for="ex-pick">Agregar ejercicio</label>

    </div>

    <div id="ex-list">${draft.exercises.map((ex, i) => exerciseBoxHTML(ex, i)).join('')
      || emptyHTML('Agregá al menos un ejercicio.')}</div>

    <div class="field mt3"><label for="s-notes">Notas (opcional)</label>
      <textarea id="s-notes" rows="2" data-draft="notes">${esc(draft.notes)}</textarea></div>`;
}

/* "Última vez · 12 oct · 4×10 · 55 kg" y un botón para traer esas series.
   El botón solo se ofrece con las series vacías: nunca pisa lo que ya escribiste. */
let progAbierto = null;      // exId cuyo rango se está editando dentro del recuadro
function ultimaVezHTML(ex, i){
  const uv = draft ? ultimaVez(ex.exId, draft.date, draft.id) : null;
  if(!uv) return '';
  const vacias = ex.sets.every(s => !Number(s.reps) && !Number(s.kg));
  const sug = sugerirProgresion(ex.exId, uv), pr = progresionDe(ex.exId);
  const nota = { sube: `subís ${fmtKg(pr.inc)} kg`, reps: 'una rep más donde no llegaste',
                 consolidar: 'llegaste al tope al fallo: repetí antes de subir',
                 'tope-sin-carga': 'llegaste al tope: sumá lastre o pasá a una variante más difícil' }[sug.motivo];
  const abierto = progAbierto === ex.exId;
  return `<div class="ultima" data-ei="${i}">
      <div class="row between wrap">
        <span class="xs muted">Última vez · ${fechaCorta(uv.date)} · ${esc(resumenSeries(uv.sets))}</span>
        ${vacias ? `<button class="btn sm" data-act="repetir-ultima" data-ei="${i}">Repetir</button>` : ''}
      </div>
      <div class="sugerencia">
        <span><b>Hoy toca · ${esc(resumenSeries(sug.reps.map(r => ({ reps: r, kg: sug.kg }))))}</b>
          <span class="xs muted">· ${esc(nota)}</span></span>
        ${vacias ? `<button class="btn sm primary" data-act="usar-sugerencia" data-ei="${i}">Usar sugerencia</button>` : ''}
      </div>
      <div class="prog-rango xs muted">Rango ${pr.min}–${pr.max} reps · +${fmtKg(pr.inc)} kg
        <button type="button" class="btn sm" data-act="prog-editar" data-ei="${i}" aria-expanded="${abierto}">${abierto ? 'Cerrar' : 'Cambiar'}</button></div>
      ${abierto ? `<div class="prog-edit">
        <div><label for="pg-min-${i}">Piso</label><input id="pg-min-${i}" type="number" min="1" max="49" inputmode="numeric" value="${pr.min}"></div>
        <div><label for="pg-max-${i}">Tope</label><input id="pg-max-${i}" type="number" min="2" max="50" inputmode="numeric" value="${pr.max}"></div>
        <div><label for="pg-inc-${i}">Salto (kg)</label><input id="pg-inc-${i}" type="number" min="0.25" max="20" step="0.25" inputmode="decimal" value="${pr.inc}"></div>
        <button type="button" class="btn sm primary" data-act="prog-guardar" data-ei="${i}">Guardar</button>

    </div>`;
}

function exerciseBoxHTML(ex, i){
  const def = exDef(ex.exId);
  const musculos = def
    ? Object.entries(def.muscles).map(([m,f]) =>
        `${MUSCLES[m].label}${f < 1 ? ` ${Math.round(f*100)}%` : ''}`).join(' · ')

    <div class="exbox">

      </div>
      <div class="xs dim" style="margin-bottom:var(--s3)">${esc(musculos)}</div>
      ${ultimaVezHTML(ex, i)}

      <div class="setrow xs muted"><span></span><span>Reps</span><span>Kg</span><span></span></div>
      ${ex.sets.map((s, j) => `
        <div class="setrow">
          <span class="xs dim">${j+1}</span>
          <input type="number" min="0" max="999" inputmode="numeric" value="${s.reps ?? ''}"
                 data-ei="${i}" data-si="${j}" data-k="reps" aria-label="Reps de la serie ${j+1}">
          <input type="number" min="0" max="999" step="0.5" inputmode="decimal" value="${s.kg ?? ''}"
                 data-ei="${i}" data-si="${j}" data-k="kg" aria-label="Kilos de la serie ${j+1}">
          <button class="btn sm danger" data-act="del-set" data-ei="${i}" data-si="${j}" aria-label="Borrar serie">✕</button>
        </div>`).join('')}
      <button class="btn sm" data-act="add-set" data-ei="${i}">+ serie</button>

      <div style="margin-top:var(--s3)">
        <label>Esfuerzo · reps que te sobraron</label>
        <div class="rir">
          ${[0,1,2,3].map(r => `<button data-act="rir" data-ei="${i}" data-rir="${r}"
            aria-pressed="${(ex.rir ?? 1) === r}">${r === 0 ? 'al fallo' : r === 3 ? '3+' : r}</button>`).join('')}
        </div>
      </div>
    </div>`;
}

function refreshExList(){
  $('#ex-list').innerHTML = draft.exercises.map((ex,i) => exerciseBoxHTML(ex,i)).join('')
    || emptyHTML('Agregá al menos un ejercicio.');
}

function saveSession(){
  // Limpio series vacías antes de guardar: si no, contaminan el historial.
  draft.exercises.forEach(ex => {
    ex.sets = ex.sets.filter(s => Number(s.reps) > 0);
  });
  draft.exercises = draft.exercises.filter(ex => ex.sets.length);
  if(!draft.exercises.length){ toast('Cargá al menos una serie con reps.'); return false; }

  // Récords: se miden contra el historial SIN esta sesión (esRecord la excluye).
  const records = draft.exercises.filter(ex => esRecord(draft, ex)).map(ex => ex.name);
  const before = computeGym();
  const idx = state.gym.sessions.findIndex(s => s.id === draft.id);
  if(idx >= 0) state.gym.sessions[idx] = draft; else state.gym.sessions.push(draft);
  save();
  const after = computeGym();
  const delta = after.totalPts - before.totalPts;
  toast(`Guardado · ${delta >= 0 ? '+' : ''}${fmtNum(delta,1)} puntos de estímulo` +
        (records.length ? ` · Récord en ${records.join(', ')}` : ''));
  return true;
}

/* ==========================================================================
   11. EVENTOS — delegación desde document. Un solo listener para toda la app:
   como el HTML se redibuja entero, enganchar listeners a cada botón los
   perdería en el siguiente render.
   ========================================================================== */

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if(tab){ go(tab.dataset.view); return; }

  const zone = e.target.closest('[data-muscle]');
  if(zone){
    selMuscle = selMuscle === zone.dataset.muscle ? null : zone.dataset.muscle;
    render();
    const det = $('#muscle-detail');
    if(det) det.focus({preventScroll:true});
    return;
  }

  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  handleAction(btn.dataset.act, btn, e);
});

// El mapa corporal también tiene que responder al teclado: los <g> son focusables
// pero no son botones nativos, así que Enter y Espacio hay que manejarlos a mano.
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !$('#backdrop').hidden){ closeModal(); return; }
  if(e.key === 'Escape' && habMulti){ salirSeleccion(); return; }
  if((e.key === 'Enter' || e.key === ' ') && habMulti && e.target.classList?.contains('en-sel')){ e.preventDefault(); e.target.click(); return; }
  if(e.key === 'Escape' && view === 'habitos' && habSel){ habSel = null; habOffset = 0; render(); return; }
  if(e.key === 'Enter' && e.target.id === 'hb-cat-nueva'){
    e.preventDefault();
    const crear = $('[data-act="crear-cat"]');
    if(crear) crear.click();
    return;
  }
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('mz')){
    e.preventDefault();
    e.target.click();
  }
  if((e.key === 'Enter' || e.key === ' ') &&
     (e.target.classList?.contains('bloque') || e.target.classList?.contains('radar-dot'))){
    e.preventDefault();
    e.target.dispatchEvent(new MouseEvent('click', {bubbles:true}));
  }
});

// Escritura en los inputs del draft de sesión.
document.addEventListener('input', e => {
  const t = e.target;
  // El selector libre de color del editor de hábitos: el elegido pasa a ser el
  // actual y ninguna casilla de la paleta queda marcada.
  if(t.id === 'fl-tel'){ const ok = $('#fl-tel-ok'); if(ok) ok.textContent = telHint(t.value); return; }
  if(t.id === 'hb-color-libre'){
    colorDraft = t.value;
    $$('.sw-btn').forEach(b => b.setAttribute('aria-pressed', 'false'));
    refrescarPreviewIcono();
    return;
  }
  // Escribir un emoji quita el ícono propio elegido: nunca quedan los dos.
  if(t.id === 'hb-emoji'){
    if(t.value.trim()) iconoDraft = null;
    refrescarPreviewIcono();
    return;
  }
  if(!draft) return;
  if(t.dataset.draft){ draft[t.dataset.draft] = t.value; return; }
  if(t.dataset.k){
    const ex = draft.exercises[+t.dataset.ei];
    if(ex) ex.sets[+t.dataset.si][t.dataset.k] = t.value;
    if(Number(t.value) > 0){
      // Ya escribiste: los botones que traen series no aparecen más (nunca pisan lo tuyo).
      $$(`.ultima[data-ei="${t.dataset.ei}"] [data-act="repetir-ultima"], .ultima[data-ei="${t.dataset.ei}"] [data-act="usar-sugerencia"]`).forEach(r => r.remove());
    }
  }
});

/* Sesión pre-armada con la sugerencia del día. */function openQuickSession(){

  suggestion.forEach(exId => {
    const def = exDef(exId);
    if(def) draft.exercises.push({ exId: def.id, name: def.name, rir: 1, sets: [{reps:'', kg:''}] });
  });

function handleAction(act, btn, ev){
  const id = btn.dataset.id;

  switch(act){

  /* --- navegación desde las visualizaciones --- */
  case 'go-sec': go(btn.dataset.view); break;
  case 'open-muscle': {
    const mus = btn.dataset.mus;
    go('gym');
    selMuscle = mus;
    render();
    break;
  }
  case 'quick-session': openQuickSession(); break;

  /* --- modal genérico --- */
  case 'close-modal': closeModal(); break;
  case 'toast-accion': {
    const f = toastAccion;
    toastAccion = null; clearTimeout(toastTimer); $('#toast').hidden = true;
    if(f) f();
    break;
  }
  case 'save-modal':
    if(modalSave && modalSave() !== false){ closeModal(); render(); }
    break;

  /* --- gym --- */
  case 'new-session':  openSessionModal(null); break;
  case 'edit-session': openSessionModal(id); break;
  case 'del-session':
    borrarDeLista(state.gym.sessions, id, 'Entrenamiento borrado');
    break;
  case 'close-muscle': selMuscle = null; render(); break;
  case 'ver-mas':
    limites[btn.dataset.lista] += PAGINA * 2;
    render();
    break;

  case 'add-ex': {
    const sel = $('#ex-pick');
    const def = exDef(sel.value);
    if(!def) break;
    draft.exercises.push({ exId: def.id, name: def.name, rir: 1, sets: [{reps:'', kg:''}] });
    refreshExList();
    break;
  }
  case 'del-ex': draft.exercises.splice(+btn.dataset.ei, 1); refreshExList(); break;
  case 'repetir-ultima': {
    const ex = draft.exercises[+btn.dataset.ei];
    const uv = ex && ultimaVez(ex.exId, draft.date, draft.id);
    if(!uv) break;
    // El botón puede estar desactualizado (escribiste algo después de dibujarlo).
    if(!ex.sets.every(s => !Number(s.reps) && !Number(s.kg))){ toast('Ya cargaste series: no las piso.'); break; }
    ex.sets = uv.sets.map(s => ({ reps: s.reps, kg: s.kg > 0 ? s.kg : '' }));
    refreshExList();
    break;
  }
  case 'usar-sugerencia': {
    const ex = draft.exercises[+btn.dataset.ei];
    const sug = ex && sugerirProgresion(ex.exId, ultimaVez(ex.exId, draft.date, draft.id));
    if(!sug) break;
    if(!ex.sets.every(s => !Number(s.reps) && !Number(s.kg))){ toast('Ya cargaste series: no las piso.'); break; }
    ex.sets = sug.reps.map(r => ({ reps: r, kg: sug.kg > 0 ? sug.kg : '' }));
    refreshExList();
    break;
  }
  case 'prog-editar': {
    const ex = draft.exercises[+btn.dataset.ei];
    if(!ex) break;
    progAbierto = progAbierto === ex.exId ? null : ex.exId;
    refreshExList();
    break;
  }
  case 'prog-guardar':
  case 'prog-restaurar': {
    const i = +btn.dataset.ei, ex = draft.exercises[i];
    if(!ex) break;
    const p = act === 'prog-restaurar' ? Object.assign({}, PROG_DEF)
      : progresionValida({ min: Number($('#pg-min-' + i).value), max: Number($('#pg-max-' + i).value), inc: Number($('#pg-inc-' + i).value) });
    if(!p){ toast('Revisá el rango: piso menor que el tope (1 a 50 reps) y un salto de 0,25 a 20 kg.'); break; }
    const prog = state.gym.progresion = state.gym.progresion || {};
    if(p.min === PROG_DEF.min && p.max === PROG_DEF.max && p.inc === PROG_DEF.inc) delete prog[ex.exId];
    else prog[ex.exId] = p;
    if(!Object.keys(prog).length) delete state.gym.progresion;
    progAbierto = null;
    save(); refreshExList();
    toast(`${ex.name}: rango ${p.min}–${p.max} · +${fmtKg(p.inc)} kg`);
    break;
  }
  case 'gym-semana': gymSemana = Math.max(0, gymSemana + Number(btn.dataset.d)); render(); break;
  case 'pomo-opc': {
    const k = btn.dataset.k, v = Number(btn.dataset.v);
    if((k === 'foco' && POMO_FOCO.includes(v)) || (k === 'descanso' && POMO_DESC.includes(v))){
      pomoForm.materia = ($('#pomo-mat') || {}).value || pomoForm.materia;
      pomoForm.tema = ($('#pomo-tema') || {}).value || pomoForm.tema;
      pomoForm[k] = v; render();
    }
    break;
  }
  case 'pomo-iniciar': {
    const mat = $('#pomo-mat').value, tema = $('#pomo-tema').value;
    pomoForm.materia = mat; pomoForm.tema = tema;
    iniciarPomo(mat, tema, pomoForm.foco, pomoForm.descanso);
    break;
  }
  case 'pomo-terminar': terminarPomo(); break;
  case 'cuenta-salir': salirCuenta(); break;
  case 'cuenta-sync': {
    const s = syncInfo(); s.pendiente = s.pendiente || !estadoVacio(state); guardarSync();
    (s.pendiente ? subir() : bajar()).then(() => { if(syncEstado === 'listo') toast('Sincronizado'); else if(syncEstado === 'error' || syncEstado === 'sin-conexion') toast(TEXTO_SYNC[syncEstado]); });
    break;
  }
  case 'sync-usar-nube': {
    const fila = conflictoFila;
    if(!fila) break;
    conflictoFila = null; closeModal();
    const previo = JSON.stringify(state);
    if(aplicarFila(fila)) toast('Se usaron los datos de tu cuenta', { accion: { texto: 'Deshacer', fn: () => {
      state = normalizarEstado(JSON.parse(previo)); save(); render();
    } } });
    break;
  }
  case 'sync-usar-local': {
    const fila = conflictoFila;
    if(!fila) break;
    conflictoFila = null; closeModal();
    const s = syncInfo(); s.rev = fila.rev; s.pendiente = true; guardarSync();
    subir();
    const deLaNube = JSON.stringify(fila.datos);
    toast('Se usaron los datos de este aparato', { accion: { texto: 'Deshacer', fn: () => {
      state = normalizarEstado(JSON.parse(deLaNube)); save(); render();
    } } });
    break;
  }
  case 'pomo-descartar': descartarPomo(); break;
  case 'timer-iniciar': iniciarTimer(+btn.dataset.seg); break;
  case 'timer-ajustar': ajustarTimer(+btn.dataset.d); break;
  case 'timer-parar':   pararTimer(); break;
  case 'add-set': {
    const ex = draft.exercises[+btn.dataset.ei];
    const last = ex.sets[ex.sets.length - 1];
    ex.sets.push(last ? {reps:last.reps, kg:last.kg} : {reps:'', kg:''});  // copia la anterior
    refreshExList();
    break;
  }
  case 'del-set': {
    const ex = draft.exercises[+btn.dataset.ei];
    ex.sets.splice(+btn.dataset.si, 1);
    if(!ex.sets.length) ex.sets.push({reps:'', kg:''});
    refreshExList();
    break;
  }
  case 'rir':
    draft.exercises[+btn.dataset.ei].rir = +btn.dataset.rir;
    refreshExList();
    break;

  case 'new-custom-ex': {
    const musOpts = MUSCLE_IDS.map(m => `<option value="${m}">${esc(MUSCLES[m].label)}</option>`).join('');
    // Guardo el draft actual: este modal pisa el de sesión y hay que volver.
    const pending = draft;
    openModal('Ejercicio propio', `
      <div class="field"><label for="cx-name">Nombre</label><input id="cx-name" maxlength="40"></div>
      <div class="field"><label for="cx-m1">Músculo principal (100%)</label><select id="cx-m1">${musOpts}</select></div>
      <div class="fields">
        <div class="field"><label for="cx-m2">Secundario (opcional)</label>
          <select id="cx-m2"><option value="">—</option>${musOpts}</select></div>
        <div class="field"><label for="cx-f2">Aporte</label>
          <select id="cx-f2"><option value="0.3">30%</option><option value="0.4">40%</option>
            <option value="0.5">50%</option></select></div>
      </div>
      <div class="field"><label for="cx-bw">Usa peso corporal</label>
        <select id="cx-bw">
          <option value="">No, solo peso externo</option>

    toast('Peso guardado · los puntos de los ejercicios con peso corporal se recalcularon');
    break;

  case 'backup-despues':
    escribirClave(CLAVE_BACKUP_SILENCIO, iso());
    render();
    break;
  case 'pedir-proteccion':
    pedirProteccion();
    break;
  case 'export':
    exportarBackup();
    break;
  case 'bajar-roto': {
    let roto = '';
    try{ roto = localStorage.getItem(CLAVE_ROTO) || ''; }catch(e){}
    if(roto) exportarTexto(roto, `bau-tracker-danado-${iso()}.json`);
    else toast('No quedó nada apartado.');
    break;
  }
  case 'cerrar-aviso':
    avisoRescate = null;
    try{ localStorage.removeItem(CLAVE_ROTO); }catch(e){}
    render();
    break;
  case 'import': {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.onchange = () => {
      const file = input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const data = JSON.parse(reader.result);
          // Validar ANTES de asignar y guardar. Antes se guardaba primero y, si el
          // archivo tenía la forma equivocada, el render explotaba y la app quedaba
          // en blanco para siempre: ya no había forma de llegar a Ajustes a borrar.
          const errs = validarEstado(data);
          if(errs.length){
            toast('No se importó · ' + errs[0]);
            console.warn('Problemas del backup:', errs);
            return;
          }
          state = normalizarEstado(data);
          save(); render();
          toast('Datos importados.');
        }catch(err){
          toast('El archivo no es un backup válido.');
          console.error(err);
        }
      };
      reader.readAsText(file);
    };
    input.click();
    break;
  }
  case 'seed':
    openModal('Cargar datos de ejemplo', `
      <p>Esto <b>reemplaza todos tus datos</b> por datos de ejemplo.</p>
      <p class="xs muted mt3">Vas a tener unos segundos para deshacerlo, pero si querés
         conservar lo que tenés, exportalo antes.</p>
      <div class="row wrap mt3"><button class="btn sm" data-act="export">Exportar mis datos primero</button></div>`,
      () => reemplazarEstado(seedData(), 'Datos de ejemplo cargados.'), 'Cargar ejemplos', true);
    break;
  case 'wipe':
    openModal('Borrar todo', `
      <p>Se borran <b>todos</b> tus entrenamientos, estudio, clientes y hábitos.</p>
      <p class="xs muted mt3">Vas a tener unos segundos para deshacerlo. Pasado ese tiempo
         no se puede recuperar, salvo desde un backup.</p>
      <div class="row wrap mt3"><button class="btn sm" data-act="export">Exportar mis datos primero</button></div>`,
      () => reemplazarEstado(emptyState(), 'Todo borrado.'), 'Borrar todo', true);
    break;
  }
}

/* ==========================================================================
   TEMPORIZADOR DE DESCANSO.
   Se guarda el INSTANTE en que termina, no un contador que baja: un setInterval
   se atrasa o se pausa cuando la pestaña no está a la vista, y un contador
   mentiría. Con el instante final el tiempo que queda se calcula siempre contra
   el reloj, así sobrevive a eso y a recargar la página.
   Límite honesto: con el celular bloqueado JavaScript se pausa y el aviso llega
   al desbloquear. En iPhone, además, el navegador no vibra.
   ========================================================================== */
const CLAVE_TIMER = 'bauTracker.timer';
let timer = null;                       // {fin, total} en ms de reloj; null = no hay
let timerIntervalo = 0, timerAudio = null, timerWakeLock = null;

function restanteMs(t, ahora = Date.now()){ return t ? Math.max(0, t.fin - ahora) : 0; }
function fmtTiempo(ms){
  const s = Math.ceil(ms / 1000);          // ceil: a 0,4 s tiene que decir 00:01, no 00:00
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function guardarTimer(){
  if(timer) escribirClave(CLAVE_TIMER, JSON.stringify(timer));
  else try{ localStorage.removeItem(CLAVE_TIMER); }catch(e){}
}
function restaurarTimer(){
  let t = null;
  try{ t = JSON.parse(leerClave(CLAVE_TIMER) || 'null'); }catch(e){}
  if(t && Number.isFinite(t.fin) && Number.isFinite(t.total) && t.total > 0 && t.fin > Date.now()){
    timer = { fin: t.fin, total: t.total };
    arrancarTic(); pintarTimer();
  }else{
    // Si venció con la app cerrada no suena nada: ya nadie lo está esperando.
    timer = null; guardarTimer();
  }
}
function iniciarTimer(seg){
  const ms = Math.max(5, Math.min(Number(seg) || 0, 3600)) * 1000;       // de 5 s a 1 h
  timer = { fin: Date.now() + ms, total: ms };
  guardarTimer(); prepararAudio(); pedirPantallaEncendida(); arrancarTic(); pintarTimer();
}
function ajustarTimer(deltaSeg){
  if(!timer) return;
  timer.fin += deltaSeg * 1000;
  if(restanteMs(timer) <= 0){ terminoTimer(); return; }                  // restar hasta el final = terminó
  timer.total = Math.max(timer.total + Math.max(deltaSeg, 0) * 1000, restanteMs(timer)); // la franja no pasa de 100%
  guardarTimer(); pintarTimer();
}
function pararTimer(){
  timer = null; guardarTimer();
  clearInterval(timerIntervalo); timerIntervalo = 0;
  soltarPantalla(); pintarTimer();
}
function arrancarTic(){ clearInterval(timerIntervalo); timerIntervalo = setInterval(ticTimer, 250); }
function ticTimer(){
  if(!timer) return;
  if(restanteMs(timer) <= 0) terminoTimer(); else pintarTimer();
}
function terminoTimer(){
  pararTimer();
  sonarFin();
  toast('Descanso terminado');
}
function pintarTimer(){
  const pill = $('#timer-pill');
  if(!pill) return;
  pill.hidden = !timer;
  if(!timer) return;
  const resta = restanteMs(timer);
  $('#timer-num').textContent = fmtTiempo(resta);
  $('#timer-strip').style.setProperty('--p', (resta / timer.total).toFixed(3));
}

/* Sonido y vibración. El AudioContext se crea en el toque que INICIA el
   temporizador: los navegadores no dejan sonar nada si no nació de un gesto. */
function prepararAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!timerAudio) timerAudio = new AC();
    if(timerAudio.state === 'suspended') timerAudio.resume();
  }catch(e){}
}
function sonarFin(){
  try{ if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]); }catch(e){}
  try{
    if(!timerAudio) return;
    const t0 = timerAudio.currentTime;
    [0, .25, .5].forEach(dt => {                                          // tres pitidos
      const o = timerAudio.createOscillator(), g = timerAudio.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      o.connect(g); g.connect(timerAudio.destination);
      g.gain.setValueAtTime(.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(.35, t0 + dt + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dt + .18);
      o.start(t0 + dt); o.stop(t0 + dt + .2);
    });
  }catch(e){}
}
/* Pantalla encendida mientras corre, si el navegador lo permite. */
async function pedirPantallaEncendida(){
  try{ if(navigator.wakeLock && !timerWakeLock) timerWakeLock = await navigator.wakeLock.request('screen'); }
  catch(e){ timerWakeLock = null; }
}
function soltarPantalla(){
  try{ if(timerWakeLock) timerWakeLock.release(); }catch(e){}
  timerWakeLock = null;
}
/* ==========================================================================
   SINCRONIZACIÓN — una cuenta para tener los mismos datos en todos los aparatos.
   Cada aparato sigue guardando todo en su localStorage: la app anda sin internet y sin
   cuenta. Con la sesión iniciada, además:
     · al guardar, el estado completo sube a Supabase SYNC_ESPERA_MS después del último
       cambio (no en cada tecla);
     · al abrir la app, al volver a ella y al recuperar internet, se fija si la nube tiene
       una versión más nueva y la baja;
     · `rev` cuenta las versiones: si dos aparatos cambiaron a la vez, se pregunta cuál
       conservar entero, y el otro lado se recupera con Deshacer. No se mezcla registro a
       registro: con un solo usuario y dos aparatos es raro y así nunca queda un híbrido.
   ========================================================================== */
let nube = null, sync = null, syncTimer = 0, subiendo = false, otraVez = false, conflictoFila = null;
let syncEstado = 'apagado';   // apagado | listo | pendiente | subiendo | sin-conexion | error | conflicto
const SYNC_VACIO = () => ({ id: null, usuario: null, conectado: false, rev: 0, pendiente: false, ultimo: null });

/* Lo que este aparato sabe de su cuenta: id, mail, si está conectado, la última versión
   que conoce de la nube y si tiene cambios sin subir. Vive en su propia clave. */
function syncInfo(){
  if(!sync){
    let g = null;
    try{ g = JSON.parse(leerClave(CLAVE_SYNC) || 'null'); }catch(e){}
    sync = Object.assign(SYNC_VACIO(), g && typeof g === 'object' ? g : {});
  }
  return sync;
}
function guardarSync(){ escribirClave(CLAVE_SYNC, JSON.stringify(syncInfo())); }
// Las pruebas pueden simular claves con window.__supabasePrueba ({url, anon}).
const configSupabase = () => window.__supabasePrueba || { url: SUPABASE_URL, anon: SUPABASE_ANON };
function syncConfigurada(){ const c = configSupabase(); return !!window.__nubeFalsa || !!(c.url && c.anon); }
function enArtifact(){ return !!(window.claude && typeof window.claude.use === 'function'); }
function syncDisponible(){ return !!window.__nubeFalsa || (syncConfigurada() && !enArtifact()); }
const syncActiva = () => syncDisponible() && syncInfo().conectado && !!syncInfo().id;

function cargarSDK(){
  return new Promise((ok, mal) => {
    if(window.supabase && window.supabase.createClient) return ok(window.supabase);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = () => (window.supabase ? ok(window.supabase) : mal(new Error('SDK vacío')));
    s.onerror = () => mal(new Error('No se pudo cargar Supabase'));
    document.head.appendChild(s);
  });
}
/* La conexión, una sola vez. En los tests se usa una nube falsa con la misma forma. */
async function asegurarNube(){
  if(nube) return nube;
  try{
    if(window.__nubeFalsa) nube = window.__nubeFalsa;
    else if(syncDisponible()){
      const sdk = await cargarSDK();
      nube = sdk.createClient(configSupabase().url, configSupabase().anon,
        { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'bauTracker.auth' } });
    }
  }catch(e){ nube = null; syncEstado = 'sin-conexion'; pintarSync(); }
  return nube;
}

const estadoVacio = s => !s || !(s.gym && s.gym.sessions.length) && !(s.estudio && s.estudio.entries.length) &&
                         !(s.freelance && s.freelance.items.length) && !(s.habitos && s.habitos.list.length);
function cuantosRegistros(s){
  const n = normalizarEstado(JSON.parse(JSON.stringify(s || {})));
  return n.gym.sessions.length + n.estudio.entries.length + n.freelance.items.length +
         Object.values(n.habitos.log).reduce((a, l) => a + Object.keys(l || {}).length, 0);
}

/* Al guardar. Aunque la sesión esté cerrada, si el aparato tiene cuenta se anota que hay
   cambios: al volver a entrar se suben. */
function marcarPendiente(){
  if(!syncDisponible()) return;
  const s = syncInfo();
  if(!s.id) return;
  s.pendiente = true; guardarSync();
  if(!s.conectado) return;
  syncEstado = 'pendiente'; pintarSync();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(subir, SYNC_ESPERA_MS);
}

async function leerFila(){
  const { data, error } = await nube.from('bau_estado').select('datos,rev,actualizado').maybeSingle();
  if(error) throw error;
  return data || null;
}

/* Reemplaza lo de este aparato por lo de la nube (validado y normalizado, como un backup). */
function aplicarFila(fila){
  if(!fila || validarEstado(fila.datos).length){ toast('Lo que hay en la cuenta no tiene la forma esperada: no se tocó nada.'); return false; }
  state = normalizarEstado(JSON.parse(JSON.stringify(fila.datos)));
  guardarLocal();
  const s = syncInfo();
  s.rev = fila.rev; s.pendiente = false; s.ultimo = fila.actualizado || new Date().toISOString(); guardarSync();
  syncEstado = 'listo';
  render();
  return true;
}

async function subir(){
  clearTimeout(syncTimer);
  const s = syncInfo();
  if(!syncActiva() || !s.pendiente) return;
  if(!(await asegurarNube())) return;
  if(navigator.onLine === false){ syncEstado = 'sin-conexion'; pintarSync(); return; }
  if(subiendo){ otraVez = true; return; }
  subiendo = true; syncEstado = 'subiendo'; pintarSync();
  const enviado = JSON.stringify(state);
  try{
    const { data, error } = await nube.rpc('guardar_estado', { p_datos: JSON.parse(enviado), p_rev: s.rev });
    if(error) throw error;
    const r = Array.isArray(data) ? data[0] : data;
    if(r && r.o_ok){
      s.rev = r.o_rev; s.ultimo = r.o_actualizado || new Date().toISOString();
      s.pendiente = JSON.stringify(state) !== enviado;     // si cambió mientras subía, sigue pendiente
      guardarSync();
      syncEstado = s.pendiente ? 'pendiente' : 'listo';
      if(s.pendiente) syncTimer = setTimeout(subir, SYNC_ESPERA_MS);
    }else{
      const fila = await leerFila();                       // otro aparato guardó antes
      if(fila) mostrarConflicto(fila, false);
    }
  }catch(e){
    syncEstado = navigator.onLine === false ? 'sin-conexion' : 'error';
    console.warn('Sincronización:', e);
  }finally{ subiendo = false; pintarSync(); }
  if(otraVez){ otraVez = false; await subir(); }
}

/* Al abrir la app, al volver a ella y al recuperar internet. */
async function bajar(){
  const s = syncInfo();
  if(!syncActiva() || !(await asegurarNube())) return;
  if(navigator.onLine === false){ syncEstado = 'sin-conexion'; pintarSync(); return; }
  try{
    const fila = await leerFila();
    if(!fila){
      s.rev = 0; if(!estadoVacio(state)) s.pendiente = true; guardarSync();
      if(s.pendiente) await subir(); else { syncEstado = 'listo'; pintarSync(); }
      return;
    }
    if(fila.rev === s.rev){
      if(s.pendiente) await subir(); else { syncEstado = 'listo'; pintarSync(); }
      return;
    }
    if(fila.rev > s.rev && !s.pendiente){ aplicarFila(fila); toast('Datos al día con tu cuenta'); return; }
    mostrarConflicto(fila, false);
  }catch(e){ syncEstado = navigator.onLine === false ? 'sin-conexion' : 'error'; pintarSync(); console.warn('Sincronización:', e); }
}

/* El primer encuentro de este aparato con la cuenta. */
async function despuesDeEntrar(user){
  const s = syncInfo();
  if(s.id !== user.id){ Object.assign(s, SYNC_VACIO()); s.pendiente = !estadoVacio(state); }   // otra cuenta: no se conoce ninguna versión
  s.id = user.id; s.usuario = user.email || ''; s.conectado = true; guardarSync();
  const fila = await leerFila();
  if(!fila){ s.rev = 0; s.pendiente = true; guardarSync(); await subir(); toast('Listo: tus datos quedaron guardados en tu cuenta'); return 'subio'; }
  if(estadoVacio(state)){ aplicarFila(fila); toast('Listo: bajaron los datos de tu cuenta'); return 'bajo'; }
  if(fila.rev === s.rev){ if(s.pendiente) await subir(); else { syncEstado = 'listo'; pintarSync(); } return 'igual'; }
  mostrarConflicto(fila, true);
  return 'pregunta';
}

function mostrarConflicto(fila, primeraVez){
  conflictoFila = fila; syncEstado = 'conflicto'; pintarSync();
  const cuando = fila.actualizado ? new Date(fila.actualizado).toLocaleString('es-AR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'sin fecha';
  openModal(primeraVez ? 'Ya tenés datos en tu cuenta' : 'Hubo cambios en dos aparatos', `
    <p>${primeraVez ? 'Este aparato y tu cuenta tienen datos distintos.' : 'Mientras este aparato tenía cambios sin subir, otro guardó en tu cuenta.'}
      Elegí con cuáles te quedás: el otro lado se puede recuperar con <b>Deshacer</b>.</p>
    <div class="cuenta-lados">
      <button class="btn" data-act="sync-usar-nube">Usar los de la cuenta · ${cuantosRegistros(fila.datos)} registros · ${esc(cuando)}</button>
      <button class="btn" data-act="sync-usar-local">Usar los de este aparato · ${cuantosRegistros(state)} registros</button>
    </div>`, null);
}

function mensajeErrorCuenta(e){
  const m = String((e && (e.message || e.code)) || '');
  if(/invalid login|invalid_credentials/i.test(m)) return 'Mail o contraseña incorrectos.';
  if(/not confirmed/i.test(m)) return 'Falta confirmar el mail: buscá el correo de confirmación y tocá el link.';
  if(/already registered|already exists/i.test(m)) return 'Ese mail ya tiene cuenta: tocá "Entrar".';
  if(/password/i.test(m)) return 'La contraseña tiene que tener al menos 6 caracteres.';
  if(/fetch|network|failed/i.test(m)) return 'Sin conexión: probá de nuevo con internet.';
  return 'No se pudo: ' + m.slice(0, 120);
}
async function entrarCuenta(email, clave, crear){
  email = String(email || '').trim();
  if(!email || !clave){ toast('Poné tu mail y tu contraseña.'); return false; }
  if(!(await asegurarNube())){ toast('No se pudo conectar con la cuenta. ¿Tenés internet?'); return false; }
  let r;
  try{
    r = crear
      ? await nube.auth.signUp({ email, password: clave, options: { emailRedirectTo: location.origin + location.pathname } })
      : await nube.auth.signInWithPassword({ email, password: clave });
  }catch(e){ r = { error: e }; }
  if(r.error){ toast(mensajeErrorCuenta(r.error), { ms: 6000 }); return false; }
  const d = r.data || {};
  if(!d.session){ toast('Te mandamos un mail para confirmar la cuenta. Confirmala y después tocá "Entrar".', { ms: 9000 }); return false; }
  try{ await despuesDeEntrar(d.user || d.session.user); }
  catch(e){ syncEstado = 'error'; toast(mensajeErrorCuenta(e)); }
  render();
  return true;
}
async function salirCuenta(){
  try{ if(nube) await nube.auth.signOut(); }catch(e){}
  clearTimeout(syncTimer);
  const s = syncInfo(); s.conectado = false; guardarSync();
  syncEstado = 'apagado'; render();
  toast('Sesión cerrada. Tus datos quedan en este aparato.');
}
async function iniciarNube(){
  if(!syncDisponible()) return;
  const s = syncInfo();
  if(!s.conectado || !s.id){ pintarSync(); return; }
  if(!(await asegurarNube())) return;
  try{
    const { data } = await nube.auth.getSession();
    if(!data || !data.session){ s.conectado = false; guardarSync(); syncEstado = 'apagado'; render(); return; }
    await bajar();
  }catch(e){ syncEstado = 'sin-conexion'; pintarSync(); }
}

function hace(isoTiempo){
  const min = Math.round((Date.now() - new Date(isoTiempo).getTime()) / 60000);
  if(!Number.isFinite(min)) return '—';
  if(min < 1) return 'recién';
  if(min < 60) return `hace ${min} min`;
  const hs = Math.round(min / 60);
  return hs < 24 ? `hace ${hs} h` : `hace ${Math.round(hs / 24)} días`;
}
const TEXTO_SYNC = { apagado: '', listo: 'Sincronizado', pendiente: 'Cambios por subir', subiendo: 'Subiendo…',
  'sin-conexion': 'Sin conexión: se sube al volver', error: 'No se pudo sincronizar', conflicto: 'Hay que elegir qué datos conservar' };
function estadoCuentaTexto(){
  const s = syncInfo(), t = TEXTO_SYNC[syncEstado] || '';
  return (s.ultimo ? `Última sincronización: ${hace(s.ultimo)}` : 'Todavía sin sincronizar') + (t && syncEstado !== 'listo' ? ' · ' + t : '');
}
function pintarSync(){
  const el = $('#sync-ind');
  if(el){
    const on = syncActiva();
    el.hidden = !on;
    if(on){ el.dataset.estado = syncEstado; const t = TEXTO_SYNC[syncEstado] || 'Cuenta'; el.title = t; el.setAttribute('aria-label', 'Cuenta: ' + t); }
  }
  const c = $('#cuenta-estado');
  if(c) c.textContent = estadoCuentaTexto();
}

function cuentaHTML(){
  if(!syncConfigurada()) return '';
  if(!syncDisponible()) return `<div class="card mt4" id="cuenta"><h2>Cuenta</h2>
    <p class="xs muted mt3">Dentro de este visor la cuenta no está disponible. Abrí la app publicada para iniciar sesión y sincronizar.</p></div>`;
  const s = syncInfo();
  if(s.conectado && s.id) return `<div class="card mt4" id="cuenta"><h2>Cuenta</h2>
    <p class="mt3">Conectado como <b>${esc(s.usuario || '')}</b></p>
    <p class="xs muted" id="cuenta-estado">${esc(estadoCuentaTexto())}</p>
    <div class="row wrap mt3">
      <button class="btn" data-act="cuenta-sync">Sincronizar ahora</button>
      <button class="btn" data-act="cuenta-salir">Cerrar sesión</button>
    </div></div>`;
  return `<div class="card mt4" id="cuenta"><h2>Cuenta</h2>
    <p class="xs muted mt3">Con una cuenta tenés los mismos datos en el celular y en la compu. Sin cuenta, todo sigue guardado solo en este aparato.</p>
    <form id="form-cuenta" class="mt3" autocomplete="on">
      <div class="field"><label for="cu-mail">Mail</label>
        <input id="cu-mail" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" value="${esc(s.usuario || '')}" required></div>
      <div class="field"><label for="cu-clave">Contraseña</label>
        <input id="cu-clave" name="password" type="password" autocomplete="current-password" minlength="6" required></div>
      <div class="row wrap">
        <button class="btn primary" type="submit" data-modo="entrar">Entrar</button>
        <button class="btn" type="submit" data-modo="crear">Crear cuenta</button>
      </div>
    </form></div>`;
}

document.addEventListener('submit', e => {
  if(!e.target || e.target.id !== 'form-cuenta') return;
  e.preventDefault();
  const crear = !!(e.submitter && e.submitter.dataset.modo === 'crear');
  const botones = [...e.target.querySelectorAll('button')];
  botones.forEach(b => { b.disabled = true; });
  entrarCuenta($('#cu-mail').value, $('#cu-clave').value, crear).finally(() => botones.forEach(b => { b.disabled = false; }));
});
document.addEventListener('visibilitychange', () => { if(!document.hidden && syncActiva()) bajar(); });
addEventListener('online', () => { if(syncActiva()) (syncInfo().pendiente ? subir() : bajar()); });
addEventListener('offline', () => { if(syncActiva()){ syncEstado = 'sin-conexion'; pintarSync(); } });

/* ==========================================================================
   POMODORO. Igual que el descanso: se guarda el INSTANTE en que termina cada fase,
   no un contador, así sobrevive a la pestaña oculta y a recargar. Al terminar un
   bloque de foco la sesión de estudio se guarda sola (con Deshacer) y empieza el
   descanso, que no se guarda. Si el foco terminó con la app cerrada, al volver se
   guarda igual: el tiempo pasó (salvo que haya sido hace más de 12 horas).
   ========================================================================== */
const CLAVE_POMO = 'bauTracker.pomo';
const POMO_FOCO = [25, 50], POMO_DESC = [5, 10], POMO_MIN = 5, POMO_VIEJO_MS = 12 * 3600 * 1000;
let pomo = null;            // {fase:'foco'|'descanso', fin, total, inicio, materia, tema, foco, descanso}
let pomoIntervalo = 0, pomoForm = { foco: 25, descanso: 5 };

function guardarPomo(){
  if(pomo) escribirClave(CLAVE_POMO, JSON.stringify(pomo));
  else try{ localStorage.removeItem(CLAVE_POMO); }catch(e){}
}
/* La sesión de estudio que deja un bloque de foco. Devuelve la entrada creada. */
function registrarPomo(p, minutos){
  const e = { id: uid(), date: iso(new Date(p.inicio)), subject: p.materia, topic: p.tema || '', minutes: minutos, fuente: 'pomodoro' };
  state.estudio.entries.push(e);
  save();
  const raiz = state;
  toast(`Pomodoro guardado: ${minutos} min de ${p.materia}`, { accion: { texto: 'Deshacer', fn: () => {
    if(state !== raiz) return;
    const i = state.estudio.entries.findIndex(x => x.id === e.id);
    if(i >= 0){ state.estudio.entries.splice(i, 1); save(); render(); }
  } } });
  return e;
}
function iniciarPomo(materia, tema, foco, descanso){
  materia = String(materia || '').trim().slice(0, 40);
  if(!materia){ toast('Elegí una materia para el pomodoro.'); return false; }
  if(!POMO_FOCO.includes(foco) || !POMO_DESC.includes(descanso)) return false;
  const ahora = Date.now();
  pomo = { fase: 'foco', inicio: ahora, fin: ahora + foco * 60000, total: foco * 60000,
           materia, tema: String(tema || '').trim().slice(0, 80), foco, descanso };
  guardarPomo(); prepararAudio(); pedirPantallaEncendida(); arrancarPomo(); render();
  return true;
}
/* Pasa de fase si ya venció. `silencio` = al volver a abrir la app (no suena nada). */
function avanzarPomo(ahora = Date.now(), silencio = false){
  if(!pomo || pomo.fin > ahora) return;
  if(pomo.fase === 'foco'){
    const p = pomo;
    if(ahora - p.fin < POMO_VIEJO_MS) registrarPomo(p, p.foco);
    const finDesc = p.fin + p.descanso * 60000;
    pomo = finDesc > ahora ? Object.assign({}, p, { fase: 'descanso', fin: finDesc, total: p.descanso * 60000 }) : null;
    if(!silencio){ sonarFin(); }
  }else{
    pomo = null;
    if(!silencio){ sonarFin(); toast('Terminó el descanso: cuando quieras, otro bloque'); }
  }
  guardarPomo();
  if(!pomo) pararPomoTic();
  render();
}
/* Cortar antes: se guardan los minutos reales si llegan al mínimo. */
function terminarPomo(){
  if(!pomo) return;
  if(pomo.fase === 'foco'){
    const minutos = Math.floor((Date.now() - pomo.inicio) / 60000);
    if(minutos >= POMO_MIN) registrarPomo(pomo, minutos);
    else toast(`Menos de ${POMO_MIN} minutos: no se guardó`);
  }
  pomo = null; guardarPomo(); pararPomoTic(); render();
}
function descartarPomo(){
  if(!pomo) return;
  pomo = null; guardarPomo(); pararPomoTic(); render();
  toast('Pomodoro descartado');
}
function arrancarPomo(){ clearInterval(pomoIntervalo); pomoIntervalo = setInterval(ticPomo, 500); pintarPomo(); }
function pararPomoTic(){ clearInterval(pomoIntervalo); pomoIntervalo = 0; pintarPomo(); }
function ticPomo(){
  if(!pomo) return pararPomoTic();
  if(pomo.fin <= Date.now()) avanzarPomo(); else pintarPomo();
}
/* Sin redibujar la pantalla: solo los números y las franjas. */
function pintarPomo(){
  const pill = $('#pomo-pill');
  const resta = pomo ? Math.max(0, pomo.fin - Date.now()) : 0, p = pomo ? (resta / pomo.total).toFixed(3) : '1';
  if(pill){
    pill.hidden = !pomo || view === 'personal';
    if(pomo){
      $('#pomo-pill-num').textContent = fmtTiempo(resta);
      $('#pomo-pill-txt').textContent = pomo.fase === 'foco' ? 'Estudio' : 'Descanso';
      $('#pomo-pill-strip').style.setProperty('--p', p);
    }
  }
  const n = $('#pomo-num'); if(n) n.textContent = fmtTiempo(resta);
  const b = $('#pomo-barra'); if(b) b.style.setProperty('--p', p);
}
function restaurarPomo(){
  let p = null;
  try{ p = JSON.parse(leerClave(CLAVE_POMO) || 'null'); }catch(e){}
  const ok = p && (p.fase === 'foco' || p.fase === 'descanso') && [p.fin, p.total, p.inicio].every(Number.isFinite) && p.total > 0
             && typeof p.materia === 'string' && p.materia && POMO_FOCO.includes(p.foco) && POMO_DESC.includes(p.descanso);
  pomo = ok ? p : null;
  if(!pomo){ guardarPomo(); return; }
  avanzarPomo(Date.now(), true);
  if(pomo) arrancarPomo();
}

/* ==========================================================================
   COPIA DE SEGURIDAD — cuándo fue la última, y si el navegador protege los datos.
   Todo vive en el localStorage de UN aparato: si se limpia el navegador, se
   cambia de celular o el sistema purga el almacenamiento, el historial se va.
   Estas funciones no evitan eso (nada puede, salvo exportar): hacen que no te
   olvides, y le piden al navegador que no lo borre solo.
   Las fechas van en claves APARTE del estado, como el tema: son un dato de ESTE
   aparato. Si vivieran dentro del estado viajarían en el backup, y al importar
   uno viejo la app creería que exportaste hace meses.
   ========================================================================== */
const CLAVE_BACKUP = 'bauTracker.backup';
const CLAVE_BACKUP_SILENCIO = 'bauTracker.backupSilencio';
const AVISO_MIN_REGISTROS = 5;   // con menos que esto no hay nada que valga la pena proteger
const AVISO_DIAS = 14;           // cada cuánto se avisa
const AVISO_SILENCIO_DIAS = 7;   // cuánto calla "Más tarde"

function leerClave(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function escribirClave(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

function ultimoBackup(){ return leerClave(CLAVE_BACKUP) || null; }       // 'AAAA-MM-DD' o null
function marcarBackup(){ escribirClave(CLAVE_BACKUP, iso()); }
function diasSinBackup(){ const u = ultimoBackup(); return u ? daysSince(u) : null; }
function textoBackup(){
  const d = diasSinBackup();
  if(d === null) return 'nunca';
  if(d <= 0) return 'hoy';
  if(d === 1) return 'ayer';
  return `hace ${d} días`;
}

/* Cuánto hay en juego: una app vacía no necesita avisar nada. */
function registrosEnRiesgo(){
  return state.gym.sessions.length + state.estudio.entries.length + state.freelance.items.length +
    Object.values(state.habitos.log).reduce((a, l) => a + Object.keys(l || {}).length, 0);
}
/* ¿Hay que avisar? Devuelve null o {dias} (dias:null = nunca exportó). */
function avisoBackup(){
  if(registrosEnRiesgo() < AVISO_MIN_REGISTROS) return null;
  const callado = leerClave(CLAVE_BACKUP_SILENCIO);
  if(callado && daysSince(callado) < AVISO_SILENCIO_DIAS) return null;
  const d = diasSinBackup();
  if(d !== null && d < AVISO_DIAS) return null;
  return { dias: d };
}

function avisoBackupHTML(){
  const a = avisoBackup();
  if(!a) return '';
  const titulo = a.dias === null ? 'Todavía no exportaste ninguna copia'
                                 : `Hace ${a.dias} días que no exportás una copia`;
  return `
    <div class="card" id="aviso-backup" style="border-color:var(--warn);margin-bottom:var(--s4)">
      <b>${titulo}</b>
      <p class="xs muted mt3">Tus datos viven solo en este aparato. Si limpiás el navegador o
         cambiás de celular, se pierden. Exportar es un toque.</p>
      <div class="row wrap mt3">
        <button class="btn sm primary" data-act="export">Exportar ahora</button>
        <button class="btn sm" data-act="backup-despues">Más tarde</button>
      </div>
    </div>`;
}

/* Tras un intento de exportar. Solo un éxito marca la fecha: si el guardado
   falló o se canceló, decir "ya exportaste" sería peor que no decir nada. */
function registrarExportacion(ok){
  if(ok){
    marcarBackup();
    const el = $('#backup-estado');
    if(el) el.innerHTML = `Último backup: <b>${textoBackup()}</b>`;
    if(view === 'inicio') render();       // el aviso, si estaba, desaparece
  }
  return ok;
}

/* Almacenamiento persistente: le pide al navegador que NO borre estos datos
   cuando falte espacio. En Chrome se concede según el uso; Safari y Firefox
   deciden distinto. Dentro de un iframe con sandbox (el visor de artifacts)
   puede no existir o lanzar, y eso es "no se puede comprobar acá", NO
   "no protegido": decir lo segundo sería una alarma falsa. */
let almacenamiento = 'desconocido';   // 'protegido' | 'no-protegido' | 'no-disponible'
async function pedirProteccion(){
  try{
    if(!(navigator.storage && navigator.storage.persist && navigator.storage.persisted)){
      almacenamiento = 'no-disponible';
    }else if(await navigator.storage.persisted()){
      almacenamiento = 'protegido';
    }else{
      almacenamiento = (await navigator.storage.persist()) ? 'protegido' : 'no-protegido';
    }
  }catch(e){ almacenamiento = 'no-disponible'; }
  const el = $('#almacen-estado');
  if(el) el.innerHTML = almacenamientoHTML();   // en el lugar: no se redibuja Ajustes mientras escribís
}
function almacenamientoHTML(){
  const t = {
    'desconocido':  'comprobando…',
    'protegido':    'protegido por el navegador',
    'no-protegido': 'sin proteger: el navegador podría borrarlo si le falta espacio',
    'no-disponible':'no se puede comprobar desde acá, por eso conviene exportar',
  }[almacenamiento];
  return `Almacenamiento: <b>${t}</b>` +
    (almacenamiento === 'no-protegido'
      ? ` <button class="btn sm" data-act="pedir-proteccion">Pedir protección</button>` : '');
}

/* Guardar el backup en un archivo.
   Abriendo el .html local alcanza con un <a download>. Pero si la app está
   publicada como artifact en claude.ai, el visor bloquea las descargas que
   inicia la página (incluidas las de blob:) y ese link no hace nada: ahí hay
   que pedirle el guardado a la plataforma, que le muestra al usuario una
   confirmación. Un solo código para los dos casos. */
async function exportarBackup(){
  return registrarExportacion(
    await exportarTexto(JSON.stringify(state, null, 2), `bau-tracker-${iso()}.json`));
}

/* Guardar un texto como archivo. Abriendo el .html local alcanza con un <a download>;
   dentro del visor de artifacts las descargas que inicia la página están bloqueadas
   y hay que pedírselo a la plataforma. Un solo código para los dos casos. */
async function exportarTexto(texto, filename){
  const api = (window.claude && typeof window.claude.use === 'function')
    ? await window.claude.use('downloads')
    : null;
  if(api){
    try{ await api.save({ filename, data: texto }); toast('Backup guardado.'); return true; }
    catch(err){
      toast(err && err.code === 'declined' ? 'Guardado cancelado.' : 'No se pudo guardar el backup.');
      return false;
    }
  }
  // En el iPhone (y en Android) una app instalada no descarga bien con <a download>: se
  // abre la hoja de Compartir (Guardar en Archivos, WhatsApp, Drive…). En la compu, descarga.
  const archivo = typeof File === 'function' ? new File([texto], filename, { type: 'application/json' }) : null;
  if(archivo && navigator.canShare && navigator.share && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare({ files: [archivo] })){
    try{ await navigator.share({ files: [archivo], title: filename }); toast('Backup listo.'); return true; }
    catch(err){
      if(err && err.name === 'AbortError'){ toast('Guardado cancelado.'); return false; }
      // si compartir falla por otra razón, se intenta la descarga común
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], {type:'application/json'}));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
  return true;     // el navegador no avisa si la descarga terminó: es lo mejor que se sabe
}

  s.habitos.list = [

    const pag = [20, 20, 12, 0, 25, 8, 20][d % 7];      // cantidad: a veces llega a la meta, a veces no
    if(pag) s.habitos.log.h4[day] = pag;
    if([0, 2, 4].includes(diaSemana(day)) && d % 5 !== 0) s.habitos.log.h5[day] = true;   // casi siempre que toca
  }
  return s;
}

/* ==========================================================================
   TEMA — claro / oscuro / el del sistema.
   Va en su propia clave de localStorage y no dentro del estado: es preferencia
   de ESTE aparato y no tiene por qué viajar en el backup a otro celular.
   ========================================================================== */
const CLAVE_TEMA = 'bauTracker.tema';
function temaGuardado(){
  try{ return localStorage.getItem(CLAVE_TEMA) || 'auto'; }catch(e){ return 'auto'; }
}
function aplicarTema(t){
  const raiz = document.documentElement;
  if(t === 'auto') raiz.removeAttribute('data-theme');
  else raiz.setAttribute('data-theme', t);
  try{ localStorage.setItem(CLAVE_TEMA, t); }catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = getComputedStyle(raiz).getPropertyValue('--bg').trim() || '#15161A';
  const cs = document.querySelector('meta[name="color-scheme"]');
  if(cs) cs.content = t === 'auto' ? 'light dark' : t;
}
aplicarTema(temaGuardado());

// Sin envoltorio, el click le pasaría el MouseEvent como velocidad inicial.
$('#modal-x').addEventListener('click', () => closeModal());

// El arrastre vive en la cabecera y en la barra de agarre, que son las dos
// cosas que no scrollean. El cuerpo del diálogo sigue siendo scroll normal.
['.agarre', '.modal-head'].forEach(sel => {
  const z = $('#backdrop ' + sel);
  z.addEventListener('pointerdown', tomarHoja);
  z.addEventListener('pointermove', moverHoja);
  z.addEventListener('pointerup', soltarHoja);
  z.addEventListener('pointercancel', () => { agarre = null; enVuelo(false); });
});

function activarInstalacion(){
  if(location.protocol !== 'http:' && location.protocol !== 'https:') return;
  // La versión publicada (GitHub Pages) trae su manifest como archivo y un service worker
  // para abrir sin internet. build-web.py la marca con data-web en <html>.
  if(document.documentElement.dataset.web === '1'){
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(err => console.warn('Sin service worker:', err));
    return;
  }
  try{
    const manifest = {
      name: 'Bau Tracker', short_name: 'Bau', lang: 'es',
      start_url: location.pathname + location.search,
      scope: './', display: 'standalone', orientation: 'portrait',
      background_color: '#F4F2ED', theme_color: '#F4F2ED',
      description: 'Registro diario de gym, estudio, freelance y hábitos.',
      icons: [
        { src: ICONO_192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
        { src: ICONO_512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
      ],
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  }catch(err){ console.warn('No se pudo publicar el manifest:', err); }
}
activarInstalacion();
pedirProteccion();
restaurarTimer();
restaurarPomo();
