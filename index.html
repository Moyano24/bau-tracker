function revisarImportacion(){
  importTexto = $('#imp-texto').value;
  const r = leerImportacion(importTexto);
  if(r.error){
    const el = $('#imp-error');
    el.textContent = r.error; el.hidden = false;
    return false;
  }
  importacion = r;
  openModal(r.tipo === 'rutina' ? 'Revisar rutina' : 'Revisar entrenamientos', revisionHTML(r), guardarImportacion, 'Guardar');
  return false;   // el openModal de arriba ya reemplazó el diálogo
}

function revisionHTML(r){
  const nuevosIds = new Set(r.nuevos.map(n => n.id));
  const marca = id => nuevosIds.has(id) ? ' <span class="pill">Nuevo</span>' : '';
  const fila = (nombre, id, detalle) => `<li><span>${esc(nombre)}${marca(id)}</span><span class="xs muted">${esc(detalle)}</span></li>`;
  const cuerpo = r.tipo === 'rutina'
    ? `<p class="xs muted">${esc(r.rutina.nombre)} · ${r.rutina.dias.length} ${r.rutina.dias.length === 1 ? 'día' : 'días'}.
         El rango de reps de cada ejercicio pasa a ser su rango de progresión.</p>
       ${r.rutina.dias.map(d => `<div class="exbox"><b>${esc(d.nombre)}</b>
         <ul class="imp-lista">${d.ejercicios.map(e => fila(e.name, e.exId, metaTexto(e) + (e.kg ? ` · ${fmtKg(e.kg)} kg` : ''))).join('')}</ul>
       </div>`).join('')}`
    : r.sesiones.map((s, i) => {
        const dup = s.date && posibleDuplicado(s);
        return `<div class="exbox">
          <div class="field"><label for="imp-fecha-${i}">Fecha${s.date ? '' : ' · no figuraba en la foto'}</label>
            <input id="imp-fecha-${i}" type="date" max="${iso()}" value="${s.date || iso()}" data-imp-fecha="${i}"></div>
          ${dup ? '<p class="imp-aviso">Ya hay un entrenamiento igual ese día: quedó sin marcar.</p>' : ''}
          <ul class="imp-lista">${s.exercises.map(e => fila(e.name, e.exId, resumenSeries(e.sets))).join('')}</ul>
          <label class="imp-incluir"><input type="checkbox" data-imp-incluir="${i}" ${dup ? '' : 'checked'}> Cargar este entrenamiento</label>
        </div>`;
      }).join('');
  const nuevos = r.nuevos.length ? `<div class="exbox"><b>Ejercicios nuevos</b>
      <p class="xs muted">No estaban en la app: se crean con estos músculos. Si es uno que ya existe, elegilo.</p>
      ${r.nuevos.map(n => {
        const conMusculo = Object.keys(n.muscles).length > 0;
        return `<div class="field imp-nuevo">
          <label for="imp-rz-${n.id}">${esc(n.name)} · ${conMusculo ? esc(musculosTexto(n.muscles)) : 'sin músculo'}</label>
          <select id="imp-rz-${n.id}" data-imp-reemplazo="${n.id}"><option value="">Crear como ejercicio nuevo</option>${opcionesEjercicios()}</select>
          ${conMusculo ? '' : `<select data-imp-musculo="${n.id}" aria-label="Músculo principal de ${esc(n.name)}">
            <option value="">Elegí el músculo principal</option>
            ${MUSCLE_IDS.map(m => `<option value="${m}">${esc(MUSCLES[m].label)}</option>`).join('')}</select>`}
        </div>`;
      }).join('')}
    </div>` : '';
  const avisos = r.avisos.length ? `<ul class="imp-avisos">${r.avisos.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : '';
  return `${avisos}${cuerpo}${nuevos}<button type="button" class="btn sm" data-act="imp-volver">← Volver a pegar</button>`;
}

/* Guardar lo revisado: los nuevos se crean o se cambian por el elegido, y todo se puede deshacer. */
function guardarImportacion(){
  const r = importacion;
  if(!r) return true;
  // En un registro solo cuentan los entrenamientos marcados (y los nuevos que aparecen en ellos).
  const marcadas = r.tipo === 'rutina' ? [] : r.sesiones.map((s, i) => i).filter(i => {
    const m = $(`[data-imp-incluir="${i}"]`);
    return m && m.checked;
  });
  if(r.tipo === 'registro' && !marcadas.length){ toast('No quedó ningún entrenamiento marcado para cargar.'); return false; }
  const enJuego = new Set(r.tipo === 'rutina'
    ? r.rutina.dias.flatMap(d => d.ejercicios.map(e => e.exId))
    : marcadas.flatMap(i => r.sesiones[i].exercises.map(e => e.exId)));
  const destino = {}, crear = [];
  for(const n of r.nuevos.filter(x => enJuego.has(x.id))){
    const rz = exDef(($(`[data-imp-reemplazo="${n.id}"]`) || {}).value || '');
    if(rz){ destino[n.id] = rz; continue; }
    let muscles = n.muscles;
    if(!Object.keys(muscles).length){
      const m = ($(`[data-imp-musculo="${n.id}"]`) || {}).value;
      if(!MUSCLES[m]){ toast(`Elegí el músculo principal de ${n.name}.`); return false; }
      muscles = { [m]: 1 };
    }
    const ex = { id: n.id, name: n.name, muscles, bw: n.bw };
    crear.push(ex); destino[n.id] = ex;
  }
  const fijar = e => { const d = destino[e.exId]; if(d){ e.exId = d.id; e.name = d.name; } return e; };
  const raiz = state, g = state.gym;

  if(r.tipo === 'rutina'){
    const rutina = JSON.parse(JSON.stringify(r.rutina));
    rutina.dias.forEach(d => d.ejercicios.forEach(fijar));
    const progAntes = g.progresion ? JSON.parse(JSON.stringify(g.progresion)) : null;
    g.customExercises.push(...crear);
    aplicarRangosRutina(rutina);
    g.rutinas.unshift(rutina);
    save();
    importacion = null; importTexto = '';
    toast(`Rutina cargada · ${rutina.dias.length} ${rutina.dias.length === 1 ? 'día' : 'días'}`, { accion: { texto: 'Deshacer',
      fn: () => deshacerImportacion(raiz, { rutina: rutina.id, creados: crear.map(c => c.id), progresion: progAntes }) } });
    return true;
  }

  const sesiones = [];
  for(const i of marcadas){
    const s = r.sesiones[i], f = ($(`[data-imp-fecha="${i}"]`) || {}).value;
    if(!fechaImportable(f)){ toast(`Revisá la fecha del entrenamiento ${i + 1}: no puede ser del futuro.`); return false; }
    sesiones.push({ id: s.id, date: f, notes: s.notes,
      exercises: s.exercises.map(e => fijar(Object.assign({}, e, { sets: e.sets.map(x => Object.assign({}, x)) }))) });
  }
  const antes = computeGym().totalPts;
  g.customExercises.push(...crear);
  g.sessions.push(...sesiones);
  save();
  const delta = computeGym().totalPts - antes;
  importacion = null; importTexto = '';
  toast(`${sesiones.length === 1 ? 'Entrenamiento cargado' : `${sesiones.length} entrenamientos cargados`} · +${fmtNum(delta, 1)} puntos`,
    { accion: { texto: 'Deshacer', fn: () => deshacerImportacion(raiz, { sesiones: sesiones.map(s => s.id), creados: crear.map(c => c.id) }) } });
  return true;
}

/* El rango de reps de la rutina pasa a ser el de doble progresión. Las reps fijas (4 × 10) no
   son un rango: progresionValida las rechaza y el ejercicio sigue con el suyo. */
function aplicarRangosRutina(r){
  for(const d of r.dias) for(const e of d.ejercicios){
    const p = progresionValida({ min: e.min, max: e.max, inc: progresionDe(e.exId).inc });
    if(p){ state.gym.progresion = state.gym.progresion || {}; state.gym.progresion[e.exId] = p; }
  }
}

function deshacerImportacion(raiz, q){
  // Si en el medio se importó un backup o se borró todo, `state` es otro objeto.
  if(state !== raiz) return;
  const g = state.gym;
  if(q.sesiones) g.sessions = g.sessions.filter(s => !q.sesiones.includes(s.id));
  if(q.rutina) g.rutinas = g.rutinas.filter(x => x.id !== q.rutina);
  if('progresion' in q){ if(q.progresion) g.progresion = q.progresion; else delete g.progresion; }
  // Los ejercicios creados se van, salvo que ya se hayan usado en otro lado.
  const enUso = new Set(g.sessions.flatMap(s => s.exercises.map(e => e.exId))
    .concat(g.rutinas.flatMap(x => x.dias.flatMap(d => d.ejercicios.map(e => e.exId)))));
  g.customExercises = g.customExercises.filter(c => !q.creados.includes(c.id) || enUso.has(c.id));
  save(); render();
}

function handleAction(act, btn, ev){
  const id = btn.dataset.id;

  switch(act){

  /* --- navegación desde las visualizaciones --- */
  case 'go-sec': go(btn.dataset.view); break;
  case 'open-muscle': {
    const mus = btn.dataset.mus;
    go('gym');
    selMuscle = mus;
    render();
    break;
  }
  case 'quick-session': openQuickSession(); break;
  case 'usar-dia': abrirDiaRutina(id, btn.dataset.dia); break;
  case 'del-rutina': borrarDeLista(state.gym.rutinas, id, 'Rutina borrada'); break;
  case 'importar-ia':
  case 'imp-volver': abrirImportar(); break;
  case 'copiar-prompt': {
    const txt = promptImportar();
    const ok = () => toast('Prompt copiado: pegalo en la IA junto con la foto');
    // Si el navegador no deja copiar, el prompt aparece entero y seleccionado.
    const mal = () => {
      const caja = $('#imp-prompt');
      if(!caja) return;
      caja.innerHTML = `<textarea id="imp-prompt-txt" readonly rows="6">${esc(txt)}</textarea>
        <p class="xs muted">No se pudo copiar solo: mantené apretado el texto (o Ctrl+C) para copiarlo.</p>`;
      const ta = $('#imp-prompt-txt'); ta.focus(); ta.select();
    };
    try{ navigator.clipboard.writeText(txt).then(ok, mal); }catch(e){ mal(); }
    break;
  }

  /* --- modal genérico --- */
  case 'close-modal': closeModal(); break;
  case 'toast-accion': {
    const f = toastAccion;
    toastAccion = null; clearTimeout(toastTimer); $('#toast').hidden = true;
    if(f) f();
    break;
  }
  case 'save-modal':
    if(modalSave && modalSave() !== false){ closeModal(); render(); }
    break;

  /* --- gym --- */
  case 'new-session':  openSessionModal(null); break;
  case 'edit-session': openSessionModal(id); break;
  case 'del-session':
    borrarDeLista(state.gym.sessions, id, 'Entrenamiento borrado');
    break;
  case 'close-muscle': selMuscle = null; render(); break;
  case 'ver-mas':
    limites[btn.dataset.lista] += PAGINA * 2;
    render();
    break;

  case 'add-ex': {
    const sel = $('#ex-pick');
    const def = exDef(sel.value);
    if(!def) break;
    draft.exercises.push({ exId: def.id, name: def.name, rir: 1, sets: [{reps:'', kg:''}] });
    refreshExList();
    break;
  }
  case 'del-ex': draft.exercises.splice(+btn.dataset.ei, 1); refreshExList(); break;
  case 'repetir-ultima': {
    const ex = draft.exercises[+btn.dataset.ei];
    const uv = ex && ultimaVez(ex.exId, draft.date, draft.id);
    if(!uv) break;
    // El botón puede estar desactualizado (escribiste algo después de dibujarlo).
    if(!ex.sets.every(s => !Number(s.reps) && !Number(s.kg))){ toast('Ya cargaste series: no las piso.'); break; }
    ex.sets = uv.sets.map(s => ({ reps: s.reps, kg: s.kg > 0 ? s.kg : '' }));
    refreshExList();
    break;
  }
  case 'usar-sugerencia': {
    const ex = draft.exercises[+btn.dataset.ei];
    const sug = ex && sugerirProgresion(ex.exId, ultimaVez(ex.exId, draft.date, draft.id));
    if(!sug) break;
    if(!ex.sets.every(s => !Number(s.reps) && !Number(s.kg))){ toast('Ya cargaste series: no las piso.'); break; }
    ex.sets = sug.reps.map(r => ({ reps: r, kg: sug.kg > 0 ? sug.kg : '' }));
    refreshExList();
    break;
  }
  case 'prog-editar': {
    const ex = draft.exercises[+btn.dataset.ei];
    if(!ex) break;
    progAbierto = progAbierto === ex.exId ? null : ex.exId;
    refreshExList();
    break;
  }
  case 'prog-guardar':
  case 'prog-restaurar': {
    const i = +btn.dataset.ei, ex = draft.exercises[i];
    if(!ex) break;
    const p = act === 'prog-restaurar' ? Object.assign({}, PROG_DEF)
      : progresionValida({ min: Number($('#pg-min-' + i).value), max: Number($('#pg-max-' + i).value), inc: Number($('#pg-inc-' + i).value) });
    if(!p){ toast('Revisá el rango: el piso tiene que ser menor que el tope (de 1 a 50 reps) y el salto, de 0,25 a 20 kg.'); break; }
    const prog = state.gym.progresion = state.gym.progresion || {};
    if(p.min === PROG_DEF.min && p.max === PROG_DEF.max && p.inc === PROG_DEF.inc) delete prog[ex.exId];
    else prog[ex.exId] = p;
    if(!Object.keys(prog).length) delete state.gym.progresion;
    progAbierto = null;
    save(); refreshExList();
    toast(`${ex.name}: rango ${p.min}–${p.max} · +${fmtKg(p.inc)} kg`);
    break;
  }
  case 'gym-semana': gymSemana = Math.max(0, gymSemana + Number(btn.dataset.d)); render(); break;
  case 'pomo-opc': {
    const k = btn.dataset.k, v = Number(btn.dataset.v);
    if((k === 'foco' && pomoFocoOk(v)) || (k === 'descanso' && pomoDescOk(v))){
      pomoForm.materia = ($('#pomo-mat') || {}).value || pomoForm.materia;
      pomoForm.tema = ($('#pomo-tema') || {}).value || pomoForm.tema;
      pomoForm[k] = v; render();
    }
    break;
  }
  case 'pomo-iniciar': {
    const mat = $('#pomo-mat').value, tema = $('#pomo-tema').value;
    pomoForm.materia = mat; pomoForm.tema = tema;
    if(iniciarPomo(mat, tema, pomoForm.foco, pomoForm.descanso)) abrirReloj({ modo: 'corriendo', fuente: 'pomo' });
    break;
  }
  case 'pomo-otro': {
    pomoForm.materia = $('#pomo-mat').value; pomoForm.tema = $('#pomo-tema').value;
    if(!pomoForm.materia.trim()){ toast('Elegí una materia para el pomodoro.'); break; }
    elegirPomo();
    break;
  }
  case 'pomo-terminar': terminarPomo(); break;
  case 'cuenta-salir': salirCuenta(); break;
  case 'atajo-crear': {
    btn.disabled = true;
    asegurarNube().then(n => n && n.rpc('crear_clave_atajos', { p_zona: zonaAparato() })).then(r => {
      if(!r || r.error || typeof r.data !== 'string'){ toast(r && faltaSqlAtajos(r.error) ? TEXTO_FALTA_SQL : 'No se pudo crear la clave. Probá de nuevo.'); btn.disabled = false; return; }
      atajoClave = r.data; atajoBorrar = false; render();
      const c = $('#atajos'); if(c) c.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }, () => { toast('No se pudo crear la clave. Probá de nuevo.'); btn.disabled = false; });
    break;
  }
  case 'atajo-borrar': {
    // Sin confirm() (no anda en el visor): el primer toque arma el botón y el segundo borra.
    if(!atajoBorrar){ atajoBorrar = true; render(); break; }
    btn.disabled = true;
    asegurarNube().then(n => n && n.rpc('borrar_clave_atajos', {})).then(r => {
      atajoBorrar = false; render();
      toast(!r || r.error ? (r && faltaSqlAtajos(r.error) ? TEXTO_FALTA_SQL : 'No se pudo borrar la clave. Probá de nuevo.')
                          : 'Clave borrada: los atajos que la usaban dejaron de andar.');
    }, () => { atajoBorrar = false; render(); toast('No se pudo borrar la clave. Probá de nuevo.'); });
    break;
  }
  case 'atajo-probar': {
    const hb = state.habitos.list[0], salida = $('#atajo-prueba');
    if(!hb || !atajoClave || !salida) break;
    salida.textContent = 'Probando…';
    asegurarNube().then(n => n.rpc('anotar_atajo', { p_clave: atajoClave, p_habito: hb.name, p_probar: true })).then(r => {
      salida.textContent = r.error ? (faltaSqlAtajos(r.error) ? TEXTO_FALTA_SQL : 'No anduvo: ' + (r.error.message || 'error desconocido')) : String(r.data);
    }, () => { salida.textContent = 'No anduvo: revisá la conexión.'; });
    break;
  }
  case 'atajo-listo': atajoClave = null; render(); break;
  case 'atajo-copiar': {
    const el = $('#' + btn.dataset.de);

      if(c) c.focus({ preventScroll: true });
    }
    break;
  }
  case 'sel-todos': {
    if(!habMulti) break;
    const todos = habMostrados().map(x => x.id);
    habMulti = new Set(todos.every(x => habMulti.has(x)) ? [] : todos);
    render();
    break;
  }
  case 'sel-completar': completarSeleccion(); break;
  case 'sel-saltear': saltearSeleccion(); break;
  case 'saltar-dia': {
    const hid = btn.dataset.habit, day = btn.dataset.day;
    if(!habitoDe(hid) || !fechaValida(day) || day > iso()) break;
    const log = state.habitos.log[hid] = state.habitos.log[hid] || {};
    if(log[day] === SALTEO) delete log[day];
    else if(!activo(hid, day)) log[day] = SALTEO;
    if(!Object.keys(log).length) delete state.habitos.log[hid];
    save(); render();
    break;

  case 'sel-cats': abrirCatsMulti(); break;
  case 'sel-borrar': borrarSeleccion(); break;
  case 'multi-cat': {

  case 'dia-sel': habDia = btn.dataset.day === iso() ? null : btn.dataset.day; render(); break;
  case 'dia-hoy': habDia = null; render(); break;
  case 'dia-semana': {

  case 'del-habit': {

    if(!hb) break;
    borrarDeLista(state.habitos.list, id, `Hábito “${hb.name}” borrado`, {
      // El historial cuelga del hábito: se va con él y vuelve con él.
      quitar: () => { const l = state.habitos.log[id]; delete state.habitos.log[id]; return l; },
      devolver: (_, l) => { if(l) state.habitos.log[id] = l; },
    });

  }
  case 'toggle-day': {
    const hid = btn.dataset.habit, day = btn.dataset.day, hb = habitoDe(hid);
    if(!hb) break;
    // Un hábito de cantidad no se tilda: se le carga un valor.
    if(esCantidad(hb)){ abrirValorDia(hid, day); break; }
    const log = state.habitos.log[hid] = state.habitos.log[hid] || {};
    if(hecho(hid, day)) delete log[day]; else log[day] = true;      // marcar también reemplaza un salteo
    save(); render();
    break;
  }
  case 'valor-dia': abrirValorDia(btn.dataset.habit, btn.dataset.day); break;
  case 'valor-paso': {
    const hid = btn.dataset.habit, hb = habitoDe(hid);
    if(!hb || !esCantidad(hb)) break;
    const dia = btn.dataset.day || iso();          // el día elegido en la tira, no siempre hoy
    const nuevo = Math.max(0, valorDia(hid, dia) + Number(btn.dataset.d) * pasoDe(hb));
    if(nuevo === 0 && salteado(hid, dia)) break;   // restar sobre un día salteado no lo borra

    break;

  case 'valor-meta': {
    const campo = $('#hb-valor'), hb = valorDraft && habitoDe(valorDraft.id);
    if(campo && hb) campo.value = String(hb.meta);
    break;
  }
  case 'valor-cero': { const campo = $('#hb-valor'); if(campo) campo.value = '0'; break; }
  case 'abrir-habito': habSel = id; habOffset = 0; habDetVista = 'mes'; window.scrollTo(0, 0); render(); break;
  case 'cerrar-habito': habSel = null; habOffset = 0; render(); break;
  case 'vista-hab':
    habVista = btn.dataset.v; habOffset = 0; habMulti = null;
    escribirClave(CLAVE_HABVISTA, habVista);
    render();
    break;
  case 'det-vista': habDetVista = btn.dataset.v; habOffset = 0; render(); break;
  case 'filtro-hab': habFiltro = btn.dataset.cat || null; render(); break;
  case 'nav-hab': habOffset = Math.max(0, habOffset + Number(btn.dataset.d)); render(); break;

  /* --- ajustes --- */
  case 'tema':

    break;
  case 'save-bw':
    state.profile.bodyweightKg = Number($('#bw').value) || 70;
    save();
    toast('Peso guardado · los puntos de los ejercicios con peso corporal se recalcularon');
    break;

  case 'backup-despues':
    escribirClave(CLAVE_BACKUP_SILENCIO, iso());
    render();
    break;
  case 'pedir-proteccion':
    pedirProteccion();
    break;
  case 'export':
    exportarBackup();
    break;
  case 'bajar-roto': {
    let roto = '';
    try{ roto = localStorage.getItem(CLAVE_ROTO) || ''; }catch(e){}
    if(roto) exportarTexto(roto, `bau-tracker-danado-${iso()}.json`);
    else toast('No quedó nada apartado');
    break;
  }
  case 'cerrar-aviso':
    avisoRescate = null;
    try{ localStorage.removeItem(CLAVE_ROTO); }catch(e){}
    render();
    break;
  case 'import': {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.onchange = () => {
      const file = input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const data = JSON.parse(reader.result);
          // Validar ANTES de asignar y guardar. Antes se guardaba primero y, si el
          // archivo tenía la forma equivocada, el render explotaba y la app quedaba
          // en blanco para siempre: ya no había forma de llegar a Ajustes a borrar.
          const errs = validarEstado(data);
          if(errs.length){
            toast('No se importó · ' + errs[0]);
            console.warn('Problemas del backup:', errs);
            return;

          state = normalizarEstado(data);
          save(); render();
          toast('Datos importados');
        }catch(err){
          toast('El archivo no es un backup válido.');
          console.error(err);

  }
  case 'seed':
    openModal('Cargar datos de ejemplo', `
      <p>Esto <b>reemplaza todos tus datos</b> por datos de ejemplo.</p>
      <p class="xs muted mt3">Vas a tener unos segundos para deshacerlo, pero si querés
         conservar lo que tenés, exportalo antes.</p>
      <div class="row wrap mt3"><button class="btn sm" data-act="export">Exportar mis datos primero</button></div>`,
      () => reemplazarEstado(seedData(), 'Datos de ejemplo cargados.'), 'Cargar ejemplos', true);
    break;
  case 'wipe':
    openModal('Borrar todo', `
      <p>Se borran <b>todos</b> tus entrenamientos, estudio, clientes y hábitos.</p>
      <p class="xs muted mt3">Vas a tener unos segundos para deshacerlo. Pasado ese tiempo
         no se puede recuperar, salvo desde un backup.</p>
      <div class="row wrap mt3"><button class="btn sm" data-act="export">Exportar mis datos primero</button></div>`,
      () => reemplazarEstado(emptyState(), 'Todo borrado.'), 'Borrar todo', true);
    break;
  }
}

/* ==========================================================================
   TEMPORIZADOR DE DESCANSO.
   Se guarda el INSTANTE en que termina, no un contador que baja: un setInterval
   se atrasa o se pausa cuando la pestaña no está a la vista, y un contador
   mentiría. Con el instante final el tiempo que queda se calcula siempre contra
   el reloj, así sobrevive a eso y a recargar la página.
   Límite honesto: con el celular bloqueado JavaScript se pausa y el aviso llega
   al desbloquear. En iPhone, además, el navegador no vibra.
   ========================================================================== */
const CLAVE_TIMER = 'bauTracker.timer';
let timer = null;                       // {fin, total} en ms de reloj; null = no hay
let timerIntervalo = 0, timerAudio = null, timerWakeLock = null;

/* En pausa, lo que queda está guardado y no corre. */
function restanteMs(t, ahora = Date.now()){ return !t ? 0 : t.pausa != null ? t.pausa : Math.max(0, t.fin - ahora); }
function fmtTiempo(ms){
  const s = Math.ceil(ms / 1000);          // ceil: a 0,4 s tiene que decir 00:01, no 00:00
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function guardarTimer(){
  if(timer) escribirClave(CLAVE_TIMER, JSON.stringify(timer));
  else try{ localStorage.removeItem(CLAVE_TIMER); }catch(e){}
}
function restaurarTimer(){
  let t = null;
  try{ t = JSON.parse(leerClave(CLAVE_TIMER) || 'null'); }catch(e){}
  const pausado = t && Number.isFinite(t.pausa) && t.pausa > 0;
  if(t && Number.isFinite(t.fin) && Number.isFinite(t.total) && t.total > 0 && (t.fin > Date.now() || pausado)){
    timer = { fin: t.fin, total: t.total };
    if(pausado){ timer.pausa = t.pausa; timer.pausaDesde = Number(t.pausaDesde) || Date.now(); }
    arrancarTic(); pintarTimer();
  }else{
    // Si venció con la app cerrada no suena nada: ya nadie lo está esperando.
    timer = null; guardarTimer();
  }
}
function iniciarTimer(seg){
  const ms = Math.max(5, Math.min(Number(seg) || 0, 3600)) * 1000;       // de 5 s a 1 h
  timer = { fin: Date.now() + ms, total: ms };
  guardarTimer(); prepararAudio(); pedirPantallaEncendida(); arrancarTic(); pintarTimer();
}
function ajustarTimer(deltaSeg){
  if(!timer) return;
  moverFin(timer, deltaSeg);
  if(restanteMs(timer) <= 0){ terminoTimer(); return; }                  // restar hasta el final = terminó
  timer.total = Math.max(timer.total + Math.max(deltaSeg, 0) * 1000, restanteMs(timer)); // la franja no pasa de 100%
  guardarTimer(); pintarTimer();
}
function pararTimer(){
  timer = null; guardarTimer();
  clearInterval(timerIntervalo); timerIntervalo = 0;
  soltarPantalla(); pintarTimer();
}
function arrancarTic(){ clearInterval(timerIntervalo); timerIntervalo = setInterval(ticTimer, 250); }
function ticTimer(){
  if(!timer) return;
  if(restanteMs(timer) <= 0) terminoTimer(); else pintarTimer();
}
function terminoTimer(){
  // Si se estaba mirando en grande, el reloj festeja en vez de cerrarse de golpe.
  if(relojMuestra('descanso')) relojListo('descanso', 'Descanso terminado', 'A la próxima serie');
  pararTimer();
  sonarFin();
  toast('Descanso terminado');
}
function pintarTimer(){
  const pill = $('#timer-pill');
  if(!pill) return;
  pill.hidden = !timer || relojMuestra('descanso');
  if(timer){
    const resta = restanteMs(timer);
    $('#timer-num').textContent = fmtTiempo(resta);
    $('#timer-strip').style.setProperty('--p', (resta / timer.total).toFixed(3));
  }
  pintarReloj();
}

/* Sonido y vibración. El AudioContext se crea en el toque que INICIA el
   temporizador: los navegadores no dejan sonar nada si no nació de un gesto. */
function prepararAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!timerAudio) timerAudio = new AC();
    if(timerAudio.state === 'suspended') timerAudio.resume();
  }catch(e){}
}
function sonarFin(){
  try{ if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]); }catch(e){}
  try{
    if(!timerAudio) return;
    const t0 = timerAudio.currentTime;
    [0, .25, .5].forEach(dt => {                                          // tres pitidos
      const o = timerAudio.createOscillator(), g = timerAudio.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      o.connect(g); g.connect(timerAudio.destination);
      g.gain.setValueAtTime(.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(.35, t0 + dt + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dt + .18);
      o.start(t0 + dt); o.stop(t0 + dt + .2);
    });
  }catch(e){}
}
/* Pantalla encendida mientras corre, si el navegador lo permite. */
async function pedirPantallaEncendida(){
  try{ if(navigator.wakeLock && !timerWakeLock) timerWakeLock = await navigator.wakeLock.request('screen'); }
  catch(e){ timerWakeLock = null; }
}
function soltarPantalla(){
  try{ if(timerWakeLock) timerWakeLock.release(); }catch(e){}
  timerWakeLock = null;
}
/* ==========================================================================
   SINCRONIZACIÓN — una cuenta para tener los mismos datos en todos los aparatos.
   Cada aparato sigue guardando todo en su localStorage: la app anda sin internet y sin
   cuenta. Con la sesión iniciada, además:
     · al guardar, el estado completo sube a Supabase SYNC_ESPERA_MS después del último
       cambio (no en cada tecla);
     · al abrir la app, al volver a ella y al recuperar internet, se fija si la nube tiene
       una versión más nueva y la baja;
     · `rev` cuenta las versiones: si dos aparatos cambiaron a la vez, se pregunta cuál
       conservar entero, y el otro lado se recupera con Deshacer. No se mezcla registro a
       registro: con un solo usuario y dos aparatos es raro y así nunca queda un híbrido.
   ========================================================================== */
let nube = null, sync = null, syncTimer = 0, subiendo = false, otraVez = false, conflictoFila = null;
let syncEstado = 'apagado';   // apagado | listo | pendiente | subiendo | sin-conexion | error | conflicto
const SYNC_VACIO = () => ({ id: null, usuario: null, conectado: false, rev: 0, pendiente: false, ultimo: null });

/* Lo que este aparato sabe de su cuenta: id, mail, si está conectado, la última versión
   que conoce de la nube y si tiene cambios sin subir. Vive en su propia clave. */
function syncInfo(){
  if(!sync){
    let g = null;
    try{ g = JSON.parse(leerClave(CLAVE_SYNC) || 'null'); }catch(e){}
    sync = Object.assign(SYNC_VACIO(), g && typeof g === 'object' ? g : {});
  }
  return sync;
}
function guardarSync(){ escribirClave(CLAVE_SYNC, JSON.stringify(syncInfo())); }
// Las pruebas pueden simular claves con window.__supabasePrueba ({url, anon}).
const configSupabase = () => window.__supabasePrueba || { url: SUPABASE_URL, anon: SUPABASE_ANON };
function syncConfigurada(){ const c = configSupabase(); return !!window.__nubeFalsa || !!(c.url && c.anon); }
function enArtifact(){ return !!(window.claude && typeof window.claude.use === 'function'); }
function syncDisponible(){ return !!window.__nubeFalsa || (syncConfigurada() && !enArtifact()); }
const syncActiva = () => syncDisponible() && syncInfo().conectado && !!syncInfo().id;

function cargarSDK(){
  return new Promise((ok, mal) => {
    if(window.supabase && window.supabase.createClient) return ok(window.supabase);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = () => (window.supabase ? ok(window.supabase) : mal(new Error('SDK vacío')));
    s.onerror = () => mal(new Error('No se pudo cargar Supabase'));
    document.head.appendChild(s);
  });
}
/* La conexión, una sola vez. En los tests se usa una nube falsa con la misma forma. */
async function asegurarNube(){
  if(nube) return nube;
  try{
    if(window.__nubeFalsa) nube = window.__nubeFalsa;
    else if(syncDisponible()){
      const sdk = await cargarSDK();
      nube = sdk.createClient(configSupabase().url, configSupabase().anon,
        { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'bauTracker.auth' } });
    }
  }catch(e){ nube = null; syncEstado = 'sin-conexion'; pintarSync(); }
  return nube;
}

const estadoVacio = s => !s || !(s.gym && s.gym.sessions.length) && !(s.estudio && s.estudio.entries.length) &&
                         !(s.freelance && s.freelance.items.length) && !(s.habitos && s.habitos.list.length);
function cuantosRegistros(s){
  const n = normalizarEstado(JSON.parse(JSON.stringify(s || {})));
  return n.gym.sessions.length + n.estudio.entries.length + n.freelance.items.length +
         Object.values(n.habitos.log).reduce((a, l) => a + Object.keys(l || {}).length, 0);
}

/* Al guardar. Aunque la sesión esté cerrada, si el aparato tiene cuenta se anota que hay
   cambios: al volver a entrar se suben. */
function marcarPendiente(){
  if(!syncDisponible()) return;
  const s = syncInfo();
  if(!s.id) return;
  s.pendiente = true; guardarSync();
  if(!s.conectado) return;
  syncEstado = 'pendiente'; pintarSync();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(subir, SYNC_ESPERA_MS);
}

async function leerFila(){
  const { data, error } = await nube.from('bau_estado').select('datos,rev,actualizado').maybeSingle();
  if(error) throw error;
  return data || null;
}

/* Reemplaza lo de este aparato por lo de la nube (validado y normalizado, como un backup). */
function aplicarFila(fila){
  if(!fila || validarEstado(fila.datos).length){ toast('Los datos de la cuenta llegaron dañados: no se cambió nada en este aparato.'); return false; }
  state = normalizarEstado(JSON.parse(JSON.stringify(fila.datos)));
  guardarLocal();
  const s = syncInfo();
  s.rev = fila.rev; s.pendiente = false; s.ultimo = fila.actualizado || new Date().toISOString(); guardarSync();
  syncEstado = 'listo';
  render();
  return true;
}

async function subir(){
  clearTimeout(syncTimer);
  const s = syncInfo();
  if(!syncActiva() || !s.pendiente) return;
  if(!(await asegurarNube())) return;
  if(navigator.onLine === false){ syncEstado = 'sin-conexion'; pintarSync(); return; }
  if(subiendo){ otraVez = true; return; }
  subiendo = true; syncEstado = 'subiendo'; pintarSync();
  const enviado = JSON.stringify(state);
  try{
    const { data, error } = await nube.rpc('guardar_estado', { p_datos: JSON.parse(enviado), p_rev: s.rev });
    if(error) throw error;
    const r = Array.isArray(data) ? data[0] : data;
    if(r && r.o_ok){
      s.rev = r.o_rev; s.ultimo = r.o_actualizado || new Date().toISOString();
      s.pendiente = JSON.stringify(state) !== enviado;     // si cambió mientras subía, sigue pendiente
      guardarSync();
      syncEstado = s.pendiente ? 'pendiente' : 'listo';
      if(s.pendiente) syncTimer = setTimeout(subir, SYNC_ESPERA_MS);
    }else{
      const fila = await leerFila();                       // otro aparato guardó antes
      if(fila) mostrarConflicto(fila, false);
    }
  }catch(e){
    syncEstado = navigator.onLine === false ? 'sin-conexion' : 'error';
    console.warn('Sincronización:', e);
  }finally{ subiendo = false; pintarSync(); }
  if(otraVez){ otraVez = false; await subir(); }
}

/* Al abrir la app, al volver a ella y al recuperar internet. */
async function bajar(){
  const s = syncInfo();
  if(!syncActiva() || !(await asegurarNube())) return;
  if(navigator.onLine === false){ syncEstado = 'sin-conexion'; pintarSync(); return; }
  try{
    const fila = await leerFila();
    if(!fila){
      s.rev = 0; if(!estadoVacio(state)) s.pendiente = true; guardarSync();
      if(s.pendiente) await subir(); else { syncEstado = 'listo'; pintarSync(); }
      return;
    }
    if(fila.rev === s.rev){
      if(s.pendiente) await subir(); else { syncEstado = 'listo'; pintarSync(); }
      return;
    }
    if(fila.rev > s.rev && !s.pendiente){ aplicarFila(fila); toast('Datos al día con tu cuenta'); return; }
    mostrarConflicto(fila, false);
  }catch(e){ syncEstado = navigator.onLine === false ? 'sin-conexion' : 'error'; pintarSync(); console.warn('Sincronización:', e); }
}

/* El primer encuentro de este aparato con la cuenta. */
async function despuesDeEntrar(user){
  const s = syncInfo();
  if(s.id !== user.id){ Object.assign(s, SYNC_VACIO()); s.pendiente = !estadoVacio(state); }   // otra cuenta: no se conoce ninguna versión
  s.id = user.id; s.usuario = user.email || ''; s.conectado = true; guardarSync();
  const fila = await leerFila();
  if(!fila){ s.rev = 0; s.pendiente = true; guardarSync(); await subir(); toast('Listo: tus datos quedaron guardados en tu cuenta'); return 'subio'; }
  if(estadoVacio(state)){ aplicarFila(fila); toast('Listo: bajaron los datos de tu cuenta'); return 'bajo'; }
  if(fila.rev === s.rev){ if(s.pendiente) await subir(); else { syncEstado = 'listo'; pintarSync(); } return 'igual'; }
  mostrarConflicto(fila, true);
  return 'pregunta';
}

function mostrarConflicto(fila, primeraVez){
  conflictoFila = fila; syncEstado = 'conflicto'; pintarSync();
  const cuando = fila.actualizado ? new Date(fila.actualizado).toLocaleString('es-AR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'sin fecha';
  openModal(primeraVez ? 'Ya tenés datos en tu cuenta' : 'Hubo cambios en dos aparatos', `
    <p>${primeraVez ? 'Este aparato y tu cuenta tienen datos distintos.' : 'Mientras este aparato tenía cambios sin subir, otro guardó en tu cuenta.'}
      Elegí con cuáles te quedás: el otro lado se puede recuperar con <b>Deshacer</b>.</p>
    <div class="cuenta-lados">
      <button class="btn" data-act="sync-usar-nube">Usar los de la cuenta · ${cuantosRegistros(fila.datos)} registros · ${esc(cuando)}</button>

function mensajeErrorCuenta(e){
  const m = String((e && (e.message || e.code)) || '');
  if(/invalid login|invalid_credentials/i.test(m)) return 'Mail o contraseña incorrectos.';
  if(/not confirmed/i.test(m)) return 'Falta confirmar el mail: buscá el correo de confirmación y tocá el link.';
  if(/already registered|already exists/i.test(m)) return 'Ese mail ya tiene cuenta: tocá "Entrar".';
  if(/password/i.test(m)) return 'La contraseña tiene que tener al menos 6 caracteres.';
  if(/fetch|network|failed/i.test(m)) return 'Sin conexión: probá de nuevo con internet.';
  return 'No se pudo: ' + m.slice(0, 120);
}
async function entrarCuenta(email, clave, crear){
  email = String(email || '').trim();
  if(!email || !clave){ toast('Poné tu mail y tu contraseña.'); return false; }
  if(!(await asegurarNube())){ toast('No se pudo conectar con la cuenta. ¿Tenés internet?'); return false; }
  let r;
  try{
    r = crear
      ? await nube.auth.signUp({ email, password: clave, options: { emailRedirectTo: location.origin + location.pathname } })
      : await nube.auth.signInWithPassword({ email, password: clave });
  }catch(e){ r = { error: e }; }
  if(r.error){ toast(mensajeErrorCuenta(r.error), { ms: 6000 }); return false; }
  const d = r.data || {};
  if(!d.session){ toast('Revisá tu mail: hay que confirmar la cuenta y después tocar «Entrar».', { ms: 9000 }); return false; }
  try{ await despuesDeEntrar(d.user || d.session.user); }
  catch(e){ syncEstado = 'error'; toast(mensajeErrorCuenta(e)); }
  render();
  return true;
}
async function salirCuenta(){

async function iniciarNube(){
  if(!syncDisponible()) return;
  const s = syncInfo();
  if(!s.conectado || !s.id){ pintarSync(); return; }
  if(!(await asegurarNube())) return;

    if(!data || !data.session){ s.conectado = false; guardarSync(); syncEstado = 'apagado'; render(); return; }
    await bajar();

}

function hace(isoTiempo){
  const min = Math.round((Date.now() - new Date(isoTiempo).getTime()) / 60000);
  if(!Number.isFinite(min)) return '—';
  if(min < 1) return 'recién';
  if(min < 60) return `hace ${min} min`;
  const hs = Math.round(min / 60);
  return hs < 24 ? `hace ${hs} h` : `hace ${Math.round(hs / 24)} días`;
}

/* ==========================================================================
   POMODORO. Igual que el descanso: se guarda el INSTANTE en que termina cada fase,
   no un contador, así sobrevive a la pestaña oculta y a recargar. Al terminar un
   bloque de foco la sesión de estudio se guarda sola (con Deshacer) y empieza el
   descanso, que no se guarda. Si el foco terminó con la app cerrada, al volver se
   guarda igual: el tiempo pasó (salvo que haya sido hace más de 12 horas).
   ========================================================================== */
const CLAVE_POMO = 'bauTracker.pomo';
const POMO_FOCO = [25, 50], POMO_DESC = [5, 10], POMO_MIN = 5, POMO_VIEJO_MS = 12 * 3600 * 1000;
/* Los botones rápidos son POMO_FOCO y POMO_DESC; con la ruedita vale cualquier foco de 5 a 90
   minutos y cualquier descanso de 0 a 30 (0 = sin descanso). */
const POMO_FOCO_MAX = 90, POMO_DESC_MAX = 30;
const pomoFocoOk = v => Number.isInteger(v) && v >= POMO_MIN && v <= POMO_FOCO_MAX;
const pomoDescOk = v => Number.isInteger(v) && v >= 0 && v <= POMO_DESC_MAX;
let pomo = null;            // {fase:'foco'|'descanso', fin, total, inicio, materia, tema, foco, descanso}
let pomoIntervalo = 0, pomoForm = { foco: 25, descanso: 5 };

function guardarPomo(){
  if(pomo) escribirClave(CLAVE_POMO, JSON.stringify(pomo));
  else try{ localStorage.removeItem(CLAVE_POMO); }catch(e){}
}
/* La sesión de estudio que deja un bloque de foco. Devuelve la entrada creada. */
function registrarPomo(p, minutos){
  const e = { id: uid(), date: iso(new Date(p.inicio)), subject: p.materia, topic: p.tema || '', minutes: minutos, fuente: 'pomodoro' };
  state.estudio.entries.push(e);
  save();
  const raiz = state;
  toast(`Pomodoro guardado: ${minutos} min de ${p.materia}`, { accion: { texto: 'Deshacer', fn: () => {
    if(state !== raiz) return;
    const i = state.estudio.entries.findIndex(x => x.id === e.id);
    if(i >= 0){ state.estudio.entries.splice(i, 1); save(); render(); }
  } } });
  return e;
}
function iniciarPomo(materia, tema, foco, descanso){
  materia = String(materia || '').trim().slice(0, 40);
  if(!materia){ toast('Elegí una materia para el pomodoro.'); return false; }
  if(!pomoFocoOk(foco) || !pomoDescOk(descanso)) return false;
  const ahora = Date.now();
  pomo = { fase: 'foco', inicio: ahora, fin: ahora + foco * 60000, total: foco * 60000,
           materia, tema: String(tema || '').trim().slice(0, 80), foco, descanso };
  guardarPomo(); prepararAudio(); pedirPantallaEncendida(); arrancarPomo(); render();
  return true;
}
/* Pasa de fase si ya venció. `silencio` = al volver a abrir la app (no suena nada). */
function avanzarPomo(ahora = Date.now(), silencio = false){
  if(!pomo || pomo.pausa != null || pomo.fin > ahora) return;
  if(pomo.fase === 'foco'){
    const p = pomo, mirando = !silencio && relojMuestra('pomo'), min = Math.round(corridoMs(p, p.fin) / 60000);
    // Lo que corrió de verdad hasta el final (con los minutos sumados o restados, sin las pausas).
    if(ahora - p.fin < POMO_VIEJO_MS) registrarPomo(p, min);
    if(mirando && !(p.fin + p.descanso * 60000 > ahora)) relojListo('pomo', `Pomodoro guardado: ${min} min`, p.materia);
    const finDesc = p.fin + p.descanso * 60000;
    pomo = finDesc > ahora ? { fase: 'descanso', inicio: p.fin, fin: finDesc, total: p.descanso * 60000,
                               materia: p.materia, tema: p.tema, foco: p.foco, descanso: p.descanso } : null;
    if(!silencio){ sonarFin(); }
  }else{
    if(!silencio && relojMuestra('pomo')) relojListo('pomo', 'Terminó el descanso', 'Cuando quieras, otro bloque');
    pomo = null;
    if(!silencio){ sonarFin(); toast('Terminó el descanso: cuando quieras, otro bloque'); }
  }
  guardarPomo();
  if(!pomo){ pararPomoTic(); if(!(reloj && reloj.modo === 'listo')) cerrarRelojSi('pomo'); }
  render();
}
/* Cortar antes: se guardan los minutos que corrieron de verdad (sin las pausas) si llegan al mínimo. */
function terminarPomo(){
  if(!pomo) return;
  if(pomo.fase === 'foco'){
    const minutos = Math.floor(corridoMs(pomo) / 60000);
    if(minutos >= POMO_MIN) registrarPomo(pomo, minutos);
    else toast(`Menos de ${POMO_MIN} minutos: no se guardó`);
  }
  pomo = null; guardarPomo(); pararPomoTic(); cerrarRelojSi('pomo'); render();
}
function descartarPomo(){
  if(!pomo) return;
  pomo = null; guardarPomo(); pararPomoTic(); cerrarRelojSi('pomo'); render();
  toast('Pomodoro descartado');
}
function arrancarPomo(){ clearInterval(pomoIntervalo); pomoIntervalo = setInterval(ticPomo, 500); pintarPomo(); }
function pararPomoTic(){ clearInterval(pomoIntervalo); pomoIntervalo = 0; pintarPomo(); }
function ticPomo(){
  if(!pomo) return pararPomoTic();
  if(restanteMs(pomo) <= 0) avanzarPomo(); else pintarPomo();
}
/* Sin redibujar la pantalla: solo los números y las franjas. */
function pintarPomo(){
  const pill = $('#pomo-pill');
  const resta = restanteMs(pomo), p = pomo ? (resta / pomo.total).toFixed(3) : '1';
  if(pill){
    pill.hidden = !pomo || view === 'personal' || relojMuestra('pomo');

  pintarReloj();
}
function restaurarPomo(){
  let p = null;
  try{ p = JSON.parse(leerClave(CLAVE_POMO) || 'null'); }catch(e){}
  const ok = p && (p.fase === 'foco' || p.fase === 'descanso') && [p.fin, p.total, p.inicio].every(Number.isFinite) && p.total > 0
             && typeof p.materia === 'string' && p.materia && pomoFocoOk(p.foco) && pomoDescOk(p.descanso)
             && (p.pausa == null || (Number.isFinite(p.pausa) && p.pausa >= 0));
  pomo = ok ? p : null;
  if(!pomo){ guardarPomo(); return; }
  avanzarPomo(Date.now(), true);
  if(pomo) arrancarPomo();
}
