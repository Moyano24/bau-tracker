/* Una sola función de rango para todos los frentes (gym, estudio, freelance, hábitos).
   `simetrico` es un booleano: el nivel 9 no se gana acumulando, se gana con balance. */
function rankOf(value, thresholds, simetrico = false){
  let i = 0;
  for(let t = 0; t < thresholds.length; t++){
    if(value >= thresholds[t]) i = t;
  }
  if(simetrico && i === thresholds.length - 1) i = 8;
  const next = i >= 8 ? null : thresholds[i + 1];
  const base = thresholds[Math.min(i, thresholds.length - 1)];
  const progress = next === null ? 1 : (value - base) / (next - base);
  return { i, tier: TIERS[i], value, base, next, progress: clamp(progress, 0, 1) };
}

/* ---------------------------------------------------------------------------
   PUNTOS DE ESTÍMULO — el corazón del gym. [NIVEL: nuevo]

   No uso tonelaje (series × reps × kg) porque tiene dos sesgos que romperían la app:
   premia series livianas de muchas reps, y hace que la prensa aplaste a las
   elevaciones laterales (cuádriceps Diamante, hombros Hierro para siempre).

   La fórmula combina dos correcciones que sí están en la literatura:
     · volumen relativo → normalizar el peso contra TU propio máximo en ESE ejercicio
     · reps efectivas   → solo las últimas ~5 reps antes del fallo estimulan

       repsEfectivas = min(reps, 5 - rir)   acotado a [0, 5]
       intensidadRel = pesoEfectivo / mejorE1RM   acotado a [0.3, 1]
       puntos        = repsEfectivas × intensidadRel        (máximo teórico: 5)

   Detalle clave: el mejorE1RM se recorre EN ORDEN CRONOLÓGICO, manteniendo el mejor
   máximo conocido hasta esa serie inclusive. Si usara el récord de hoy para puntuar
   series de hace un año, hacerte más fuerte te bajaría los puntos viejos.
--------------------------------------------------------------------------- */

function e1RM(peso, reps){
  // Epley. Capeo las reps en 12 porque la fórmula pierde precisión y se dispara
  // por encima de eso (una serie de 30 reps daría un 1RM fantasioso).
  return peso * (1 + Math.min(reps, 12) / 30);
}

/* ---- Lo que hiciste la última vez, y los récords ----
   Todo esto se DERIVA del historial cada vez que se necesita; nada se guarda.
   Un récord guardado se desincroniza apenas editás o borrás una sesión vieja. */
function fechaCorta(s){
  return parseISO(s).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }).replace('.', '');
}
const fmtKg = n => Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10).replace('.', ',');

/* "4×10 · 55 kg" si todas las series son iguales; si no, lista las reps y da el
   rango de carga ("10, 10, 9, 8 · 55–57,5 kg"). Sin carga: peso corporal. */
function resumenSeries(sets){
  const s = (sets || []).map(x => ({ reps: Number(x.reps) || 0, kg: Number(x.kg) || 0 }))
                        .filter(x => x.reps > 0);
  if(!s.length) return '';
  const kgs = s.map(x => x.kg), kmin = Math.min(...kgs), kmax = Math.max(...kgs);
  const carga = kmax === 0 ? 'peso corporal'
              : kmin === kmax ? `${fmtKg(kmax)} kg` : `${fmtKg(kmin)}–${fmtKg(kmax)} kg`;
  const reps = s.every(x => x.reps === s[0].reps) ? `${s.length}×${s[0].reps}` : s.map(x => x.reps).join(', ');
  return `${reps} · ${carga}`;
}

/* La vez anterior que hiciste ese ejercicio: la sesión más reciente (misma fecha
   o antes), sin contar la que estás editando. Empates de fecha: gana la que se
   cargó después. */
function ultimaVez(exId, hastaFecha, excluirId){
  let mejor = null;
  for(const s of state.gym.sessions){
    if(s.id === excluirId) continue;
    if(hastaFecha && s.date > hastaFecha) continue;
    const ex = s.exercises.find(e => e.exId === exId && e.sets.some(x => Number(x.reps) > 0));
    if(!ex) continue;
    if(!mejor || s.date >= mejor.date) mejor = { date: s.date, ex };
  }
  return mejor && {
    date: mejor.date,
    rir: Number.isFinite(mejor.ex.rir) ? mejor.ex.rir : 1,
    sets: mejor.ex.sets.filter(x => Number(x.reps) > 0)
                       .map(x => ({ reps: Number(x.reps), kg: Number(x.kg) || 0 })),
  };
}

/* El rango y el salto de un ejercicio (el elegido o el de siempre). */
function progresionDe(exId){
  const p = (state.gym.progresion || {})[exId];
  return p ? { min: p.min, max: p.max, inc: p.inc } : Object.assign({}, PROG_DEF);
}
/* Qué toca hoy, a partir de la vez anterior (`uv`, la de ultimaVez). Función pura.
     · todas las series llegaron al tope y sobraron reps (RIR ≥ 1) → +inc kg, todas al piso
     · si no → mismo peso, +1 rep en cada serie que no llegó (sin pasar el tope)
     · sin carga externa (peso corporal) → solo reps; en el tope, avisa
   Devuelve { kg, reps:[…], motivo } o null si no hay vez anterior. */
function sugerirProgresion(exId, uv){
  if(!uv || !uv.sets || !uv.sets.length) return null;
  const pr = progresionDe(exId);
  const peso = Math.max(...uv.sets.map(s => s.kg || 0));
  const rir = Number.isFinite(uv.rir) ? uv.rir : 1;
  const tope = uv.sets.every(s => s.reps >= pr.max);
  const mas1 = uv.sets.map(s => s.reps >= pr.max ? s.reps : Math.min(pr.max, s.reps + 1));
  if(peso <= 0) return { kg: 0, reps: tope ? uv.sets.map(s => s.reps) : mas1, motivo: tope ? 'tope-sin-carga' : 'reps' };
  if(tope && rir >= 1) return { kg: Math.round((peso + pr.inc) * 100) / 100, reps: uv.sets.map(() => pr.min), motivo: 'sube' };
  if(tope) return { kg: peso, reps: uv.sets.map(s => s.reps), motivo: 'consolidar' };
  return { kg: peso, reps: mas1, motivo: 'reps' };
}
/* El rango que se guarda: enteros de 1 a 50 (piso menor que tope) y un salto de 0,25 a 20 kg. */
function progresionValida(p){
  if(!p || typeof p !== 'object') return null;
  const min = Number(p.min), max = Number(p.max), inc = Number(p.inc);
  if(!Number.isInteger(min) || !Number.isInteger(max) || min < 1 || max > 50 || min >= max) return null;
  if(!Number.isFinite(inc) || inc < .25 || inc > 20) return null;
  return { min, max, inc: Math.round(inc * 100) / 100 };
}

/* Mismo criterio de carga que computeGym: peso + (peso corporal × factor). */
function mejorE1RM(exId, sets){
  const def = exDef(exId), bw = def && def.bw ? state.profile.bodyweightKg * def.bw : 0;
  let mejor = 0;
  for(const s of sets){
    const reps = Number(s.reps) || 0, carga = (Number(s.kg) || 0) + bw;
    if(reps > 0 && carga > 0) mejor = Math.max(mejor, e1RM(carga, reps));
  }
  return mejor;
}
/* ¿Esta sesión superó todo lo que hiciste antes en ese ejercicio? La primera vez
   NO cuenta: no hay con qué compararla. "Antes" = fecha anterior, o misma fecha
   y cargada antes (una sesión sin guardar cuenta como la última). */
function esRecord(sesion, ex){
  const todas = state.gym.sessions;
  const pos = todas.findIndex(s => s.id === sesion.id);
  const limite = pos < 0 ? todas.length : pos;
  let previo = 0;
  todas.forEach((s, k) => {
    if(s.id === sesion.id) return;
    if(!(s.date < sesion.date || (s.date === sesion.date && k < limite))) return;
    for(const e of s.exercises) if(e.exId === ex.exId) previo = Math.max(previo, mejorE1RM(e.exId, e.sets));
  });
  return previo > 0 && mejorE1RM(ex.exId, ex.sets) > previo + 1e-9;
}

function computeGym(){
  const sessions = state.gym.sessions.slice().sort((a,b) => a.date.localeCompare(b.date));
  const cutoff4w = daysAgoISO(28);
  const best = {};   // exId -> mejor e1RM conocido hasta el momento del recorrido

  const byDate = {};   // fecha -> puntos del día, para el gráfico de tendencia
  const m = {};
  MUSCLE_IDS.forEach(id => {
    m[id] = { pts:0, pts4w:0, sets:0, kg:0, last:null, byEx:{} };
  });

  for(const s of sessions){
    for(const ex of s.exercises){
      const def = exDef(ex.exId);
      if(!def) continue;
      const rir = Number.isFinite(ex.rir) ? ex.rir : 1;
      const bwLoad = def.bw ? state.profile.bodyweightKg * def.bw : 0;

      for(const set of ex.sets){
        const reps = Number(set.reps) || 0;
        const kg   = Number(set.kg)   || 0;
        if(reps <= 0) continue;

        const load = kg + bwLoad;
        if(load > 0){
          const e = e1RM(load, reps);
          if(!(best[ex.exId] >= e)) best[ex.exId] = e;   // así cubre el caso undefined
        }

        // Sin carga registrada y sin peso corporal no hay forma de medir intensidad:
        // se le da el piso (0.3) en vez de descartar la serie.
        const rel  = best[ex.exId] ? clamp(load / best[ex.exId], .3, 1) : .3;
        const eff  = clamp(Math.min(reps, 5 - rir), 0, 5);
        const pts  = eff * rel;

        for(const [mus, factor] of Object.entries(def.muscles)){
          const t = m[mus];
          if(!t) continue;
          t.pts += pts * factor;
          byDate[s.date] = (byDate[s.date] || 0) + pts * factor;
          if(s.date >= cutoff4w) t.pts4w += pts * factor;
          t.kg  += reps * kg * factor;
          if(factor >= 1) t.sets++;
          if(!t.last || s.date > t.last) t.last = s.date;   // cualquier aporte cuenta como estimulo
          t.byEx[def.name] = (t.byEx[def.name] || 0) + pts * factor;
        }
      }
    }
  }

  MUSCLE_IDS.forEach(id => { m[id].rank = rankOf(m[id].pts, THRESHOLDS.gym); });

  // Rango global = el del músculo MÁS ATRASADO. El eslabón débil manda:
  // es lo que hace que el mapa corporal sirva para decidir qué entrenar.
  // Empates: si dos grupos estan en el mismo nivel, frena el que MENOS puntos tiene.
  const weakest = MUSCLE_IDS.reduce((a, b) => m[b].pts < m[a].pts ? b : a);
  const weakestIdx = m[weakest].rank.i;

  const ptsList = MUSCLE_IDS.map(id => m[id].pts);
  const maxPts = Math.max(...ptsList);
  const balance = maxPts > 0 ? Math.min(...ptsList) / maxPts : 0;
  const simetrico = weakestIdx >= 7 && balance >= .7;

  const rank = rankOf(m[weakest].pts, THRESHOLDS.gym, simetrico);
  return { m, rank, weakest, balance, byDate, totalPts: ptsList.reduce((a,b) => a+b, 0) };
}

/* Cuántas series recibió cada músculo en la semana que empieza el lunes `desde`
   (AAAA-MM-DD). Una serie vale 1 para el músculo principal (aporte ≥ 1) y ½ para cada
   secundario: el press de banca son series de pecho y media serie de tríceps. */
const objetivoSeries = mus => SERIES_OBJ[mus] || SERIES_OBJ.def;
function seriesSemana(desde = iso(lunesDe(new Date()))){
  const hasta = iso(addDays(parseISO(desde), 6)), r = {};
  MUSCLE_IDS.forEach(id => { r[id] = 0; });
  for(const s of state.gym.sessions){
    if(s.date < desde || s.date > hasta) continue;
    for(const ex of s.exercises){
      const def = exDef(ex.exId);
      if(!def) continue;
      const n = ex.sets.filter(x => Number(x.reps) > 0).length;
      for(const [mus, f] of Object.entries(def.muscles)) if(mus in r) r[mus] += n * (f >= 1 ? 1 : .5);
    }
  }
  return r;
}

/* ---- Exámenes ----
   Cuánto llevás estudiado para un examen: los minutos de ESA materia (sin importar
   mayúsculas ni acentos) desde que lo cargaste hasta el día del examen. La meta de la
   semana reparte lo que falta en las semanas que quedan (al menos una). */
const normMateria = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
function diasHasta(fecha){ return -daysSince(fecha); }
function avanceExamen(ex){
  const m = normMateria(ex.materia), hoy = iso(), lunes = iso(lunesDe(new Date()));
  let min = 0, minSemana = 0;
  for(const e of state.estudio.entries){
    if(normMateria(e.subject) !== m || e.date < ex.desde || e.date > ex.fecha) continue;
    const n = Number(e.minutes) || 0;
    min += n;
    if(e.date >= lunes && e.date <= hoy) minSemana += n;
  }
  const hechas = min / 60, dias = diasHasta(ex.fecha);
  const semanas = Math.max(1, Math.ceil(Math.max(dias, 0) / 7));
  // La meta de esta semana: lo que falta al empezar la semana, repartido en las semanas que quedan.
  const faltaba = Math.max(0, ex.horas - (min - minSemana) / 60);
  return { hechas, dias, semanaHechas: minSemana / 60, metaSemana: ex.horas ? faltaba / semanas : 0 };
}
function cuandoExamen(dias){ return dias === 0 ? 'hoy' : dias === 1 ? 'mañana' : dias < 0 ? `hace ${-dias} días` : `en ${dias} días`; }
/* El examen más cercano que viene (de hoy en adelante), o null. */
function proximoExamen(){
  const hoy = iso();
  return (state.estudio.examenes || []).filter(x => x.fecha >= hoy).sort((a, b) => a.fecha.localeCompare(b.fecha))[0] || null;
}

function computeEstudio(){
  const bySubject = {};
  let totalMin = 0;
  for(const e of state.estudio.entries){
    const min = Number(e.minutes) || 0;
    bySubject[e.subject] = (bySubject[e.subject] || 0) + min;
    totalMin += min;
  }
  const hours = totalMin / 60;
  const vals = Object.values(bySubject);
  const top = vals.length ? Math.max(...vals) : 0;
  // Simétrico: no alcanza con acumular horas, ninguna materia puede quedar abandonada.
  const simetrico = vals.length >= 3 && top > 0 && Math.min(...vals) >= top * .4;
  return { bySubject, totalMin, hours, rank: rankOf(hours, THRESHOLDS.estudio, simetrico) };
}

function computeFreelance(){
  const items = state.freelance.items;
  const byStage = {};
  STAGES.forEach(s => byStage[s.id] = items.filter(i => i.stage === s.id));
  const done = byStage.completado.length;
  const ingresos = items
    .filter(i => i.stage === 'completado')
    .reduce((a,i) => a + (Number(i.amountARS) || 0), 0);
  const ingresos30 = items
    .filter(i => i.stage === 'completado' && i.updatedAt >= daysAgoISO(30))
    .reduce((a,i) => a + (Number(i.amountARS) || 0), 0);
  // Simétrico: pipeline vivo. De nada sirve haber cerrado 40 proyectos si hoy no
  // estás contactando a nadie.
  const simetrico = STAGES.every(s => byStage[s.id].length > 0);
  return { byStage, done, ingresos, ingresos30, rank: rankOf(done, THRESHOLDS.freelance, simetrico) };
}

/* ---- Seguimiento de clientes ----
   El último contacto es el que registraste, o si no la última vez que se tocó el cliente. */
function ultimoContactoDe(it){
  return [it.ultimoContacto, it.updatedAt, it.createdAt].find(fechaValida) || iso();
}
function diasSinContacto(it){ return Math.max(0, daysSince(ultimoContactoDe(it))); }
/* ¿Hay que volver a escribirle? Si agendaste un próximo seguimiento, manda esa fecha
   (no se avisa antes); si no, pasar el umbral de su etapa. */
function vencido(it){
  if(!(it.stage in ROTTING)) return false;
  if(fechaValida(it.proximo)) return it.proximo <= iso();
  return diasSinContacto(it) >= ROTTING[it.stage];
}
/* Un teléfono argentino a como lo pide wa.me: 549 + código de área + número, sin el 0 ni
   el 15. Devuelve '' si no alcanza para un número completo (10 dígitos sin el país). */
function waNumero(tel){
  let d = String(tel == null ? '' : tel).replace(/\D/g, '');
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('54')){ d = d.slice(2); if(d.startsWith('9')) d = d.slice(1); }
  if(d.startsWith('0')) d = d.slice(1);
  if(d.length === 12) for(const a of [2, 3, 4]) if(d.substr(a, 2) === '15'){ d = d.slice(0, a) + d.slice(a + 2); break; }
  return d.length === 10 ? '549' + d : '';
}
function plantillaDe(etapa){ return ((state.freelance.plantillas || {})[etapa]) || PLANTILLAS_DEF[etapa] || ''; }
function mensajeDe(it){
  return plantillaDe(it.stage).split('{cliente}').join(it.client || '').split('{proyecto}').join(it.project || 'tu web');
}
function enlaceWA(it){
  const n = waNumero(it.telefono), m = mensajeDe(it);
  return n && m ? `https://wa.me/${n}?text=${encodeURIComponent(m)}` : '';
}

/* PERSONAL = Estudio + Freelance. Los dos frentes guardan sus datos por separado
   (una sesión de estudio y un cliente son cosas distintas) y cada uno conserva su
   rango y sus umbrales. Lo único nuevo es el rango de la sección, y usa el mismo
   criterio que el gym: lo marca el eslabón más débil, no el promedio. Así la app
   te empuja a no abandonar ninguno de los dos. */
function computePersonal(){
  const e = computeEstudio(), f = computeFreelance();
  const sub = [
    {k:'estudio',   label:'Estudio',   r:e.rank, unit:'h',         dec:1},
    {k:'freelance', label:'Freelance', r:f.rank, unit:'proyectos', dec:0},
  ];
  const flojo = sub.reduce((a,b) => b.r.i < a.r.i ? b : a);
  return { e, f, sub, flojo, rank: flojo.r };
}

/* ---- Modelo de hábitos ----
   Un hábito es de dos tipos: 'check' (lo hice o no) o 'cantidad' (tiene una meta
   y una unidad: 20 páginas, 8 vasos). El historial guarda UN valor por día:
   `true` (el formato de antes, que sigue valiendo) o un número. Todo lo demás
   sale de estas tres preguntas, y nada fuera de ellas lee el historial directo:
     valorDia  qué se registró ese día   (true -> 1, nada -> 0)
     hecho     ¿cumplió ese día?          check: hay algo · cantidad: llegó a la meta
     activo    ¿hizo algo ese día?        cualquier valor > 0 (aunque no llegue a la meta)
   `hecho` es lo que cuenta para rachas y rangos; `activo`, para el mapa de
   actividad de Inicio. Un día con 3 de 8 vasos es actividad, pero no es un check. */
function habitoDe(id){ return state.habitos.list.find(x => x.id === id) || null; }
function esCantidad(hb){ return !!hb && hb.tipo === 'cantidad' && Number(hb.meta) > 0; }
function valorDia(id, dia){
  const v = (state.habitos.log[id] || {})[dia];
  if(v === true) return 1;
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? n : 0;
}
function hecho(id, dia){
  const hb = habitoDe(id), v = valorDia(id, dia);
  return esCantidad(hb) ? v >= Number(hb.meta) : v > 0;
}
function activo(id, dia){ return valorDia(id, dia) > 0; }
/* Un día SALTEADO guarda 'skip' (valorDia lo lee como 0: no es hecho ni actividad). No es
   un día que toque: no corta la racha ni cuenta para los porcentajes ni los fallados. */
const SALTEO = 'skip';
function salteado(id, dia){ return (state.habitos.log[id] || {})[dia] === SALTEO; }
/* De cuánto en cuánto sube el "+" de un hábito de cantidad, según su meta. */
function pasoDe(hb){
  const m = Number(hb && hb.meta) || 1;
  return m >= 100 ? 10 : m >= 20 ? 5 : m >= 5 ? 1 : 0.5;
}

/* ---- Frecuencia: qué días toca un hábito ----
   Un hábito toca TODOS los días (lo de siempre) o solo algunos días de la semana
   (`dias`: 0 = lunes … 6 = domingo, como en el resto de la app), y empieza en una
   fecha (`inicio`, o `createdAt` si no hay). Nada de esto se guarda calculado: se
   deriva del hábito cada vez. Un hábito viejo no trae ninguno de los dos campos y
   se comporta EXACTAMENTE como antes.
   Un día cumplido en un día que no toca (un extra) cuenta como cumplido: no se
   pierde, pero tampoco suma al porcentaje. */
const diaSemana = dia => (parseISO(dia).getDay() + 6) % 7;     // 0 = lunes … 6 = domingo
/* Desde cuándo cuenta el hábito: su inicio, o su alta; y si no tiene ninguno, su primer
   registro. Los días ANTERIORES se pueden registrar igual ("ya lo hacía antes de crear
   el hábito"): cuentan como cumplidos y suman a la racha si vienen pegados al inicio,
   pero no son días que tocaban, así que nunca bajan el porcentaje ni suman fallados. */
function inicioDe(hb){
  const base = hb.inicio || hb.createdAt || null;
  if(base) return base;
  const log = state.habitos.log[hb.id] || {};
  let primero = null;
  for(const d of Object.keys(log)) if(valorDia(hb.id, d) > 0 && (!primero || d < primero)) primero = d;
  return primero || iso();
}
/* El primer día con algo cumplido, o null: la racha mejor arranca ahí si es anterior al inicio. */
function primerRegistro(hb){
  const log = state.habitos.log[hb.id] || {};
  let primero = null;
  for(const d of Object.keys(log)) if(hecho(hb.id, d) && (!primero || d < primero)) primero = d;
  return primero;
}
/* `ini` llega ya calculado cuando se recorren muchos días: inicioDe revisa el
   historial entero y no tiene sentido repetirlo en cada vuelta de un bucle. */
function programadoEn(hb, dia, ini){
  return tocaDia(hb, dia, ini) && !salteado(hb.id, dia);
}
/* Si ese día le tocaba por su frecuencia, haya sido salteado o no. */
function tocaDia(hb, dia, ini){
  if(dia < ini) return false;
  return !hb.dias || hb.dias.includes(diaSemana(dia));
}
const programado = (hb, dia) => programadoEn(hb, dia, inicioDe(hb));
/* "Cada día" o "L · X · V". */
function frecuenciaTexto(hb){
  return hb.dias ? hb.dias.map(d => INICIAL_DIA[d]).join(' · ') : 'Cada día';
}
/* Cuántos hábitos tocaban ese día y cuántos se cumplieron. */
function avanceDia(dia){
  let hechos = 0, programados = 0;
  for(const hb of state.habitos.list){
    if(!programado(hb, dia)) continue;
    programados++;
    if(hecho(hb.id, dia)) hechos++;
  }
  return { hechos, programados };
}

/* La racha: se camina hacia atrás desde hoy.
     · un día cumplido suma (también un extra, en un día que no tocaba)
     · hoy sin hacer no corta todavía: el día no terminó
     · un día que no tocaba y no se hizo se SALTA: no corta
     · un día que tocaba y no se hizo CORTA
   Antes del inicio solo cuentan los días cumplidos pegados uno tras otro: el primero sin
   hacer termina la racha (no se sabe qué pasó antes de que el hábito existiera). */
function habitStreak(habitId){
  const hb = habitoDe(habitId), hoy = iso();
  if(!hb) return 0;
  const ini = inicioDe(hb);
  let n = 0, d = new Date();
  for(let i = 0; i < 4000; i++, d = addDays(d, -1)){
    const dia = iso(d);
    if(hecho(habitId, dia)){ n++; continue; }
    if(dia < ini) break;
    if(dia === hoy) continue;
    if(!programadoEn(hb, dia, ini)) continue;
    break;
  }
  return n;
}
/* La mejor racha: la misma regla, recorriendo el calendario desde el inicio hasta hoy. */
function habitBestStreak(habitId){
  const hb = habitoDe(habitId), hoy = iso();
  if(!hb) return 0;
  const ini = inicioDe(hb);
  const primero = primerRegistro(hb);
  let best = 0, run = 0;
  for(let d = parseISO(primero && primero < ini ? primero : ini); iso(d) <= hoy; d = addDays(d, 1)){
    const dia = iso(d);
    if(hecho(habitId, dia)){ run++; if(run > best) best = run; }
    else if(dia < ini) run = 0;
    else if(dia !== hoy && programadoEn(hb, dia, ini)) run = 0;
  }
  return best;
}
/* Cumplimiento de los últimos 30 días: cumplidos ÷ días que TOCABAN. Es null si en
   esa ventana no tocó ninguno (un hábito que empieza en el futuro): no hay con qué
   medirlo. Un extra no suma ni resta, para que nunca pase del 100%. */
function tasa30(habitId){
  const hb = habitoDe(habitId);
  if(!hb) return null;
  const ini = inicioDe(hb);
  let tocaron = 0, hechos = 0;
  for(let i = 0; i < 30; i++){
    const dia = daysAgoISO(i);
    if(!programadoEn(hb, dia, ini)) continue;
    tocaron++;
    if(hecho(habitId, dia)) hechos++;
  }
  return tocaron ? hechos / tocaron : null;
}
/* Lo mismo pero siempre un número, para mostrarlo. */
function habitRate30(habitId){ return tasa30(habitId) ?? 0; }

/* Todo lo que se muestra en la pantalla de detalle. Función pura y derivada:
   nada de esto se guarda. */
function statsHabito(id){
  const hb = habitoDe(id), log = state.habitos.log[id] || {};
  const dias = Object.keys(log).filter(d => valorDia(id, d) > 0).sort();
  const cumplidos = dias.filter(d => hecho(id, d));
  const hoy = iso();
  const desde = hb ? inicioDe(hb) : (dias[0] || hoy);
  const transcurridos = Math.max(0, daysSince(desde));          // días completos hasta ayer
  // Se recorre el calendario una vez: cuántos días tocaban, cuántos se cumplieron
  // de esos, y cuántos ya terminados (hasta ayer) se dejaron sin hacer.
  let programados = 0, cumplidosProg = 0, fallados = 0;
  if(hb) for(let d = parseISO(desde); iso(d) <= hoy; d = addDays(d, 1)){
    const dia = iso(d);
    if(!programadoEn(hb, dia, desde)) continue;
    programados++;
    if(hecho(id, dia)) cumplidosProg++;
    else if(dia < hoy) fallados++;          // hoy sin marcar todavía no es un día fallado
  }
  const valores = dias.map(d => valorDia(id, d));
  const total = valores.reduce((a, v) => a + v, 0);
  let mejorDia = null;
  dias.forEach((d, k) => { if(!mejorDia || valores[k] > mejorDia.valor) mejorDia = { valor: valores[k], fecha: d }; });
  return {
    racha: habitStreak(id), mejor: habitBestStreak(id),
    completados: cumplidos.length,
    desde, transcurridos, programados, fallados,
    tasa30: habitRate30(id),
    tasaTotal: programados ? cumplidosProg / programados : 0,
    salteados: Object.keys(log).filter(d => log[d] === SALTEO).length,
    total, promedio: dias.length ? total / dias.length : 0, mejorDia,
    ultimo: dias.length ? dias[dias.length - 1] : null,
  };
}

function computeHabitos(){
  const list = state.habitos.list;
  let total = 0;
  for(const hb of list){
    total += Object.keys(state.habitos.log[hb.id] || {}).filter(d => hecho(hb.id, d)).length;
  }
  // Simétrico: todos los hábitos por encima del 80% en los últimos 30 días. Solo se
  // le exige a los que tuvieron días que cumplir en esa ventana, y tiene que haber
  // al menos uno: un hábito que empieza en el futuro no frena a nadie.
  const tasas = list.map(hb => tasa30(hb.id)).filter(t => t !== null);
  const simetrico = tasas.length > 0 && tasas.every(t => t >= .8);
  return { total, list, rank: rankOf(total, THRESHOLDS.habitos, simetrico) };
}

/* ---- Categorías: lo que depende del estado ---- */
function categoriasTodas(){ return CATEGORIAS_BASE.concat(state.habitos.categorias || []); }
function idsCategoriasValidas(){ return new Set(categoriasTodas().map(c => c.id)); }
function categoriaDe(id){ return categoriasTodas().find(c => c.id === id) || null; }
/* Las categorías de un hábito, ya resueltas (un id que no existe se ignora). */
function catsDe(hb){ return (hb.cats || []).map(categoriaDe).filter(Boolean); }
/* Qué categorías están en uso y cuántos hábitos tiene cada una. Es DERIVADO:
   nada de esto se guarda, así nunca se desfasa. Orden: de fábrica y luego propias. */
function categoriasEnUso(){
  const cuenta = {};
  for(const hb of state.habitos.list) for(const id of hb.cats || []) cuenta[id] = (cuenta[id] || 0) + 1;
  return categoriasTodas().filter(c => cuenta[c.id]).map(c => Object.assign({}, c, { cuenta: cuenta[c.id] }));
}
/* ¿Se puede crear una con este nombre? (no vacío, y no igual a otra sin contar acentos ni mayúsculas) */
function nombreCategoriaLibre(nombre){
  const k = claveNombre(nombre);
  return !!k && !categoriasTodas().some(c => claveNombre(c.n) === k);
}
let habFiltro = null;         // id de la categoría con la que se filtra la lista, o null

function crearCategoria(nombre){
  const n = String(nombre == null ? '' : nombre).replace(/\s+/g, ' ').trim().slice(0, LARGO_CAT).trim();
  if(!n) return { error: 'Poné un nombre para la categoría.' };
  if(!nombreCategoriaLibre(n)) return { error: 'Ya hay una categoría con ese nombre.' };
  state.habitos.categorias = state.habitos.categorias || [];
  if(state.habitos.categorias.length >= MAX_CATS_PROPIAS)
    return { error: `Podés tener hasta ${MAX_CATS_PROPIAS} categorías propias.` };
  const categoria = { id: 'cx-' + uid(), n };
  state.habitos.categorias.push(categoria);
  save();
  return { ok: true, categoria };
}
/* Borrar una categoría propia la saca también de los hábitos que la usaban, y
   Deshacer repone las dos cosas: la categoría y las etiquetas, en su orden. */
function borrarCategoria(id){
  const c = (state.habitos.categorias || []).find(x => x.id === id);
  if(!c) return;
  borrarDeLista(state.habitos.categorias, id, `Categoría “${c.n}” borrada`, {
    quitar: () => {
      const afectados = [];
      for(const hb of state.habitos.list){
        if(!(hb.cats || []).includes(id)) continue;
        afectados.push([hb.id, hb.cats.slice()]);
        hb.cats = hb.cats.filter(x => x !== id);
        if(!hb.cats.length) delete hb.cats;
      }
      if(habFiltro === id) habFiltro = null;
      return afectados;
    },
    devolver: (_, afectados) => {
      for(const [hid, cats] of afectados){ const hb = habitoDe(hid); if(hb) hb.cats = cats; }
    },
  });
}

/* ---- Calendario ----
   Funciones puras. Siempre fecha LOCAL (nunca toISOString: en UTC−3 corre el día
   a partir de las 21 h) y semanas que arrancan en lunes, como en el resto de la app. */
const NOMBRE_MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const INICIAL_DIA = ['L','M','X','J','V','S','D'];
const NOMBRES_DIA = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
function lunesDe(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
/* Los 7 días (AAAA-MM-DD) de la semana que contiene a `fecha`, de lunes a domingo. */
function semanaDe(fecha){
  const l = lunesDe(typeof fecha === 'string' ? parseISO(fecha) : fecha);
  return Array.from({ length: 7 }, (_, i) => iso(addDays(l, i)));
}
/* Un mes como filas de 7: lunes primero, con null en los huecos de antes del día 1
   y de después del último. mes va de 0 (enero) a 11. */
function mesGrid(anio, mes){
  const ultimo = new Date(anio, mes + 1, 0).getDate();
  const celdas = Array((new Date(anio, mes, 1).getDay() + 6) % 7).fill(null);
  for(let d = 1; d <= ultimo; d++) celdas.push(iso(new Date(anio, mes, d)));
  while(celdas.length % 7) celdas.push(null);
  const filas = [];
  for(let i = 0; i < celdas.length; i += 7) filas.push(celdas.slice(i, i + 7));
  return filas;
}
/* 53 columnas de semanas, terminando en la semana actual (con sus días futuros). */
function rangoAnio(hoy = new Date()){
  const esta = lunesDe(hoy);
  return Array.from({ length: 53 }, (_, k) => semanaDe(addDays(esta, -7 * (52 - k))));
}
/* El mes que está `atras` meses antes de hoy. */
function mesAtras(atras, hoy = new Date()){
  const d = new Date(hoy.getFullYear(), hoy.getMonth() - atras, 1);
  return { anio: d.getFullYear(), mes: d.getMonth() };
}

/* Marca de rango. Reemplaza al rombo con degradado y halo: una retícula de 3x3
   con tantas celdas llenas como nivel. El número se lee en la FORMA, no solo en
   el color, así que sigue funcionando en blanco y negro y para quien no
   distingue bien los colores. */
function gemHTML(tier, big){
  const lado = big ? 30 : 18, celda = lado / 3, hueco = big ? 1.2 : .9;
  let celdas = '';
  for(let k = 0; k < 9; k++){
    celdas += `<rect x="${((k%3)*celda).toFixed(2)}" y="${(Math.floor(k/3)*celda).toFixed(2)}"
      width="${(celda-hueco).toFixed(2)}" height="${(celda-hueco).toFixed(2)}"
      fill="${k <= tier.i ? tier.c : 'var(--line)'}"/>`;
  }
  return `<svg class="marca" viewBox="0 0 ${lado} ${lado}" width="${lado}" height="${lado}"
    aria-hidden="true" focusable="false">${celdas}</svg>`;
}

function rankCardHTML(titulo, r, unidad, extra = ''){
  const falta = r.next === null
    ? 'Nivel máximo'
    : `faltan ${fmtNum(Math.max(0, r.next - r.value), unidad === 'h' ? 1 : 0)} ${unidad}`;
  return `
    <div class="card">
      <div class="row between">
        <span class="muted xs">${esc(titulo)}</span>
        ${gemHTML(r.tier)}
      </div>
      <div class="big mt3">${r.tier.n}</div>

        <span>${falta}</span>
      </div>
      ${extra}
    </div>`;
}

function heatClass(last){
  if(!last) return 'r0';
  const d = daysSince(last);
  if(d <= 1) return 'r4';
  if(d <= 3) return 'r3';
  if(d <= 6) return 'r2';
  return 'r1';
}
function heatLabel(last){
  if(!last) return 'nunca';
  const d = daysSince(last);
  if(d === 0) return 'hoy';
  if(d === 1) return 'ayer';
  return `hace ${d} días`;
}

function zoneHTML(mus, data, vista, weak){
  const art = BODY_ART[vista], d = art.paths[mus];
  if(!d) return '';
  const cls = [heatClass(data.last), selMuscle === mus ? 'sel' : '', weak ? 'weak' : ''].filter(Boolean).join(' ');
  const label = `${MUSCLES[mus].label}, ${data.rank.tier.n}, entrenado ${heatLabel(data.last)}`;
  const espejo = ` transform="translate(${art.eje * 2},0) scale(-1,1)"`;
  return `<g class="mz t${data.rank.i} ${cls}" data-muscle="${mus}"
    tabindex="0" role="button" aria-label="${esc(label)}"><path d="${d}"/><path d="${d}"${espejo}/></g>`;
}

/* Mete las dos láminas en el <defs> global, una sola vez por carga. */
let laminasListas = false;
function asegurarLaminas(){
  if(laminasListas) return;
  const defs = document.querySelector('svg defs');
  if(!defs) return;
  for(const vista of ['frente','espalda']){
    const a = BODY_ART[vista];
    const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    img.setAttribute('id', 'lamina-' + vista);
    img.setAttribute('x', 0); img.setAttribute('y', 0);
    img.setAttribute('width', a.w); img.setAttribute('height', a.h);
    img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', a.img);
    img.setAttribute('href', a.img);
    // La lámina es línea de un solo color sobre transparente. En vez de embeber
    // una segunda copia recoloreada para el tema claro, se usa su canal alfa
    // como máscara y el color sale de un token: un asset, los dos temas.
    const mask = document.createElementNS('http://www.w3.org/2000/svg', 'mask');
    mask.setAttribute('id', 'mask-' + vista);
    mask.setAttribute('maskUnits', 'userSpaceOnUse');
    mask.setAttribute('x', 0); mask.setAttribute('y', 0);
    mask.setAttribute('width', a.w); mask.setAttribute('height', a.h);
    mask.appendChild(img);
    const tinta = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    tinta.setAttribute('id', 'lamina-' + vista);
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', 0); rect.setAttribute('y', 0);
    rect.setAttribute('width', a.w); rect.setAttribute('height', a.h);
    rect.setAttribute('fill', 'var(--lamina)');
    rect.setAttribute('mask', 'url(#mask-' + vista + ')');
    tinta.appendChild(rect);
    defs.appendChild(mask);
    defs.appendChild(tinta);
  }
  laminasListas = true;
}

/* ---- Hábitos ---- */
/* Una pantalla, cuatro formas de mirar lo mismo (Hoy / Semana / Mes / Año) y un
   detalle por hábito. Los datos son los de siempre: lo único que cambia entre
   vistas es cuánto se muestra y qué se puede tocar. */

/* Cuántas semanas muestra el heatmap tocable del detalle ("Historial").
   Las columnas se reparten el ancho de la tarjeta: menos columnas, celdas más
   grandes. Con mouse alcanza con 14px, así que entra la historia completa.
   Con el dedo cada día es un botón y tiene que poder tocarse, así que acá
   resolvemos el canje al revés: fijamos el tamaño mínimo de la celda y de ahí
   sale cuánta historia entra. En un teléfono angosto son unas 12 semanas (tres
   meses); en una tablet vuelven a entrar las 21.
   `pointer: coarse` pregunta por el dedo, no por el tamaño de la pantalla: una
   notebook con pantalla táctil chica también necesita celdas grandes. */
const SEMANAS_MAX = 21, CEL_MIN = 20, CEL_GAP = 4, BORDES = 81;
function semanasHeat(){
  if(!matchMedia('(pointer: coarse)').matches) return SEMANAS_MAX;
  // BORDES: lo que se comen el margen de la página y el relleno de la tarjeta.
  // Es una constante medida, no estimada; si cambia el padding hay que rehacerla.
  const ancho = Math.max(innerWidth - BORDES, 160);
  const entran = Math.floor((ancho + CEL_GAP) / (CEL_MIN + CEL_GAP));
  return Math.max(10, Math.min(SEMANAS_MAX, entran));
}
function habitColor(id){
  const hb = habitoDe(id);
  return (hb && hb.color) || HABIT_COLORS[0];
}
/* Constancia de Inicio: cuántas semanas entran a lo ancho de la tarjeta con un cuadrado
   de unos 24 px. En el teléfono son 12; en la compu, hasta 26 (medio año). Se estima con
   el ancho de la ventana menos lo que se comen la barra lateral (desde 900 px), el margen
   de la página, el relleno de la tarjeta y la columna de las letras de los días. Si la
   cuenta erra un poco, como las columnas valen 1fr, solo cambia el tamaño del cuadrado. */
const CONST_MIN = 12, CONST_MAX = 26, CONST_CEL = 24, CONST_GAP = 4;
function semanasConstancia(){
  const ancho = innerWidth >= 900 ? Math.min(innerWidth - 216, 1100) - 48 : innerWidth - 32;
  const util = ancho - 34 - 18;                 // relleno + borde de la tarjeta; columna de las letras
  const entran = Math.floor((util + CONST_GAP) / (CONST_CEL + CONST_GAP));
  return Math.max(CONST_MIN, Math.min(CONST_MAX, entran));
}
let semanasDibujadas = semanasHeat(), constanciaDibujada = semanasConstancia();
addEventListener('resize', () => {
  const n = semanasHeat(), c = semanasConstancia();
  if(n !== semanasDibujadas || c !== constanciaDibujada){ semanasDibujadas = n; constanciaDibujada = c; render(); }
});

/* Estado de la pantalla. La vista elegida es una preferencia de ESTE aparato
   (clave aparte, como el tema); el resto vive solo mientras la app está abierta. */
const CLAVE_HABVISTA = 'bauTracker.habVista';
const VISTAS_HAB = [['hoy', 'Hoy'], ['semana', 'Semana'], ['mes', 'Mes'], ['anio', 'Año']];
let habVista = (() => { const v = leerClave(CLAVE_HABVISTA); return VISTAS_HAB.some(([k]) => k === v) ? v : 'hoy'; })();
let habOffset = 0;            // cuántas semanas / meses hacia atrás se está mirando
let habSel = null;            // id del hábito abierto en el detalle, o null
let habDetVista = 'mes';      // 'semana' | 'mes' | 'historial'

const ICONO_CHECK = '<svg class="ck" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICONO_LAPIZ = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/></svg>';
const fmtV = v => Number.isInteger(v) ? String(v) : fmtNum(v, 1);
function fechaLarga(s){
  return parseISO(s).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
}
/* El color llega a un style="…": solo pasa un hex válido, nunca texto crudo. */
function habEstilo(hb){
  const c = esColorHex(hb.color) ? hb.color : HABIT_COLORS[0];
  return `style="--tinta:${c};--sobre:${tintaSobre(c)}"`;
}
function etiquetaDia(hb, dia, ini){
  ini = ini || inicioDe(hb);
  const f = fechaLarga(dia), ok = hecho(hb.id, dia);
  // Lo que un lector de pantalla tiene que saber de un día que se ve atenuado.
  const nota = salteado(hb.id, dia) ? ', salteado' : dia < ini ? ', antes del inicio' : !programadoEn(hb, dia, ini) ? ', no toca' : '';
  if(esCantidad(hb)){
    return `${f}: ${fmtV(valorDia(hb.id, dia))} de ${fmtV(Number(hb.meta))}${hb.unidad ? ' ' + hb.unidad : ''}${ok ? ', cumplido' : ''}${nota}`;
  }
  return `${f}: ${ok ? 'cumplido' : 'sin marcar'}${nota}`;
}
/* Qué fracción de la meta se llegó ese día (0 a 1). */
const fracDia = (hb, dia) => Math.min(valorDia(hb.id, dia) / Number(hb.meta), 1);
/* Clases y atributos comunes de una casilla de día, sea del tamaño que sea. */
function claseDia(hb, dia, ini){
  ini = ini || inicioDe(hb);
  const hoy = iso(), ok = hecho(hb.id, dia);
  const parcial = esCantidad(hb) && !ok && valorDia(hb.id, dia) > 0;
  const sk = salteado(hb.id, dia), antes = dia < ini, noToca = !antes && !sk && !programadoEn(hb, dia, ini);
  return { hoy, fut: dia > hoy, antes, noToca, ok, parcial, sk,
           // El futuro no se marca. Lo anterior al inicio sí: se puede registrar lo que ya hacías.
           inerte: dia > hoy,
           // Las clases de atenuado, para pegar a la de cada casilla.
           marcas: `${dia > hoy ? ' fut' : ''}${noToca ? ' nt' : ''}${antes ? ' ant' : ''}${sk ? ' sk' : ''}`,
           act: esCantidad(hb) ? 'valor-dia' : 'toggle-day',
           attrs: `data-act="${esCantidad(hb) ? 'valor-dia' : 'toggle-day'}" data-habit="${esc(hb.id)}" data-day="${dia}"` };
}

/* ---- Dibujar un ícono ----
   iconoSVG da el <svg> completo de un ícono propio ('' si el id no existe: nunca
   se dibuja nada inventado). iconoHabitoHTML decide QUÉ ícono lleva un hábito:
   su ícono propio, si no su emoji, si no el de su primera categoría, si no un punto.
   El emoji entra escapado; el SVG solo sale de la biblioteca, nunca de texto ajeno. */
function iconoSVG(id, tam = 24){
  if(!iconoValido(id)) return '';
  return `<svg class="ico-h" viewBox="0 0 24 24" width="${tam}" height="${tam}" aria-hidden="true" focusable="false">${ICONOS[id].d}</svg>`;
}
function iconoHabitoHTML(hb, tam = 24){
  if(iconoValido(hb.icono)) return iconoSVG(hb.icono, tam);
  if(hb.emoji) return esc(hb.emoji);
  const c = catsDe(hb).find(x => x.icono && iconoValido(x.icono));
  return c ? iconoSVG(c.icono, tam) : '●';
}

/* Cabecera común: ícono, nombre (abre el detalle) y la racha. */
function habCabHTML(hb, derecha, abre = true, marca = '', salteo = false){
  const sub = `${salteo ? 'Salteado · ' : ''}${frecuenciaTexto(hb)} · racha ${habitStreak(hb.id)} · mejor ${habitBestStreak(hb.id)} · ${Math.round(habitRate30(hb.id) * 100)}% en 30 días`;
  const cuerpo = `<b>${esc(hb.name)}</b><span class="hab-sub">${abre ? sub : esc(hb.desc || '')}</span>`;
  return `<div class="hab-cab">${marca}
    <span class="hab-ico" aria-hidden="true">${iconoHabitoHTML(hb, 26)}</span>
    ${abre ? `<button class="hab-nom" data-act="abrir-habito" data-id="${esc(hb.id)}">${cuerpo}</button>`
           : `<div class="hab-nom">${cuerpo}</div>`}
    ${derecha || ''}</div>`;
}

/* ---- Hoy ---- */
/* El día que se está mirando en Hoy: null es "hoy" (así se actualiza solo pasada la
   medianoche; guardar la fecha de hoy se quedaría en la de ayer). */
let habDia = null;
const mayus1 = s => s.charAt(0).toUpperCase() + s.slice(1);

/* La llama de racha. Siempre habla de HOY, aunque se esté mirando otro día:
   encendida si hay racha y hoy está cumplido (o hoy no toca, así que no corre riesgo);
   apagada si no hay racha, o si la hay pero hoy todavía no se hizo. */
const LLAMA_CUERPO = 'M12 2.5c.8 3.4 5.6 6.2 5.6 11a5.6 5.6 0 0 1-11.2 0c0-2.1.9-3.8 2.1-5.2.2 1.7 1 2.7 2 3.2C10.3 8.3 10.6 5.2 12 2.5z';
const LLAMA_NUCLEO = 'M12 12.6c.7 1.7 2.6 2.8 2.6 4.8a2.6 2.6 0 0 1-5.2 0c0-1.4.8-2.4 1.4-3.2.3.9.8 1.3 1.2 1.5-.2-1.1-.2-2 0-3.1z';
function llamaEncendida(hb){
  const hoy = iso();
  return habitStreak(hb.id) >= 1 && (hecho(hb.id, hoy) || !programado(hb, hoy));
}
function llamaHTML(hb){
  const r = habitStreak(hb.id), on = llamaEncendida(hb);
  let d = 0; for(const ch of String(hb.id)) d = (d * 31 + ch.charCodeAt(0)) % 26;     // desfase propio: de 0 a 2,5 s
  const dias = `${r} ${r === 1 ? 'día' : 'días'}`;
  const aria = on ? `Racha de ${dias}` : r ? `Racha de ${dias}: marcá hoy para no perderla` : 'Sin racha';
  return `<span class="llama${on ? ' on' : ''}" data-on="${on ? 1 : 0}" role="img" aria-label="${aria}" style="--d:-${(d / 10).toFixed(1)}s">
    <span class="llama-ico"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g class="cuerpo"><path class="l-cuerpo" d="${LLAMA_CUERPO}"/>${on ? `<path class="l-nucleo" d="${LLAMA_NUCLEO}"/>` : ''}</g></svg>${
      on ? '<i class="chispa a"></i><i class="chispa b"></i>' : ''}</span><b>${r}</b></span>`;
}

/* La tarjeta de Hoy: el avance del día (0 a 1) es lo que llena el color. */
function filaHoyHTML(hb, dia = habDia || iso()){
  const id = esc(hb.id), de = dia === iso() ? 'de hoy' : 'del ' + fechaCorta(dia);
  const c = esColorHex(hb.color) ? hb.color : HABIT_COLORS[0];
  const cant = esCantidad(hb);
  const p = cant ? fracDia(hb, dia) : (hecho(hb.id, dia) ? 1 : 0), ps = p.toFixed(3);
  // En el modo selección (habMulti es un Set) la tarjeta es una casilla y su contenido queda inerte.
  const sel = habMulti ? habMulti.has(hb.id) : null;
  const marca = sel === null ? '' : `<span class="sel-marca" aria-hidden="true">${ICONO_CHECK}</span>`;
  const abre = `<div class="hab rellena${sel === null ? '' : ' en-sel'}" data-hid="${id}" data-dia="${dia}" data-p="${ps}"${sel === null ? ''
    : ` role="checkbox" aria-checked="${sel}" aria-label="${esc(hb.name)}" tabindex="0" data-act="sel-toggle" data-id="${id}"`}
    style="--tinta:${c};--sobre:${tintaSobre(c)};--base:${baseDe(c)};--p:${ps}"><i class="rell" aria-hidden="true"></i><div class="hab-in"${sel === null ? '' : ' inert'}>`;
  // Saltear: se ofrece mientras ese día no tenga nada registrado (o ya esté salteado, para volver atrás).
  const sk = salteado(hb.id, dia);
  const saltar = sk || !activo(hb.id, dia) ? `<button class="saltar" data-act="saltar-dia" data-habit="${id}" data-day="${dia}"
      aria-pressed="${sk}" aria-label="${sk ? 'Quitar el salteo' : 'Saltear'} ${esc(hb.name)} ${de}">–</button>` : '';
  if(!cant){
    const ok = hecho(hb.id, dia);
    const chk = `<button class="chk" data-act="toggle-day" data-habit="${id}" data-day="${dia}"
      aria-pressed="${ok}" aria-label="${ok ? 'Desmarcar' : 'Marcar'} ${esc(hb.name)} ${de}">${ICONO_CHECK}</button>`;
    return `${abre}${habCabHTML(hb, llamaHTML(hb) + saltar + chk, true, marca, sk)}</div></div>`;
  }
  const v = valorDia(hb.id, dia), meta = Number(hb.meta), paso = fmtV(pasoDe(hb));
  return `${abre}
    ${habCabHTML(hb, llamaHTML(hb), true, marca, sk)}
    <div class="hab-cant">
      <button class="chk sm" data-act="valor-paso" data-habit="${id}" data-day="${dia}" data-d="-1" aria-label="Restar ${paso}">−</button>
      <div class="hab-valor" aria-live="polite"><b>${fmtV(v)}</b> / ${fmtV(meta)}<small>${esc(hb.unidad || '')}</small></div>
      <button class="chk sm" data-act="valor-paso" data-habit="${id}" data-day="${dia}" data-d="1" aria-label="Sumar ${paso}">+</button>
      <button class="chk sm" data-act="valor-dia" data-habit="${id}" data-day="${dia}" aria-label="Escribir un valor">${ICONO_LAPIZ}</button>
      ${saltar}
    </div>
  </div></div>`;
}

let habNoTocan = false;       // si la lista de los que ese día no tocan está desplegada
/* En Hoy van los hábitos que TOCAN el día elegido, y los que no tocan pero tienen un
   registro (para poder desmarcarlo). Los demás quedan en una línea que los despliega. */
function vistaHoyHTML(list, dia = habDia || iso()){
  const esHoy = dia === iso();
  const toca = hb => programado(hb, dia) || activo(hb.id, dia) || salteado(hb.id, dia);
  const visibles = list.filter(toca), libres = list.filter(hb => !toca(hb));
  return (visibles.length || !libres.length ? visibles.map(hb => filaHoyHTML(hb, dia)).join('')
            : `<div style="grid-column:1 / -1">${emptyHTML(esHoy ? 'Hoy no toca ningún hábito.' : 'Ese día no tocaba ningún hábito.')}</div>`) +
    (libres.length ? `
      <button type="button" class="no-tocan" data-act="no-tocan" aria-expanded="${habNoTocan}">${libres.length} ${
        libres.length === 1 ? 'no toca' : 'no tocan'} ${esHoy ? 'hoy' : 'ese día'} · registrar igual <span aria-hidden="true">${habNoTocan ? '▴' : '▾'}</span></button>
      ${habNoTocan ? libres.map(hb => filaHoyHTML(hb, dia)).join('') : ''}` : '');
}

/* ---- La tira semanal ----
   Siete días de la semana que contiene al día elegido, cada uno con un anillo: la
   fracción de los hábitos que TOCABAN ese día que se cumplieron. Tocar uno cambia el
   día de la lista; los de más adelante de hoy no se pueden elegir. */
function tiraSemanalHTML(){
  const hoy = iso(), sel = habDia || hoy, dias = semanaDe(sel), esHoy = sel === hoy;
  const R = 16, C = 2 * Math.PI * R;
  const botones = dias.map((d, k) => {
    const a = avanceDia(d), f = a.programados ? a.hechos / a.programados : 0;
    const completo = a.programados > 0 && a.hechos === a.programados;
    return `<button type="button" class="tira-dia${d === hoy ? ' hoy' : ''}${completo ? ' completo' : ''}" data-act="dia-sel" data-day="${d}"
      aria-pressed="${d === sel}" ${d > hoy ? 'disabled' : ''}
      aria-label="${esc(fechaLarga(d))}: ${a.programados ? `${a.hechos} de ${a.programados}` : 'no tocaba ninguno'}">
      <span class="tira-l" aria-hidden="true">${INICIAL_DIA[k]}</span>
      <span class="tira-anillo" aria-hidden="true"><svg viewBox="0 0 38 38"><circle class="pista" cx="19" cy="19" r="${R}"/><circle class="avance" cx="19" cy="19" r="${R}" stroke-dasharray="${(C * f).toFixed(1)} ${C.toFixed(1)}"/></svg><b>${Number(d.slice(8))}</b></span></button>`;
  }).join('');
  return `<div class="tira">
    <div class="tira-dias" role="group" aria-label="Días de la semana">${botones}</div>
    <div class="tira-titulo">
      <button type="button" class="btn sm" data-act="dia-semana" data-d="-1" aria-label="Semana anterior">‹</button>
      <div class="tira-fecha"><b>${esHoy ? 'Hoy' : esc(mayus1(fechaLarga(sel)))}</b>${esHoy
        ? `<span class="xs muted">${esc(fechaLarga(sel))}</span>`
        : '<button type="button" class="btn sm" data-act="dia-hoy">Volver a hoy</button>'}</div>
      <button type="button" class="btn sm" data-act="dia-semana" data-d="1" aria-label="Semana siguiente" ${dias[6] >= hoy ? 'disabled' : ''}>›</button>
    </div></div>`;
}

/* ---- Selección múltiple ----
   habMulti es null (modo apagado) o un Set con los ids elegidos. Solo existe en Hoy, que
   es donde están las tarjetas. Entrar: el botón "Seleccionar" o mantener apretada una
   tarjeta (CLIC_LARGO_MS, se cancela si el dedo se mueve más de CLIC_LARGO_PX o se suelta). */
let habMulti = null;
let lp = null, suprimirClic = false;
const CLIC_LARGO_MS = 500, CLIC_LARGO_PX = 8;

/* Los hábitos que tienen tarjeta en Hoy ahora mismo: con el filtro y el día elegido
   aplicados, y los que no tocan solo si esa lista está desplegada. */
function habMostrados(){
  const dia = habDia || iso();
  const lista = habFiltro ? state.habitos.list.filter(x => (x.cats || []).includes(habFiltro)) : state.habitos.list;
  return lista.filter(hb => habNoTocan || programado(hb, dia) || activo(hb.id, dia) || salteado(hb.id, dia));
}
/* Lo que no se ve no puede quedar elegido: se descarta lo borrado, filtrado o replegado. */
function podarSeleccion(){
  if(!habMulti) return;
  if(habVista !== 'hoy' || !state.habitos.list.length){ habMulti = null; return; }
  const ok = new Set(habMostrados().map(x => x.id));
  habMulti = new Set([...habMulti].filter(id => ok.has(id)));
}
function entrarSeleccion(id){
  if(view !== 'habitos' || habVista !== 'hoy' || !state.habitos.list.length) return;
  habMulti = new Set(id ? [id] : []);
  render();
}
function salirSeleccion(){ if(habMulti){ habMulti = null; render(); } }

function seleccionCabHTML(){
  const n = habMulti.size, todos = habMostrados().length > 0 && habMostrados().every(x => habMulti.has(x.id));
  return `<div class="sel-cab">
      <b aria-live="polite">${n} ${n === 1 ? 'seleccionado' : 'seleccionados'}</b>
      <span class="row"><button type="button" class="btn sm" data-act="sel-todos">${todos ? 'Ninguno' : 'Todos'}</button>
        <button type="button" class="btn sm" data-act="sel-salir">Cancelar</button></span>
    </div>`;
}
function seleccionBarraHTML(){
  const off = habMulti.size ? '' : 'disabled';
  return `<div class="sel-barra" role="toolbar" aria-label="Acciones sobre los hábitos elegidos">
      <button type="button" class="btn" data-act="sel-completar" ${off}>Completar</button>
      <button type="button" class="btn" data-act="sel-saltear" ${off}>Saltear</button>
      <button type="button" class="btn" data-act="sel-cats" ${off}>Categorías</button>
      <button type="button" class="btn danger" data-act="sel-borrar" ${off}>Borrar</button>
    </div>`;
}

/* Completar: marca cumplido el día elegido en los elegidos que TOCAN ese día (el de
   cantidad se pone en su meta). Los que ya estaban cumplidos o no tocan no se tocan. */
function completarSeleccion(){
  if(!habMulti || !habMulti.size) return;
  const dia = habDia || iso(), raiz = state, de = dia === iso() ? 'de hoy' : 'del ' + fechaCorta(dia);
  const previo = [];
  let hechos = 0, noTocan = 0;
  for(const id of habMulti){
    const hb = habitoDe(id);
    if(!hb) continue;
    if(!tocaDia(hb, dia, inicioDe(hb))){ noTocan++; continue; }
    if(hecho(id, dia)) continue;
    const creado = !state.habitos.log[id];
    const log = state.habitos.log[id] = state.habitos.log[id] || {};
    previo.push({ id, creado, valor: log[dia] });
    log[dia] = esCantidad(hb) ? Number(hb.meta) : true;
    hechos++;
  }
  if(!hechos){
    toast(noTocan ? 'Ninguno de los elegidos toca ese día.' : 'Los elegidos ya estaban cumplidos.');
    return;
  }
  habMulti = null;
  save(); render();
  toast(`${hechos} ${hechos === 1 ? 'hábito completado' : 'hábitos completados'} ${de}${noTocan ? ` · ${noTocan} no ${noTocan === 1 ? 'toca' : 'tocan'}` : ''}`, { accion: { texto: 'Deshacer', fn: () => {
    if(state !== raiz) return;
    for(const p of previo){
      const log = state.habitos.log[p.id];
      if(!log) continue;
      if(p.valor === undefined) delete log[dia]; else log[dia] = p.valor;
      if(p.creado && !Object.keys(log).length) delete state.habitos.log[p.id];
    }
    save(); render();
  } } });
}

/* Saltear: el día elegido, en los elegidos que tocaban ese día y no tienen nada registrado. */
function saltearSeleccion(){
  if(!habMulti || !habMulti.size) return;
  const dia = habDia || iso(), raiz = state, de = dia === iso() ? 'de hoy' : 'del ' + fechaCorta(dia);
  const previo = [];
  for(const id of habMulti){
    const hb = habitoDe(id);
    if(!hb || !tocaDia(hb, dia, inicioDe(hb)) || activo(id, dia) || salteado(id, dia)) continue;
    const creado = !state.habitos.log[id];
    (state.habitos.log[id] = state.habitos.log[id] || {})[dia] = SALTEO;
    previo.push({ id, creado });
  }
  if(!previo.length){ toast('Ninguno de los elegidos se puede saltear ese día (ya tienen algo o no tocan).'); return; }
  habMulti = null;
  save(); render();
  toast(`${previo.length} ${previo.length === 1 ? 'hábito salteado' : 'hábitos salteados'} ${de}`, { accion: { texto: 'Deshacer', fn: () => {
    if(state !== raiz) return;
    for(const p of previo){
      const log = state.habitos.log[p.id];
      if(!log || log[dia] !== SALTEO) continue;
      delete log[dia];
      if(p.creado && !Object.keys(log).length) delete state.habitos.log[p.id];
    }
    save(); render();
  } } });
}

/* Borrar: todos juntos, con un solo Deshacer. */
function borrarSeleccion(){
  if(!habMulti || !habMulti.size) return;
  const raiz = state, lista = state.habitos.list;
  const quitados = lista.map((hb, i) => ({ hb, i })).filter(x => habMulti.has(x.hb.id));
  if(!quitados.length) return;
  const logs = {}, ordenLog = Object.keys(state.habitos.log);
  for(const x of quitados.slice().reverse()){
    lista.splice(x.i, 1);
    if(state.habitos.log[x.hb.id]){ logs[x.hb.id] = state.habitos.log[x.hb.id]; delete state.habitos.log[x.hb.id]; }
  }
  habMulti = null;
  save(); render();
  const n = quitados.length;
  toast(n === 1 ? `Hábito “${quitados[0].hb.name}” borrado` : `${n} hábitos borrados`, { accion: { texto: 'Deshacer', fn: () => {
    if(state !== raiz) return;
    for(const x of quitados) lista.splice(Math.min(x.i, lista.length), 0, x.hb);   // de menor a mayor índice: cada uno vuelve a su lugar
    // El historial vuelve en el mismo orden de claves que tenía: el estado queda idéntico, no solo equivalente.
    const actual = state.habitos.log, repuesto = {};
    for(const k of ordenLog) if(k in logs) repuesto[k] = logs[k]; else if(k in actual) repuesto[k] = actual[k];
    for(const k of Object.keys(actual)) if(!(k in repuesto)) repuesto[k] = actual[k];
    state.habitos.log = repuesto;
    save(); render();
  } } });
}

/* Categorías de varios a la vez. Cada etiqueta tiene tres estados: la tienen todos los
   elegidos, algunos, o ninguno. Tocarla la pone en todos (o la saca de todos si ya la
   tenían todos); se aplica al tocar "Aplicar". */
let catsMulti = null;
function chipMultiHTML(c){
  const e = catsMulti.actual[c.id];
  return `<button type="button" class="cat-chip" data-act="multi-cat" data-cat="${esc(c.id)}"
      aria-pressed="${e === 'todas' ? 'true' : e === 'algunas' ? 'mixed' : 'false'}">${c.icono ? iconoSVG(c.icono, 16) : ''}${esc(c.n)}</button>`;
}
function catsMultiHTML(){
  const grupo = (rotulo, lista) => `<div class="cat-grupo"><span class="xs muted">${rotulo}</span>
    <div class="cat-chips">${lista.map(chipMultiHTML).join('')}</div></div>`;
  const propias = state.habitos.categorias || [];
  return grupo('Tema', CATEGORIAS_BASE.filter(c => c.g === 'tema')) +
         grupo('Momento del día', CATEGORIAS_BASE.filter(c => c.g === 'momento')) +
         (propias.length ? grupo('Tus categorías', propias) : '') +
         '<p class="xs muted mt3">Una etiqueta con borde punteado la tienen solo algunos: tocarla se la pone a todos.</p>';
}
function abrirCatsMulti(){
  const hbs = [...(habMulti || [])].map(habitoDe).filter(Boolean);
  if(!hbs.length) return;
  const inicial = {};
  for(const c of categoriasTodas()){
    const n = hbs.filter(hb => (hb.cats || []).includes(c.id)).length;
    inicial[c.id] = n === 0 ? 'ninguna' : n === hbs.length ? 'todas' : 'algunas';
  }
  catsMulti = { ids: hbs.map(x => x.id), inicial, actual: Object.assign({}, inicial) };
  openModal(`Categorías · ${hbs.length} ${hbs.length === 1 ? 'hábito' : 'hábitos'}`, catsMultiHTML(), aplicarCatsMulti, 'Aplicar');
}
function aplicarCatsMulti(){
  const cm = catsMulti, raiz = state;
  if(!cm) return;
  const previo = cm.ids.map(id => { const hb = habitoDe(id); return { id, tenia: !!(hb && hb.cats), cats: hb && hb.cats ? hb.cats.slice() : [] }; });
  let saltados = 0; const cambiados = new Set();
  for(const cid of Object.keys(cm.actual)){
    if(cm.actual[cid] === cm.inicial[cid]) continue;
    for(const id of cm.ids){
      const hb = habitoDe(id);
      if(!hb) continue;
      const cats = hb.cats || [];
      if(cm.actual[cid] === 'todas' && !cats.includes(cid)){
        if(cats.length >= MAX_CATS_HABITO){ saltados++; continue; }
        hb.cats = cats.concat([cid]); cambiados.add(id);
      }else if(cm.actual[cid] === 'ninguna' && cats.includes(cid)){
        const resto = cats.filter(x => x !== cid);
        if(resto.length) hb.cats = resto; else delete hb.cats;
        cambiados.add(id);
      }
    }
  }
  catsMulti = null;
  if(!cambiados.size && !saltados) return true;          // nada que cambiar: se cierra sin avisar
  habMulti = null;
  save();
  const n = cambiados.size;
  toast(`${n ? `Categorías cambiadas en ${n} ${n === 1 ? 'hábito' : 'hábitos'}` : 'Sin cambios'}${saltados ? ` · ${saltados} ya tenían el máximo de ${MAX_CATS_HABITO}` : ''}`,
        { accion: { texto: 'Deshacer', fn: () => {
    if(state !== raiz) return;
    for(const p of previo){
      const hb = habitoDe(p.id);
      if(!hb) continue;
      if(p.tenia) hb.cats = p.cats; else delete hb.cats;
    }
    save(); render();
  } } });
  return true;
}

/* Mantener apretada una tarjeta entra en el modo selección con esa tarjeta elegida. */
function cancelarLP(){ if(lp){ clearTimeout(lp.timer); lp = null; } }
function dispararLP(){
  if(!lp) return;
  const id = lp.id; cancelarLP();
  if(habMulti || view !== 'habitos' || habVista !== 'hoy' || !habitoDe(id)) return;
  habMulti = new Set([id]);
  suprimirClic = true; setTimeout(() => { suprimirClic = false; }, 700);   // el toque que sigue al soltar no tiene que alternarla
  try{ if(navigator.vibrate) navigator.vibrate(15); }catch(_){}
  render();
}
document.addEventListener('pointerdown', e => {
  cancelarLP();
  if(e.button || habMulti || view !== 'habitos' || habVista !== 'hoy' || habSel) return;
  const c = e.target.closest && e.target.closest('.hab.rellena[data-hid]');
  if(!c) return;
  lp = { id: c.dataset.hid, x: e.clientX, y: e.clientY, pid: e.pointerId, timer: setTimeout(dispararLP, CLIC_LARGO_MS) };
});
document.addEventListener('pointermove', e => {
  if(lp && e.pointerId === lp.pid && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > CLIC_LARGO_PX) cancelarLP();
});
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, cancelarLP));
// En captura, antes que el resto: se traga el clic que llega justo después de entrar por mantener apretado.
document.addEventListener('click', e => {
  if(suprimirClic){ suprimirClic = false; e.stopImmediatePropagation(); e.preventDefault(); }
}, true);
// Mantener apretado en un teléfono también abre el menú del sistema: acá no corresponde.
document.addEventListener('contextmenu', e => {
  if((lp || suprimirClic) && e.target.closest && e.target.closest('.hab.rellena')) e.preventDefault();
});

/* ---- Año: 53 semanas, solo lectura ---- */
function anioPorHabitoHTML(hb){
  const hoy = iso(), cant = esCantidad(hb), ini = inicioDe(hb);
  let cumplidos = 0;
  const celdas = rangoAnio().flat().map(d => {
    const ok = hecho(hb.id, d), fut = d > hoy;
    if(ok && !fut) cumplidos++;
    const parcial = cant && !ok && valorDia(hb.id, d) > 0;
    const antes = d < ini, noToca = !antes && !programadoEn(hb, d, ini);
    const cls = [ok ? 'on' : '', parcial ? 'parcial' : '', fut ? 'fut' : '', noToca ? 'nt' : '', antes ? 'ant' : '',
                 d === hoy ? 'today' : ''].filter(Boolean).join(' ');
    return `<i class="hcell ${cls}" ${parcial ? `style="--f:${fracDia(hb, d).toFixed(3)}"` : ''}></i>`;
  }).join('');
  const resumen = `${cumplidos} ${cumplidos === 1 ? 'día cumplido' : 'días cumplidos'} en el último año`;
  return `<button class="hab-abrir" data-act="abrir-habito" data-id="${esc(hb.id)}"
      aria-label="Abrir ${esc(hb.name)}: ${resumen}">
    <span class="heat tablero anio" aria-hidden="true">${celdas}</span>
    <span class="hab-pie">${resumen}</span></button>`;
}
function vistaAnioHTML(list){
  return list.map(hb => `<div class="hab" ${habEstilo(hb)}>${habCabHTML(hb)}${anioPorHabitoHTML(hb)}</div>`).join('');
}

/* ---- El heatmap tocable (Historial del detalle) ---- */
function heatmapHTML(habitId){
  const hb = habitoDe(habitId);
  if(!hb) return '';
  const hoy = new Date(), cant = esCantidad(hb);
  // Contamos desde el final de la semana actual hacia atrás: así salen siempre
  // exactamente N columnas completas, sin una suelta a medio llenar en el borde.
  const fin = addDays(hoy, 6 - ((hoy.getDay() + 6) % 7));
  const desde = addDays(fin, -(semanasHeat() * 7 - 1)), ini = inicioDe(hb);
  const celdas = [];
  for(let d = new Date(desde); d <= fin; d = addDays(d, 1)){
    const key = iso(d), c = claseDia(hb, key, ini);
    const cls = [c.ok ? 'on' : '', c.parcial ? 'parcial' : '', c.fut ? 'fut' : '', c.noToca ? 'nt' : '', c.antes ? 'ant' : '',
                 key === iso(hoy) ? 'today' : ''].filter(Boolean).join(' ');
    celdas.push(`<button class="hcell ${cls}" ${c.parcial ? `style="--f:${fracDia(hb, key).toFixed(3)}"` : ''}
      ${c.attrs} ${c.inerte ? 'disabled' : ''} aria-label="${esc(etiquetaDia(hb, key, ini))}" title="${key}"></button>`);
  }
  return `<div class="heat tablero" ${habEstilo(hb)}>${celdas.join('')}</div>`;
}

/* ---- Navegación entre semanas y meses ---- */
function navegacionHTML(vista){
  if(vista !== 'semana' && vista !== 'mes') return '';
  let etiqueta;
  if(vista === 'semana'){
    const s = semanaDe(addDays(new Date(), -7 * habOffset));
    etiqueta = habOffset === 0 ? 'Esta semana' : `${fechaCorta(s[0])} – ${fechaCorta(s[6])}`;
  }else{
    const m = mesAtras(habOffset);
    etiqueta = `${NOMBRE_MES[m.mes][0].toUpperCase()}${NOMBRE_MES[m.mes].slice(1)} ${m.anio}`;
  }
  return `<div class="nav-per">
    <button class="btn sm" data-act="nav-hab" data-d="1" aria-label="${vista === 'semana' ? 'Semana anterior' : 'Mes anterior'}">‹</button>
    <b>${etiqueta}</b>
    <button class="btn sm" data-act="nav-hab" data-d="-1" aria-label="${vista === 'semana' ? 'Semana siguiente' : 'Mes siguiente'}" ${habOffset === 0 ? 'disabled' : ''}>›</button>
  </div>`;
}

/* ---- Gráficos de un hábito de cantidad (dentro de un panel del color del hábito) ---- */
function barrasHabitoHTML(hb){
  const W = 310, x0 = 6, x1 = 304, yb = 92, yt = 10, meta = Number(hb.meta);
  const dias = Array.from({ length: 30 }, (_, k) => iso(addDays(new Date(), -(29 - k))));
  const vals = dias.map(d => valorDia(hb.id, d));
  const tope = Math.max(meta * 1.15, ...vals, 1);
  const paso = (x1 - x0) / 30, ancho = Math.max(2, paso - 2);
  const y = v => yb - (v / tope) * (yb - yt);
  const u = hb.unidad ? ' ' + hb.unidad : '';
  const barras = vals.map((v, k) => v <= 0 ? '' :
    `<rect x="${(x0 + paso * k + 1).toFixed(1)}" y="${y(v).toFixed(1)}" width="${ancho.toFixed(1)}"
      height="${(yb - y(v)).toFixed(1)}" rx="2" fill="currentColor" opacity="${v >= meta ? 1 : .55}"/>`).join('');
  const toques = dias.map((d, k) => {
    const txt = esc(`${fechaCorta(d)} · ${fmtV(vals[k])} de ${fmtV(meta)}${u}`);
    return `<rect class="hit" x="${(x0 + paso * k).toFixed(1)}" y="0" width="${paso.toFixed(1)}" height="${yb}"
      tabindex="0" role="button" aria-label="${txt}" data-tipfor="hab-tip-b" data-tiptext="${txt}"/>`;
  }).join('');
  return `<svg class="viz" viewBox="0 0 ${W} 100" role="img" aria-label="Últimos 30 días de ${esc(hb.name)}">
      <line x1="${x0}" y1="${y(meta).toFixed(1)}" x2="${x1}" y2="${y(meta).toFixed(1)}" stroke="currentColor"
        stroke-dasharray="4 3" opacity=".85"/>
      <line x1="${x0}" y1="${yb}" x2="${x1}" y2="${yb}" stroke="currentColor" opacity=".5"/>
      ${barras}${toques}</svg>
    <div class="tip" id="hab-tip-b">Tocá una barra para ver el día. La línea punteada es la meta.</div>`;
}
function tendenciaHabitoHTML(hb){
  const W = 12, x0 = 12, x1 = 298, yb = 92, yt = 12, meta = Number(hb.meta) * 7;
  const semanas = weekStarts(W).map(s => {
    let tot = 0;
    for(let k = 0; k < 7; k++) tot += valorDia(hb.id, iso(addDays(s, k)));
    return { desde: iso(s), tot };
  });
  const tope = Math.max(meta * 1.15, ...semanas.map(s => s.tot), 1);
  const paso = (x1 - x0) / (W - 1);
  const cx = k => x0 + paso * k, y = v => yb - (v / tope) * (yb - yt);
  const u = hb.unidad ? ' ' + hb.unidad : '';
  const puntos = semanas.map((s, k) => `${cx(k).toFixed(1)},${y(s.tot).toFixed(1)}`).join(' ');
  const area = `${cx(0).toFixed(1)},${yb} ${puntos} ${cx(W - 1).toFixed(1)},${yb}`;
  const toques = semanas.map((s, k) => {
    const txt = esc(`Semana del ${fechaCorta(s.desde)} · ${fmtV(Math.round(s.tot * 10) / 10)}${u} (meta ${fmtV(meta)})`);
    return `<rect class="hit" x="${(cx(k) - paso / 2).toFixed(1)}" y="0" width="${paso.toFixed(1)}" height="${yb}"
      tabindex="0" role="button" aria-label="${txt}" data-tipfor="hab-tip-t" data-tiptext="${txt}"/>`;
  }).join('');
  return `<svg class="viz" viewBox="0 0 310 100" role="img" aria-label="Tendencia de 12 semanas de ${esc(hb.name)}">
      <line x1="${x0}" y1="${y(meta).toFixed(1)}" x2="${x1}" y2="${y(meta).toFixed(1)}" stroke="currentColor"
        stroke-dasharray="4 3" opacity=".85"/>
      <line x1="${x0}" y1="${yb}" x2="${x1}" y2="${yb}" stroke="currentColor" opacity=".5"/>
      <polygon points="${area}" fill="currentColor" opacity=".22"/>
      <polyline points="${puntos}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${semanas.map((s, k) => `<circle cx="${cx(k).toFixed(1)}" cy="${y(s.tot).toFixed(1)}" r="2.8" fill="currentColor"/>`).join('')}
      ${toques}</svg>
    <div class="tip" id="hab-tip-t">Tocá un punto para ver la semana. La línea punteada es la meta semanal.</div>`;
}

/* ---- Detalle de un hábito ---- */

  const dias = n => n === 1 ? 'día' : 'días';
  const tiles = [
    ['Racha actual', s.racha, dias(s.racha)],
    ['Mejor racha', s.mejor, dias(s.mejor)],
    ['Cumplidos', s.completados, s.completados === 1 ? 'vez' : 'veces'],
    ['Desde que empezaste', s.transcurridos, dias(s.transcurridos)],
    ['Días fallados', s.fallados, dias(s.fallados)],
    ['Salteados', s.salteados, dias(s.salteados)],
    ['Últimos 30 días', Math.round(s.tasa30 * 100), '%'],
    ['Cumplimiento total', Math.round(s.tasaTotal * 100), '%'],
    ['Frecuencia', frecuenciaTexto(hb), '', true],
  ];
  if(cant){
    tiles.push(['Total acumulado', fmtV(Math.round(s.total * 10) / 10), u],
               ['Promedio por día', fmtV(Math.round(s.promedio * 10) / 10), u],
               ['Mejor día', s.mejorDia ? fmtV(s.mejorDia.valor) : '—', s.mejorDia ? fechaCorta(s.mejorDia.fecha) : ''],
               ['Meta diaria', fmtV(Number(hb.meta)), u]);
  }
  let cuerpo = '';
  if(habDetVista === 'semana'){
    cuerpo = semanaPorHabitoHTML(hb, semanaDe(addDays(new Date(), -7 * habOffset)));
  }else if(habDetVista === 'mes'){

    cuerpo = mesPorHabitoHTML(hb, m.anio, m.mes);
  }else{
    cuerpo = heatmapHTML(hb.id);
  }
  const seg = [['semana', 'Semana'], ['mes', 'Mes'], ['historial', 'Historial']];
  return `
    <div class="hab" ${habEstilo(hb)}>
      <div class="hab-cab">
        <button class="chk sm" data-act="cerrar-habito" aria-label="Volver a los hábitos">←</button>

        <div class="hab-nom"><b>${esc(hb.name)}</b><span class="hab-sub">${esc(hb.desc || (cant ? `Meta: ${fmtV(Number(hb.meta))} ${hb.unidad || ''} por día` : ''))}</span></div>
      </div>
      ${catsDe(hb).length ? `<div class="hab-tags" aria-label="Categorías">${catsDe(hb).map(c =>
        `<span class="hab-tag">${esc(c.n)}</span>`).join('')}</div>` : ''}
      <div class="seg" role="group" aria-label="Qué mostrar">${seg.map(([v, t]) =>

    <div class="stats">${tiles.map(([et, val, suf, texto]) =>
      `<div class="stat" ${habEstilo(hb)}><small>${et}</small><b${texto ? ' class="stat-texto"' : ''}>${val}</b>${suf ? `<span>${suf}</span>` : ''}</div>`).join('')}</div>
    <div class="row wrap mt4">
      <button class="btn" data-act="edit-habit" data-id="${esc(hb.id)}">Editar</button>
      <button class="btn danger" data-act="del-habit" data-id="${esc(hb.id)}">Borrar</button>
    </div>`;

      ${habMulti ? seleccionBarraHTML() : ''}`
    : `<div class="mt4">${emptyHTML('Agregá tu primer hábito.')}</div>`}`;

function viewHabitos(){
  const hb = habSel ? habitoDe(habSel) : null;

function viewAjustes(){

const SEC_LABEL = {gym:'Gym', estudio:'Estudio', freelance:'Freelance', habitos:'Hábitos'};

function faltaTxt(r, unit, dec){
  if(r.next === null) return 'nivel máximo';
  const n = Math.max(0, r.next - r.value);
  // singular cuando falta uno solo: antes decía "faltan 1 proyectos"
  const u = (n === 1 && unit.length > 1 && unit.endsWith('s')) ? unit.slice(0, -1) : unit;
  return `${n === 1 ? 'falta' : 'faltan'} ${fmtNum(n, dec)} ${u} para ${TIERS[r.i+1].n}`;
}

/* Panel de señalética: un bloque de color plano por sección.
   Reemplaza a los anillos concéntricos, que no pertenecen a este mundo visual
   sino a cualquier app de salud de los últimos diez años. Un bloque se lee de
   un vistazo y a distancia, que es la escena real: el celular en la mano entre
   series. El numeral es la cifra del nivel; la forma de la marca lo repite. */

  const bloques = secs.map(s => `

  return `<div>

const ABBR = {pecho:'Pec', espalda:'Esp', hombros:'Hom', biceps:'Bic', triceps:'Tri',
  antebrazos:'Ant', abdominales:'Abs', cuadriceps:'Cua', isquios:'Isq', gluteos:'Glu', pantorrillas:'Pan'};

/* Radar de simetría: la forma del polígono ES el desbalance. Un pico solo
   significa que ese grupo se lleva todo el trabajo. */
function radarHTML(g){
  const n = MUSCLE_IDS.length, R = 72, cx = 110, cy = 96;
  const max = Math.max(...MUSCLE_IDS.map(id => g.m[id].pts), 1);
  const ang = i => (i / n) * Math.PI * 2 - Math.PI / 2;
  const pt = (i, k) => [cx + Math.cos(ang(i)) * R * k, cy + Math.sin(ang(i)) * R * k];
  const f  = id => Math.max(.05, g.m[id].pts / max);

  const grid = [.25,.5,.75,1].map(k =>
    `<polygon points="${MUSCLE_IDS.map((_,i)=>pt(i,k).map(v=>v.toFixed(1)).join(',')).join(' ')}"
      fill="none" stroke="var(--line)" stroke-width=".7"/>`).join('');
  const spokes = MUSCLE_IDS.map((_,i) =>
    `<line x1="${cx}" y1="${cy}" x2="${pt(i,1)[0].toFixed(1)}" y2="${pt(i,1)[1].toFixed(1)}" stroke="var(--line)" stroke-width=".7"/>`).join('');
  const poly = MUSCLE_IDS.map((id,i)=>pt(i,f(id)).map(v=>v.toFixed(1)).join(',')).join(' ');
  const dots = MUSCLE_IDS.map((id,i) => {
    const [x,y] = pt(i, f(id));
    const d = g.m[id];
    return `<circle class="radar-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4"
      fill="${d.rank.tier.c}" data-act="open-muscle" data-mus="${id}"
      data-tipfor="radar-tip" data-tiptext="${esc(MUSCLES[id].label + ' · ' + d.rank.tier.n + ' · ' + fmtNum(d.pts) + ' pts · entrenado ' + heatLabel(d.last))}"
      role="button" tabindex="0" aria-label="${esc(MUSCLES[id].label)}"/>`;
  }).join('');
  const labels = MUSCLE_IDS.map((id,i) => {
    const [x,y] = pt(i, 1.2);
    const anchor = Math.abs(x - cx) < 8 ? 'middle' : (x > cx ? 'start' : 'end');
    return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anchor}" font-size="7.5" fill="var(--muted)">${ABBR[id]}</text>`;
  }).join('');

  return `<svg class="viz" viewBox="0 0 220 200" role="img" aria-label="Radar de simetría muscular">
    ${grid}${spokes}
    <polygon points="${poly}" fill="color-mix(in srgb, var(--accent) 18%, transparent)" stroke="var(--accent)" stroke-width="1.6"/>
    ${dots}${labels}
  </svg>`;
}

function weekStarts(n){
  const t = new Date();
  const mon = addDays(t, -((t.getDay() + 6) % 7));
  return Array.from({length:n}, (_,k) => addDays(mon, -(n - 1 - k) * 7));
}

/* Tendencia de 12 semanas: barras = horas de estudio, línea = puntos de gym.
   Dos escalas independientes; lo que importa es la forma, no comparar unidades. */
function trendHTML(g){
  const W = 12, w0 = 18, w1 = 300, h0 = 12, h1 = 108;
  const weeks = weekStarts(W).map(s => {
    const from = iso(s), to = iso(addDays(s, 6));
    const pts = Object.keys(g.byDate).filter(d => d >= from && d <= to)
                  .reduce((a,d) => a + g.byDate[d], 0);
    const min = state.estudio.entries.filter(e => e.date >= from && e.date <= to)
                  .reduce((a,e) => a + (Number(e.minutes)||0), 0);
    return {from, pts, min, label: fmtDate(from)};
  });
  const maxP = Math.max(...weeks.map(w => w.pts), 1);
  const maxM = Math.max(...weeks.map(w => w.min), 1);
  const step = (w1 - w0) / W;
  const cxOf = i => w0 + step * i + step / 2;
  const yP = v => h1 - (v / maxP) * (h1 - h0);

  const bars = weeks.map((w,i) => {
    const bh = (w.min / maxM) * (h1 - h0);
    return `<rect x="${(cxOf(i)-7).toFixed(1)}" y="${(h1-bh).toFixed(1)}" width="14" height="${Math.max(0,bh).toFixed(1)}"
      rx="0" fill="var(--surface-2)"/>`;
  }).join('');
  const line = weeks.map((w,i) => `${cxOf(i).toFixed(1)},${yP(w.pts).toFixed(1)}`).join(' ');
  const dots = weeks.map((w,i) =>
    `<circle cx="${cxOf(i).toFixed(1)}" cy="${yP(w.pts).toFixed(1)}" r="2.6" fill="var(--accent)"/>`).join('');
  const hits = weeks.map((w,i) => {
    const txt = esc('Semana del ' + w.label + ' · ' + fmtNum(w.pts) + ' pts de gym · '
                    + fmtNum(w.min/60,1) + ' h de estudio');
    return `<rect class="hit" x="${(cxOf(i)-step/2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${h1}" rx="4"
      tabindex="0" role="button" aria-label="${txt}"
      data-tipfor="trend-tip" data-tiptext="${txt}"/>`;
  }).join('');

  return `<svg class="viz" viewBox="0 0 310 124" role="img" aria-label="Tendencia de las últimas 12 semanas">
    <line x1="${w0}" y1="${h1}" x2="${w1}" y2="${h1}" stroke="var(--line)"/>
    ${bars}
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${hits}
  </svg>`;
}

/* Heatmap de constancia global: cuántos frentes tocó cada día (0 a 4). */
/* El color de un día según cuántos frentes tuvo (0 a 3). */
const colorConstancia = c => c === 0 ? 'var(--surface-2)' : `color-mix(in srgb, var(--good) ${Math.round(25 + c * 25)}%, var(--surface-2))`;
function leyendaConstanciaHTML(){
  return `<div class="const-leyenda xs muted" aria-hidden="true"><span>Menos</span>${[0, 1, 2, 3].map(c =>
    `<i style="background:${colorConstancia(c)}" title="${c} ${c === 1 ? 'frente' : 'frentes'}"></i>`).join('')}<span>Más</span></div>`;
}
/* La grilla de Constancia: una columna por semana (lunes a domingo, de arriba abajo),
   con las letras de los días a la izquierda y el mes arriba de su primera semana. */
/* Dónde va cada mes: sobre la semana que tiene su día 1 (la de su domingo). Si dos quedan
   a menos de tres semanas, se descarta la de antes (la del mes cortado del principio). */
function mesesConstancia(inicio, semanas){
  const meses = [];
  for(let w = 0; w < semanas; w++){
    const m = addDays(inicio, w * 7 + 6).getMonth();
    if(!meses.length || meses[meses.length - 1].m !== m) meses.push({ w, m });
  }
  return meses.filter((x, k) => !meses[k + 1] || meses[k + 1].w - x.w >= 3);
}
function globalHeatHTML(semanas = semanasConstancia(), t = new Date()){
  const hoy = iso(t);
  const fin = addDays(lunesDe(t), 6), inicio = addDays(fin, -(semanas * 7 - 1));
  // Las fechas de cada frente, una vez: buscar en las listas por cada día era lento.
  const gym = new Set(state.gym.sessions.map(s => s.date));
  const personal = new Set(state.estudio.entries.map(e => e.date).concat(state.freelance.items.map(i => i.updatedAt)));
  const partes = [];
  [['L', 0], ['X', 2], ['V', 4]].forEach(([l, d]) => partes.push(`<span class="const-dia" style="grid-column:1;grid-row:${d + 2}" aria-hidden="true">${l}</span>`));
  mesesConstancia(inicio, semanas).forEach(({ w, m }) =>
    partes.push(`<span class="const-mes" style="grid-column:${w + 2};grid-row:1" aria-hidden="true">${NOMBRE_MES[m].slice(0, 3)}</span>`));
  let activos = 0;
  for(let w = 0; w < semanas; w++){
    const lunes = addDays(inicio, w * 7);
    for(let d = 0; d < 7; d++){
      const key = iso(addDays(lunes, d)), fut = key > hoy;
      // Tres frentes, los mismos que las secciones: estudio y freelance cuentan como uno (Personal).
      let c = 0;
      if(gym.has(key)) c++;
      if(personal.has(key)) c++;
      if(state.habitos.list.some(hb => activo(hb.id, key))) c++;
      if(c && !fut) activos++;
      const txt = `${key} · ${fut ? 'a futuro' : c + ' de 3 frentes'}`;
      partes.push(`<div class="hcell act${fut ? ' fut' : ''}${key === hoy ? ' today' : ''}" data-c="${c}"
        style="grid-column:${w + 2};grid-row:${d + 2};background:${colorConstancia(c)}" title="${txt}" data-tipfor="act-tip"
        data-tiptext="${txt}"></div>`);
    }
  }
  return `<div class="heat constancia" style="--sem:${semanas}" role="img"
    aria-label="${activos} días con actividad en las últimas ${semanas} semanas">${partes.join('')}</div>`;
}
