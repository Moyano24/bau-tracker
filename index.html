/* Valida la FORMA de un backup. Devuelve una lista de problemas (vacía = está bien).
   Hace falta porque un JSON puede ser válido y aun así tener la forma equivocada:
   {"gym":{"sessions":"hola"}} parsea perfecto y después rompe todo. */
function validarEstado(d){
  const errs = [];
  const obj = v => v && typeof v === 'object' && !Array.isArray(v);
  const arr = v => Array.isArray(v);
  if(!obj(d)) return ['el archivo no es un objeto JSON'];

  const seccion = (clave, listas) => {
    if(!(clave in d)) return;                       // ausente está bien: se completa sola
    if(!obj(d[clave])) { errs.push(`"${clave}" tendría que ser un objeto`); return; }
    for(const l of listas){
      if(l in d[clave] && !arr(d[clave][l]))
        errs.push(`"${clave}.${l}" tendría que ser una lista`);
    }
  };
  seccion('gym', ['sessions','customExercises','rutinas']);
  seccion('estudio', ['entries', 'examenes']);
  seccion('freelance', ['items']);
  seccion('habitos', ['list', 'categorias']);
  seccion('profile', []);

  // las sesiones de gym son las que más adentro se recorren: hay que mirarlas
  if(obj(d.gym) && arr(d.gym.sessions)){
    d.gym.sessions.forEach((s, i) => {
      if(errs.length > 6) return;
      if(!obj(s)) { errs.push(`la sesión #${i+1} no es un objeto`); return; }
      if(!arr(s.exercises)) { errs.push(`la sesión #${i+1} no tiene lista de ejercicios`); return; }
      s.exercises.forEach((e, j) => {
        if(errs.length > 6) return;
        if(!obj(e) || !arr(e.sets))
          errs.push(`el ejercicio #${j+1} de la sesión #${i+1} no tiene lista de series`);
      });
    });
  }
  if(obj(d.habitos) && 'log' in d.habitos && !obj(d.habitos.log))
    errs.push('"habitos.log" tendría que ser un objeto');
  if(obj(d.habitos) && arr(d.habitos.list)){
    d.habitos.list.forEach((x, i) => {
      if(errs.length > 6) return;
      if(!obj(x)) errs.push(`el hábito #${i+1} no es un objeto`);
      else if(x.id == null || x.id === '') errs.push(`el hábito #${i+1} no tiene id`);
    });
  }
  if(obj(d.habitos) && arr(d.habitos.categorias)){
    d.habitos.categorias.forEach((c, i) => {
      if(errs.length > 6) return;
      if(!obj(c)) errs.push(`la categoría #${i+1} no es un objeto`);
    });
  }
  if(obj(d.habitos) && obj(d.habitos.log)){
    for(const [id, dias] of Object.entries(d.habitos.log)){
      if(errs.length > 6) break;
      if(dias != null && !obj(dias)) errs.push(`el historial del hábito "${id}" no es un objeto`);
    }
  }
  if(obj(d.estudio) && arr(d.estudio.entries) && d.estudio.entries.some(e => !obj(e)))
    errs.push('hay entradas de estudio que no son objetos');

  return errs.slice(0, 6);
}

/* Un hábito viejo no trae `tipo`: es de sí/no. Y todo lo que llega de afuera
   (un backup importado) se sanea acá: el color termina dentro de un
   style="…" y un texto con comillas ahí rompería el atributo. */
function normalizarHabito(x, validos){
  // `validos` es el conjunto de ids de categoría que existen. Si no llega (o llega
  // el índice, porque alguien usó .map(normalizarHabito)), se calcula del estado.
  if(!(validos instanceof Set)) validos = idsCategoriasValidas();
  const o = Object.assign({}, x);
  o.id = String(o.id);
  o.name = String(o.name == null ? '' : o.name).slice(0, 40);
  o.emoji = String(o.emoji == null ? '' : o.emoji).slice(0, 8);
  o.color = esColorHex(o.color) ? o.color : HABIT_COLORS[0];
  if(o.desc != null) o.desc = String(o.desc).slice(0, 80);
  const meta = Number(o.meta);
  if(o.tipo === 'tiempo' && Number.isFinite(meta) && meta >= 0.5){
    // Tiempo: minutos enteros, con una meta distinta por día de la semana si varía. Un día
    // con 0 no toca. Si los siete son iguales no hace falta la lista: alcanza con la meta.
    o.meta = Math.min(Math.max(Math.round(meta), 1), MAX_MIN_HABITO);
    o.unidad = 'min';
    const md = Array.isArray(o.metasDia) && o.metasDia.length === 7
      ? o.metasDia.map(n => (Number.isInteger(n) && n >= 0 && n <= MAX_MIN_HABITO ? n : null)) : null;
    if(md && md.every(n => n !== null) && md.some(n => n > 0) && new Set(md).size > 1){
      o.metasDia = md; o.meta = Math.max(...md);
    }else delete o.metasDia;
  }else if(o.tipo === 'cantidad' && Number.isFinite(meta) && meta > 0){
    o.meta = meta;
    o.unidad = String(o.unidad == null ? '' : o.unidad).slice(0, 20);
    delete o.metasDia;
  }else{
    o.tipo = 'check'; delete o.meta; delete o.unidad; delete o.metasDia;   // sin meta válida no tiene sentido
  }
  // Etiquetas: solo ids que existen, sin repetir, hasta MAX_CATS_HABITO.
  const cats = [...new Set((Array.isArray(o.cats) ? o.cats : []).filter(c => typeof c === 'string' && validos.has(c)))]
    .slice(0, MAX_CATS_HABITO);
  if(cats.length) o.cats = cats; else delete o.cats;
  // Ícono propio o emoji, nunca los dos: si hay un ícono válido gana, y un ícono
  // que no esté en la biblioteca se descarta (no se dibuja nada inventado).
  if(iconoValido(o.icono)) o.emoji = ''; else delete o.icono;
  // Frecuencia: días fijos (0 = lunes … 6 = domingo, sin repetir y ordenados) y fecha
  // de inicio. Los siete días, o ninguno, es "cada día": se quita la clave.
  const dias = [...new Set((Array.isArray(o.dias) ? o.dias : [])
    .filter(n => typeof n === 'number' && Number.isInteger(n) && n >= 0 && n <= 6))].sort((a, b) => a - b);
  if(dias.length > 0 && dias.length < 7) o.dias = dias; else delete o.dias;
  if(!fechaValida(o.inicio)) delete o.inicio;
  return o;
}

/* Un examen sin materia o sin una fecha real no sirve: se descarta. Lo demás se completa. */
function normalizarEstudio(e){
  if(!Array.isArray(e.examenes)){ delete e.examenes; return e; }
  e.examenes = e.examenes.filter(x => x && typeof x === 'object' && typeof x.materia === 'string' && x.materia.trim() && fechaValida(x.fecha))
    .map(x => {
      const horas = Number(x.horas);
      return { id: String(x.id || uid()), materia: x.materia.trim().slice(0, 40),
               tipo: x.tipo in TIPOS_EXAMEN ? x.tipo : 'parcial', fecha: x.fecha,
               horas: Number.isFinite(horas) && horas > 0 ? Math.min(Math.round(horas * 2) / 2, 500) : 0,
               desde: fechaValida(x.desde) && x.desde <= x.fecha ? x.desde : x.fecha };
    });
  return e;
}

/* Los datos de seguimiento que lleguen rotos se descartan: un teléfono que no es texto,
   una fecha que no es real, una plantilla de una etapa que no existe o demasiado larga. */
function normalizarFreelance(f){
  if(Array.isArray(f.items)) f.items = f.items.map(it => {
    if(!it || typeof it !== 'object') return it;
    const o = Object.assign({}, it);
    if(typeof o.telefono === 'string' && o.telefono.trim()) o.telefono = o.telefono.trim().slice(0, 30); else delete o.telefono;
    if(!fechaValida(o.ultimoContacto)) delete o.ultimoContacto;
    if(!fechaValida(o.proximo)) delete o.proximo;
    return o;
  });
  if(f.plantillas && typeof f.plantillas === 'object' && !Array.isArray(f.plantillas)){
    const p = {};
    for(const k of Object.keys(PLANTILLAS_DEF)){
      const v = f.plantillas[k];
      if(typeof v === 'string' && v.trim()) p[k] = v.trim().slice(0, LARGO_PLANTILLA);
    }
    if(Object.keys(p).length) f.plantillas = p; else delete f.plantillas;
  }else delete f.plantillas;
  return f;
}

/* Los rangos de progresión que lleguen rotos se descartan (vale el de siempre). */
function normalizarGym(g){
  if(g.progresion && typeof g.progresion === 'object' && !Array.isArray(g.progresion)){
    const limpio = {};
    for(const [exId, p] of Object.entries(g.progresion)){ const v = progresionValida(p); if(v) limpio[exId] = v; }
    if(Object.keys(limpio).length) g.progresion = limpio; else delete g.progresion;
  }else delete g.progresion;
  g.rutinas = (Array.isArray(g.rutinas) ? g.rutinas : []).map(rutinaValida).filter(Boolean);
  return g;
}

/* Texto de una sola línea, sin espacios de más y con largo máximo. */
const limpiarTexto = (s, n) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, n).trim();
function enteroEn(v, min, max){ const n = Number(v); return Number.isInteger(n) && n >= min && n <= max ? n : null; }

/* Una rutina guardada (o restaurada de un backup): lo roto se descarta, pieza por pieza.
   Un día sin ejercicios no sirve, y una rutina sin días tampoco. */
function rutinaValida(r){
  if(!r || typeof r !== 'object' || !esIdSeguro(r.id) || !Array.isArray(r.dias)) return null;
  const dias = [];
  for(const d of r.dias.slice(0, IMPORT_MAX.dias)){
    if(!d || typeof d !== 'object' || !esIdSeguro(d.id) || !Array.isArray(d.ejercicios)) continue;
    const ejercicios = [];
    for(const e of d.ejercicios.slice(0, IMPORT_MAX.ejercicios)){
      if(!e || typeof e !== 'object' || !esIdSeguro(e.exId)) continue;
      const series = enteroEn(e.series, 1, IMPORT_MAX.series), min = enteroEn(e.min, 1, IMPORT_MAX.reps),
            max = enteroEn(e.max, 1, IMPORT_MAX.reps), name = limpiarTexto(e.name, 40);
      if(series === null || min === null || max === null || min > max || !name) continue;
      const x = { exId: e.exId, name, series, min, max }, kg = Number(e.kg);
      if(Number.isFinite(kg) && kg > 0 && kg <= IMPORT_MAX.kg) x.kg = kg;
      ejercicios.push(x);
    }
    if(ejercicios.length) dias.push({ id: d.id, nombre: limpiarTexto(d.nombre, 40) || 'Día', ejercicios });
  }
  if(!dias.length) return null;
  return { id: r.id, nombre: limpiarTexto(r.nombre, 60) || 'Rutina',
           creada: typeof r.creada === 'string' ? r.creada.slice(0, 10) : '', dias };
}

/* Completa las claves que falten, sección por sección. Un Object.assign plano
   pisaría gym entero y se perderían los ejercicios propios. */
function normalizarEstado(d){
  const b = emptyState();
  const habitos = Object.assign(b.habitos, d.habitos || {});
  // Primero las categorías propias: los hábitos se normalizan contra ellas.
  habitos.categorias = normalizarCategorias(habitos.categorias);
  const validos = new Set(CATEGORIAS_BASE.map(c => c.id).concat(habitos.categorias.map(c => c.id)));
  habitos.list = (Array.isArray(habitos.list) ? habitos.list : []).map(x => normalizarHabito(x, validos));
  // El historial solo guarda true, un número mayor que 0 o un salteo: lo demás se descarta.
  if(habitos.log && typeof habitos.log === 'object' && !Array.isArray(habitos.log)){
    for(const id of Object.keys(habitos.log)){
      const dias = habitos.log[id];
      if(!dias || typeof dias !== 'object' || Array.isArray(dias)){ delete habitos.log[id]; continue; }
      for(const d of Object.keys(dias)){
        const v = dias[d];
        if(!(v === true || v === 'skip' ||   /* literal: esto corre antes de que exista SALTEO */
            (typeof v === 'number' && Number.isFinite(v) && v > 0))) delete dias[d];
      }
    }
  }else habitos.log = {};
  return {
    version:   1,
    profile:   Object.assign(b.profile,   d.profile   || {}),
    gym:       normalizarGym(Object.assign(b.gym, d.gym || {})),
    estudio:   normalizarEstudio(Object.assign(b.estudio, d.estudio || {})),
    freelance: normalizarFreelance(Object.assign(b.freelance, d.freelance || {})),
    habitos,
    meta:      Object.assign(b.meta,      d.meta      || {}),
  };
}

/* Si el guardado está roto NO se borra: se aparta con otra clave, así siempre
   se puede recuperar a mano desde la consola o desde la pantalla de rescate. */
const CLAVE_ROTO = STORAGE_KEY + '.roto';
let avisoRescate = null;
function apartarRoto(raw, motivo){
  try{ localStorage.setItem(CLAVE_ROTO, raw); }catch(e){}
  avisoRescate = motivo;
  console.warn('Guardado apartado en "' + CLAVE_ROTO + '":', motivo);
}

let state = load();

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }
  catch(err){ console.warn('localStorage bloqueado:', err); return emptyState(); }
  if(!raw) return emptyState();

  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(err){ apartarRoto(raw, 'el guardado no era JSON válido'); return emptyState(); }

  const errs = validarEstado(parsed);
  if(errs.length){ apartarRoto(raw, errs.join(' · ')); return emptyState(); }
  return normalizarEstado(parsed);
}

/* Guardar: en este aparato siempre; y si hay una cuenta, queda pendiente de subir. */
function save(){
  guardarLocal();
  marcarPendiente();
}
function guardarLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(err){
    // Pasa si el navegador bloquea el almacenamiento (modo privado, cuota llena).
    toast('⚠ No se pudo guardar. Exportá tus datos desde Ajustes.');
    console.error(err);
  }
}

// Todos los ejercicios disponibles = catálogo + los que agregaste vos.
function allExercises(){ return CATALOG.concat(state.gym.customExercises); }
function exDef(id){ return allExercises().find(e => e.id === id) || null; }

// Musculo de mayor aporte. Agrupa el selector de ejercicios: filtrar por "aporte === 1"
// dejaba afuera cualquier ejercicio sin un 100% exacto y duplicaba los que tenian dos.
function primaryMuscle(ex){
  return Object.entries(ex.muscles).sort((a, b) => b[1] - a[1])[0][0];
}
// "Pecho · Tríceps 40% · Hombros 30%"
const musculosTexto = muscles => Object.entries(muscles).map(([m, f]) =>
  `${MUSCLES[m].label}${f < 1 ? ` ${Math.round(f * 100)}%` : ''}`).join(' · ');

/* ---- Importar con IA ----
   La app da un prompt; la persona se lo manda a cualquier IA con la foto de su rutina (o de
   su cuaderno) y pega la respuesta. Acá se lee esa respuesta: todo es puro, salvo uid(). */
const IMPORT_EJ_RUTINA = `{"bau":"rutina","version":1,"nombre":"Rutina del profe","dias":[
  {"nombre":"Día A · Pecho y tríceps","ejercicios":[
    {"id":"press-banca","nombre":"Press banca","series":4,"reps":"8-10","kg":60},
    {"id":"nuevo","nombre":"Hack squat","series":3,"reps":"10-12","kg":null,
     "musculos":{"cuadriceps":1,"gluteos":0.5},"peso_corporal":null}]}]}`;
const IMPORT_EJ_REGISTRO = `{"bau":"registro","version":1,"entrenamientos":[
  {"fecha":"2026-10-03","ejercicios":[
    {"id":"sentadilla","nombre":"Sentadilla","rir":1,
     "series":[{"reps":8,"kg":80},{"reps":8,"kg":80},{"reps":7,"kg":80}]}]}]}`;

function promptImportar(anio = new Date().getFullYear()){
  return [
    'Te paso una foto de mi entrenamiento de gimnasio. Pasala al formato de mi app (Bau Tracker).',
    '',
    'Primero fijate qué es:',
    '- Si es un PLAN o rutina a seguir (días con ejercicios, series y repeticiones objetivo), usá el formato "rutina".',
    '- Si es un REGISTRO de lo que ya entrené (con los pesos y repeticiones que hice), usá el formato "registro".',
    '',
    'Formato "rutina":', '```json', IMPORT_EJ_RUTINA, '```',
    'Formato "registro" ("series" es la lista de cada serie que hice):', '```json', IMPORT_EJ_REGISTRO, '```',
    '',
    'Reglas:',
    '1. Respondé SOLO con el JSON dentro de un bloque de código, sin explicaciones.',
    '2. "id": usá el id exacto de la lista de abajo si el ejercicio es el mismo o casi el mismo (por ejemplo "press plano con barra" es press-banca).',
    '3. Si no hay ninguno equivalente, poné "id": "nuevo", el nombre como aparece, y en "musculos" los ids de músculo de abajo (1 = principal, 0.3 a 0.5 = secundario). "peso_corporal": la parte del cuerpo que se levanta (1 en dominadas, 0.65 en flexiones) o null si se usa solo peso externo.',
    '4. "reps": un número (10) o un rango como texto ("8-10"). "kg": un número, o null si no figura. No inventes pesos.',
    `5. "fecha": AAAA-MM-DD, o null si no aparece. Si falta el año, es ${anio}.`,
    '6. "rir": las repeticiones que sobraron (0 = al fallo, 1, 2 o 3). Si no figura, 1.',
    '7. Si un ejercicio va por tiempo, usá la equivalencia que dice su nombre en la lista (en la plancha 1 rep = 10 seg: 30 seg son 3 reps).',
    '8. Si algo no se lee bien, dejalo afuera antes que inventarlo.',
    '',
    'Músculos: ' + MUSCLE_IDS.join(', '),
    '',
    'Ejercicios de la app (id — nombre):',
    ...allExercises().map(e => `${e.id} — ${e.name}`),
  ].join('\n');
}

const IMPORT_SIN_FORMATO = 'No encontré el formato de Bau Tracker en lo que pegaste. Copiá la respuesta entera de la IA (el bloque que empieza con { y termina con }).';

/* Saca el JSON del texto pegado: desde la primera { hasta la última } (así lo que la IA diga
   antes o después, y las marcas de bloque de código, quedan afuera). Si no parsea, prueba sin
   comas sobrantes y después con comillas rectas. */
function extraerJSON(texto){
  const t = String(texto == null ? '' : texto);
  if(t.length > IMPORT_MAX.largo) return { error: 'El texto es demasiado largo. Pegá solo la respuesta de la IA.' };
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a < 0 || b < a) return { error: IMPORT_SIN_FORMATO };
  const j = t.slice(a, b + 1), sinComas = s => s.replace(/,\s*([}\]])/g, '$1');
  for(const intento of [j, sinComas(j), sinComas(j.replace(/[\u201C\u201D]/g, '"'))]){
    try{ return { datos: JSON.parse(intento) }; }catch(e){}
  }
  return { error: 'La respuesta parece cortada o mal armada. Pedile a la IA que la mande de nuevo, completa.' };
}

/* Un número aunque la IA lo mande como texto: "62,5 kg" → 62.5, "10 reps" → 10. */
function numeroDe(v){
  if(typeof v === 'number') return v;
  const m = typeof v === 'string' && v.match(/\d+(?:[.,]\d+)?/);
  return m ? Number(m[0].replace(',', '.')) : NaN;
}

/* "8-10", "8 a 10", "10" o 10 → {min, max}. */
function rangoReps(v){
  const m = String(v == null ? '' : v).match(/^\s*(\d{1,2})\s*(?:(?:-|–|a)\s*(\d{1,2}))?\s*$/);
  if(!m) return null;
  let min = +m[1], max = m[2] ? +m[2] : min;
  if(min > max) [min, max] = [max, min];
  return min >= 1 && max <= IMPORT_MAX.reps ? { min, max } : null;
}

/* Los músculos que manda la IA para un ejercicio nuevo: solo ids válidos, el mayor pasa a 1. */
function musculosValidos(m){
  if(!m || typeof m !== 'object' || Array.isArray(m)) return {};
  const pares = Object.entries(m).filter(([id, f]) => MUSCLES[id] && Number.isFinite(Number(f)) && Number(f) > 0);
  if(!pares.length) return {};
  const tope = Math.max(...pares.map(([, f]) => Number(f))), out = {};
  for(const [id, f] of pares.sort((a, b) => b[1] - a[1]).slice(0, 4)){
    const v = Math.round(Number(f) / tope * 100) / 100;
    if(v >= .1) out[id] = v;
  }
  return out;
}

/* A qué ejercicio de la app corresponde: por id, después por nombre (sin acentos ni
   mayúsculas) y si no, uno nuevo. Los nuevos se juntan en `nuevos`, uno por nombre. */
function resolverEjercicio(e, nuevos){
  const nombre = limpiarTexto(e.nombre, 40), lista = allExercises(), k = claveNombre(nombre);
  const def = (esIdSeguro(e.id) && lista.find(x => x.id === e.id)) || (k && lista.find(x => claveNombre(x.name) === k));
  if(def) return { exId: def.id, name: def.name };
  if(!k) return null;
  let n = nuevos.find(x => claveNombre(x.name) === k);
  if(!n){
    const bw = Number(e.peso_corporal);
    n = { id: 'cx-' + uid(), name: nombre, muscles: musculosValidos(e.musculos),
          bw: e.peso_corporal != null && bw > 0 && bw <= 1 ? bw : null };
    nuevos.push(n);
  }
  return { exId: n.id, name: n.name };
}

/* Una fecha que se puede guardar: real, de este siglo y no del futuro. */
function fechaImportable(s, hoy = iso()){
  return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && s >= '2000-01-01' && s <= hoy && iso(parseISO(s)) === s;
}

/* Lee la respuesta pegada. Devuelve {error} o {tipo:'rutina', rutina, nuevos, avisos}
   o {tipo:'registro', sesiones, nuevos, avisos}. Las sesiones sin fecha legible traen date:null. */
function leerImportacion(texto, hoy = iso()){
  const x = extraerJSON(texto);
  if(x.error) return { error: x.error };
  const d = x.datos;
  if(!d || typeof d !== 'object' || Array.isArray(d)) return { error: IMPORT_SIN_FORMATO };
  const tipo = d.bau === 'rutina' || d.bau === 'registro' ? d.bau
             : Array.isArray(d.dias) ? 'rutina' : Array.isArray(d.entrenamientos) ? 'registro' : null;
  if(!tipo) return { error: IMPORT_SIN_FORMATO };
  const avisos = [], nuevos = [], lista = v => Array.isArray(v) ? v : [];
  const obj = v => v && typeof v === 'object' && !Array.isArray(v);
  let omitidos = 0;
  const avisoOmitidos = () => {
    if(omitidos) avisos.push(omitidos === 1 ? 'Un ejercicio vino sin nombre y quedó afuera.' : `${omitidos} ejercicios vinieron sin nombre y quedaron afuera.`);
  };

  if(tipo === 'rutina'){
    const dias = [], fuente = lista(d.dias);
    if(fuente.length > IMPORT_MAX.dias) avisos.push(`Vinieron ${fuente.length} días: quedan los primeros ${IMPORT_MAX.dias}.`);
    for(const dia of fuente.slice(0, IMPORT_MAX.dias)){
      if(!obj(dia)) continue;
      const ejercicios = [], fe = lista(dia.ejercicios);
      if(fe.length > IMPORT_MAX.ejercicios) avisos.push(`Un día traía ${fe.length} ejercicios: quedan los primeros ${IMPORT_MAX.ejercicios}.`);
      for(const e of fe.slice(0, IMPORT_MAX.ejercicios)){
        if(!obj(e)) continue;
        const r = resolverEjercicio(e, nuevos);
        if(!r){ omitidos++; continue; }
        let series = enteroEn(e.series, 1, IMPORT_MAX.series), rango = rangoReps(e.reps);
        if(series === null){ series = 3; avisos.push(`${r.name}: no se leían las series, quedaron 3.`); }
        if(!rango){ rango = { min: PROG_DEF.min, max: PROG_DEF.max }; avisos.push(`${r.name}: no se leían las reps, quedó ${PROG_DEF.min}–${PROG_DEF.max}.`); }
        const ej = { exId: r.exId, name: r.name, series, min: rango.min, max: rango.max }, kg = numeroDe(e.kg);
        if(e.kg != null && Number.isFinite(kg) && kg > 0 && kg <= IMPORT_MAX.kg) ej.kg = kg;
        ejercicios.push(ej);
      }
      if(ejercicios.length)
        dias.push({ id: uid(), nombre: limpiarTexto(dia.nombre, 40) || `Día ${String.fromCharCode(65 + dias.length)}`, ejercicios });
    }
    avisoOmitidos();
    if(!dias.length) return { error: 'La respuesta tiene el formato, pero ningún ejercicio que se pueda cargar.' };
    return { tipo, rutina: { id: uid(), nombre: limpiarTexto(d.nombre, 60) || 'Rutina', creada: hoy, dias }, nuevos, avisos };
  }

  const sesiones = [], fuente = lista(d.entrenamientos);
  if(fuente.length > IMPORT_MAX.entrenamientos) avisos.push(`Vinieron ${fuente.length} entrenamientos: quedan los primeros ${IMPORT_MAX.entrenamientos}.`);
  for(const t of fuente.slice(0, IMPORT_MAX.entrenamientos)){
    if(!obj(t)) continue;
    const exercises = [];
    for(const e of lista(t.ejercicios).slice(0, IMPORT_MAX.ejercicios)){
      if(!obj(e)) continue;
      const r = resolverEjercicio(e, nuevos);
      if(!r){ omitidos++; continue; }
      const serie = s => {
        const reps = enteroEn(numeroDe(obj(s) ? s.reps : null), 1, IMPORT_MAX.reps), kg = numeroDe(obj(s) ? s.kg : 0);
        return reps === null ? null : { reps, kg: Number.isFinite(kg) && kg > 0 && kg <= IMPORT_MAX.kg ? kg : 0 };
      };
      let sets = lista(e.series).map(serie).filter(Boolean);
      // También "series": 3, "reps": 10, "kg": 60 (las tres series iguales).
      const n = enteroEn(e.series, 1, IMPORT_MAX.series), rango = rangoReps(e.reps);
      if(!sets.length && n !== null && rango) sets = Array.from({ length: n }, () => serie({ reps: rango.min, kg: e.kg }));
      sets = sets.slice(0, IMPORT_MAX.series);
      if(!sets.length) continue;
      const rir = enteroEn(e.rir, 0, 3);
      exercises.push({ exId: r.exId, name: r.name, rir: rir === null ? 1 : rir, sets });
    }
    if(!exercises.length) continue;
    const date = fechaImportable(t.fecha, hoy) ? t.fecha : null;
    if(t.fecha != null && !date) avisos.push(`La fecha "${limpiarTexto(t.fecha, 20)}" no es válida: elegila abajo.`);
    sesiones.push({ id: uid(), date, notes: limpiarTexto(t.notas, 200), exercises });
  }
  avisoOmitidos();
  if(!sesiones.length) return { error: 'La respuesta tiene el formato, pero ninguna serie con repeticiones que se pueda cargar.' };
  return { tipo, sesiones, nuevos, avisos };
}

/* ¿Ya hay un entrenamiento ese día con los mismos ejercicios? (posible importación repetida) */
function posibleDuplicado(ses, sesiones = state.gym.sessions){
  const clave = s => s.exercises.map(e => e.exId).sort().join('|');
  return sesiones.some(s => s.date === ses.date && clave(s) === clave(ses));
}

/* ==========================================================================
   9. RANGOS Y MÉTRICAS
   ========================================================================== */

/* Una sola función de rango para todos los frentes (gym, estudio, freelance, hábitos).
   `simetrico` es un booleano: el nivel 9 no se gana acumulando, se gana con balance. */
function rankOf(value, thresholds, simetrico = false){
  let i = 0;
  for(let t = 0; t < thresholds.length; t++){
    if(value >= thresholds[t]) i = t;
  }
  if(simetrico && i === thresholds.length - 1) i = 8;
  const next = i >= 8 ? null : thresholds[i + 1];
  const base = thresholds[Math.min(i, thresholds.length - 1)];
  const progress = next === null ? 1 : (value - base) / (next - base);
  return { i, tier: TIERS[i], value, base, next, progress: clamp(progress, 0, 1) };
}

/* ---------------------------------------------------------------------------
   PUNTOS DE ESTÍMULO — el corazón del gym. [NIVEL: nuevo]

   No uso tonelaje (series × reps × kg) porque tiene dos sesgos que romperían la app:
   premia series livianas de muchas reps, y hace que la prensa aplaste a las
   elevaciones laterales (cuádriceps Diamante, hombros Hierro para siempre).

   La fórmula combina dos correcciones que sí están en la literatura:
     · volumen relativo → normalizar el peso contra TU propio máximo en ESE ejercicio
     · reps efectivas   → solo las últimas ~5 reps antes del fallo estimulan

       repsEfectivas = min(reps, 5 - rir)   acotado a [0, 5]
       intensidadRel = pesoEfectivo / mejorE1RM   acotado a [0.3, 1]
       puntos        = repsEfectivas × intensidadRel        (máximo teórico: 5)

   Detalle clave: el mejorE1RM se recorre EN ORDEN CRONOLÓGICO, manteniendo el mejor
   máximo conocido hasta esa serie inclusive. Si usara el récord de hoy para puntuar
   series de hace un año, hacerte más fuerte te bajaría los puntos viejos.
--------------------------------------------------------------------------- */

function e1RM(peso, reps){
  // Epley. Capeo las reps en 12 porque la fórmula pierde precisión y se dispara
  // por encima de eso (una serie de 30 reps daría un 1RM fantasioso).
  return peso * (1 + Math.min(reps, 12) / 30);
}

/* ---- Lo que hiciste la última vez, y los récords ----
   Todo esto se DERIVA del historial cada vez que se necesita; nada se guarda.
   Un récord guardado se desincroniza apenas editás o borrás una sesión vieja. */
function fechaCorta(s){
  return parseISO(s).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }).replace('.', '');
}
const fmtKg = n => Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10).replace('.', ',');

/* "4×10 · 55 kg" si todas las series son iguales; si no, lista las reps y da el
   rango de carga ("10, 10, 9, 8 · 55–57,5 kg"). Sin carga: peso corporal. */
function resumenSeries(sets){
  const s = (sets || []).map(x => ({ reps: Number(x.reps) || 0, kg: Number(x.kg) || 0 }))
                        .filter(x => x.reps > 0);
  if(!s.length) return '';
  const kgs = s.map(x => x.kg), kmin = Math.min(...kgs), kmax = Math.max(...kgs);
  const carga = kmax === 0 ? 'peso corporal'
              : kmin === kmax ? `${fmtKg(kmax)} kg` : `${fmtKg(kmin)}–${fmtKg(kmax)} kg`;
  const reps = s.every(x => x.reps === s[0].reps) ? `${s.length}×${s[0].reps}` : s.map(x => x.reps).join(', ');
  return `${reps} · ${carga}`;
}

/* La vez anterior que hiciste ese ejercicio: la sesión más reciente (misma fecha
   o antes), sin contar la que estás editando. Empates de fecha: gana la que se
   cargó después. */
function ultimaVez(exId, hastaFecha, excluirId){
  let mejor = null;
  for(const s of state.gym.sessions){
    if(s.id === excluirId) continue;
    if(hastaFecha && s.date > hastaFecha) continue;
    const ex = s.exercises.find(e => e.exId === exId && e.sets.some(x => Number(x.reps) > 0));
    if(!ex) continue;
    if(!mejor || s.date >= mejor.date) mejor = { date: s.date, ex };
  }
  return mejor && {
    date: mejor.date,
    rir: Number.isFinite(mejor.ex.rir) ? mejor.ex.rir : 1,
    sets: mejor.ex.sets.filter(x => Number(x.reps) > 0)
                       .map(x => ({ reps: Number(x.reps), kg: Number(x.kg) || 0 })),
  };
}

/* El rango y el salto de un ejercicio (el elegido o el de siempre). */
function progresionDe(exId){
  const p = (state.gym.progresion || {})[exId];
  return p ? { min: p.min, max: p.max, inc: p.inc } : Object.assign({}, PROG_DEF);
}
/* Qué toca hoy, a partir de la vez anterior (`uv`, la de ultimaVez). Función pura.
     · todas las series llegaron al tope y sobraron reps (RIR ≥ 1) → +inc kg, todas al piso
     · si no → mismo peso, +1 rep en cada serie que no llegó (sin pasar el tope)
     · sin carga externa (peso corporal) → solo reps; en el tope, avisa
   Devuelve { kg, reps:[…], motivo } o null si no hay vez anterior. */
function sugerirProgresion(exId, uv){
  if(!uv || !uv.sets || !uv.sets.length) return null;
  const pr = progresionDe(exId);
  const peso = Math.max(...uv.sets.map(s => s.kg || 0));
  const rir = Number.isFinite(uv.rir) ? uv.rir : 1;
  const tope = uv.sets.every(s => s.reps >= pr.max);
  const mas1 = uv.sets.map(s => s.reps >= pr.max ? s.reps : Math.min(pr.max, s.reps + 1));
  if(peso <= 0) return { kg: 0, reps: tope ? uv.sets.map(s => s.reps) : mas1, motivo: tope ? 'tope-sin-carga' : 'reps' };
  if(tope && rir >= 1) return { kg: Math.round((peso + pr.inc) * 100) / 100, reps: uv.sets.map(() => pr.min), motivo: 'sube' };
  if(tope) return { kg: peso, reps: uv.sets.map(s => s.reps), motivo: 'consolidar' };
  return { kg: peso, reps: mas1, motivo: 'reps' };
}
/* El rango que se guarda: enteros de 1 a 50 (piso menor que tope) y un salto de 0,25 a 20 kg. */
function progresionValida(p){
  if(!p || typeof p !== 'object') return null;
  const min = Number(p.min), max = Number(p.max), inc = Number(p.inc);
  if(!Number.isInteger(min) || !Number.isInteger(max) || min < 1 || max > 50 || min >= max) return null;
  if(!Number.isFinite(inc) || inc < .25 || inc > 20) return null;
  return { min, max, inc: Math.round(inc * 100) / 100 };
}

/* Mismo criterio de carga que computeGym: peso + (peso corporal × factor). */
function mejorE1RM(exId, sets){
  const def = exDef(exId), bw = def && def.bw ? state.profile.bodyweightKg * def.bw : 0;
  let mejor = 0;
  for(const s of sets){
    const reps = Number(s.reps) || 0, carga = (Number(s.kg) || 0) + bw;
    if(reps > 0 && carga > 0) mejor = Math.max(mejor, e1RM(carga, reps));
  }
  return mejor;
}
/* ¿Esta sesión superó todo lo que hiciste antes en ese ejercicio? La primera vez
   NO cuenta: no hay con qué compararla. "Antes" = fecha anterior, o misma fecha
   y cargada antes (una sesión sin guardar cuenta como la última). */
function esRecord(sesion, ex){
  const todas = state.gym.sessions;
  const pos = todas.findIndex(s => s.id === sesion.id);
  const limite = pos < 0 ? todas.length : pos;
  let previo = 0;
  todas.forEach((s, k) => {
    if(s.id === sesion.id) return;
    if(!(s.date < sesion.date || (s.date === sesion.date && k < limite))) return;
    for(const e of s.exercises) if(e.exId === ex.exId) previo = Math.max(previo, mejorE1RM(e.exId, e.sets));
  });
  return previo > 0 && mejorE1RM(ex.exId, ex.sets) > previo + 1e-9;
}

function computeGym(){
  const sessions = state.gym.sessions.slice().sort((a,b) => a.date.localeCompare(b.date));
  const cutoff4w = daysAgoISO(28);
  const best = {};   // exId -> mejor e1RM conocido hasta el momento del recorrido

  const byDate = {};   // fecha -> puntos del día, para el gráfico de tendencia
  const m = {};
  MUSCLE_IDS.forEach(id => {
    m[id] = { pts:0, pts4w:0, sets:0, kg:0, last:null, byEx:{} };
  });

  for(const s of sessions){
    for(const ex of s.exercises){
      const def = exDef(ex.exId);
      if(!def) continue;
      const rir = Number.isFinite(ex.rir) ? ex.rir : 1;
      const bwLoad = def.bw ? state.profile.bodyweightKg * def.bw : 0;

      for(const set of ex.sets){
        const reps = Number(set.reps) || 0;
        const kg   = Number(set.kg)   || 0;
        if(reps <= 0) continue;

        const load = kg + bwLoad;
        if(load > 0){
          const e = e1RM(load, reps);
          if(!(best[ex.exId] >= e)) best[ex.exId] = e;   // así cubre el caso undefined
        }

        // Sin carga registrada y sin peso corporal no hay forma de medir intensidad:
        // se le da el piso (0.3) en vez de descartar la serie.
        const rel  = best[ex.exId] ? clamp(load / best[ex.exId], .3, 1) : .3;
        const eff  = clamp(Math.min(reps, 5 - rir), 0, 5);
        const pts  = eff * rel;

        for(const [mus, factor] of Object.entries(def.muscles)){
          const t = m[mus];
          if(!t) continue;
          t.pts += pts * factor;
          byDate[s.date] = (byDate[s.date] || 0) + pts * factor;
          if(s.date >= cutoff4w) t.pts4w += pts * factor;
          t.kg  += reps * kg * factor;
          if(factor >= 1) t.sets++;
          if(!t.last || s.date > t.last) t.last = s.date;   // cualquier aporte cuenta como estimulo
          t.byEx[def.name] = (t.byEx[def.name] || 0) + pts * factor;
        }
      }
    }
  }

  MUSCLE_IDS.forEach(id => { m[id].rank = rankOf(m[id].pts, THRESHOLDS.gym); });

  // Rango global = el del músculo MÁS ATRASADO. El eslabón débil manda:
  // es lo que hace que el mapa corporal sirva para decidir qué entrenar.
  // Empates: si dos grupos estan en el mismo nivel, frena el que MENOS puntos tiene.
  const weakest = MUSCLE_IDS.reduce((a, b) => m[b].pts < m[a].pts ? b : a);
  const weakestIdx = m[weakest].rank.i;

  const ptsList = MUSCLE_IDS.map(id => m[id].pts);
  const maxPts = Math.max(...ptsList);
  const balance = maxPts > 0 ? Math.min(...ptsList) / maxPts : 0;
  const simetrico = weakestIdx >= 7 && balance >= .7;

  const rank = rankOf(m[weakest].pts, THRESHOLDS.gym, simetrico);
  return { m, rank, weakest, balance, byDate, totalPts: ptsList.reduce((a,b) => a+b, 0) };
}

/* Cuántas series recibió cada músculo en la semana que empieza el lunes `desde`
   (AAAA-MM-DD). Una serie vale 1 para el músculo principal (aporte ≥ 1) y ½ para cada
   secundario: el press de banca son series de pecho y media serie de tríceps. */
const objetivoSeries = mus => SERIES_OBJ[mus] || SERIES_OBJ.def;
function seriesSemana(desde = iso(lunesDe(new Date()))){
  const hasta = iso(addDays(parseISO(desde), 6)), r = {};
  MUSCLE_IDS.forEach(id => { r[id] = 0; });
  for(const s of state.gym.sessions){
    if(s.date < desde || s.date > hasta) continue;
    for(const ex of s.exercises){
      const def = exDef(ex.exId);
      if(!def) continue;
      const n = ex.sets.filter(x => Number(x.reps) > 0).length;
      for(const [mus, f] of Object.entries(def.muscles)) if(mus in r) r[mus] += n * (f >= 1 ? 1 : .5);
    }
  }
  return r;
}

/* ---- Exámenes ----
   Cuánto llevás estudiado para un examen: los minutos de ESA materia (sin importar
   mayúsculas ni acentos) desde que lo cargaste hasta el día del examen. La meta de la
   semana reparte lo que falta en las semanas que quedan (al menos una). */
const normMateria = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
function diasHasta(fecha){ return -daysSince(fecha); }
function avanceExamen(ex){
  const m = normMateria(ex.materia), hoy = iso(), lunes = iso(lunesDe(new Date()));
  let min = 0, minSemana = 0;
  for(const e of state.estudio.entries){
    if(normMateria(e.subject) !== m || e.date < ex.desde || e.date > ex.fecha) continue;
    const n = Number(e.minutes) || 0;
    min += n;
    if(e.date >= lunes && e.date <= hoy) minSemana += n;
  }
  const hechas = min / 60, dias = diasHasta(ex.fecha);
  const semanas = Math.max(1, Math.ceil(Math.max(dias, 0) / 7));
  // La meta de esta semana: lo que falta al empezar la semana, repartido en las semanas que quedan.
  const faltaba = Math.max(0, ex.horas - (min - minSemana) / 60);
  return { hechas, dias, semanaHechas: minSemana / 60, metaSemana: ex.horas ? faltaba / semanas : 0 };
}
function cuandoExamen(dias){ return dias === 0 ? 'hoy' : dias === 1 ? 'mañana' : dias < 0 ? `hace ${-dias} días` : `en ${dias} días`; }
/* El examen más cercano que viene (de hoy en adelante), o null. */
function proximoExamen(){
  const hoy = iso();
  return (state.estudio.examenes || []).filter(x => x.fecha >= hoy).sort((a, b) => a.fecha.localeCompare(b.fecha))[0] || null;
}

function computeEstudio(){
  const bySubject = {};
  let totalMin = 0;
  for(const e of state.estudio.entries){
    const min = Number(e.minutes) || 0;
    bySubject[e.subject] = (bySubject[e.subject] || 0) + min;
    totalMin += min;
  }
  const hours = totalMin / 60;
  const vals = Object.values(bySubject);
  const top = vals.length ? Math.max(...vals) : 0;
  // Simétrico: no alcanza con acumular horas, ninguna materia puede quedar abandonada.
  const simetrico = vals.length >= 3 && top > 0 && Math.min(...vals) >= top * .4;
  return { bySubject, totalMin, hours, rank: rankOf(hours, THRESHOLDS.estudio, simetrico) };
}

function computeFreelance(){
  const items = state.freelance.items;
  const byStage = {};
  STAGES.forEach(s => byStage[s.id] = items.filter(i => i.stage === s.id));
  const done = byStage.completado.length;
  const ingresos = items
    .filter(i => i.stage === 'completado')
    .reduce((a,i) => a + (Number(i.amountARS) || 0), 0);
  const ingresos30 = items
    .filter(i => i.stage === 'completado' && i.updatedAt >= daysAgoISO(30))
    .reduce((a,i) => a + (Number(i.amountARS) || 0), 0);
  // Simétrico: pipeline vivo. De nada sirve haber cerrado 40 proyectos si hoy no
  // estás contactando a nadie.
  const simetrico = STAGES.every(s => byStage[s.id].length > 0);
  return { byStage, done, ingresos, ingresos30, rank: rankOf(done, THRESHOLDS.freelance, simetrico) };
}

/* ---- Seguimiento de clientes ----
   El último contacto es el que registraste, o si no la última vez que se tocó el cliente. */
function ultimoContactoDe(it){
  return [it.ultimoContacto, it.updatedAt, it.createdAt].find(fechaValida) || iso();
}
function diasSinContacto(it){ return Math.max(0, daysSince(ultimoContactoDe(it))); }
/* ¿Hay que volver a escribirle? Si agendaste un próximo seguimiento, manda esa fecha
   (no se avisa antes); si no, pasar el umbral de su etapa. */
function vencido(it){
  if(!(it.stage in ROTTING)) return false;
  if(fechaValida(it.proximo)) return it.proximo <= iso();
  return diasSinContacto(it) >= ROTTING[it.stage];
}
/* Un teléfono argentino a como lo pide wa.me: 549 + código de área + número, sin el 0 ni
   el 15. Devuelve '' si no alcanza para un número completo (10 dígitos sin el país). */
function waNumero(tel){
  let d = String(tel == null ? '' : tel).replace(/\D/g, '');
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('54')){ d = d.slice(2); if(d.startsWith('9')) d = d.slice(1); }
  if(d.startsWith('0')) d = d.slice(1);
  if(d.length === 12) for(const a of [2, 3, 4]) if(d.substr(a, 2) === '15'){ d = d.slice(0, a) + d.slice(a + 2); break; }
  return d.length === 10 ? '549' + d : '';
}
function plantillaDe(etapa){ return ((state.freelance.plantillas || {})[etapa]) || PLANTILLAS_DEF[etapa] || ''; }
function mensajeDe(it){
  return plantillaDe(it.stage).split('{cliente}').join(it.client || '').split('{proyecto}').join(it.project || 'tu web');
}
function enlaceWA(it){
  const n = waNumero(it.telefono), m = mensajeDe(it);
  return n && m ? `https://wa.me/${n}?text=${encodeURIComponent(m)}` : '';
}

/* PERSONAL = Estudio + Freelance. Los dos frentes guardan sus datos por separado
   (una sesión de estudio y un cliente son cosas distintas) y cada uno conserva su
   rango y sus umbrales. Lo único nuevo es el rango de la sección, y usa el mismo
   criterio que el gym: lo marca el eslabón más débil, no el promedio. Así la app
   te empuja a no abandonar ninguno de los dos. */
function computePersonal(){
  const e = computeEstudio(), f = computeFreelance();
  const sub = [
    {k:'estudio',   label:'Estudio',   r:e.rank, unit:'h',         dec:1},
    {k:'freelance', label:'Freelance', r:f.rank, unit:'proyectos', dec:0},
  ];
  const flojo = sub.reduce((a,b) => b.r.i < a.r.i ? b : a);
  return { e, f, sub, flojo, rank: flojo.r };
}

/* ---- Modelo de hábitos ----
   Un hábito es de dos tipos: 'check' (lo hice o no) o 'cantidad' (tiene una meta
   y una unidad: 20 páginas, 8 vasos). El historial guarda UN valor por día:
   `true` (el formato de antes, que sigue valiendo) o un número. Todo lo demás
   sale de estas tres preguntas, y nada fuera de ellas lee el historial directo:
     valorDia  qué se registró ese día   (true -> 1, nada -> 0)
     hecho     ¿cumplió ese día?          check: hay algo · cantidad: llegó a la meta
     activo    ¿hizo algo ese día?        cualquier valor > 0 (aunque no llegue a la meta)
   `hecho` es lo que cuenta para rachas y rangos; `activo`, para el mapa de
   actividad de Inicio. Un día con 3 de 8 vasos es actividad, pero no es un check. */
function habitoDe(id){ return state.habitos.list.find(x => x.id === id) || null; }
function esCantidad(hb){ return !!hb && (hb.tipo === 'cantidad' || hb.tipo === 'tiempo') && Number(hb.meta) > 0; }
/* Un hábito de tiempo es uno de cantidad en minutos, con meta por día y temporizador. */
function esTiempo(hb){ return esCantidad(hb) && hb.tipo === 'tiempo'; }
/* La meta de ESE día: la de su día de la semana si varía (0 = ese día no toca). */
function metaDia(hb, dia){ return esTiempo(hb) && hb.metasDia ? hb.metasDia[diaSemana(dia)] : Number(hb.meta); }
/* "45" o "30–60" (los días que tocan), para mostrar la meta sin un día puntual. */
function metaRango(hb){
  if(!(esTiempo(hb) && hb.metasDia)) return fmtV(Number(hb.meta));
  const m = hb.metasDia.filter(n => n > 0), a = Math.min(...m), b = Math.max(...m);
  return a === b ? fmtV(a) : `${fmtV(a)}–${fmtV(b)}`;
}
const metaVaria = hb => esTiempo(hb) && !!hb.metasDia && /–/.test(metaRango(hb));
/* La meta de una semana entera: la suma por día si varía, si no 7 veces la diaria. */
const metaSemanal = hb => esTiempo(hb) && hb.metasDia ? hb.metasDia.reduce((a, b) => a + b, 0) : Number(hb.meta) * 7;
function valorDia(id, dia){
  const v = (state.habitos.log[id] || {})[dia];
  if(v === true) return 1;
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? n : 0;
}
function hecho(id, dia){
  const hb = habitoDe(id), v = valorDia(id, dia);
  if(!esCantidad(hb)) return v > 0;
  const m = metaDia(hb, dia);
  return m > 0 ? v >= m : v > 0;          // un día sin meta (no toca) cuenta con cualquier registro
}
function activo(id, dia){ return valorDia(id, dia) > 0; }
/* Un día SALTEADO guarda 'skip' (valorDia lo lee como 0: no es hecho ni actividad). No es
   un día que toque: no corta la racha ni cuenta para los porcentajes ni los fallados. */
const SALTEO = 'skip';
function salteado(id, dia){ return (state.habitos.log[id] || {})[dia] === SALTEO; }
/* De cuánto en cuánto sube el "+" de un hábito de cantidad, según su meta. */
function pasoDe(hb){
  const m = Number(hb && hb.meta) || 1;
  return m >= 100 ? 10 : m >= 20 ? 5 : m >= 5 ? 1 : 0.5;
}

/* ---- Frecuencia: qué días toca un hábito ----
   Un hábito toca TODOS los días (lo de siempre) o solo algunos días de la semana
   (`dias`: 0 = lunes … 6 = domingo, como en el resto de la app), y empieza en una
   fecha (`inicio`, o `createdAt` si no hay). Nada de esto se guarda calculado: se
   deriva del hábito cada vez. Un hábito viejo no trae ninguno de los dos campos y
   se comporta EXACTAMENTE como antes.
   Un día cumplido en un día que no toca (un extra) cuenta como cumplido: no se
   pierde, pero tampoco suma al porcentaje. */
const diaSemana = dia => (parseISO(dia).getDay() + 6) % 7;     // 0 = lunes … 6 = domingo
/* Desde cuándo cuenta el hábito: su inicio, o su alta; y si no tiene ninguno, su primer
   registro. Los días ANTERIORES se pueden registrar igual ("ya lo hacía antes de crear
   el hábito"): cuentan como cumplidos y suman a la racha si vienen pegados al inicio,
   pero no son días que tocaban, así que nunca bajan el porcentaje ni suman fallados. */
function inicioDe(hb){
  const base = hb.inicio || hb.createdAt || null;
  if(base) return base;
  const log = state.habitos.log[hb.id] || {};
  let primero = null;
  for(const d of Object.keys(log)) if(valorDia(hb.id, d) > 0 && (!primero || d < primero)) primero = d;
  return primero || iso();
}
/* El primer día con algo cumplido, o null: la racha mejor arranca ahí si es anterior al inicio. */
function primerRegistro(hb){
  const log = state.habitos.log[hb.id] || {};
  let primero = null;
  for(const d of Object.keys(log)) if(hecho(hb.id, d) && (!primero || d < primero)) primero = d;
  return primero;
}
/* `ini` llega ya calculado cuando se recorren muchos días: inicioDe revisa el
   historial entero y no tiene sentido repetirlo en cada vuelta de un bucle. */
function programadoEn(hb, dia, ini){
  return tocaDia(hb, dia, ini) && !salteado(hb.id, dia);
}
/* Si ese día le tocaba por su frecuencia, haya sido salteado o no. */
function tocaDia(hb, dia, ini){
  if(dia < ini) return false;
  if(esTiempo(hb) && hb.metasDia && !(hb.metasDia[diaSemana(dia)] > 0)) return false;   // meta 0 = no toca
  return !hb.dias || hb.dias.includes(diaSemana(dia));
}
const programado = (hb, dia) => programadoEn(hb, dia, inicioDe(hb));
/* "Cada día" o "L · X · V". */
function frecuenciaTexto(hb){
  return hb.dias ? hb.dias.map(d => INICIAL_DIA[d]).join(' · ') : 'Cada día';
}
/* Cuántos hábitos tocaban ese día y cuántos se cumplieron. */
function avanceDia(dia){
  let hechos = 0, programados = 0;
  for(const hb of state.habitos.list){
    if(!programado(hb, dia)) continue;
    programados++;
    if(hecho(hb.id, dia)) hechos++;
  }
  return { hechos, programados };
}

/* La racha: se camina hacia atrás desde hoy.
     · un día cumplido suma (también un extra, en un día que no tocaba)
     · hoy sin hacer no corta todavía: el día no terminó
     · un día que no tocaba y no se hizo se SALTA: no corta
     · un día que tocaba y no se hizo CORTA
   Antes del inicio solo cuentan los días cumplidos pegados uno tras otro: el primero sin
   hacer termina la racha (no se sabe qué pasó antes de que el hábito existiera). */
function habitStreak(habitId){
  const hb = habitoDe(habitId), hoy = iso();
  if(!hb) return 0;
  const ini = inicioDe(hb);
  let n = 0, d = new Date();
  for(let i = 0; i < 4000; i++, d = addDays(d, -1)){
    const dia = iso(d);
    if(hecho(habitId, dia)){ n++; continue; }
    if(dia < ini) break;
    if(dia === hoy) continue;
    if(!programadoEn(hb, dia, ini)) continue;
    break;
  }
  return n;
}
/* La mejor racha: la misma regla, recorriendo el calendario desde el inicio hasta hoy. */
function habitBestStreak(habitId){
  const hb = habitoDe(habitId), hoy = iso();
  if(!hb) return 0;
  const ini = inicioDe(hb);
  const primero = primerRegistro(hb);
  let best = 0, run = 0;
  for(let d = parseISO(primero && primero < ini ? primero : ini); iso(d) <= hoy; d = addDays(d, 1)){
    const dia = iso(d);
    if(hecho(habitId, dia)){ run++; if(run > best) best = run; }
    else if(dia < ini) run = 0;
    else if(dia !== hoy && programadoEn(hb, dia, ini)) run = 0;
  }
  return best;
}
/* Cumplimiento de los últimos 30 días: cumplidos ÷ días que TOCABAN. Es null si en
   esa ventana no tocó ninguno (un hábito que empieza en el futuro): no hay con qué
   medirlo. Un extra no suma ni resta, para que nunca pase del 100%. */
function tasa30(habitId){
  const hb = habitoDe(habitId);
  if(!hb) return null;
  const ini = inicioDe(hb);
  let tocaron = 0, hechos = 0;
  for(let i = 0; i < 30; i++){
    const dia = daysAgoISO(i);
    if(!programadoEn(hb, dia, ini)) continue;
    tocaron++;
    if(hecho(habitId, dia)) hechos++;
  }
  return tocaron ? hechos / tocaron : null;
}
/* Lo mismo pero siempre un número, para mostrarlo. */
function habitRate30(habitId){ return tasa30(habitId) ?? 0; }

/* Todo lo que se muestra en la pantalla de detalle. Función pura y derivada:
   nada de esto se guarda. */
function statsHabito(id){
  const hb = habitoDe(id), log = state.habitos.log[id] || {};
  const dias = Object.keys(log).filter(d => valorDia(id, d) > 0).sort();
  const cumplidos = dias.filter(d => hecho(id, d));
  const hoy = iso();
  const desde = hb ? inicioDe(hb) : (dias[0] || hoy);
  const transcurridos = Math.max(0, daysSince(desde));          // días completos hasta ayer
  // Se recorre el calendario una vez: cuántos días tocaban, cuántos se cumplieron
  // de esos, y cuántos ya terminados (hasta ayer) se dejaron sin hacer.
  let programados = 0, cumplidosProg = 0, fallados = 0;
  if(hb) for(let d = parseISO(desde); iso(d) <= hoy; d = addDays(d, 1)){
    const dia = iso(d);
    if(!programadoEn(hb, dia, desde)) continue;
    programados++;
    if(hecho(id, dia)) cumplidosProg++;
    else if(dia < hoy) fallados++;          // hoy sin marcar todavía no es un día fallado
  }
  const valores = dias.map(d => valorDia(id, d));
  const total = valores.reduce((a, v) => a + v, 0);
  let mejorDia = null;
  dias.forEach((d, k) => { if(!mejorDia || valores[k] > mejorDia.valor) mejorDia = { valor: valores[k], fecha: d }; });
  return {
    racha: habitStreak(id), mejor: habitBestStreak(id),
    completados: cumplidos.length,
    desde, transcurridos, programados, fallados,
    tasa30: habitRate30(id),
    tasaTotal: programados ? cumplidosProg / programados : 0,
    salteados: Object.keys(log).filter(d => log[d] === SALTEO).length,
    total, promedio: dias.length ? total / dias.length : 0, mejorDia,
    ultimo: dias.length ? dias[dias.length - 1] : null,
  };
}

function computeHabitos(){
  const list = state.habitos.list;
  let total = 0;
  for(const hb of list){
    total += Object.keys(state.habitos.log[hb.id] || {}).filter(d => hecho(hb.id, d)).length;
  }
  // Simétrico: todos los hábitos por encima del 80% en los últimos 30 días. Solo se
  // le exige a los que tuvieron días que cumplir en esa ventana, y tiene que haber
  // al menos uno: un hábito que empieza en el futuro no frena a nadie.
  const tasas = list.map(hb => tasa30(hb.id)).filter(t => t !== null);
  const simetrico = tasas.length > 0 && tasas.every(t => t >= .8);
  return { total, list, rank: rankOf(total, THRESHOLDS.habitos, simetrico) };
}

/* ---- Categorías: lo que depende del estado ---- */
function categoriasTodas(){ return CATEGORIAS_BASE.concat(state.habitos.categorias || []); }
function idsCategoriasValidas(){ return new Set(categoriasTodas().map(c => c.id)); }
function categoriaDe(id){ return categoriasTodas().find(c => c.id === id) || null; }
/* Las categorías de un hábito, ya resueltas (un id que no existe se ignora). */
function catsDe(hb){ return (hb.cats || []).map(categoriaDe).filter(Boolean); }
/* Qué categorías están en uso y cuántos hábitos tiene cada una. Es DERIVADO:
   nada de esto se guarda, así nunca se desfasa. Orden: de fábrica y luego propias. */
function categoriasEnUso(){
  const cuenta = {};
  for(const hb of state.habitos.list) for(const id of hb.cats || []) cuenta[id] = (cuenta[id] || 0) + 1;
  return categoriasTodas().filter(c => cuenta[c.id]).map(c => Object.assign({}, c, { cuenta: cuenta[c.id] }));
}
/* ¿Se puede crear una con este nombre? (no vacío, y no igual a otra sin contar acentos ni mayúsculas) */
function nombreCategoriaLibre(nombre){
  const k = claveNombre(nombre);
  return !!k && !categoriasTodas().some(c => claveNombre(c.n) === k);
}
let habFiltro = null;         // id de la categoría con la que se filtra la lista, o null

function crearCategoria(nombre){
  const n = String(nombre == null ? '' : nombre).replace(/\s+/g, ' ').trim().slice(0, LARGO_CAT).trim();
  if(!n) return { error: 'Poné un nombre para la categoría.' };
  if(!nombreCategoriaLibre(n)) return { error: 'Ya hay una categoría con ese nombre.' };
  state.habitos.categorias = state.habitos.categorias || [];
  if(state.habitos.categorias.length >= MAX_CATS_PROPIAS)
    return { error: `Podés tener hasta ${MAX_CATS_PROPIAS} categorías propias.` };
  const categoria = { id: 'cx-' + uid(), n };
  state.habitos.categorias.push(categoria);
  save();
  return { ok: true, categoria };
}
/* Borrar una categoría propia la saca también de los hábitos que la usaban, y
   Deshacer repone las dos cosas: la categoría y las etiquetas, en su orden. */
function borrarCategoria(id){
  const c = (state.habitos.categorias || []).find(x => x.id === id);
  if(!c) return;
  borrarDeLista(state.habitos.categorias, id, `Categoría “${c.n}” borrada`, {
    quitar: () => {
      const afectados = [];
      for(const hb of state.habitos.list){
        if(!(hb.cats || []).includes(id)) continue;
        afectados.push([hb.id, hb.cats.slice()]);
        hb.cats = hb.cats.filter(x => x !== id);
        if(!hb.cats.length) delete hb.cats;
      }
      if(habFiltro === id) habFiltro = null;
      return afectados;
    },
    devolver: (_, afectados) => {
      for(const [hid, cats] of afectados){ const hb = habitoDe(hid); if(hb) hb.cats = cats; }
    },
  });
}

/* ---- Calendario ----
   Funciones puras. Siempre fecha LOCAL (nunca toISOString: en UTC−3 corre el día
   a partir de las 21 h) y semanas que arrancan en lunes, como en el resto de la app. */
const NOMBRE_MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const INICIAL_DIA = ['L','M','X','J','V','S','D'];
const NOMBRES_DIA = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
function lunesDe(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
/* Los 7 días (AAAA-MM-DD) de la semana que contiene a `fecha`, de lunes a domingo. */
function semanaDe(fecha){
  const l = lunesDe(typeof fecha === 'string' ? parseISO(fecha) : fecha);
  return Array.from({ length: 7 }, (_, i) => iso(addDays(l, i)));
}
/* Un mes como filas de 7: lunes primero, con null en los huecos de antes del día 1
   y de después del último. mes va de 0 (enero) a 11. */
function mesGrid(anio, mes){
  const ultimo = new Date(anio, mes + 1, 0).getDate();
  const celdas = Array((new Date(anio, mes, 1).getDay() + 6) % 7).fill(null);
  for(let d = 1; d <= ultimo; d++) celdas.push(iso(new Date(anio, mes, d)));
  while(celdas.length % 7) celdas.push(null);
  const filas = [];
  for(let i = 0; i < celdas.length; i += 7) filas.push(celdas.slice(i, i + 7));
  return filas;
}
/* 53 columnas de semanas, terminando en la semana actual (con sus días futuros). */
function rangoAnio(hoy = new Date()){
  const esta = lunesDe(hoy);
  return Array.from({ length: 53 }, (_, k) => semanaDe(addDays(esta, -7 * (52 - k))));
}
/* El mes que está `atras` meses antes de hoy. */
function mesAtras(atras, hoy = new Date()){
  const d = new Date(hoy.getFullYear(), hoy.getMonth() - atras, 1);
  return { anio: d.getFullYear(), mes: d.getMonth() };
}

  inicio:'Inicio', gym:'Gym', personal:'Personal',

};

/* Marca de rango. Reemplaza al rombo con degradado y halo: una retícula de 3x3
   con tantas celdas llenas como nivel. El número se lee en la FORMA, no solo en
   el color, así que sigue funcionando en blanco y negro y para quien no
   distingue bien los colores. */
function gemHTML(tier, big){
  const lado = big ? 30 : 18, celda = lado / 3, hueco = big ? 1.2 : .9;
  let celdas = '';
  for(let k = 0; k < 9; k++){
    celdas += `<rect x="${((k%3)*celda).toFixed(2)}" y="${(Math.floor(k/3)*celda).toFixed(2)}"
      width="${(celda-hueco).toFixed(2)}" height="${(celda-hueco).toFixed(2)}"
      fill="${k <= tier.i ? tier.c : 'var(--line)'}"/>`;
  }
  return `<svg class="marca" viewBox="0 0 ${lado} ${lado}" width="${lado}" height="${lado}"
    aria-hidden="true" focusable="false">${celdas}</svg>`;
}

function rankCardHTML(titulo, r, unidad, extra = ''){
  const falta = r.next === null
    ? 'Nivel máximo'
    : `faltan ${fmtNum(Math.max(0, r.next - r.value), unidad === 'h' ? 1 : 0)} ${unidad}`;
  return `
    <div class="card">
      <div class="row between">
        <span class="muted xs">${esc(titulo)}</span>
        ${gemHTML(r.tier)}
      </div>
      <div class="big mt3">${r.tier.n}</div>
      <div class="bar mt3" style="--barra:${r.tier.c}"
           role="progressbar" aria-valuenow="${Math.round(r.progress*100)}" aria-valuemin="0" aria-valuemax="100">
        <i style="--p:${(r.progress).toFixed(3)}"></i>
      </div>
      <div class="row between mt2 xs muted" style="margin-top:var(--s2)">
        <span>${fmtNum(r.value, unidad === 'h' ? 1 : 0)} ${esc(unidad)}</span>
        <span>${falta}</span>
      </div>
      ${extra}
    </div>`;
}

function verMasHTML(lista, total, mostradas){
  if(total <= mostradas) return '';
  return `<div class="center mt3">
    <button class="btn sm" data-act="ver-mas" data-lista="${lista}">
      Ver más · quedan ${total - mostradas}
    </button></div>`;
}

          return ex && d <= 21 ? `<span class="pill" data-examen-chip>📅 ${TIPOS_EXAMEN[ex.tipo]} de ${esc(ex.materia)} ${cuandoExamen(d)}</span>` : ''; })()}
          </div>
          <div class="xs dim mt5">Tocá un bloque para ver cuánto te falta e ir a esa sección.</div>
        </div>

/* ---- Gym ----
   El mapa corporal es una lámina anatómica real (line art, embebida en base64 para
   que el archivo siga siendo autocontenido y funcione offline) con las 11 regiones
   clickeables calcadas encima.

   Las regiones NO están dibujadas a ojo: se generaron midiendo la máscara del dibujo
   (inundando desde afuera para saber qué píxel está dentro del cuerpo) y rellenando
   el ancho real de cada miembro fila por fila. Por eso ninguna se sale ni queda corta.

   Cada path es la mitad izquierda y se espeja sobre `eje`. La imagen va debajo con
   pointer-events:none, así el click pasa a la región. */
const BODY_ART = {

function heatClass(last){
  if(!last) return 'r0';
  const d = daysSince(last);
  if(d <= 1) return 'r4';
  if(d <= 3) return 'r3';
  if(d <= 6) return 'r2';
  return 'r1';
}
function heatLabel(last){
  if(!last) return 'nunca';
  const d = daysSince(last);
  if(d === 0) return 'hoy';
  if(d === 1) return 'ayer';
  return `hace ${d} días`;
}

function zoneHTML(mus, data, vista, weak){
  const art = BODY_ART[vista], d = art.paths[mus];
  if(!d) return '';
  const cls = [heatClass(data.last), selMuscle === mus ? 'sel' : '', weak ? 'weak' : ''].filter(Boolean).join(' ');
  const label = `${MUSCLES[mus].label}, ${data.rank.tier.n}, entrenado ${heatLabel(data.last)}`;
  const espejo = ` transform="translate(${art.eje * 2},0) scale(-1,1)"`;
  return `<g class="mz t${data.rank.i} ${cls}" data-muscle="${mus}"
    tabindex="0" role="button" aria-label="${esc(label)}"><path d="${d}"/><path d="${d}"${espejo}/></g>`;
}

/* Mete las dos láminas en el <defs> global, una sola vez por carga. */
let laminasListas = false;
function asegurarLaminas(){
  if(laminasListas) return;
  const defs = document.querySelector('svg defs');
  if(!defs) return;
  for(const vista of ['frente','espalda']){
    const a = BODY_ART[vista];
    const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    img.setAttribute('id', 'lamina-' + vista);
    img.setAttribute('x', 0); img.setAttribute('y', 0);
    img.setAttribute('width', a.w); img.setAttribute('height', a.h);
    img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', a.img);
    img.setAttribute('href', a.img);
    // La lámina es línea de un solo color sobre transparente. En vez de embeber
    // una segunda copia recoloreada para el tema claro, se usa su canal alfa
    // como máscara y el color sale de un token: un asset, los dos temas.
    const mask = document.createElementNS('http://www.w3.org/2000/svg', 'mask');
    mask.setAttribute('id', 'mask-' + vista);
    mask.setAttribute('maskUnits', 'userSpaceOnUse');
    mask.setAttribute('x', 0); mask.setAttribute('y', 0);
    mask.setAttribute('width', a.w); mask.setAttribute('height', a.h);
    mask.appendChild(img);
    const tinta = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    tinta.setAttribute('id', 'lamina-' + vista);
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', 0); rect.setAttribute('y', 0);
    rect.setAttribute('width', a.w); rect.setAttribute('height', a.h);
    rect.setAttribute('fill', 'var(--lamina)');
    rect.setAttribute('mask', 'url(#mask-' + vista + ')');
    tinta.appendChild(rect);
    defs.appendChild(mask);
    defs.appendChild(tinta);
  }
  laminasListas = true;
}
