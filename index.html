     plano saturado (el del hábito), no encima de la superficie de la app. */
  --sobre-tinta:#FFFFFF;           /* los días dibujados sobre el color */
  --tinta-marca:rgba(0,0,0,.55);   /* el anillo del día de hoy */
  /* El velo detrás de un diálogo. NO es --line-fuerte: ese token se invierte con
     el tema (tinta en claro, casi blanco en oscuro) y un velo casi blanco sobre
     una página oscura la lava en vez de atenuarla. Para llevar la atención a la
     hoja hay que oscurecer lo de atrás en los dos temas. */
  --velo-color:#14130F;

  /* Los 9 rangos, un color plano cada uno. Ordenados: neutro -> metal -> frío
     -> clímax naranja. Sin rojo puro ni negro, como la paleta de Múnich. */
  --rank-0:#7D7A72; --rank-1:#9C5B2A; --rank-2:#6B7A86;
  --rank-3:#A87A17; --rank-4:#2F7FA3; --rank-5:#2B7A52;
  --rank-6:#17879A; --rank-7:#6A4C9C; --rank-8:#C8481F;

  /* escala de espaciado: múltiplos de 4. No inventar valores fuera de acá. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  /* Esquinas blandas en TODA la app (antes eran vivas, de Múnich 72; el redondeado
     nació en Hábitos y se extendió a pedido). Botones, tarjetas, campos y paneles
     leen estos tres radios; --r-celda es el de las casillas chicas de los calendarios. */
  --r1:10px; --r2:14px; --r3:20px; --r-celda:4px; --pill:999px;

  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:26px; --t-xl:44px;

  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}

/* El oscuro por preferencia del sistema. Guardado con :not([data-theme="light"])
   para que elegir claro a mano le gane a un sistema en oscuro. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161A; --surface:#1D1F24; --surface-2:#26282E;
    --line:#3A3D45; --line-fuerte:#F0EEE9;
    --text:#F0EEE9; --muted:#A9A69C; --dim:#938F86;
    --accent:#5BB3D9; --accent-text:#10171B;
    --good:#3FA070; --warn:#D9A62B; --bad:#E0674A;
    --lamina:#D8D4CB;
    --rank-0:#9A968C; --rank-1:#C87A3E; --rank-2:#93A3B0;
    --rank-3:#D9A62B; --rank-4:#4FA6CC; --rank-5:#3FA070;
    --rank-6:#2FB0C4; --rank-7:#9077C9; --rank-8:#E8663A;
  }
}
/* Y el mismo oscuro cuando el interruptor lo pide a mano. */
:root[data-theme="dark"]{
  --bg:#15161A; --surface:#1D1F24; --surface-2:#26282E;
  --line:#3A3D45; --line-fuerte:#F0EEE9;
  --text:#F0EEE9; --muted:#A9A69C; --dim:#938F86;
  --accent:#5BB3D9; --accent-text:#10171B;
  --good:#3FA070; --warn:#D9A62B; --bad:#E0674A;
  --lamina:#D8D4CB;
  --rank-0:#9A968C; --rank-1:#C87A3E; --rank-2:#93A3B0;
  --rank-3:#D9A62B; --rank-4:#4FA6CC; --rank-5:#3FA070;
  --rank-6:#2FB0C4; --rank-7:#9077C9; --rank-8:#E8663A;
}

/* Superficies que pinta el navegador y no pertenecen a ningún sistema de diseño
   hasta que uno las reclama: selección, cursor, controles, barra de scroll. */
::selection{background:var(--accent); color:var(--accent-text)}
:root{accent-color:var(--accent); scrollbar-color:var(--line) transparent}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:var(--t-sm);
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  /* los datos de esta app son casi todos números en columna */
  font-variant-numeric:tabular-nums;
}

/* Títulos y cifras en la condensada: es la voz del sistema. */
/* El tracking es específico del tamaño; un solo valor para todo está mal en
   algún lado. Cuanto más grande la letra, más separada se lee: las cifras
   gigantes van en negativo. Lo chico, al revés, quiere un pelo de aire. El
   interlineado acompaña: apretado arriba, cómodo en el cuerpo. */
h1,h2,h3,.big,.cifra{font-family:var(--font-display)}
h1{letter-spacing:-.015em; line-height:1.05}
h2,h3{letter-spacing:-.005em; line-height:1.15}
.xs,.bloque-sec{letter-spacing:.015em}

/* Foco visible SIEMPRE. Es lo primero que se rompe y lo más barato de mantener. */
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:var(--t-lg)}
h2{font-size:var(--t-md)}
h3{font-size:var(--t-sm)}
p{margin:0}

/* ==========================================================================
   2. LAYOUT — mobile-first. Los estilos base son los del celular.
   El @media de abajo agrega la sidebar recién en pantallas grandes.
   ========================================================================== */
.app{display:flex; flex-direction:column; min-height:100dvh}

.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  display:flex; background:var(--surface);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:var(--s2) var(--s1); background:none; border:0; cursor:pointer;
  color:var(--dim); font-family:inherit; font-size:10px; font-weight:600;
}
/* Pictogramas dibujados, no glifos Unicode: un solo grosor, misma retícula.
   Los glifos del sistema cambian de forma en cada plataforma. */
.tab .ico{width:22px; height:22px; display:block; fill:none;
  stroke:currentColor; stroke-width:1.6; stroke-linecap:square; stroke-linejoin:miter}
.tab[aria-current="page"]{color:var(--accent)}

.brand{display:none}

.main-wrap{flex:1; display:flex; flex-direction:column; min-width:0}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:var(--s3); padding:var(--s4); border-bottom:1px solid var(--line);
  /* Instalada en el iPhone la barra de estado va encima de la página: se le deja su lugar. */
  padding-top:calc(var(--s4) + env(safe-area-inset-top, 0px));
  position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); z-index:30;
}
main{padding:var(--s4); padding-bottom:96px; max-width:1100px; width:100%}

@media (min-width:900px){
  .app{flex-direction:row}
  .tabs{
    position:sticky; top:0; height:100dvh; width:216px;
    flex-direction:column; border-top:0; border-right:1px solid var(--line);
    padding:var(--s4) var(--s3); gap:var(--s1);
  }
  .tab{
    flex:none; flex-direction:row; justify-content:flex-start; gap:var(--s3);
    padding:var(--s3); border-radius:var(--r1); font-size:var(--t-sm);
  }
  .tab[aria-current="page"]{background:var(--surface-2); color:var(--text)}

  .brand{
    display:flex; align-items:center; gap:var(--s2);
    padding:var(--s2) var(--s3) var(--s5); font-weight:700; font-size:var(--t-md);
  }
  main{padding:var(--s5); padding-bottom:var(--s6)}
}

/* ==========================================================================
   3. COMPONENTES
   ========================================================================== */
.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r2); padding:var(--s4);
}
.grid{display:grid; gap:var(--s3)}
@media (min-width:640px){ .grid-2{grid-template-columns:repeat(2,1fr)} }
@media (min-width:900px){ .grid-4{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1100px){ .grid-4{grid-template-columns:repeat(4,1fr)} }

.row{display:flex; align-items:center; gap:var(--s3)}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.xs{font-size:var(--t-xs)}
.big{font-size:var(--t-xl); font-weight:700; letter-spacing:-.02em; line-height:1.1}
.mt3{margin-top:var(--s3)} .mt4{margin-top:var(--s4)} .mt5{margin-top:var(--s5)}
.center{text-align:center}

/* Marca de rango: retícula 3x3, color plano, sin brillo. */
.marca{flex:none; display:block}

/* El punto de la sincronización, arriba a la derecha: se toca y lleva a la cuenta. */
.sync-ind{width:32px; height:32px; padding:0; border:0; background:none; display:grid; place-items:center; cursor:pointer}
.sync-ind[hidden]{display:none}
.sync-ind::after{content:""; width:10px; height:10px; border-radius:50%; background:var(--good)}
.sync-ind[data-estado="pendiente"]::after, .sync-ind[data-estado="subiendo"]::after{background:var(--warn)}
.sync-ind[data-estado="sin-conexion"]::after{background:transparent; border:2px solid var(--muted)}
.sync-ind[data-estado="error"]::after, .sync-ind[data-estado="conflicto"]::after{background:var(--bad)}
.cuenta-lados{display:grid; gap:var(--s2); margin-top:var(--s3)}
.cuenta-lados .btn{justify-content:flex-start; text-align:left; min-height:52px}

/* Barra plana. Anima con transform, no con width: animar width obliga al
   navegador a rehacer el layout en cada cuadro. */
.bar{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.bar > i{
  display:block; height:100%; width:100%; background:var(--barra, var(--accent));
  transform-origin:left center; transform:scaleX(var(--p,0));
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
}

button{font-family:inherit}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  padding:var(--s3) var(--s4); border-radius:var(--r1); border:1px solid var(--line);
  background:var(--surface-2); color:var(--text); font-size:var(--t-sm); font-weight:600;
  cursor:pointer;
  /* Explícito y no `transition:.15s`: eso anima TODAS las propiedades, incluso
     las que obligan al navegador a rehacer el layout. */
  transition:background-color .15s ease, border-color .15s ease, transform .09s ease;
}
.btn:hover{border-color:var(--line-fuerte)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:var(--s1) var(--s2); font-size:var(--t-xs)}
.btn.danger{color:var(--bad)}
/* La acción destructiva de un diálogo de confirmación: rellena, no solo teñida. */
.btn.peligro{background:var(--bad); border-color:var(--bad); color:var(--bg)}
.btn.peligro:active{background:color-mix(in srgb, var(--bad) 78%, var(--line-fuerte))}

/* ---- Respuesta al toque ----
   La sensación de que una interfaz es directa se cae apenas aparece latencia.
   El feedback va en el APRETAR, no en el soltar: `:active` entra en cuanto el
   dedo baja, sin una línea de JS. Y es mínimo —1px y un color plano— porque el
   mundo visual es señalética, no goma: un rebote acá sería de otra app. */
.btn:active{background:var(--line); transform:translateY(1px)}
.btn.primary:active{filter:none; background:color-mix(in srgb, var(--accent) 78%, var(--line-fuerte))}
.tab:active{background:var(--surface-2)}
.chip:active,.mbtn:active{background:var(--line)}
.bloque:active{background:var(--line)}
/* La celda del heatmap es chiquita: lo que se lee a ese tamaño es que se
   achique, no que cambie de color. */
.heat .hcell:active{transform:scale(.8)}
.heat .hcell{transition:transform .09s ease}

/* El navegador espera ~300ms por si viene un segundo toque (doble toque =
   zoom). Acá el doble toque no significa nada, así que ese retardo es puro
   impuesto sobre cada toque. */
button,.tab,.hcell,.mz,[data-act]{touch-action:manipulation}
.btn.danger:hover{border-color:var(--bad)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--line-fuerte); color:var(--bg); border-color:var(--line-fuerte)}

label{display:block; font-size:var(--t-xs); color:var(--muted); margin-bottom:var(--s1); font-weight:600}
input,select,textarea{
  width:100%; padding:var(--s3); border-radius:var(--r1);
  border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  font-family:inherit; font-size:var(--t-md);   /* 16 px: con menos, Safari del iPhone hace zoom al escribir */
}
input:focus,select:focus,textarea:focus{border-color:var(--accent); outline:none}
input[type=number]{appearance:textfield}
.field{margin-bottom:var(--s3)}
.fields{display:grid; gap:var(--s3); grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}

.pill{
  display:inline-flex; align-items:center; gap:var(--s1);
  padding:2px var(--s2); border-radius:99px; background:var(--surface-2);
  font-size:var(--t-xs); font-weight:600; color:var(--muted);
}

.list{display:flex; flex-direction:column; gap:var(--s2)}
.item{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r1); padding:var(--s3);
}

table{width:100%; border-collapse:collapse; font-size:var(--t-sm)}
th{text-align:left; font-size:var(--t-xs); color:var(--muted); font-weight:600; padding:var(--s2) var(--s2)}
td{padding:var(--s2); border-top:1px solid var(--line)}
.scroll-x{overflow-x:auto}

.empty{
  text-align:center; padding:var(--s6) var(--s4);
  color:var(--dim); border:1px dashed var(--line); border-radius:var(--r2);
}

/* ---- Mapa corporal ---- */
.bodies{display:flex; gap:var(--s5); justify-content:center; flex-wrap:wrap}
.body-svg{width:min(200px,46vw); height:auto}
.silo{pointer-events:none}
/* El relleno de cada zona lo pone el rango (gradiente del tier) desde el JS.
   La opacidad cuenta la otra mitad de la historia: cuán reciente es el estímulo. */
.mz{cursor:pointer; transition:opacity .25s, stroke .15s}
.mz{stroke:var(--bg); stroke-width:.7}
/* El color de cada zona es su rango, plano. Antes venia de nueve
   <linearGradient> en el <defs>: el rediseno saco los degradados del CSS y se
   olvido de los del SVG, asi que el mapa -lo mas visible de la app- seguia
   pintado con la paleta vieja. Como clase y no como atributo fill, el color
   sale de un token y cambia con el tema sin que el JS se entere. */
.mz.t0{fill:var(--rank-0)} .mz.t1{fill:var(--rank-1)} .mz.t2{fill:var(--rank-2)}
.mz.t3{fill:var(--rank-3)} .mz.t4{fill:var(--rank-4)} .mz.t5{fill:var(--rank-5)}
.mz.t6{fill:var(--rank-6)} .mz.t7{fill:var(--rank-7)} .mz.t8{fill:var(--rank-8)}
.mz.r0{opacity:.28}
.mz.r1{opacity:.5}
.mz.r2{opacity:.68}
.mz.r3{opacity:.85}
.mz.r4{opacity:1}
.mz:hover{stroke:var(--line-fuerte); stroke-width:1.4; opacity:1}
.mz.sel{stroke:var(--line-fuerte); stroke-width:1.8; opacity:1}
.mz:focus-visible{outline:none; stroke:var(--accent); stroke-width:2.4}
/* La escalera de rangos: nueve franjas planas, no un degradado. Se ven los
   escalones, que es justo lo que la escala significa. */
.tierbar{height:10px; flex:1; min-width:120px; display:grid; grid-auto-flow:column;
  grid-auto-columns:1fr}
.tierbar i{display:block}

.cpick{display:flex; gap:var(--s2); flex-wrap:wrap}
.sw-btn{width:36px; height:36px; border-radius:9px; border:2px solid transparent;
  cursor:pointer; padding:0}
.sw-btn[aria-pressed="true"]{border-color:var(--line-fuerte); outline:2px solid var(--bg); outline-offset:-4px}
/* El selector libre del navegador: un cuadrito más de la fila. */
.sw-libre{display:inline-flex; width:36px; height:36px; margin:0}
.sw-libre input{width:36px; height:36px; padding:0; border:2px dashed var(--line-fuerte); background:none; cursor:pointer}
.fields[hidden]{display:none}
.fields + .field{margin-top:var(--s3)}

/* ---- Editor: ícono y categorías ---- */
.ico-sel{display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap}
.ico-prev{
  width:48px; height:48px; flex:none; display:grid; place-items:center; border-radius:14px;
  background:var(--tinta, var(--accent)); color:var(--sobre, var(--accent-text)); font-size:24px;
}
.iconos-panel{
  max-height:230px; overflow-y:auto; margin-top:var(--s2); padding:var(--s2);
  border:1px solid var(--line); background:var(--surface);
}
.iconos-panel[hidden]{display:none}
.icono-grupo + .icono-grupo{margin-top:var(--s3)}
.icono-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(44px, 1fr)); gap:var(--s1); margin-top:var(--s1)}
.ico-btn{
  width:100%; min-height:44px; padding:0; display:grid; place-items:center;
  background:var(--surface-2); border:2px solid transparent; color:var(--text); cursor:pointer;
}
.ico-btn[aria-pressed="true"]{border-color:var(--line-fuerte); background:var(--surface)}
.ico-btn:active{opacity:.7}
.cat-grupo + .cat-grupo{margin-top:var(--s3)}
.cat-chips{display:flex; flex-wrap:wrap; gap:var(--s2); margin-top:var(--s1)}
.cat-chip-wrap{display:inline-flex; align-items:center}
.cat-chip{
  display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 var(--s3);
  border:1px solid var(--line); border-radius:99px; background:var(--surface-2); color:var(--text);
  font:inherit; font-size:var(--t-xs); font-weight:600; cursor:pointer;
}
.cat-chip[aria-pressed="true"]{background:var(--line-fuerte); border-color:var(--line-fuerte); color:var(--bg)}
.cat-chip:active{opacity:.75}
.cat-borrar{width:32px; min-height:36px; padding:0; background:none; border:0; color:var(--bad); font-size:12px; cursor:pointer}
.cat-nueva{display:flex; gap:var(--s2); margin-top:var(--s3)}
.cat-nueva input{flex:1; min-width:0}

/* ---- La fila de filtros de la lista (dentro de .vista-habitos) ---- */
.filtro-hab{
  display:flex; gap:var(--s2); overflow-x:auto; padding:var(--s2) 0; margin-top:var(--s2);
  scrollbar-width:none;
}
.filtro-hab::-webkit-scrollbar{display:none}
.filtro-chip{
  flex:none; display:inline-flex; align-items:center; gap:var(--s2); min-height:40px; padding:0 var(--s3);
  border:1px solid var(--line); border-radius:99px; background:var(--surface); color:var(--text);
  font:inherit; font-size:var(--t-sm); font-weight:600; cursor:pointer;
}
.filtro-chip[aria-pressed="true"]{background:var(--line-fuerte); border-color:var(--line-fuerte); color:var(--bg)}
.filtro-chip:active{opacity:.75}
.filtro-n{font-size:var(--t-xs); font-weight:700}

/* ---- Frecuencia ---- */
/* Un día que no toca se ve atenuado pero se puede tocar (cuenta como extra). Uno
   anterior al inicio del hábito casi no se ve y no se puede marcar. `ant` va
   después de `nt` y de `fut` para ganarles: es una sola propiedad. */
.dia.nt,.dia-barra.nt,.mes-dia.nt{opacity:.5}
.dia.ant,.dia-barra.ant,.mes-dia.ant{opacity:.45}
.heat.tablero .hcell.nt{opacity:.55}
/* Día salteado: borde punteado (no se confunde con "sin marcar" ni depende del color). */
.dia.sk,.mes-dia.sk,.dia-barra.sk{border:2px dashed var(--sobre); opacity:.8}
.heat.tablero .hcell.sk{background:transparent; outline:1.5px dashed var(--sobre, var(--sobre-tinta)); outline-offset:-1.5px}
.saltar{
  flex:none; width:40px; height:40px; padding:0; display:grid; place-items:center;
  border-radius:50%; border:2.5px dashed var(--sobre); background:transparent; color:var(--sobre);
  cursor:pointer; font:inherit; font-size:22px; font-weight:700; line-height:1;
}
.saltar[aria-pressed="true"]{border-style:solid; background:var(--sobre); color:var(--tinta)}
.saltar:active{transform:scale(.94)}
/* En Hoy la cabecera lleva llama, saltear y check: menos aire entre ellos deja lugar al nombre. */
.hab.rellena .hab-cab{gap:var(--s2)}
.heat.tablero .hcell.ant{opacity:.3}
.no-tocan{
  grid-column:1 / -1; display:flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:44px; background:none; border:1px dashed var(--line); border-radius:var(--r2);
  color:var(--muted); font:inherit; font-weight:600; cursor:pointer;
}
.no-tocan:active{opacity:.7}
.dias-sel{display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:var(--s2)}
.dias-sel[hidden]{display:none}
.dia-chip{
  width:40px; height:40px; padding:0; border:1px solid var(--line); border-radius:50%;
  background:var(--surface-2); color:var(--text); font:inherit; font-weight:700; cursor:pointer;
}
.dia-chip[aria-pressed="true"]{background:var(--line-fuerte); border-color:var(--line-fuerte); color:var(--bg)}
.dia-chip:active{opacity:.75}
.stat b.stat-texto{font-size:var(--t-lg); letter-spacing:0}

/* ---- La tira semanal de Hoy ---- */
.tira{margin-top:var(--s3)}
.tira-dias{display:grid; grid-template-columns:repeat(7, 1fr); gap:var(--s1)}
.tira-dia{
  display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0;
  padding:var(--s1) 0 var(--s2); border:0; border-radius:var(--r2); background:none;
  color:var(--text); font:inherit; cursor:pointer;
}
.tira-l{font-size:var(--t-xs); font-weight:700; color:var(--muted)}
.tira-anillo{position:relative; width:38px; height:38px; display:grid; place-items:center}
.tira-anillo svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); fill:none; stroke-width:3}
.tira-anillo .pista{stroke:var(--line)}
.tira-anillo .avance{stroke:var(--line-fuerte); stroke-linecap:round}
.tira-dia.completo .avance{stroke:var(--good)}
.tira-anillo b{position:relative; font-size:var(--t-sm); font-weight:700}
.tira-dia.hoy .tira-anillo::after{
  content:""; position:absolute; left:50%; bottom:-7px; width:5px; height:5px; margin-left:-2.5px;
  border-radius:50%; background:currentColor;
}
.tira-dia[aria-pressed="true"]{background:var(--line-fuerte); color:var(--bg)}
.tira-dia[aria-pressed="true"] .tira-l{color:var(--bg)}
.tira-dia[aria-pressed="true"] .pista{stroke:color-mix(in srgb, var(--bg) 35%, transparent)}
.tira-dia[aria-pressed="true"] .avance{stroke:var(--bg)}
.tira-dia:active:not(:disabled){opacity:.7}
.tira-dia:disabled{opacity:.35; cursor:default}
.tira-titulo{display:flex; align-items:center; justify-content:space-between; gap:var(--s2); margin-top:var(--s3)}
.tira-titulo .btn{min-width:44px; min-height:40px}
.tira-fecha{display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center}
.tira-fecha b{font-family:var(--font-display); font-size:var(--t-lg); font-weight:700; line-height:1.1}
/* Las etiquetas de un hábito, dentro de su tarjeta de color. */
.hab-tags{display:flex; flex-wrap:wrap; gap:var(--s1); margin-top:var(--s3)}
.hab-tag{display:inline-block; padding:2px var(--s3); border:1.5px solid var(--sobre); border-radius:99px; font-size:var(--t-xs); font-weight:700}
@media (pointer: coarse){ .cat-chip{min-height:40px} .cat-borrar{min-height:40px} }

.legend{display:flex; gap:var(--s3); justify-content:center; flex-wrap:wrap; font-size:var(--t-xs); color:var(--muted)}
.legend span{display:flex; align-items:center; gap:var(--s1)}
.sw{width:11px;height:11px;display:inline-block;background:var(--accent)}
.sw.late{animation:pulsez 1.8s ease-in-out infinite}

/* Grilla de músculos: sirve de navegación por teclado y de leyenda con datos.
   El color del mapa nunca es la única fuente de información. */
.mgrid{display:grid; gap:var(--s2); grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mbtn{
  text-align:left; padding:var(--s2) var(--s3); border-radius:var(--r1);
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  cursor:pointer; font-size:var(--t-xs);
}
.mbtn:hover{border-color:var(--accent)}
.mbtn.sel{border-color:var(--accent); background:var(--surface-2)}

/* ---- Heatmap de hábitos ---- */
.heat{
  display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,11px);
  gap:3px; overflow-x:auto; padding-bottom:var(--s1);
}
.hcell{width:11px;height:11px;background:var(--surface-2);border:0;padding:0;cursor:pointer}
.hcell.on{background:var(--good)}
.hcell.fut{opacity:.25; cursor:default}
.hcell.today{outline:1.5px solid var(--line-fuerte); outline-offset:1px}

/* Constancia (Inicio): las columnas valen 1fr y cada cuadrado es cuadrado
   (aspect-ratio), así la grilla llena el ancho de la tarjeta con el MISMO espacio
   entre columnas que entre filas. Antes las columnas "auto" se estiraban y los
   cuadrados no: quedaba un hueco grande al costado de cada uno. Cuántas semanas
   entran lo decide semanasConstancia(). */
.heat.constancia{
  --cg:3px;
  grid-auto-flow:row; grid-template-columns:auto repeat(var(--sem, 12), minmax(0, 1fr));
  grid-template-rows:auto repeat(7, auto); gap:var(--cg); overflow:visible; padding-bottom:0;
}
.heat.constancia .hcell{width:auto; height:auto; aspect-ratio:1; border-radius:var(--r-celda)}
.const-dia{font-size:10px; font-weight:600; color:var(--muted); line-height:1; align-self:center; padding-right:var(--s1)}
.const-mes{font-size:11px; font-weight:600; color:var(--muted); white-space:nowrap; line-height:1.4}
.const-leyenda{display:flex; align-items:center; gap:3px}
.const-leyenda i{display:block; width:12px; height:12px; border-radius:var(--r-celda)}
.const-leyenda span{margin:0 var(--s1)}

/* El bloque de un hábito: un panel del color del hábito con los días dibujados
   en blanco encima, como un tablero de señales. El color plano se lo pasa el JS
   en --tinta, porque cada hábito elige el suyo.
   Las celdas acá no llevan medida fija: la columna vale 1fr y `aspect-ratio:1`
   les da el alto, así la grilla llena el ancho de la tarjeta y no queda una
   barra de scroll lateral. Cuántas semanas entran lo decide el JS (semanasHeat),
   no el CSS, porque depende de cuánto mide una celda tocable. */
.heat.tablero{
  --cel-max:14px; --cel-gap:3px;
  grid-template-rows:repeat(7,auto);
  /* minmax(0, max) hace las dos cosas de una: si sobra ancho las columnas
     crecen hasta el tope y no más (en una pantalla grande el calendario se
     queda denso en vez de inflarse); si falta, se achican parejo hasta entrar. */
  grid-auto-columns:minmax(0,var(--cel-max));
  gap:var(--cel-gap);
  /* El panel abraza a la grilla en vez de estirarse: así no queda color vacío
     a la derecha cuando las celdas llegaron a su tope. */
  width:max-content; max-width:100%;
  background:var(--tinta);
  padding:var(--s2);
  overflow:visible;
}
.heat.tablero .hcell{
  width:auto; height:auto; aspect-ratio:1; border-radius:2px;
  background:color-mix(in srgb, var(--sobre, var(--sobre-tinta)) 26%, transparent);
}
.heat.tablero .hcell.on{background:var(--sobre, var(--sobre-tinta))}
/* Cantidad a medias (3 de 8 vasos): más intensa cuanto más cerca de la meta, pero
   nunca tan llena como un día cumplido. */
.heat.tablero .hcell.parcial{background:color-mix(in srgb, var(--sobre, var(--sobre-tinta)) calc(30% + 50% * var(--f, 0)), transparent)}
.heat.tablero .hcell.fut{opacity:.3}
.heat.tablero .hcell.today{outline:2px solid var(--sobre, var(--tinta-marca)); outline-offset:1px}

/* ==========================================================================
   HÁBITOS — color pleno.
   Las esquinas blandas ya no son solo de acá: los tres radios viven en :root.
   Cada hábito pasa su color como --tinta y la tinta legible sobre él como --sobre
   (blanca u oscura según el contraste, ver tintaSobre en el JS).
   ========================================================================== */
.seg{display:flex; gap:var(--s1); padding:var(--s1); background:var(--surface-2); border-radius:var(--r2)}
.seg button{
  flex:1; min-height:40px; padding:0 var(--s2); background:none; border:0; border-radius:var(--r1);
  font:inherit; font-weight:700; font-size:var(--t-sm); color:var(--muted); cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--line-fuerte); color:var(--bg)}
.seg button:active{opacity:.75}
.seg button:disabled{opacity:.5; cursor:default}

.nav-per{display:flex; align-items:center; justify-content:space-between; gap:var(--s2); margin:var(--s3) 0}
.nav-per b{font-family:var(--font-display); font-size:var(--t-lg); font-weight:700}
.nav-per .btn{min-width:44px; min-height:40px; font-size:var(--t-lg); line-height:1}

.hab{background:var(--tinta); color:var(--sobre); border-radius:var(--r3); padding:var(--s4)}
/* Las tarjetas se acomodan solas: una columna en el teléfono, dos o más cuando hay
   lugar. Sin esto, a 1100px un casillero del mes (aspect-ratio:1) mediría 100px. */
.lista-hab{display:grid; gap:var(--s3); grid-template-columns:repeat(auto-fill, minmax(min(100%, 340px), 1fr)); align-items:start}
.detalle{max-width:560px}
.hab-cab{display:flex; align-items:center; gap:var(--s3)}
/* El trazo de TODOS los íconos propios, en un solo lugar. */
.ico-h{display:block; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.hab-ico{
  flex:none; width:44px; height:44px; display:grid; place-items:center;
  border-radius:var(--r2); background:color-mix(in srgb, var(--sobre) 20%, transparent); font-size:22px;
}
.hab-nom{flex:1; min-width:0; background:none; border:0; padding:0; color:inherit; font:inherit; text-align:left}
button.hab-nom{cursor:pointer}
.hab-nom b{display:block; font-size:var(--t-md); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hab-sub{display:block; font-size:var(--t-xs); font-weight:500}

/* El círculo de check. 44px: es lo que más se toca en toda la app. */
.chk{
  flex:none; width:44px; height:44px; padding:0; display:grid; place-items:center;
  border-radius:50%; border:2.5px solid var(--sobre); background:transparent; color:var(--sobre);
  cursor:pointer; font:inherit; font-weight:700; transition:background-color .12s ease, color .12s ease;
}
.chk svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.chk .ck{opacity:0}
.chk[aria-pressed="true"]{background:var(--sobre); color:var(--tinta)}
.chk[aria-pressed="true"] .ck{opacity:1}
.chk:active{transform:scale(.94)}
.chk.sm{width:40px; height:40px; font-size:20px}

.hab-cant{display:flex; align-items:center; gap:var(--s2); margin-top:var(--s3)}
.hab-valor{flex:1; text-align:center; font-family:var(--font-display); font-size:var(--t-lg); font-weight:700; line-height:1.1}
.hab-valor b{font-size:var(--t-xl)}
.hab-valor small{display:block; font-family:var(--font); font-size:var(--t-xs); font-weight:500}

/* La tarjeta de Hoy: de fondo una base apagada (--base, ver baseDe) y encima una capa
   del color pleno que crece de izquierda a derecha con el avance (--p, de 0 a 1).
   Dos colores sólidos, sin degradados. Al redibujar, render() deja en --p0 de dónde
   venía y la tarjeta que cambió corre el recorrido una sola vez. */
.hab.rellena{position:relative; overflow:hidden; background:var(--base); --p0:0}
.hab.rellena > .rell{
  position:absolute; inset:0; background:var(--tinta);
  transform-origin:left center; transform:scaleX(var(--p, 0));
}
.hab.rellena > .hab-in{position:relative}
.hab.rellena.anima > .rell{animation:rellena .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rellena{from{transform:scaleX(var(--p0))} to{transform:scaleX(var(--p, 0))}}

/* La llama de racha. Plana: el cuerpo en la tinta de la tarjeta y el núcleo en su base,
   así se ve sobre cualquier color de hábito. Apagada es solo el contorno. Al encenderse
   (render() le pone .enciende una sola vez) pega un salto y suelta dos chispas; mientras
   está encendida titila muy despacio, cada tarjeta con su propio desfase (--d).
   Solo se mueven transform y opacity. */
.llama{display:inline-flex; align-items:center; gap:2px; flex:none; font-size:var(--t-sm); font-weight:700; color:var(--sobre)}
.llama-ico{position:relative; display:block; width:24px; height:24px}
.llama svg{display:block; width:24px; height:24px; overflow:visible}
.llama .l-cuerpo{fill:none; stroke:var(--sobre); stroke-width:1.8; stroke-linejoin:round; opacity:.8}
.llama.on .l-cuerpo{fill:var(--sobre); stroke:none; opacity:1}
.llama .l-nucleo{fill:var(--base)}
.llama .cuerpo{transform-box:fill-box; transform-origin:50% 100%}
.llama.on .cuerpo{animation:titila 2.6s ease-in-out var(--d, 0s) infinite}
@keyframes titila{0%, 100%{transform:scale(1, 1)} 50%{transform:scale(.95, 1.07)}}
.llama.enciende .llama-ico{animation:enciende .42s cubic-bezier(.2,.8,.2,1)}
@keyframes enciende{0%{transform:scale(.6)} 60%{transform:scale(1.18)} 100%{transform:scale(1)}}
.chispa{position:absolute; top:3px; width:3px; height:3px; border-radius:50%; background:var(--sobre); opacity:0}
.chispa.a{left:5px}
.chispa.b{right:5px}
.llama.enciende .chispa{animation:chispa .5s ease-out both}
.llama.enciende .chispa.b{animation-delay:.08s}
@keyframes chispa{0%{opacity:1; transform:translateY(2px)} 100%{opacity:0; transform:translateY(-9px)}}

/* Selección múltiple. En el modo selección la tarjeta entera es una casilla
   (role=checkbox) y su contenido queda inerte. El estado se ve por el trazo de afuera y
   por el círculo marcado, no solo por el color. */
.hab.rellena{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.hab.rellena.en-sel{cursor:pointer}
.hab.rellena.en-sel[aria-checked="true"]{outline:3px solid var(--text); outline-offset:2px}
.hab.rellena.en-sel:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.sel-marca{flex:none; display:grid; place-items:center; width:26px; height:26px; border-radius:50%;
  border:2.5px solid var(--sobre); color:var(--tinta)}
.sel-marca svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; opacity:0}
.hab.en-sel[aria-checked="true"] .sel-marca{background:var(--sobre)}
.hab.en-sel[aria-checked="true"] .sel-marca svg{opacity:1}
.sel-cab{display:flex; align-items:center; justify-content:space-between; gap:var(--s2); margin-top:var(--s3)}
.sel-cab b{font-family:var(--font-display); font-size:var(--t-lg)}
.sel-cab .btn{min-height:40px}
.sel-barra{
  position:sticky; bottom:calc(72px + env(safe-area-inset-bottom)); z-index:35;
  display:grid; grid-template-columns:repeat(4, 1fr); gap:var(--s2); margin-top:var(--s4); padding:var(--s3);
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
}
.sel-barra .btn{min-height:44px; padding-left:var(--s2); padding-right:var(--s2)}
@media (min-width:900px){ .sel-barra{bottom:var(--s4)} }
@media (max-width:460px){ .sel-barra{grid-template-columns:repeat(2, 1fr)} }
.cat-chip[aria-pressed="mixed"]{border-style:dashed; border-color:var(--line-fuerte)}

/* Semana: siete círculos (o siete barras, si es de cantidad). */
.sem{display:grid; grid-template-columns:repeat(7, 1fr); gap:var(--s1); margin-top:var(--s3)}
.sem-dia{display:flex; flex-direction:column; align-items:center; gap:var(--s1); font-size:var(--t-xs); font-weight:700; min-width:0}
.dia{
  width:100%; max-width:42px; aspect-ratio:1; padding:0; display:grid; place-items:center;
  border-radius:50%; border:2px solid color-mix(in srgb, var(--sobre) 55%, transparent);
  background:transparent; color:var(--sobre); font:inherit; font-size:var(--t-xs); font-weight:700; cursor:pointer;
}
.dia.on{background:var(--sobre); border-color:var(--sobre); color:var(--tinta)}
.dia.hoy{outline:2px solid var(--sobre); outline-offset:2px}
.dia.fut{opacity:.35; cursor:default}
.dia:active:not(:disabled){transform:scale(.92)}
.dia-barra{
  position:relative; overflow:hidden; width:100%; max-width:42px; height:64px; padding:0;
  border:0; border-radius:var(--r1); background:color-mix(in srgb, var(--sobre) 22%, transparent); cursor:pointer;
}
.dia-barra i{position:absolute; left:0; right:0; bottom:0; height:calc(var(--f, 0) * 100%); background:var(--sobre)}
.dia-barra.hoy{outline:2px solid var(--sobre); outline-offset:2px}
.dia-barra.fut{opacity:.35; cursor:default}
.dia-num{font-size:11px; font-weight:700; min-height:1.2em}

/* Mes: cuadrícula de 7 columnas. */
.mes{display:grid; grid-template-columns:repeat(7, 1fr); gap:var(--s1); margin-top:var(--s3)}
.mes-cab{font-size:var(--t-xs); font-weight:700; text-align:center}
.mes-vacio{aspect-ratio:1}
.mes-dia{
  position:relative; overflow:hidden; aspect-ratio:1; padding:0; display:grid; place-items:center;
  border:0; border-radius:var(--r-celda); background:color-mix(in srgb, var(--sobre) 22%, transparent);
  color:var(--sobre); font:inherit; font-size:12px; font-weight:700; cursor:pointer;
}
.mes-dia.on{background:var(--sobre); color:var(--tinta)}
.mes-dia.hoy{outline:2px solid var(--sobre); outline-offset:1px}
.mes-dia.fut{opacity:.35; cursor:default}
.mes-dia.parcial i{position:absolute; left:0; bottom:0; height:4px; width:calc(var(--f, 0) * 100%); background:var(--sobre)}
.mes-dia:active:not(:disabled){transform:scale(.92)}

/* Año: solo lectura. A 390px una celda mide ~5px: no hay forma de acertarle con el dedo. */
.hab .heat.tablero{background:none; padding:0; margin-top:var(--s3)}
.heat.tablero.anio{--cel-gap:1px; --cel-max:14px}
.heat.tablero.anio .hcell{border-radius:1px; cursor:inherit}
button.hab-abrir{display:block; width:100%; max-width:100%; padding:0; background:none; border:0; color:inherit; font:inherit; text-align:left; cursor:pointer}
.hab-pie{display:block; margin-top:var(--s2); font-size:var(--t-xs); font-weight:500}

/* Detalle de un hábito */
.stats{display:grid; grid-template-columns:1fr 1fr; gap:var(--s3); margin-top:var(--s3)}
.stat{background:color-mix(in srgb, var(--tinta) 18%, var(--surface)); border-radius:var(--r2); padding:var(--s4); min-width:0}
.stat small{display:block; font-size:var(--t-xs); font-weight:600; color:var(--muted)}
.stat b{font-family:var(--font-display); font-size:var(--t-xl); font-weight:700; line-height:1.05; letter-spacing:-.01em}
.stat span{font-size:var(--t-xs); color:var(--muted); margin-left:var(--s1)}
.hab-panel{background:var(--tinta); color:var(--sobre); border-radius:var(--r3); padding:var(--s4); margin-top:var(--s3)}
.hab-panel h3{font-size:var(--t-md); margin-bottom:var(--s2)}
.hab-panel .tip{color:var(--sobre); min-height:2.4em}
.hab-panel .hit:hover{fill:color-mix(in srgb, var(--sobre) 18%, transparent)}
.hab .seg{background:color-mix(in srgb, var(--sobre) 18%, transparent); margin-top:var(--s3)}
.hab .seg button{color:var(--sobre)}
.hab .seg button[aria-pressed="true"]{background:var(--sobre); color:var(--tinta)}
.hab .nav-per b{color:var(--sobre)}

/* En una pantalla táctil el dedo necesita ~24px. Las celdas del heatmap medían
   11px: imposibles de acertar. `pointer: coarse` apunta a dedo, no a mouse, así
   que en la compu no cambia nada. */
@media (pointer: coarse){
  .heat{grid-template-rows:repeat(7,19px); gap:5px}
  .heat.constancia{--cg:4px; grid-template-rows:auto repeat(7, auto); gap:var(--cg)}
  .hcell{width:19px; height:19px; border-radius:4px}
  /* Con el dedo el tope sube y el JS muestra menos semanas (ver semanasHeat),
     así cada día sigue siendo un blanco de ~20px. */
  .heat.tablero{--cel-max:26px; --cel-gap:4px}
  .btn.sm{min-height:32px; padding:var(--s2) var(--s3); font-size:var(--t-sm)}
  .rir button{min-height:36px; padding:var(--s2) var(--s4)}
  .mbtn{min-height:52px}
  .tab{padding:var(--s3) var(--s1)}
  .setrow{grid-template-columns:24px 1fr 1fr 40px}
  .setrow input{padding:var(--s3)}
}

/* ---- Pipeline freelance ---- */
.pipe{display:grid; gap:var(--s3); grid-template-columns:1fr}
@media (min-width:760px){ .pipe{grid-template-columns:repeat(4,1fr)} }
.col{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:var(--s3); min-height:90px}
.col h3{font-size:var(--t-xs); color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:var(--s2)}
/* Seguimiento: un cliente al que hay que volver a escribir se ve por el borde, el ícono y el texto. */
.item.vencido{border:2px solid var(--warn)}
.contacto{display:block; margin-top:var(--s2); font-size:var(--t-xs); color:var(--muted)}
.item.vencido .contacto{color:var(--text); font-weight:700}
.acciones-cli{display:flex; flex-wrap:wrap; gap:var(--s2); margin-top:var(--s2)}
.acciones-cli .btn{min-height:36px}
a.btn{text-decoration:none; display:inline-flex; align-items:center; justify-content:center}
.plantilla textarea{min-height:84px}

/* ---- Modal ---- */
.backdrop{
  position:fixed; inset:0; z-index:60;
  /* El velo se oscurece junto con la hoja: feedback continuo DURANTE el gesto,
     no un corte al final. --velo lo escribe el JS en cada cuadro. */
  background:color-mix(in srgb, var(--velo-color) calc(58% * var(--velo,1)), transparent);
  display:flex; align-items:flex-end; justify-content:center; padding:0;
}
@media (min-width:700px){ .backdrop{align-items:center; padding:var(--s4)} }
.backdrop[hidden]{display:none}
.modal{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r3) var(--r3) 0 0; width:100%; max-width:640px;
  max-height:92dvh; display:flex; flex-direction:column;
}
@media (min-width:700px){ .modal{border-radius:var(--r3)} }
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:var(--s4); border-bottom:1px solid var(--line)}

/* La barra de agarre. Sin ella, poder arrastrar la hoja para cerrarla sería un
   secreto: la afordancia tiene que verse. En escritorio el diálogo va centrado
   y no se arrastra, así que no aparece. */
.agarre{display:none}
@media (max-width:699px){
  .agarre{
    display:block; width:36px; height:4px; margin:var(--s2) auto var(--s1);
    background:var(--line); flex:none;
  }
  /* La zona de arrastre no debe competir con el scroll del navegador. */
  .agarre,.modal-head{touch-action:none}
}
/* La hoja la mueve el JS con un resorte, cuadro por cuadro. Una transición de
   CSS acá pelearía con él: no se puede agarrar a mitad de camino. */
.modal{will-change:auto}
.modal.enVuelo{will-change:transform}
.modal-body{padding:var(--s4); overflow-y:auto; flex:1}
.modal-foot{padding:var(--s4); border-top:1px solid var(--line); display:flex; gap:var(--s2); justify-content:flex-end}

/* ---- Toast ---- */
#toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  background:var(--line-fuerte); border:0; color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r1); z-index:80;
  font-size:var(--t-sm); max-width:90vw;
}
#toast[hidden]{display:none}

/* ---- "Última vez" dentro de cada ejercicio del formulario ---- */
.ultima{
  margin-bottom:var(--s3); padding:var(--s2) var(--s3);
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r1);
}
/* Doble progresión: lo que toca hoy, debajo de lo que hiciste la última vez. */
.sugerencia{display:flex; align-items:center; justify-content:space-between; gap:var(--s2); flex-wrap:wrap;
  margin-top:var(--s2); padding-top:var(--s2); border-top:1px solid var(--line)}
.sugerencia b{font-size:var(--t-sm)}
.prog-rango{display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; margin-top:var(--s1)}
.prog-rango .btn{min-height:32px}
.prog-edit{display:flex; align-items:flex-end; gap:var(--s2); flex-wrap:wrap; margin-top:var(--s2)}
.prog-edit label{margin:0}
.prog-edit input{width:72px; padding:var(--s2)}

/* Series de la semana: una pista con la franja del objetivo marcada y el avance encima. */
.series{display:grid; gap:var(--s3); margin-top:var(--s3)}
.serie-cab{display:flex; justify-content:space-between; gap:var(--s2); font-size:var(--t-xs)}
.serie-cab b{font-size:var(--t-sm)}
.serie-pista{position:relative; height:10px; margin-top:var(--s1); background:var(--surface-2); border-radius:99px; overflow:hidden}
.serie-franja{position:absolute; top:0; bottom:0; background:color-mix(in srgb, var(--good) 30%, transparent)}
.serie-avance{position:absolute; top:0; bottom:0; left:0; width:100%; background:var(--line-fuerte); border-radius:99px;
  transform-origin:left center; transform:scaleX(var(--p, 0))}
.serie.ok .serie-avance{background:var(--good)}
.serie-falta{color:var(--text); font-weight:700}

/* ---- Temporizador de descanso ----
   Una píldora FIJA, afuera del diálogo, a propósito: si fuera otra hoja,
   abrirla reemplazaría el formulario de sesión y se perdería lo que estás
   cargando. Va por encima del velo (60) y por debajo del aviso (80). */
.timer-pill{
  position:fixed; z-index:70; left:50%; transform:translateX(-50%);
  top:calc(env(safe-area-inset-top, 0px) + var(--s2));
  display:flex; align-items:center; gap:var(--s2);
  padding:var(--s1) var(--s1) var(--s1) var(--s4);
  background:var(--line-fuerte); color:var(--bg); overflow:hidden;
}
.timer-pill{border-radius:99px}
.timer-pill[hidden]{display:none}
/* La del pomodoro va debajo de la del descanso, por si corren las dos. */
.timer-pill.pomo{top:calc(env(safe-area-inset-top, 0px) + var(--s2) + 52px)}
.timer-pill .timer-txt{font-size:var(--t-xs); font-weight:700}
.timer-num{
  font-family:var(--font-display); font-weight:700; font-size:var(--t-lg);
  line-height:1; min-width:3.2ch; letter-spacing:-.005em;
}
.timer-btn{
  background:none; border:1px solid currentColor; color:inherit; font:inherit;
  font-weight:700; font-size:var(--t-xs); min-height:32px; min-width:40px;
  padding:0 var(--s2); cursor:pointer;
}
.timer-btn{border-radius:var(--r1)}
.timer-btn:active{opacity:.6}

/* ---- Pomodoro ---- */
.pomo-reloj{font-family:var(--font-display); font-size:clamp(56px, 16vw, 88px); font-weight:700; line-height:1; letter-spacing:-.01em; text-align:center; margin-top:var(--s3)}
.pomo-fase{text-align:center; font-weight:700}
.pomo-opc{display:flex; gap:var(--s3); flex-wrap:wrap; margin-top:var(--s3)}
.pomo-opc .seg{flex:1; min-width:150px}

/* ---- Exámenes ---- */
.examen .bar{margin-top:var(--s2)}
.examen-semana{display:flex; justify-content:space-between; gap:var(--s2); margin-top:var(--s2); font-size:var(--t-xs)}
.examen.cerca{border:2px solid var(--line-fuerte)}
details.pasados summary{cursor:pointer; font-size:var(--t-sm); font-weight:600; color:var(--muted); margin-top:var(--s3); min-height:32px}
/* La franja de progreso baja con el tiempo que queda. Se actualiza por
   transform, no por width, y el valor lo escribe el JS en cada tic. */
.timer-strip{
  position:absolute; left:0; bottom:0; height:3px; width:100%; background:var(--bg);
  transform-origin:left center; transform:scaleX(var(--p,1)); transition:transform .25s linear;
}
/* Los atajos de descanso quedan a la vista aunque la lista de ejercicios scrollee. */
.timer-chips{
  /* top negativo: el sticky mide desde DENTRO del relleno del contenedor que
     scrollea, y sin esto los atajos se frenaban 16px más abajo del borde,
     dejando asomar el contenido por encima. */
  position:sticky; top:calc(var(--s4) * -1); z-index:1;
  display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2);
  margin:calc(var(--s4) * -1) calc(var(--s4) * -1) var(--s3); padding:var(--s2) var(--s4);
  background:var(--surface); border-bottom:1px solid var(--line);
}
/* "Deshacer" dentro del aviso. Es un botón de verdad (teclado, lector de
   pantalla) y mide lo que un dedo necesita. */
#toast .toast-accion{
  margin-left:var(--s3); padding:var(--s2) var(--s3); min-height:36px;
  background:none; border:1px solid currentColor; color:inherit;
  font:inherit; font-weight:700; cursor:pointer;
}
#toast .toast-accion:active{opacity:.7}
@media (min-width:900px){ #toast{bottom:var(--s5)} }

/* Editor de series dentro del modal de sesión */
.exbox{border:1px solid var(--line); border-radius:var(--r1); padding:var(--s3); margin-bottom:var(--s3); background:var(--surface-2)}
.setrow{display:grid; grid-template-columns:24px 1fr 1fr 30px; gap:var(--s2); align-items:center; margin-bottom:var(--s2)}
.setrow input{padding:var(--s2)}
.rir{display:flex; gap:var(--s1); flex-wrap:wrap}
.rir button{
  padding:var(--s1) var(--s3); border-radius:6px; border:1px solid var(--line);
  background:var(--surface); color:var(--muted); font-size:var(--t-xs); cursor:pointer; font-weight:600;
}
.rir button[aria-pressed="true"]{border-color:var(--accent); color:var(--text); background:var(--bg)}

/* ==========================================================================
   14. MOVIMIENTO Y VISUALIZACIONES
   ========================================================================== */
@keyframes pulsez{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(80vh) rotate(540deg);opacity:0}}


.card{transition:border-color .2s, transform .2s}
.card:hover{border-color:var(--line-fuerte)}

.hero{display:grid; gap:var(--s5); grid-template-columns:1fr}
@media (min-width:860px){ .hero{grid-template-columns:1.25fr 1fr; align-items:start} }

/* Panel de señalética. Bloques de color plano, esquina blanda, sin sombra. */
.panel{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:var(--s2)}
.bloque{display:flex; flex-direction:column; align-items:flex-start; gap:var(--s1);
  padding:var(--s4) var(--s3) var(--s3); border:1px solid var(--line); border-radius:var(--r2); background:var(--surface); color:var(--text);
  cursor:pointer; font:inherit; text-align:left; transition:background .15s}
.bloque:hover{background:var(--surface-2)}
.bloque-top{display:flex; align-items:center; gap:var(--s2)}
.bloque-sec{font-size:var(--t-xs); font-weight:700; letter-spacing:.08em; text-transform:uppercase}
.bloque .cifra{font-family:var(--font-display); font-size:clamp(56px,9vw,86px); font-weight:700;
  line-height:.82; color:var(--c); letter-spacing:-.02em}
.bloque-rango{font-size:var(--t-xs); color:var(--muted)}
.bloque .bar{width:100%; margin-top:var(--s1)}

.chips{display:flex; flex-wrap:wrap; gap:var(--s2)}
.chip{display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3);
  border:1px solid var(--line); border-radius:99px; background:var(--surface-2);
  color:var(--text); font-size:var(--t-xs); font-weight:600; cursor:pointer; transition:.15s;
  font-family:inherit}
.chip:hover{border-color:var(--accent)}

.viz{width:100%; height:auto; display:block; overflow:visible}
.radar-dot{cursor:pointer; transition:r .15s}
.radar-dot:hover{r:5.5}
.hit{fill:transparent; cursor:pointer}
.hit:hover{fill:rgba(79,124,255,.12)}
.hit:focus-visible{fill:rgba(79,124,255,.18); outline:none}
.tip{min-height:32px; font-size:var(--t-xs); color:var(--muted); margin-top:var(--s2)}
.hcell.act{cursor:default}

.mz.weak{animation:pulsez 1.8s ease-in-out infinite}

#rankup{position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--bg) 92%, transparent); cursor:pointer; overflow:hidden}
#rankup[hidden]{display:none}
.rankup-card{animation:pop .5s cubic-bezier(.2,.8,.2,1) both; text-align:center; padding:var(--s7) var(--s6)}
.conf{position:absolute; top:-14px; width:7px; height:13px; border-radius:2px; animation:fall 2.6s linear forwards}

/* Movimiento reducido NO es "sin respuesta": es la versión que no marea.
   Matar todas las transiciones de un saque también mataba el feedback de
   apretado, que no es decorativo —es lo que te dice que la interfaz te
   escuchó—. Se van los desplazamientos, los resortes y los bucles; se quedan
   los cambios de color y de opacidad. La hoja, del lado del JS, deja de usar
   resorte y aparece y desaparece sin recorrido. */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important}
  *{transition-property:opacity,background-color,border-color,color,fill,stroke !important;
    transition-duration:.14s !important}
  .btn:active{transform:none}
  .heat .hcell:active{transform:none; background:var(--sobre-tinta)}
  .conf{display:none}
  .llama .cuerpo, .llama .llama-ico, .hab.rellena > .rell{animation:none !important}
  .chispa{display:none}
}

<script>
"use strict";

/* ==========================================================================
   7. CONFIG — todas las constantes de la app. Los números que querés retocar
   (umbrales de rango, colores de calor, ejercicios) están acá y en ningún otro lado.
   [NIVEL: ya sabés] — son arrays y objetos, nada nuevo.
   ========================================================================== */

/* Cada rango es UN color plano y vive como token CSS, no como hex, para que
   cambie solo con el tema sin que el JS sepa cuál está puesto. */
const TIERS = [
  {n:'Hierro',    c:'var(--rank-0)', i:0},
  {n:'Bronce',    c:'var(--rank-1)', i:1},
  {n:'Plata',     c:'var(--rank-2)', i:2},
  {n:'Oro',       c:'var(--rank-3)', i:3},
  {n:'Platino',   c:'var(--rank-4)', i:4},
  {n:'Esmeralda', c:'var(--rank-5)', i:5},
  {n:'Diamante',  c:'var(--rank-6)', i:6},
  {n:'Campeón',   c:'var(--rank-7)', i:7},
  {n:'Simétrico', c:'var(--rank-8)', i:8},
];

/* Colores que se ofrecen para un hábito. Viven acá y no junto a la vista de
   hábitos porque load() normaliza los hábitos al arrancar, y un `const` declarado
   más abajo todavía no existe en ese momento (daría un error de zona muerta).
   Elegidos midiendo: con la tinta que `tintaSobre` les asigna, ninguno baja de
   4,5:1 (el mínimo para texto normal). Hay vivos de los que piden tinta oscura
   (amarillo, lima, celeste) y oscuros de los que piden blanca. */
const HABIT_COLORS = ['#E8501C','#D93A3A','#D81B60','#9C27B0','#5C4FD6','#1E88E5','#00A6C8','#00967F',
                      '#43A047','#8DB600','#F6BE00','#F58A07','#8D5B3A','#546E7A','#1F6E96','#2B7A52'];
const TINTA_OSCURA = '#1B1A16';
const esColorHex = c => typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c);
/* Una fecha AAAA-MM-DD que existe de verdad: "2026-02-30" tiene la forma pero no
   existe (new Date la corre al 2 de marzo), y eso se nota porque al volver a
   escribirla no da lo mismo. */
const fechaValida = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && iso(parseISO(s)) === s;

/* Contraste según WCAG: (luz del más claro + 0,05) / (luz del más oscuro + 0,05).
   Sirve para elegir la tinta que se lee mejor sobre CUALQUIER color de hábito,
   incluido uno que el usuario elija con el selector libre. */
function luminancia(hex){
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contraste(a, b){
  const la = luminancia(a), lb = luminancia(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}
function tintaSobre(hex){
  return contraste(hex, '#FFFFFF') >= contraste(hex, TINTA_OSCURA) ? '#FFFFFF' : TINTA_OSCURA;
}
/* La base apagada de la tarjeta de Hoy: el mismo color mezclado hacia el lado OPUESTO
   a su tinta (hacia el negro si la tinta es blanca, hacia el blanco si es oscura).
   Así la tinta contrasta todavía más sobre la base que sobre el color pleno y el
   texto se lee en las dos zonas, sea cual sea el color que se haya elegido. */
const MEZCLA_BASE = 0.55;
function baseDe(hex){
  const polo = tintaSobre(hex) === '#FFFFFF' ? 0 : 255;
  return '#' + [1, 3, 5].map(i => {
    const c = parseInt(hex.slice(i, i + 2), 16);
    return Math.round(c * (1 - MEZCLA_BASE) + polo * MEZCLA_BASE).toString(16).padStart(2, '0');
  }).join('').toUpperCase();
}

/* ---- Categorías de los hábitos ----
   Etiquetas, no carpetas: un hábito puede ser Fitness Y de la Mañana. Hay dos
   grupos que conviven: el TEMA (qué es) y el MOMENTO del día (cuándo).
   Las de fábrica viven acá, en el código, y NO se guardan en el estado: lo que se
   guarda en cada hábito es solo su id. Por eso los ids van sin acentos y no
   cambian nunca: viajan en los backups. "Noche" no viene de fábrica; se crea
   como categoría propia. */
const CATEGORIAS_BASE = [
  { id:'arte',      n:'Arte',      g:'tema',    icono:'pincel'    },
  { id:'estudio',   n:'Estudio',   g:'tema',    icono:'libro'     },
  { id:'finanzas',  n:'Finanzas',  g:'tema',    icono:'moneda'    },
  { id:'fitness',   n:'Fitness',   g:'tema',    icono:'mancuerna' },
  { id:'nutricion', n:'Nutrición', g:'tema',    icono:'manzana'   },
  { id:'salud',     n:'Salud',     g:'tema',    icono:'corazon'   },
  { id:'social',    n:'Social',    g:'tema',    icono:'personas'  },
  { id:'trabajo',   n:'Trabajo',   g:'tema',    icono:'maletin'   },
  { id:'otros',     n:'Otros',     g:'tema',    icono:'estrella'  },
  { id:'manana',    n:'Mañana',    g:'momento', icono:'sol-sale'  },
  { id:'dia',       n:'Día',       g:'momento', icono:'sol'       },
  { id:'tarde',     n:'Tarde',     g:'momento', icono:'sol-pone'  },
];
const MAX_CATS_HABITO = 6, MAX_CATS_PROPIAS = 20, LARGO_CAT = 20;
/* Un id que va a parar a un atributo HTML: solo letras, números, _ y -. */
const esIdSeguro = s => typeof s === 'string' && /^[\w-]{1,40}$/.test(s);
/* Para COMPARAR nombres: sin acentos, sin mayúsculas, sin espacios de más.
   "nutricion", "NUTRICIÓN" y " Nutrición " son la misma categoría. */
const claveNombre = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase().replace(/\s+/g, ' ').trim();

/* Las categorías PROPIAS que llegan de afuera (un backup importado) se sanean:
   ids con forma válida y sin chocar con los de fábrica, nombres acotados, sin
   duplicados (con el criterio de claveNombre) y no más de MAX_CATS_PROPIAS. */
function normalizarCategorias(lista){
  const nombres = new Set(CATEGORIAS_BASE.map(c => claveNombre(c.n)));
  const ids = new Set(CATEGORIAS_BASE.map(c => c.id));
  const out = [];
  for(const c of Array.isArray(lista) ? lista : []){
    if(out.length >= MAX_CATS_PROPIAS) break;
    if(!c || typeof c !== 'object' || !esIdSeguro(c.id) || ids.has(c.id)) continue;
    const n = String(c.n == null ? '' : c.n).replace(/\s+/g, ' ').trim().slice(0, LARGO_CAT).trim();
    const k = claveNombre(n);
    if(!k || nombres.has(k)) continue;
    nombres.add(k); ids.add(c.id);
    out.push({ id: c.id, n });
  }
  return out;
}

const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

/* Fechas: SIEMPRE local, nunca toISOString().
   toISOString() devuelve la fecha en UTC. En Argentina (UTC-3), a las 22:00 del martes
   ya es miércoles en UTC, así que un registro cargado de noche caía en el día equivocado. */
function iso(d = new Date()){
  return d.getFullYear() + '-' +
         String(d.getMonth() + 1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysAgoISO(n){ return iso(addDays(new Date(), -n)); }
function daysSince(dateStr){
  return Math.round((parseISO(iso()) - parseISO(dateStr)) / 86400000);
}
function fmtDate(s){
  const d = parseISO(s);
  return d.toLocaleDateString('es-AR', {day:'numeric', month:'short'});
}
function fmtNum(n, dec = 0){
  return n.toLocaleString('es-AR', {minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function fmtARS(n){ return '$' + fmtNum(Math.round(n)); }

/* Escapar texto antes de meterlo en innerHTML.
   Si no hacés esto, un hábito llamado <img src=x onerror=...> rompe (o peor) la app. */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

let toastTimer, toastAccion = null;
/* El aviso. Con `{accion:{texto, fn}}` lleva un botón (ej. "Deshacer") y dura
   más, porque leer y decidir toma más que leer solamente. */
function toast(msg, opc){
  const el = $('#toast');
  const accion = opc && opc.accion;
  toastAccion = accion ? accion.fn : null;
  el.textContent = msg;
  if(accion){
    const b = document.createElement('button');
    b.className = 'toast-accion'; b.type = 'button';
    b.dataset.act = 'toast-accion'; b.textContent = accion.texto;
    el.appendChild(b);
  }
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; toastAccion = null; },
                          (opc && opc.ms) || (accion ? 6000 : 2600));
}

/* Borrar con DESHACER, sin diálogos nativos.
   Los confirm() se rompieron en silencio: dentro de un iframe con sandbox (el
   visor de artifacts) el navegador no muestra el diálogo y devuelve `false`,
   así que cada botón que dependía de uno dejaba de hacer algo. Y aun donde
   funcionan, un diálogo pregunta ANTES, cuando el dedo ya decidió; deshacer
   cubre el toque equivocado y no estorba al correcto.
   Se borra en el momento y se guarda lo borrado en la clausura del aviso.
   `extra.quitar(item)` limpia lo que cuelga del elemento (el historial de un
   hábito) y devuelve lo que `extra.devolver(item, resto)` repone. */
function borrarDeLista(lista, id, mensaje, extra){
  const idx = lista.findIndex(x => x.id === id);
  if(idx < 0) return;
  const item = lista[idx], raiz = state;
  const resto = extra && extra.quitar ? extra.quitar(item) : null;
  lista.splice(idx, 1);
  save(); render();
  toast(mensaje, { accion: { texto: 'Deshacer', fn: () => {
    // Si en el medio se importó o se borró todo, `state` es otro objeto:
    // reponer acá resucitaría un dato en un estado que ya no lo tiene.
    if(state !== raiz) return;
    lista.splice(Math.min(idx, lista.length), 0, item);
    if(extra && extra.devolver) extra.devolver(item, resto);
    save(); render();
  } } });
}

/* Reemplazar TODO el estado (ejemplos, borrar todo) con deshacer: se guarda una
   copia serializada y se repone TAL CUAL. No se pasa por normalizarEstado: la
   copia sale de un estado que ya era válido, y normalizar le agregaría campos
   (como el `tipo` de un hábito viejo) y ya no volvería idéntica. */
function reemplazarEstado(nuevo, mensaje){
  const previo = JSON.stringify(state);
  state = nuevo; save(); go('inicio');
  toast(mensaje, { accion: { texto: 'Deshacer', fn: () => {
    state = JSON.parse(previo); save(); go('inicio');
  } } });
}

   Regla: todo lo que se puede calcular NO se guarda. En el JSON solo viven

function emptyState(){

/* Valida la FORMA de un backup. Devuelve una lista de problemas (vacía = está bien).
   Hace falta porque un JSON puede ser válido y aun así tener la forma equivocada:
   {"gym":{"sessions":"hola"}} parsea perfecto y después rompe todo. */
function validarEstado(d){
  const errs = [];
  const obj = v => v && typeof v === 'object' && !Array.isArray(v);
  const arr = v => Array.isArray(v);
  if(!obj(d)) return ['el archivo no es un objeto JSON'];

  const seccion = (clave, listas) => {
    if(!(clave in d)) return;                       // ausente está bien: se completa sola
    if(!obj(d[clave])) { errs.push(`"${clave}" tendría que ser un objeto`); return; }
    for(const l of listas){
      if(l in d[clave] && !arr(d[clave][l]))
        errs.push(`"${clave}.${l}" tendría que ser una lista`);
    }
  };
  seccion('gym', ['sessions','customExercises']);
  seccion('estudio', ['entries', 'examenes']);
  seccion('freelance', ['items']);
  seccion('habitos', ['list', 'categorias']);
  seccion('profile', []);

  // las sesiones de gym son las que más adentro se recorren: hay que mirarlas
  if(obj(d.gym) && arr(d.gym.sessions)){
    d.gym.sessions.forEach((s, i) => {
      if(errs.length > 6) return;
      if(!obj(s)) { errs.push(`la sesión #${i+1} no es un objeto`); return; }
      if(!arr(s.exercises)) { errs.push(`la sesión #${i+1} no tiene lista de ejercicios`); return; }
      s.exercises.forEach((e, j) => {
        if(errs.length > 6) return;
        if(!obj(e) || !arr(e.sets))
          errs.push(`el ejercicio #${j+1} de la sesión #${i+1} no tiene lista de series`);
      });
    });
  }
  if(obj(d.habitos) && 'log' in d.habitos && !obj(d.habitos.log))
    errs.push('"habitos.log" tendría que ser un objeto');
  if(obj(d.habitos) && arr(d.habitos.list)){
    d.habitos.list.forEach((x, i) => {
      if(errs.length > 6) return;
      if(!obj(x)) errs.push(`el hábito #${i+1} no es un objeto`);
      else if(x.id == null || x.id === '') errs.push(`el hábito #${i+1} no tiene id`);
    });
  }
  if(obj(d.habitos) && arr(d.habitos.categorias)){
    d.habitos.categorias.forEach((c, i) => {
      if(errs.length > 6) return;
      if(!obj(c)) errs.push(`la categoría #${i+1} no es un objeto`);
    });
  }
  if(obj(d.habitos) && obj(d.habitos.log)){
    for(const [id, dias] of Object.entries(d.habitos.log)){
      if(errs.length > 6) break;
      if(dias != null && !obj(dias)) errs.push(`el historial del hábito "${id}" no es un objeto`);
    }
  }
  if(obj(d.estudio) && arr(d.estudio.entries) && d.estudio.entries.some(e => !obj(e)))
    errs.push('hay entradas de estudio que no son objetos');

  return errs.slice(0, 6);
}

/* Un hábito viejo no trae `tipo`: es de sí/no. Y todo lo que llega de afuera
   (un backup importado) se sanea acá: el color termina dentro de un
   style="…" y un texto con comillas ahí rompería el atributo. */
function normalizarHabito(x, validos){
  // `validos` es el conjunto de ids de categoría que existen. Si no llega (o llega
  // el índice, porque alguien usó .map(normalizarHabito)), se calcula del estado.
  if(!(validos instanceof Set)) validos = idsCategoriasValidas();
  const o = Object.assign({}, x);
  o.id = String(o.id);
  o.name = String(o.name == null ? '' : o.name).slice(0, 40);
  o.emoji = String(o.emoji == null ? '' : o.emoji).slice(0, 8);
  o.color = esColorHex(o.color) ? o.color : HABIT_COLORS[0];
  if(o.desc != null) o.desc = String(o.desc).slice(0, 80);
  const meta = Number(o.meta);
  if(o.tipo === 'cantidad' && Number.isFinite(meta) && meta > 0){
    o.meta = meta;
    o.unidad = String(o.unidad == null ? '' : o.unidad).slice(0, 20);
  }else{
    o.tipo = 'check'; delete o.meta; delete o.unidad;   // cantidad sin meta válida no tiene sentido
  }
  // Etiquetas: solo ids que existen, sin repetir, hasta MAX_CATS_HABITO.
  const cats = [...new Set((Array.isArray(o.cats) ? o.cats : []).filter(c => typeof c === 'string' && validos.has(c)))]
    .slice(0, MAX_CATS_HABITO);
  if(cats.length) o.cats = cats; else delete o.cats;
  // Ícono propio o emoji, nunca los dos: si hay un ícono válido gana, y un ícono
  // que no esté en la biblioteca se descarta (no se dibuja nada inventado).
  if(iconoValido(o.icono)) o.emoji = ''; else delete o.icono;
  // Frecuencia: días fijos (0 = lunes … 6 = domingo, sin repetir y ordenados) y fecha
  // de inicio. Los siete días, o ninguno, es "cada día": se quita la clave.
  const dias = [...new Set((Array.isArray(o.dias) ? o.dias : [])
    .filter(n => typeof n === 'number' && Number.isInteger(n) && n >= 0 && n <= 6))].sort((a, b) => a - b);
  if(dias.length > 0 && dias.length < 7) o.dias = dias; else delete o.dias;
  if(!fechaValida(o.inicio)) delete o.inicio;
  return o;
}

/* Un examen sin materia o sin una fecha real no sirve: se descarta. Lo demás se completa. */
function normalizarEstudio(e){
  if(!Array.isArray(e.examenes)){ delete e.examenes; return e; }
  e.examenes = e.examenes.filter(x => x && typeof x === 'object' && typeof x.materia === 'string' && x.materia.trim() && fechaValida(x.fecha))
    .map(x => {
      const horas = Number(x.horas);
      return { id: String(x.id || uid()), materia: x.materia.trim().slice(0, 40),
               tipo: x.tipo in TIPOS_EXAMEN ? x.tipo : 'parcial', fecha: x.fecha,
               horas: Number.isFinite(horas) && horas > 0 ? Math.min(Math.round(horas * 2) / 2, 500) : 0,
               desde: fechaValida(x.desde) && x.desde <= x.fecha ? x.desde : x.fecha };
    });
  return e;
}

/* Los datos de seguimiento que lleguen rotos se descartan: un teléfono que no es texto,
   una fecha que no es real, una plantilla de una etapa que no existe o demasiado larga. */
function normalizarFreelance(f){
  if(Array.isArray(f.items)) f.items = f.items.map(it => {
    if(!it || typeof it !== 'object') return it;
    const o = Object.assign({}, it);
    if(typeof o.telefono === 'string' && o.telefono.trim()) o.telefono = o.telefono.trim().slice(0, 30); else delete o.telefono;
    if(!fechaValida(o.ultimoContacto)) delete o.ultimoContacto;
    if(!fechaValida(o.proximo)) delete o.proximo;
    return o;
  });
  if(f.plantillas && typeof f.plantillas === 'object' && !Array.isArray(f.plantillas)){
    const p = {};
    for(const k of Object.keys(PLANTILLAS_DEF)){
      const v = f.plantillas[k];
      if(typeof v === 'string' && v.trim()) p[k] = v.trim().slice(0, LARGO_PLANTILLA);
    }
    if(Object.keys(p).length) f.plantillas = p; else delete f.plantillas;
  }else delete f.plantillas;
  return f;
}

/* Los rangos de progresión que lleguen rotos se descartan (vale el de siempre). */
function normalizarGym(g){
  if(g.progresion && typeof g.progresion === 'object' && !Array.isArray(g.progresion)){
    const limpio = {};
    for(const [exId, p] of Object.entries(g.progresion)){ const v = progresionValida(p); if(v) limpio[exId] = v; }
    if(Object.keys(limpio).length) g.progresion = limpio; else delete g.progresion;
  }else delete g.progresion;
  return g;
}

/* Completa las claves que falten, sección por sección. Un Object.assign plano
   pisaría gym entero y se perderían los ejercicios propios. */
function normalizarEstado(d){
  const b = emptyState();
  const habitos = Object.assign(b.habitos, d.habitos || {});
  // Primero las categorías propias: los hábitos se normalizan contra ellas.
  habitos.categorias = normalizarCategorias(habitos.categorias);
  const validos = new Set(CATEGORIAS_BASE.map(c => c.id).concat(habitos.categorias.map(c => c.id)));
  habitos.list = (Array.isArray(habitos.list) ? habitos.list : []).map(x => normalizarHabito(x, validos));
  // El historial solo guarda true, un número mayor que 0 o un salteo: lo demás se descarta.
  if(habitos.log && typeof habitos.log === 'object' && !Array.isArray(habitos.log)){
    for(const id of Object.keys(habitos.log)){
      const dias = habitos.log[id];
      if(!dias || typeof dias !== 'object' || Array.isArray(dias)){ delete habitos.log[id]; continue; }
      for(const d of Object.keys(dias)){
        const v = dias[d];
        if(!(v === true || v === 'skip' ||   /* literal: esto corre antes de que exista SALTEO */
            (typeof v === 'number' && Number.isFinite(v) && v > 0))) delete dias[d];
      }
    }
  }else habitos.log = {};
  return {
    version:   1,
    profile:   Object.assign(b.profile,   d.profile   || {}),
    gym:       normalizarGym(Object.assign(b.gym, d.gym || {})),
    estudio:   normalizarEstudio(Object.assign(b.estudio, d.estudio || {})),
    freelance: normalizarFreelance(Object.assign(b.freelance, d.freelance || {})),
    habitos,
    meta:      Object.assign(b.meta,      d.meta      || {}),
  };
}

/* Si el guardado está roto NO se borra: se aparta con otra clave, así siempre
   se puede recuperar a mano desde la consola o desde la pantalla de rescate. */
const CLAVE_ROTO = STORAGE_KEY + '.roto';
let avisoRescate = null;
function apartarRoto(raw, motivo){
  try{ localStorage.setItem(CLAVE_ROTO, raw); }catch(e){}
  avisoRescate = motivo;
  console.warn('Guardado apartado en "' + CLAVE_ROTO + '":', motivo);
}

let state = load();

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }
  catch(err){ console.warn('localStorage bloqueado:', err); return emptyState(); }
  if(!raw) return emptyState();

  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(err){ apartarRoto(raw, 'el guardado no era JSON válido'); return emptyState(); }

  const errs = validarEstado(parsed);
  if(errs.length){ apartarRoto(raw, errs.join(' · ')); return emptyState(); }
  return normalizarEstado(parsed);
}

/* Guardar: en este aparato siempre; y si hay una cuenta, queda pendiente de subir. */
function save(){
  guardarLocal();
  marcarPendiente();
}
function guardarLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(err){
    // Pasa si el navegador bloquea el almacenamiento (modo privado, cuota llena).
    toast('⚠ No se pudo guardar. Exportá tus datos desde Ajustes.');
    console.error(err);
  }
}

// Musculo de mayor aporte. Agrupa el selector de ejercicios: filtrar por "aporte === 1"
// dejaba afuera cualquier ejercicio sin un 100% exacto y duplicaba los que tenian dos.
function primaryMuscle(ex){
  return Object.entries(ex.muscles).sort((a, b) => b[1] - a[1])[0][0];
